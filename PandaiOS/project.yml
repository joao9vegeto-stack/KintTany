name: PandaiOS
options:
  bundleIdPrefix: com.kinttany
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  PandaiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinttany.pandaios
        PRODUCT_NAME: Panda Cloud
        INFOPLIST_KEY_CFBundleDisplayName: Panda Cloud
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
