name: PandaiOS
options:
  bundleIdPrefix: com.kinttany
  deploymentTarget:
    iOS: "16.0"
packages:
  OpenSSL-Package:
    url: https://github.com/krzyzanowskim/OpenSSL-Package.git
    from: 3.1.5004
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  PandaiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: OpenSSL-Package
        product: OpenSSL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinttany.pandaios
        PRODUCT_NAME: Panda Cloud
        INFOPLIST_KEY_CFBundleDisplayName: Panda Cloud
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PandaiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/ThirdParty/moonlight-ios/moonlight-common/moonlight-common-c/src"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/build/MoonlightCoreDerived/Build/Products/Release-iphoneos"
        OTHER_LDFLAGS: "$(inherited) -Wl,-force_load,$(PROJECT_DIR)/build/MoonlightCoreDerived/Build/Products/Release-iphoneos/libmoonlight-common.a"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
