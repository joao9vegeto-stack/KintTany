name: AscensionRecomp M4.10 - PS3 texture mutation coherence diagnostic

on:
  push:
    branches:
      - AscensionRecomp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascension-recomp-m2
  cancel-in-progress: false

jobs:
  m2:
    if: github.ref == 'refs/heads/AscensionRecomp'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout ONLY AscensionRecomp
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce branch isolation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/AscensionRecomp"
          test "$(git branch --show-current)" = "AscensionRecomp"
          test "$(find .github/workflows -type f | wc -l | tr -d ' ')" = "1"
          test -z "$(find . -type f \( -iname '*.rap' -o -name 'GOWA.SELF' -o -name 'GOWA.ELF' \) -not -path './.git/*' -print -quit)"
      - name: Python-only PS3 ELF + PPU manifest tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee m0-tests.log
          python3 -m py_compile tools/elf_inventory.py
      - name: Xcode and build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          clang --version
          cmake --version
          ninja --version || brew install ninja
          brew list --versions sdl2 >/dev/null 2>&1 || brew install sdl2
      - name: Fetch pinned ps3recomp source
        run: |
          set -euo pipefail
          git clone https://github.com/sp00nznet/ps3recomp.git upstream
          git -C upstream checkout a2c20108af45174dbb7d3e2f87f6acaaef09c6b4
          test "$(git -C upstream rev-parse HEAD)" = "a2c20108af45174dbb7d3e2f87f6acaaef09c6b4"
      - name: Compile Apple Silicon macOS static runtime (not an IPA)
        run: |
          set -euo pipefail
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DPS3RECOMP_BUILD_TESTS=OFF -DPS3RECOMP_RSX_VULKAN=OFF 2>&1 | tee m0-configure.log
          cmake --build build --target ps3recomp_runtime --parallel 4 2>&1 | tee m0-build.log
          test -s build/libps3recomp_runtime.a
          xcrun lipo -info build/libps3recomp_runtime.a
          shasum -a 256 build/libps3recomp_runtime.a | tee m0-sha256.txt
      - name: Check recompilation tool CLI
        run: |
          set -euo pipefail
          python3 -m pip install --user -r upstream/tools/requirements.txt --break-system-packages || python3 -m pip install --user -r upstream/tools/requirements.txt
          python3 upstream/tools/ppu_loader.py --help > m0-ppu-loader-help.txt
          python3 upstream/tools/ppu_lifter.py --help > m0-ppu-lifter-help.txt
          echo "M0 compila apenas o runtime macOS/ARM64, sem dados do jogo." > m0-status.txt
      - name: M2 static PPU loader and lifter on a SYNTHETIC ELF (never game code)
        run: |
          set -euo pipefail
          python3 tools/make_synthetic_ppu.py --out m2-synthetic/EBOOT.ELF
          python3 upstream/tools/ppu_loader.py m2-synthetic/EBOOT.ELF -o m2-loader 2>&1 | tee m2-loader.log
          python3 upstream/tools/ppu_lifter.py m2-synthetic/EBOOT.ELF --functions m2-loader/EBOOT.functions.json --hle-stubs m2-loader/EBOOT.imports.json --output m2-generated --jobs 1 --chunk-lines 120000 --code-end 0x10028 2>&1 | tee m2-lifter.log
          test -s m2-generated/ppu_recomp.h
          test -n "$(find m2-generated -name 'ppu_recomp*.cpp' -print -quit)"
          find m2-generated -name '*.cpp' -print0 | xargs -0 -n1 clang++ -std=c++20 -fsyntax-only -I m2-generated 2>&1 | tee m2-clang-syntax.log
          echo "M2: real ps3recomp loader -> lifter -> Clang C++ syntax validated on generated SYNTHETIC PPU ELF. Real Ascension code stays PRIVATE." > m2-status.txt
      - name: M2.1 generate iOS ARM64 object from SYNTHETIC PowerPC code
        run: |
          set -euo pipefail
          python3 tools/ppu_lift_probe.py m2-synthetic/EBOOT.ELF --start 0x10000 --count 16 --out m21-synthetic-ppu.c 2>&1 | tee m21-aot.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -ffreestanding -fno-builtin -O2 -c m21-synthetic-ppu.c -o m21-synthetic-ppu-ios-arm64.o
          test -s m21-synthetic-ppu-ios-arm64.o
          file m21-synthetic-ppu-ios-arm64.o | tee m21-arch.log
          file m21-synthetic-ppu-ios-arm64.o | grep -E 'Mach-O.*arm64'
          shasum -a 256 m21-synthetic-ppu-ios-arm64.o | tee m21-object-sha256.txt
          echo "M2.1: Generic AOT generated an iOS ARM64 Mach-O object from synthetic PPU code. Real Ascension ELF was analyzed privately, never uploaded." > m21-status.txt
      - name: M2.2 batch-audit strict function boundaries (synthetic only)
        run: |
          set -euo pipefail
          printf '[{"start":"0x10000","end":"0x1000c"},{"start":"0x10020","end":"0x10028"}]\n' > m22-synthetic-functions.json
          python3 tools/ppu_m22_bounded_batch.py m2-synthetic/EBOOT.ELF --functions m22-synthetic-functions.json --output m22-synthetic-out 2>&1 | tee m22-batch.log
          python3 -c 'import json; j=json.load(open("m22-synthetic-out/audit.json")); assert j["accepted_count"]==2 and j["rejected_count"]==0'
          for f in m22-synthetic-out/ar_func_*.c; do
            xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -ffreestanding -fno-builtin -O2 -c "$f" -o "${f%.c}.o"
          done
          test "$(find m22-synthetic-out -name '*.o' | wc -l | tr -d ' ')" = 2
          file m22-synthetic-out/*.o | tee m22-arch.log
          shasum -a 256 m22-synthetic-out/*.o > m22-sha256.txt
          echo 'M2.2 synthetic bounded-AOT batch passed; private commercial code is not part of CI.' > m22-status.txt
      - name: M2.3 CFG lifter and native iOS ARM64 object - synthetic code only
        run: |
          set -euo pipefail
          python3 tools/ppu_cfg_lifter.py m2-synthetic/EBOOT.ELF --functions m22-synthetic-functions.json --output m23-synthetic-out 2>&1 | tee m23-lifter.log
          python3 -c 'import json; x=json.load(open("m23-synthetic-out/report.json")); assert x["candidates"]==2 and x["functions_total"]==2'
          python3 - <<'PY'
          from pathlib import Path
          fs=sorted(Path("m23-synthetic-out").glob("ppu_f_*.c"))
          assert len(fs)==2, len(fs)
          with open("m23-synthetic-combined.c","w") as out:
              out.write(fs[0].read_text().split("int ppu_f_",1)[0])
              for f in fs:
                  out.write("int ppu_f_"+f.read_text().split("int ppu_f_",1)[1])
          PY
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -ffreestanding -fno-builtin -O0 -I upstream/runtime/ppu -c m23-synthetic-combined.c -o m23-synthetic-arm64.o
          file m23-synthetic-arm64.o | tee m23-object-architecture.log
          file m23-synthetic-arm64.o | grep -E 'Mach-O.*arm64'
          shasum -a 256 m23-synthetic-arm64.o | tee m23-object-sha256.txt
          echo 'M2.3: Native host branch/rotation tests and synthetic PPC64 -> iOS ARM64 object. No copyrighted inputs.' > m23-status.txt
      - name: M2.4 inventory upstream HLE registrations and test synthetic gaps
        run: |
          set -euo pipefail
          python3 upstream/tools/gen_hle_nids.py --all --out m24-public-hle-nids.cpp 2>&1 | tee m24-gen-hle.log
          python3 tools/hle_coverage.py --registry-source m24-public-hle-nids.cpp --out m24-registered-handlers.json --dump-public-nids 2>&1 | tee m24-public-handlers.log
          python3 - <<'PY'
          import json
          d=json.load(open("m24-registered-handlers.json"))
          assert d["registered_count"]>25, "HLE registry unexpectedly small"
          entries=list(d["handlers"])
          samples=[
              {"nid":entries[0],"library":"test_lib"},
              {"nid":"0x00000000","library":"test_missing"}
          ]
          assert entries[0]!="0x00000000"
          json.dump(samples,open("m24-synthetic-imports.json","w"))
          PY
          python3 tools/hle_coverage.py --registry-source m24-public-hle-nids.cpp --imports m24-synthetic-imports.json --out m24-synthetic-coverage.json 2>&1 | tee m24-coverage.log
          python3 - <<'PY'
          import json
          d=json.load(open("m24-synthetic-coverage.json"))
          assert d["registered_nids"]==1
          assert d["not_registered_nids"]==1
          PY
          echo 'M2.4 HLE inventory generated from PINNED upstream. Import fixtures synthetic only, no game data or license.' > m24-status.txt
      - name: M2.5 test complete PPU ABI and bounded nested guest dispatch
        run: |
          set -euo pipefail
          python3 tools/make_dispatch_smoke.py --out m25-synthetic-dispatch.c
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-label -Wno-unused-function -I upstream/runtime/ppu -I runtime m25-synthetic-dispatch.c runtime/ppu_bridge.c tests/host_ppu_bridge.c -o m25-host
          ./m25-host 2>&1 | tee m25-host-test.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -O2 -I upstream/runtime/ppu -I runtime -c m25-synthetic-dispatch.c -o m25-synthetic-ppu-arm64.o
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -O2 -I upstream/runtime/ppu -I runtime -c runtime/ppu_bridge.c -o m25-guest-bridge-arm64.o
          file m25-synthetic-ppu-arm64.o m25-guest-bridge-arm64.o | tee m25-arch.log
          grep -E 'Mach-O.*arm64' m25-arch.log
          shasum -a 256 m25-synthetic-ppu-arm64.o m25-guest-bridge-arm64.o > m25-checksums.txt
          echo 'M2.5 canonical ABI and guest dispatcher synthetic tests passed, no commercial game files.' > m25-status.txt
      - name: M2.6 stage ELF64 image and OPD with ACTUAL upstream PPU ABI
        run: |
          set -euo pipefail
          python3 tools/make_synthetic_ppu.py --out m26-synthetic/EBOOT.ELF
          clang -std=c11 -O2 -Wall -Wextra -Werror -I upstream/runtime/ppu -I runtime runtime/ppu_bridge.c runtime/elf_image.c tests/host_elf_image.c -o m26-elf-test
          ./m26-elf-test m26-synthetic/EBOOT.ELF 2>&1 | tee m26-host-test.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -O2 -I upstream/runtime/ppu -I runtime -c runtime/elf_image.c -o m26-elf-loader-arm64.o
          file m26-elf-loader-arm64.o | tee m26-object-info.log
          grep -E 'Mach-O.*arm64' m26-object-info.log
          shasum -a 256 m26-elf-loader-arm64.o > m26-checksums.txt
          echo 'M2.6: validated synthetic ELF64 PPU segments, BSS and OPD/TOC; no commercial content.' > m26-status.txt
      - name: M2.7 recover direct PPU call targets not present in OPD manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          data=bytearray(Path("m26-synthetic/EBOOT.ELF").read_bytes())
          struct.pack_into(">I", data, 0x1000+0x20, 0xf821ff91)
          Path("m27-synthetic-call-elf.ELF").write_bytes(data)
          Path("m27-known-opd.json").write_text(json.dumps([{"start":"0x10000"}]))
          PY
          python3 tools/recover_ppu_calls.py m27-synthetic-call-elf.ELF --functions m27-known-opd.json --out m27-candidates.json 2>&1 | tee m27-call-recovery.log
          python3 - <<'PY'
          import json
          data=json.load(open("m27-candidates.json"))
          assert data["recovered_not_in_opd"]==1, data
          assert data["candidates"][0]["entry"]=="0x10020", data["candidates"]
          PY
          echo 'M2.7: Direct branch target recovery validates plausible prologues; real Ascension executable never enters CI.' > m27-status.txt
      - name: M2.8 bind guest import stub to HLE NID, reject missing handler
        run: |
          set -euo pipefail
          python3 tools/make_hle_smoke.py --out m28-synthetic-guest.c
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-label -Wno-unused-function -I upstream/runtime/ppu -I runtime m28-synthetic-guest.c runtime/ppu_bridge.c tests/host_hle_import.c -o m28-hle-host
          ./m28-hle-host 2>&1 | tee m28-host-test.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -O2 -I upstream/runtime/ppu -I runtime -c runtime/ppu_bridge.c -o m28-hle-bridge-arm64.o
          file m28-hle-bridge-arm64.o | tee m28-object-info.log
          shasum -a 256 m28-hle-bridge-arm64.o > m28-checksums.txt
          echo 'M2.8: missing PS3 import NID fails closed; memory pointer + caller TOC validated on synthetic game-free smoke.' > m28-status.txt
      - name: M2.9 test PS3 sys_initialize_tls against canonical upstream context
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror -I upstream/runtime/ppu -I runtime runtime/ppu_bridge.c runtime/ppu_tls.c tests/host_ppu_tls.c -o m29-tls-host
          ./m29-tls-host 2>&1 | tee m29-tls-test.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -O2 -I upstream/runtime/ppu -I runtime -c runtime/ppu_tls.c -o m29-tls-arm64.o
          file m29-tls-arm64.o | tee m29-object-info.log
          shasum -a 256 m29-tls-arm64.o > m29-checksums.txt
          echo 'M2.9 tested real semantics of generic PS3 TLS initialization on SYNTHETIC TLS. Real game ELF stays private.' > m29-status.txt
      - name: M3.0 validate strict LV2 syscall 352 with synthetic PPU guest
        run: |
          set -euo pipefail
          python3 tools/make_syscall_smoke.py --out m30-synthetic-sc.c
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-label -Wno-unused-function -I upstream/runtime/ppu -I runtime m30-synthetic-sc.c runtime/ppu_bridge.c runtime/lv2_smoke.c tests/host_lv2_syscall.c -o m30-lv2-host
          ./m30-lv2-host 2>&1 | tee m30-host-test.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -O2 -I upstream/runtime/ppu -I runtime -c runtime/lv2_smoke.c -o m30-lv2-arm64.o
          file m30-lv2-arm64.o | tee m30-object-info.log
          shasum -a 256 m30-lv2-arm64.o > m30-checksums.txt
          echo 'M3.0: PPU sc uses r11; missing LV2 syscalls are fatal to test bridge, syscall 352 writes actual PS3 guest-memory info.' > m30-status.txt
      - name: M3.1 generate guarded guest import binding from synthetic manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          src=[
              {'stub':'0x10220','nid':'0x11223344','library':'sysPrxForUser'},
              {'stub':'0x10260','nid':'0xAABBCCDD','library':'cellGcmSys'}
          ]
          json.dump(src,open('m31-synthetic-imports.json','w'))
          PY
          python3 tools/build_import_binder.py --imports m31-synthetic-imports.json --source m31-guest-imports.c --report m31-import-report.json | tee m31-import-generate.log
          python3 - <<'PY'
          import json
          d=json.load(open('m31-import-report.json'))
          assert d['stubs_validated']==2 and d['unique_nids']==2
          PY
          python3 tools/make_hle_smoke.py --out m31-synthetic-ppu.c
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-label -Wno-unused-function -I upstream/runtime/ppu -I runtime m31-synthetic-ppu.c m31-guest-imports.c runtime/ppu_bridge.c tests/host_import_manifest.c -o m31-host
          ./m31-host 2>&1 | tee m31-host-test.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 -O2 -I upstream/runtime/ppu -I runtime -c m31-guest-imports.c -o m31-manifest-arm64.o
          file m31-manifest-arm64.o | tee m31-arm64-object.log
          shasum -a 256 m31-manifest-arm64.o > m31-checksums.txt
          echo 'M3.1: all import NID bindings generated with checked duplicates; CI synthetic only.' > m31-status.txt
      - name: M3.7 build iphoneos ARM64 PPU core archive without game data
        run: |
          set -euo pipefail
          bash tools/build_ios_ppu_core.sh 2>&1 | tee m37-ios-build.log
          test -s ios-ppu-core/libAscensionPPUCore-ios-arm64.a
          test -s ios-ppu-core/exports.txt
          test -s ios-ppu-core/SHA256.txt
          echo 'iOS device library built. No game bytes, NOT an IPA.' > m37-status.txt
      - name: M3.8 cross-compile pinned PS3Recomp CPU SPU LV2 modules for iphoneos
        run: |
          set -euo pipefail
          python3 tools/ios_runtime_overlay.py upstream/CMakeLists.txt
          python3 tools/enable_ios_offscreen_metal.py upstream/CMakeLists.txt
          python3 tools/enable_ios_drawable_layer.py upstream
          python3 tools/enable_ios_fixed_pipeline.py upstream ios/ARFixedFallback.metal
          python3 tools/enable_ios_rsx_texture_debug.py upstream
          python3 tools/enable_ios_cache_counters.py upstream
          cmake -S upstream -B build-ios-runtime -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_BUILD_TESTS=OFF \
            -DPS3RECOMP_RSX_VULKAN=OFF 2>&1 | tee m38-ios-configure.log
          cmake --build build-ios-runtime --target ps3recomp_runtime --parallel 4 2>&1 | tee m38-ios-runtime.log
          test -s build-ios-runtime/libps3recomp_runtime.a
          xcrun lipo -info build-ios-runtime/libps3recomp_runtime.a | tee m38-lipo.txt
          shasum -a 256 build-ios-runtime/libps3recomp_runtime.a > m38-runtime-sha256.txt
          xcrun nm -g build-ios-runtime/libps3recomp_runtime.a > m39-metal-symbols.txt
          grep -q '_rsx_metal_backend_init' m39-metal-symbols.txt
          grep -q '_rsx_metal_backend_shutdown' m39-metal-symbols.txt
          grep -q '_rsx_metal_backend_set_ios_layer' m39-metal-symbols.txt
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -fobjc-arc -fmodules -c ios/ARMetalView.m -o m40-ios-layer-view.o
          xcrun nm -g m40-ios-layer-view.o > m40-ui-symbols.txt
          grep -Fq '_OBJC_CLASS_$_ARMetalView' m40-ui-symbols.txt
          file m40-ios-layer-view.o | tee m40-ui-arch.txt
          shasum -a 256 m40-ios-layer-view.o > m40-ui-sha256.txt
          echo 'M4.0: UIKit CAMetalLayer view and iOS RSX Metal bridge compiled, not runtime displayed or game-rendered.' > m40-status.txt
          echo 'iPhone ARM64 CPU/SPU/LV2+offscreen Metal compiled; no CAMetalLayer presenter/audio/input/IPA.' > m39-status.txt
          echo 'iOS CPU/SPU/LV2 build only. SDL2 input/audio and RSX Metal backend disabled until iOS adapters are implemented.' > m38-status.txt
      - name: M4.1 link native UIKit RSX Metal diagnostic application
        run: |
          set -euo pipefail
          bash tools/build_ios_probe_ipa.sh 2>&1 | tee m41-build-ipa.log
          test -s AscensionRecompProbe-0.4.10-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' ios-probe/Payload/AscensionRecompProbe.app/Info.plist | grep -Fx 0.4.10
          /usr/bin/unzip -t AscensionRecompProbe-0.4.10-unsigned.ipa | tee m42-ipa-integrity.log
          xcrun nm -g ios-probe/Payload/AscensionRecompProbe.app/AscensionRecompProbe | grep -E '(_rsx_metal_backend_present|_rsx_metal_backend_init|_OBJC_CLASS_\\$_ARMetalView)' > m42-runtime-link-symbols.txt || true
          grep -q _rsx_metal_backend_init m39-metal-symbols.txt
          echo 'M4.2: actual GPU clear + presentDrawable + waitUntilCompleted route linked in iOS app; requires on-device screenshot.' > m42-status.txt
          xcrun nm -g ios-probe/Payload/AscensionRecompProbe.app/AscensionRecompProbe | tee m43-probe-linked-symbols.txt
          grep -q '_ar_probe_rsx_clear_flip' m43-probe-linked-symbols.txt
          grep -q '_ar_probe_rsx_triangle' m43-probe-linked-symbols.txt
          grep -q '_rsx_metal_backend_debug_fixed_probe_stage' m43-probe-linked-symbols.txt
          grep -q '_ar_probe_rsx_dma_triangle' m43-probe-linked-symbols.txt
          grep -q '_ar_probe_rsx_indexed_quad' m43-probe-linked-symbols.txt
          grep -q '_ar_probe_rsx_texture' m43-probe-linked-symbols.txt
          grep -q '_ar_probe_rsx_texture_registers' m43-probe-linked-symbols.txt
          grep -q '_rsx_metal_backend_debug_sample_texture0' m43-probe-linked-symbols.txt
          grep -q '_ar_probe_rsx_texture_cache_mutation' m43-probe-linked-symbols.txt
          grep -q '_ar_probe_cache_replacements' m43-probe-linked-symbols.txt
          echo 'M4.10: same PS3 texture address across 3 flips with 2 content hash cache replacements; each GPU sample must match rotated palette.' > m410-status.txt
          echo 'M4.9 NV4097 texture0 register -> PS3 texture decoder/cache -> bound draw Metal object -> GPU compute sample, two layouts; on-device test pending. Does NOT translate guest FP.' > m49-status.txt
          echo 'M4.8 synthetic PS3 A8R8G8B8 linear/swizzled decode -> actual Metal RGBA8 texture -> fragment sampling -> GPU 4-way readback and CAMetalLayer. Not guest fragment program support.' > m48-status.txt
          echo 'M4.7 indexes: actual NV4097 indexed two-triangle mesh from bounded PS3 big-endian u16/u32 buffers; hardware test pending.' > m47-status.txt
          echo 'M4.6 PS3 memory BE float4 vertex DMA via NV4097_DRAW_ARRAYS, expected magenta center pixel; requires hardware confirmation' > m46-status.txt
          echo 'Metal fixed pipeline MSL compiled on device; game shaders NOT supported without translator; user test needed' > m45-status.txt
          echo 'Geometry proof: guest-like NV4097 INLINE_ARRAY -> fixed VS/PS pipeline -> framebuffer raster -> center pixel GPU readback. Requires device testing; not guest game shaders.' > m44-status.txt
          echo 'M4.3 synthetic RSX NV4097 register writes -> GPU engine clear & flip, readback check. On-device screenshot required.' > m43-status.txt
      - name: Upload M2 evidence - runtime + synthetic PPU proof

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AscensionRecomp-M4.10-RSX-cache-coherency-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            m0-tests.log
            m0-configure.log
            m0-build.log
            m0-sha256.txt
            m0-ppu-loader-help.txt
            m0-ppu-lifter-help.txt
            m0-status.txt
            m2-loader.log
            m2-lifter.log
            m2-clang-syntax.log
            m2-status.txt
            m21-aot.log
            m21-arch.log
            m21-object-sha256.txt
            m21-status.txt
            m22-batch.log
            m22-arch.log
            m22-sha256.txt
            m22-status.txt
            m23-lifter.log
            m23-object-architecture.log
            m23-object-sha256.txt
            m23-status.txt
            m24-gen-hle.log
            m24-public-handlers.log
            m24-coverage.log
            m24-status.txt
