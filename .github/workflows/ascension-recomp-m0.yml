name: AscensionRecomp M7.16 - authentic 15-opcode ARM64 branch and dual-path PPC inventory

on:
  push:
    branches:
      - AscensionRecomp

permissions:
  contents: read

concurrency:
  group: ascension-recomp-m2
  cancel-in-progress: false

jobs:
  m2:
    if: github.ref == 'refs/heads/AscensionRecomp'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout ONLY AscensionRecomp
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce branch isolation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/AscensionRecomp"
          test "$(git branch --show-current)" = "AscensionRecomp"
          test "$(find .github/workflows -type f | wc -l | tr -d ' ')" = "1"
          test -z "$(find . -type f \( -iname '*.rap' -o -name 'GOWA.SELF' -o -name 'GOWA.ELF' \) -not -path './.git/*' -print -quit)"
      - name: Python-only PS3 ELF + PPU manifest tests
        run: |
          set -euo pipefail
          bash -n tools/build_ios_probe_ipa.sh
          python3 -m py_compile tools/m714_owner_batch.py
          python3 -m unittest discover -s tests -v 2>&1 | tee m0-tests.log
          python3 -m py_compile tools/elf_inventory.py
      - name: Xcode and build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          clang --version
          cmake --version
          ninja --version || brew install ninja
          brew list --versions sdl2 >/dev/null 2>&1 || brew install sdl2
          brew list --versions glslang >/dev/null 2>&1 || brew install glslang
          brew list --versions spirv-cross >/dev/null 2>&1 || brew install spirv-cross
      - name: Fetch pinned ps3recomp source
        run: |
          set -euo pipefail
          git clone https://github.com/sp00nznet/ps3recomp.git upstream
          git -C upstream checkout a2c20108af45174dbb7d3e2f87f6acaaef09c6b4
          test "$(git -C upstream rev-parse HEAD)" = "a2c20108af45174dbb7d3e2f87f6acaaef09c6b4"
          python3 tools/enable_macos_boot_smoke_null_backend.py upstream
      - name: M5.0 fetch pinned open source shader compiler sources
        run: |
          set -euo pipefail
          mkdir -p ios-shader-deps/glslang ios-shader-deps/SPIRV-Cross
          git -C ios-shader-deps/glslang init
          git -C ios-shader-deps/glslang remote add origin https://github.com/KhronosGroup/glslang.git
          git -C ios-shader-deps/glslang fetch --depth=1 origin 8a85691a0740d390761a1008b4696f57facd02c4
          git -C ios-shader-deps/glslang checkout --detach FETCH_HEAD
          test "$(git -C ios-shader-deps/glslang rev-parse HEAD)" = "8a85691a0740d390761a1008b4696f57facd02c4"
          git -C ios-shader-deps/SPIRV-Cross init
          git -C ios-shader-deps/SPIRV-Cross remote add origin https://github.com/KhronosGroup/SPIRV-Cross.git
          git -C ios-shader-deps/SPIRV-Cross fetch --depth=1 origin 300681bbcb8365a8d1eacdacdbdd0249bbf1d6b1
          git -C ios-shader-deps/SPIRV-Cross checkout --detach FETCH_HEAD
          test "$(git -C ios-shader-deps/SPIRV-Cross rev-parse HEAD)" = "300681bbcb8365a8d1eacdacdbdd0249bbf1d6b1"
          printf 'glslang %s\nSPIRV-Cross %s\n' "$(git -C ios-shader-deps/glslang rev-parse HEAD)" "$(git -C ios-shader-deps/SPIRV-Cross rev-parse HEAD)" > m50-deps-sha.txt
      - name: Compile Apple Silicon macOS static runtime (not an IPA)
        run: |
          set -euo pipefail
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DPS3RECOMP_BUILD_TESTS=OFF -DPS3RECOMP_RSX_VULKAN=OFF 2>&1 | tee m0-configure.log
          cmake --build build --target ps3recomp_runtime --parallel 4 2>&1 | tee m0-build.log
          test -s build/libps3recomp_runtime.a
          xcrun lipo -info build/libps3recomp_runtime.a
          shasum -a 256 build/libps3recomp_runtime.a | tee m0-sha256.txt
      - name: Check recompilation tool CLI
        run: |
          set -euo pipefail
          python3 -m pip install --user -r upstream/tools/requirements.txt --break-system-packages || python3 -m pip install --user -r upstream/tools/requirements.txt
          python3 upstream/tools/ppu_loader.py --help > m0-ppu-loader-help.txt
          python3 upstream/tools/ppu_lifter.py --help > m0-ppu-lifter-help.txt
          echo "M0 compila apenas o runtime macOS/ARM64, sem dados do jogo." > m0-status.txt
      - name: M5.0 prove guest NV40 VP FP TEX0 decompiler and MSL translator on host
        run: |
          set -euo pipefail
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DPS3RECOMP_BUILD_TESTS=OFF -DPS3RECOMP_RSX_VULKAN=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix glslang);$(brew --prefix spirv-cross)" 2>&1 | tee m50-host-configure.log
          cmake --build build --target test_shader_msl --parallel 4 2>&1 | tee m50-host-build.log
          ./build/test_shader_msl -v 2>&1 | tee m50-host-shaders.log
          grep -Fq '[PASS] TEX FP MSL' m50-host-shaders.log
      - name: M5.1.3 prove NV40 VP upload lanes and FP MAIN mapping on host
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -I upstream/include -I upstream/libs/video \
            tests/host_m513_nv40_upload.c upstream/libs/video/rsx_dispatch.c \
            -o m513-nv40-host
          ./m513-nv40-host 2>&1 | tee m513-nv40-host.log
          grep -Fq 'M5.1.3 NV40 guest upload PASS' m513-nv40-host.log
      - name: M5.5.2 check real NV4097 stencil write-mask register on host
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -I upstream/include -I upstream/libs/video \
            tests/host_m552_stencil_mask.c upstream/libs/video/rsx_dispatch.c \
            -o m552-stencil-host
          ./m552-stencil-host 2>&1 | tee m552-stencil-host.log
          grep -Fxq 'M5.5.2 stencil mask register PASS' m552-stencil-host.log
      - name: M5.6 verify independent NV4097 stencil read/write registers on host
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -I upstream/include -I upstream/libs/video \
            tests/host_m56_stencil_masks.c upstream/libs/video/rsx_dispatch.c \
            -o m56-stencil-host
          ./m56-stencil-host 2>&1 | tee m56-stencil-host.log
          grep -Fxq 'M5.6 independent RSX stencil masks PASS' m56-stencil-host.log
      - name: M5.8.1 verify transparent alpha oracle against independent CPU specification
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_m581_alpha_oracle.py' -v 2>&1 | tee m581-alpha-oracle.log
      - name: M5.9 host-only synthetic private PPU ELF preflight
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            ios/ARPrivateELFProbe.c tests/host_m59_elf.c -o m59-host
          ./m59-host 2>&1 | tee m59-host.log
          grep -Fxq 'M5.9 host ELF validator PASS' m59-host.log
      - name: M6.0 verify bounded PPU4 interpreter with synthetic ELF
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -O2 \
            ios/ARPrivateELFProbe.c tests/host_m60_ppu.c -o m60-host
          ./m60-host 2>&1 | tee m60-host.log
          grep -Fxq 'M6.0 PPU4 strict guest interpreter PASS' m60-host.log
      - name: M6.1 verify synthetic bounded eight-step PPU
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -O2 \
            ios/ARPrivateELFProbe.c tests/host_m61_ppu.c -o m61-host
          ./m61-host 2>&1 | tee m61-host.log
          grep -Fxq 'M6.1 PPU8 stack and BL PASS' m61-host.log
      - name: M6.2 verify nested PPU frame and mflr in 16-step sandbox
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -O2 \
            ios/ARPrivateELFProbe.c tests/host_m62_ppu.c -o m62-host
          ./m62-host 2>&1 | tee m62-host.log
          grep -Fxq 'M6.2 PPU16 sandbox frame and LR PASS' m62-host.log
      - name: M6.3 verify 24-step sandbox CPU on synthetic ELF
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m63_ppu.c -o m63-host
          ./m63-host 2>&1 | tee m63-host.log
          grep -Fxq 'M6.3 PPU24 bounded continuation PASS' m63-host.log
      - name: M6.4 verify MD-form rldicl and 32-step synthetic CPU
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m64_ppu.c -o m64-host
          ./m64-host 2>&1 | tee m64-host.log
          grep -Fxq 'M6.4 PPU32 and rldicl PASS' m64-host.log
      - name: M6.5 prove writable guest PT_LOAD and BSS in isolated shadow
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m65_guestmem.c -o m65-host
          ./m65-host 2>&1 | tee m65-host.log
          grep -Fxq 'M6.5 PPU40 private guest writable PT_LOAD PASS' m65-host.log
      - name: M6.6 verify synthetic CTR mtctr and bounded indirect guest branch
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -O2             ios/ARPrivateELFProbe.c tests/host_m66_ctr.c -o m66-host
          ./m66-host 2>&1 | tee m66-host.log
          grep -Fxq 'M6.6 PPU48 guarded mtctr and bctr PASS' m66-host.log
      - name: M6.7 verify bounded guest r0 writer provenance
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m67_trace.c -o m67-host
          ./m67-host 2>&1 | tee m67-host.log
          grep -Fxq 'M6.7 bounded r0 provenance CTR trace PASS' m67-host.log
      - name: M6.7.2 check r12 descriptor provenance
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m672_descriptor.c -o m672-host
          ./m672-host 2>&1 | tee m672-host.log
          grep -Fxq 'M6.7.2 r12 descriptor classification PASS' m672-host.log
      - name: M6.7.3 verify read-only firmware imports using a synthetic ELF
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m673_import_match.c -o m673-import-host
          ./m673-import-host 2>&1 | tee m673-import-host.log
          grep -Fxq 'M6.7.3 private import metadata PASS' m673-import-host.log
      - name: M6.7.4 test isolated TLS initialization
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m674_tls.c -o m674-tls-host
          ./m674-tls-host 2>&1 | tee m674-tls-host.log
          grep -Fxq 'M6.7.4 bounded sys_initialize_tls HLE and negative tests PASS' m674-tls-host.log
      - name: M6.7.5 validate real PT_TLS process-entry ABI and protections
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m675_process_entry.c -o m675-entry-host
          ./m675-entry-host 2>&1 | tee m675-entry-host.log
          grep -Fxq 'M6.7.5 ELF PT_TLS process-entry ABI and negative tests PASS' m675-entry-host.log
      - name: M6.7.6 check PPC LR restore, guarded blr and invalid returns
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror ios/ARPrivateELFProbe.c tests/host_m676_lr_return.c -o m676-lr-host
          ./m676-lr-host 2>&1 | tee m676-lr-host.log
          grep -Fxq 'M6.7.6 mtlr LR restore and guarded blr return PASS' m676-lr-host.log
      - name: M7.4 prove generated PPU AOT dispatcher not an interpreter
        run: |
          set -euo pipefail
          python3 tests/m74_make_fixture.py m74-fixture.elf m74-functions.json
          python3 tools/ppu_aot_build.py \
            --elf m74-fixture.elf --functions m74-functions.json \
            --output-dir m74-aot --require-entry 0x10000 | tee m74-aot.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('m74-aot/aot-manifest.json').read_text())
          assert report['generated_functions']==2 and report['rejected_functions']==0
          raw=bytes.fromhex(report['source_sha256'])
          Path('m74-aot/m74_digest.h').write_text(
              '#define AR_M74_DIGEST {'+','.join('0x%02x'%b for b in raw)+'}\n')
          PY
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-label \
            -I upstream/runtime/ppu -I runtime -I m74-aot \
            runtime/ppu_bridge.c m74-aot/ascension_private_aot.c \
            tests/host_m74_aot_native.c -o m74-aot-host
          ./m74-aot-host 2>&1 | tee m74-aot-host.log
          grep -Fxq 'M7.4 generated PPC functions executed as host-native AOT via dispatch PASS' m74-aot-host.log
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-label \
            -I upstream/runtime/ppu -I runtime \
            -c m74-aot/ascension_private_aot.c -o m74-synthetic-aot-arm64.o
          xcrun nm -g m74-synthetic-aot-arm64.o | tee m74-arm64-symbols.txt
          grep -q '_ar_private_aot_install_sha256' m74-arm64-symbols.txt
          grep -q '_ar_game_ppu_00010000' m74-arm64-symbols.txt
          echo 'Synthetic ARM64 AOT linked and executed on host; zero commercial game functions in public IPA.' > m74-status.txt
      - name: M7.5 verify native AOT startup uses clean TLS and authentic PRX HLE
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror -DASCENSION_PRIVATE_AOT_LINKED \
            -I upstream/runtime/ppu -I runtime \
            ios/ARLivePPUBridge.c ios/ARPrivateELFProbe.c \
            runtime/ppu_bridge.c runtime/elf_image.c runtime/ppu_tls.c runtime/ppu_lwmutex.c runtime/ppu_lv2_bootstrap.c \
            tests/host_m75_aot_boot.c -o m75-aot-boot-host
          ./m75-aot-boot-host 2>&1 | tee m75-aot-boot-host.log
          grep -Fxq 'M7.5 signed AOT entry isolates TLS smoke and runs genuine guest HLE PASS' m75-aot-boot-host.log
      - name: M7.6 ensure signed ARM64 AOT crosses guest basic blocks and HLE
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            runtime/ppu_bridge.c tests/host_m76_aot_tail.c -o m76-aot-tail-host
          ./m76-aot-tail-host 2>&1 | tee m76-aot-tail-host.log
          grep -Fxq 'M7.6 signed AOT multi-block tail dispatch HLE and unresolved PASS' m76-aot-tail-host.log
          echo 'M7.6: generic multi-block native dispatcher proved. Real game AOT remains in user-owned offline package; public IPA AOT=0.' > m76-status.txt
      - name: M7.7 verify PS3 lwmutex BE ABI, guest memory, and honest HLE
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            runtime/ppu_bridge.c runtime/ppu_lwmutex.c \
            tests/host_m77_lwmutex.c -o m77-lwmutex-host
          ./m77-lwmutex-host 2>&1 | tee m77-lwmutex-host.log
          grep -Fxq 'M7.7 lwmutex create guest BE ABI, validation, reset PASS' m77-lwmutex-host.log
          echo 'M7.7: sys_lwmutex_create generic HLE + exact PRX NID lookup; game AOT is NOT in the public IPA.' > m77-status.txt
      - name: M7.9 verify genuine native HLE thread ID and mutex lifecycle
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            runtime/ppu_bridge.c runtime/ppu_lwmutex.c \
            runtime/ppu_lv2_bootstrap.c tests/host_m79_native_services.c \
            -o m79-native-hle-host
          ./m79-native-hle-host 2>&1 | tee m79-native-hle-host.log
          grep -Fxq 'M7.9 native AOT thread-ID, recursive lwmutex lock/unlock PASS' m79-native-hle-host.log
      - name: M7.8 verify native guest LV2 memory and monotonic time services
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            runtime/ppu_bridge.c runtime/ppu_lv2_bootstrap.c \
            tests/host_m78_lv2_bootstrap.c -o m78-lv2-host
          ./m78-lv2-host 2>&1 | tee m78-lv2-host.log
          grep -Fxq 'M7.8 genuine native AOT LV2 memory/time guest ABI PASS' m78-lv2-host.log
          python3 -m unittest discover -s tests -p test_m78_stage_aot.py -v 2>&1 | tee m78-stage-tests.log
      - name: M7.0 validate actual native ELF loader, import binder and AOT dispatcher
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            ios/ARLivePPUBridge.c ios/ARPrivateELFProbe.c \
            runtime/ppu_bridge.c runtime/elf_image.c runtime/ppu_tls.c runtime/ppu_lwmutex.c runtime/ppu_lv2_bootstrap.c \
            tests/host_m70_native_runtime.c -o m70-native-host
          ./m70-native-host 2>&1 | tee m70-native-host.log
          grep -Fxq 'M7.0 signed native PPU staging, real NID/HLE, and honest AOT unresolved PASS' m70-native-host.log
      - name: M7.1 prove continuous signed guest decoder, natural HLE, budget and ISA faults
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            ios/ARNativePPUContinuous.c ios/ARLivePPUContinuous.c \
            ios/ARPrivateELFProbe.c \
            runtime/ppu_bridge.c runtime/elf_image.c runtime/ppu_tls.c runtime/ppu_lwmutex.c runtime/ppu_lv2_bootstrap.c \
            tests/host_m71_continuous.c -o m71-continuous-host
          ./m71-continuous-host 2>&1 | tee m71-continuous-host.log
          grep -Fxq 'M7.1 signed native PowerPC continuous 76-step, import TLS and fail-closed ISA PASS' m71-continuous-host.log
      - name: M7.2 verify CR7 cmp and all conditional branch families
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            ios/ARNativePPUContinuous.c ios/ARLivePPUContinuous.c \
            ios/ARPrivateELFProbe.c \
            runtime/ppu_bridge.c runtime/elf_image.c runtime/ppu_tls.c runtime/ppu_lwmutex.c runtime/ppu_lv2_bootstrap.c \
            tests/host_m72_cr_branch.c -o m72-cr-branch-host
          ./m72-cr-branch-host 2>&1 | tee m72-cr-branch-host.log
          grep -Fxq 'M7.2 CR7 cmpld, signed/unsigned compare and conditional branches PASS' m72-cr-branch-host.log
      - name: M7.3 validate subsequent import NID without HLE bypass
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -I upstream/runtime/ppu -I runtime \
            ios/ARNativePPUContinuous.c ios/ARLivePPUContinuous.c \
            ios/ARPrivateELFProbe.c \
            runtime/ppu_bridge.c runtime/elf_image.c runtime/ppu_tls.c runtime/ppu_lwmutex.c runtime/ppu_lv2_bootstrap.c \
            tests/host_m73_import_discovery.c -o m73-prx-host
          ./m73-prx-host 2>&1 | tee m73-prx-host.log
          grep -Fxq 'M7.3 real second PRX stub library NID identified, unknown HLE blocked PASS' m73-prx-host.log
      - name: M5.0 run synthetic PPU LV2 integrated boot smoke
        run: |
          set -euo pipefail
          cmake --build build --target ps3recomp_boot_smoke --parallel 4 2>&1 | tee m50-boot-build.log
          ./build/ps3recomp_boot_smoke build/smoke/smoke.elf 2>&1 | tee m50-boot-smoke.log
      - name: M2 static PPU loader and lifter on a SYNTHETIC ELF (never game code)
        run: |
          set -euo pipefail
          python3 tools/make_synthetic_ppu.py --out m2-synthetic/EBOOT.ELF
          python3 upstream/tools/ppu_loader.py m2-synthetic/EBOOT.ELF -o m2-loader 2>&1 | tee m2-loader.log
          python3 upstream/tools/ppu_lifter.py m2-synthetic/EBOOT.ELF --functions m2-loader/EBOOT.functions.json --hle-stubs m2-loader/EBOOT.imports.json --output m2-generated --jobs 1 --chunk-lines 120000 --code-end 0x10028 2>&1 | tee m2-lifter.log
          test -s m2-generated/ppu_recomp.h
          test -n "$(find m2-generated -name 'ppu_recomp*.cpp' -print -quit)"
          find m2-generated -name '*.cpp' -print0 | xargs -0 -n1 clang++ -std=c++20 -fsyntax-only -I m2-generated 2>&1 | tee m2-clang-syntax.log
          echo "M2: real ps3recomp loader -> lifter -> Clang C++ syntax validated on generated SYNTHETIC PPU ELF. Real Ascension code stays PRIVATE." > m2-status.txt
      - name: M2.1 generate iOS ARM64 object from SYNTHETIC PowerPC code
        run: |
          set -euo pipefail
          python3 tools/ppu_lift_probe.py m2-synthetic/EBOOT.ELF --start 0x10000 --count 16 --out m21-synthetic-ppu.c 2>&1 | tee m21-aot.log
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -ffreestanding -fno-builtin -O2 -c m21-synthetic-ppu.c -o m21-synthetic-ppu-ios-arm64.o
          test -s m21-synthetic-ppu-ios-arm64.o
          file m21-synthetic-ppu-ios-arm64.o | tee m21-arch.log
          file m21-synthetic-ppu-ios-arm64.o | grep -E 'Mach-O.*arm64'
          shasum -a 256 m21-synthetic-ppu-ios-arm64.o | tee m21-object-sha256.txt
          echo "M2.1: Generic AOT generated an iOS ARM64 Mach-O object from synthetic PPU code. Real Ascension ELF was analyzed privately, never uploaded." > m21-status.txt
      - name: M2.2 batch-audit strict function boundaries (synthetic only)
        run: |
          set -euo pipefail
          printf '[{"start":"0x10000","end":"0x1000c"},{"start":"0x10020","end":"0x10028"}]\n' > m22-synthetic-functions.json
