name: AscensionRecomp M8.05.0 - SPURS report wake and SPU stack recovery

on:
  push:
    branches:
      - AscensionRecomp
    paths-ignore:
      - .publish-ipa-run-id.txt
      - .github/workflows/publish-ipa-temporary.yml
      - Arq.zip
      - AscensionRecomp-M7.85.0-NPUA80918-20261022-020947.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: ascension-recomp-m2
  cancel-in-progress: false

jobs:
  m2:
    if: github.ref == 'refs/heads/AscensionRecomp'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout ONLY AscensionRecomp
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce branch isolation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/AscensionRecomp"
          test "$(git branch --show-current)" = "AscensionRecomp"
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          test -f .github/workflows/ascension-recomp-m0.yml
          test -f .github/workflows/publish-ipa-temporary.yml
          test -z "$(find . -type f \( -iname '*.rap' -o -name 'GOWA.SELF' -o -name 'GOWA.ELF' \) -not -path './.git/*' -print -quit)"
      - name: Python-only PS3 ELF + PPU manifest tests
        run: |
          set -euo pipefail
          bash -n tools/build_ios_probe_ipa.sh
          python3 -m py_compile tools/m790_prepare_jobmods.py tools/m772_build_ios.py tools/m772_unpack_ci.py tools/enable_ios_spu_pic_runtime.py tools/m793_lift_spu_pic.py
          python3 -m py_compile tools/m714_owner_batch.py
          python3 -m py_compile tools/patch_ps3recomp_spurs2.py tools/m801_taskset_runtime.py tools/test_m801_taskset_lockline.py tools/test_m802_spu_rejoin.py tools/test_m803_gcm_park_spu_hold.py tools/m772_unpack_ci.py tools/m772_build_ios.py tools/enable_ios_drawable_layer.py
          python3 -m unittest discover -s tests -v 2>&1 | tee m0-tests.log
          python3 -m py_compile tools/elf_inventory.py
      - name: Xcode and build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          clang --version
          cmake --version
          ninja --version || brew install ninja
          brew list --versions sdl2 >/dev/null 2>&1 || brew install sdl2
          brew list --versions glslang >/dev/null 2>&1 || brew install glslang
          brew list --versions spirv-cross >/dev/null 2>&1 || brew install spirv-cross
      - name: M7.80 verify readable PS3 guest VM
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -DASCENSION_M772_LINKED=1 \
            -I tests/fixtures -I runtime -I upstream/runtime/ppu \
            runtime/ppu_bridge.c runtime/ppu_mmapper.c \
            runtime/ppu_mmapper_reserve.c runtime/ppu_mmapper_alloc.c \
            runtime/ppu_mmapper_map.c runtime/ppu_mmapper_release.c \
            tests/host_m772_guest_vm.c \
            -o m772-guest-vm-host
          ./m772-guest-vm-host | tee m772-guest-vm-host.log
          grep -Fq '[PASS] M772 guest VM: exact 3.5-GiB extent anywhere; strategy=' m772-guest-vm-host.log
      - name: M7.22 verify native C AOT lifting of synthetic PPC64 rotation and arithmetic
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m722_native_aot.py -v 2>&1 | tee m722-native-aot-tests.log
          grep -Fq 'Ran 7 tests' m722-native-aot-tests.log
      - name: M7.24 prove native NEG/NEGO PPC64 C lifter with independent synthetic edge cases
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m724_neg_aot.py -v 2>&1 | tee m724-neg-aot-tests.log
          grep -Fq 'Ran 7 tests' m724-neg-aot-tests.log
      - name: M7.25 test statically-lifted SRAWI PPC64 host C on synthetic words
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m725_srawi.py -v 2>&1 | tee m725-srawi-aot.log
          grep -Fq 'Ran 5 tests' m725-srawi-aot.log
      - name: M7.26 verify static PPC64 DIVDU native C lifter
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m726_divdu_aot.py -v 2>&1 | tee m726-divdu-aot.log
          grep -Fq 'Ran 4 tests' m726-divdu-aot.log
      - name: M7.27 lift genuine PowerPC memory ordering barriers into native host C
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m727_barriers_aot.py -v 2>&1 | tee m727-barrier-aot.log
          grep -Fq 'Ran 6 tests' m727-barrier-aot.log
      - name: M7.28 execute scalar reference VMX as actual host-native AOT
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m728_vmx_aot.py -v 2>&1 | tee m728-vmx-aot.log
          grep -Fq 'Ran 5 tests' m728-vmx-aot.log
      - name: M7.29 verify raw FPR bit semantics and native PowerPC scalar FP lifting
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m729_fpu_aot.py -v 2>&1 | tee m729-fpu-aot-tests.log
          grep -Fq 'Ran 6 tests' m729-fpu-aot-tests.log
      - name: M7.30 prove canonical MFCR r12 PPC64 to native C AOT
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m730_mfcr_aot.py -v 2>&1 | tee m730-mfcr-aot.log
          grep -Fq 'Ran 5 tests' m730-mfcr-aot.log
      - name: M7.31 native static PPC mtocrf and true CR field mask semantics
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m731_mtocrf_aot.py -v 2>&1 | tee m731-cr-aot-tests.log
          grep -Fq 'Ran 6 tests' m731-cr-aot-tests.log
      - name: M7.33 real iPhone LV2 registration regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m733_lv2_bindings.py -v 2>&1 | tee m733-bindings-source.log
          grep -Fq 'Ran 4 tests' m733-bindings-source.log
      - name: M7.34 verify XS SRADI 6-bit PPC64 translated into native C
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_m734_sradi_aot.py -v 2>&1 | tee m734-sradi-aot-tests.log
          grep -Fq 'Ran 6 tests' m734-sradi-aot-tests.log
      - name: Fetch pinned ps3recomp source and apply Ascension SPURS2 HLE
        run: |
          set -euo pipefail
          git clone https://github.com/sp00nznet/ps3recomp.git upstream
          git -C upstream checkout 39a36296511c445707adabcd312f0b740cfbd694
          test "$(git -C upstream rev-parse HEAD)" = "39a36296511c445707adabcd312f0b740cfbd694"
          python3 tools/enable_macos_boot_smoke_null_backend.py upstream
          git clone https://github.com/sp00nznet/ps3recomp.git upstream-m772
          git -C upstream-m772 checkout 39a36296511c445707adabcd312f0b740cfbd694
          test "$(git -C upstream-m772 rev-parse HEAD)" = "39a36296511c445707adabcd312f0b740cfbd694"
          test "$(git -C upstream rev-parse HEAD)" = "$(git -C upstream-m772 rev-parse HEAD)"
          python3 tools/patch_ps3recomp_cell_game.py --upstream upstream
          python3 tools/patch_ps3recomp_cell_game.py --upstream upstream-m772
          python3 tools/patch_ps3recomp_spurs2.py --upstream upstream --repo .
          python3 tools/patch_ps3recomp_spurs2.py --upstream upstream-m772 --repo .
          python3 tools/enable_ios_spu_pic_runtime.py upstream
          python3 tools/enable_ios_spu_pic_runtime.py upstream-m772
          python3 tools/test_m801_taskset_lockline.py --upstream upstream
          python3 tools/test_m802_spu_rejoin.py --upstream upstream
          python3 tools/test_m802_spu_rejoin.py --upstream upstream-m772
          python3 tools/test_m803_gcm_park_spu_hold.py --upstream upstream
          python3 tools/test_m803_gcm_park_spu_hold.py --upstream upstream-m772
      - name: M7.72 reconstruct PS3Recomp full GOWA lift from validated source shards
        run: |
          set -euo pipefail
          python3 tools/m772_unpack_ci.py \
            --parts runtime/m772-src \
            --output "$RUNNER_TEMP/m772-lift" \
            --upstream upstream-m772 | tee m772-preflight.json
          test -s "$RUNNER_TEMP/m772-lift/AscensionRecomp-PS3Recomp-Lift/ppu/ppu_recomp_table.cpp"
          test "$(find "$RUNNER_TEMP/m772-lift/AscensionRecomp-PS3Recomp-Lift/ppu" -name 'ppu_recomp_*.cpp' | wc -l | tr -d ' ')" = 651
          test "$(find "$RUNNER_TEMP/m772-lift/AscensionRecomp-PS3Recomp-Lift/spu" -name 'spu_recomp.c' | wc -l | tr -d ' ')" = 4
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('m772-preflight.json').read_text())
          assert p['ppu_function_table_entries']==29849,p
          assert p['native_aot_function_entry_hooks']==29849,p
          assert p['native_observed_hotloop_hooks']==2,p
          print('M7.80 arbitrary-base PS3 guest VM and pinned PS3Recomp lift staged')
          PY
      - name: M7.70 unpack the 3835 delta C functions and stage one integration
        run: |
          set -euo pipefail
          python3 - <<'PYM770UNPACK'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('runtime/m770-src-bundle.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='40b06660b7b61b06ef99358477a7a84e41b8583196ce2c6176509b306293dafd'
          with zipfile.ZipFile(p) as z:
            names=z.namelist()
            assert len(names)==11 and len(set(names))==11
            assert all(n.startswith('runtime/m770-delta/') or n.startswith('tests/') for n in names)
            assert all('..' not in Path(n).parts and not n.startswith('/') for n in names)
            assert sum(n.endswith('.c') for n in names)==10
            z.extractall('.')
          print('M7.70 owner delta ZIP SHA256 PASS; seven modules, installer, manifest and regression tests staged')
          PYM770UNPACK
          python3 tools/m770_apply_ci.py .
          python3 tools/m771_apply_ci.py .
          # Correct the shipping version AFTER the M7.69-era unit tests
          # and AFTER the M7.70 stage. Do not lie about earlier hardware runs.
          python3 - <<'PYM7930VERSION'
          from pathlib import Path
          plist=Path('ios/Probe-Info.plist')
          old=plist.read_text()
          for a,b in [
            ('<key>CFBundleShortVersionString</key><string>7.70.0</string>',
             '<key>CFBundleShortVersionString</key><string>8.0.5</string>'),
            ('<key>CFBundleVersion</key><string>7700</string>',
             '<key>CFBundleVersion</key><string>8005</string>')]:
            assert old.count(a)==1,(str(plist),a,old.count(a))
            old=old.replace(a,b)
          plist.write_text(old)
          build=Path('tools/build_ios_probe_ipa.sh')
          src=build.read_text()
          assert 'IPA_VERSION' in src, 'build script must derive the IPA basename from the installed bundle version'
          print('M8.05.0 shipping identity 8.0.5 (8005) and versioned IPA basename checked')
          PYM7930VERSION
          bash -n tools/build_ios_probe_ipa.sh
      - name: Export exact iOS project sources and staged ARM64 runtime (M7.71)
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/AscensionRecomp"
          BASE="AscensionRecomp-SOURCE-${GITHUB_SHA}"
          EXPORT="$RUNNER_TEMP/$BASE"
          mkdir -p "$EXPORT"
          git archive --format=tar "${GITHUB_SHA}" | tar -xf - -C "$EXPORT"
          python3 - "$EXPORT" <<'PYM770PRIVATEINPUT'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for name in ('Arq.zip','AscensionRecomp-M7.85.0-NPUA80918-20261022-020947.txt'):
              (root/name).unlink(missing_ok=True)
          PYM770PRIVATEINPUT
          for sub in ios runtime tools tests docs .github; do
            test -d "$sub" || continue
            mkdir -p "$EXPORT/$sub"
            rsync -a --exclude='__pycache__/' --exclude='*.pyc' --exclude='*.o' --exclude='*.log' --exclude='*.ipa' "$sub/" "$EXPORT/$sub/"
          done
          for sub in upstream/runtime/ppu upstream/include; do
            test -d "$sub" || continue
            mkdir -p "$EXPORT/$sub"
            rsync -a --exclude='__pycache__/' --exclude='*.o' "$sub/" "$EXPORT/$sub/"
          done
          printf '%s\n' \
            'ASCENSIONRECOMP - IOS SOURCE SNAPSHOT / NPUA80918' \
            "Git commit = $GITHUB_SHA" \
            'Branch = AscensionRecomp (only)' \
            'M7.70 3835 PPC AOT handlers: runtime/m770-delta/' \
            'M7.71 frontier diagnostics: runtime/ppu_bridge.c and runtime/ppu_bridge.h' \
            'iOS app source: ios/ARProbeApp.m and ios/ARLivePPUBridge.c' \
            'Build script (actual Apple SDK pipeline): tools/build_ios_probe_ipa.sh' \
            'Workflow: .github/workflows/ascension-recomp-m0.yml' \
            'Installer scripts: tools/m770_apply_ci.py and tools/m771_apply_ci.py' \
            'Dependency: pinned ps3recomp a2c20108af45174dbb7d3e2f87f6acaaef09c6b4 (upstream runtime/include included).' \
            'There is NO .xcodeproj or .xcworkspace in this Git repository.' \
            'DO NOT claim a generated Xcode project exists. Build via the checked-in script / Actions.' \
            'Source snapshot is AFTER M7.70 and M7.71 installers, matching the effective code compiled in Actions.' \
            'GOWA.ELF, RAP, SELF, PSARC and game files are NOT included.' \
            > "$EXPORT/LEIA-PRIMEIRO-CODIGO-FONTE-IOS.txt"
          for file in runtime/m770-delta/ppu_m770_delta_install.c runtime/m770-delta/ppu_m770_delta_05.c ios/ARProbeApp.m runtime/ppu_bridge.c tools/build_ios_probe_ipa.sh tools/m771_apply_ci.py; do
            if test -s "$EXPORT/$file"; then
              echo "SOURCE CHECK PASS: $file"
            else
              echo "SOURCE CHECK MISSING: $file"
            fi
          done
          if grep -Fq 'frontier_enters' "$EXPORT/runtime/ppu_bridge.c"; then echo 'FORENSIC SOURCE PASS'; else echo 'FORENSIC SOURCE MISSING'; fi
          if grep -Fq 'M7.71' "$EXPORT/ios/ARProbeApp.m"; then echo 'IOS M7.71 SOURCE PASS'; else echo 'IOS M7.71 SOURCE MISSING'; fi
          (cd "$RUNNER_TEMP" && zip -q -r "$GITHUB_WORKSPACE/m771-project-source.zip" "$BASE")
          shasum -a 256 m771-project-source.zip | tee m771-project-source.sha256
          test -s m771-project-source.zip
      - name: Upload complete iOS source ZIP (after AOT/runtime integration)
        uses: actions/upload-artifact@v4
        with:
          name: AscensionRecomp-M771-IOS-SOURCE-COMPLETE
          path: |
            m771-project-source.zip
            m771-project-source.sha256
          retention-days: 14
      - name: M7.27 verify true host ARM64 dmb fence inside generated AOT
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.ppu_cfg_lifter import lift
          src,hist=lift([0x7c0006ac,0x4e800020],0x10000,'m727_guest_eieio')
          assert hist.get('eieio')==1
          Path('m727-eieio-native.c').write_text(src,encoding='utf-8')
          PY
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c11 -O2 -I upstream/runtime/ppu -I runtime \
            -S m727-eieio-native.c -o m727-eieio-arm64.s
          grep -Eq 'dmb[[:space:]]+ish' m727-eieio-arm64.s
          echo 'M7.27 ARM64 EIEIO AOT emits dmb ish fence PASS' | tee m727-arm64-fence.log
      - name: M7.28 cross-compile actual VMX static native AOT for iPhone ARM64
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.ppu_cfg_lifter import lift
          words=[(4<<26)|(5<<21)|(0<<16)|(0<<11)|908,
                 (31<<26)|(5<<21)|(0<<16)|(8<<11)|(231<<1),
                 0x4e800020]
          src,hist=lift(words,0x10000,'native_arm64_vmx')
          assert hist.get('vspltisw')==1 and hist.get('vmx_store')==1
          Path('m728-vmx-native.c').write_text(src,encoding='utf8')
          PY
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c11 -O2 -I upstream/runtime/ppu -I runtime \
            -c m728-vmx-native.c -o m728-vmx-arm64.o
          test -s m728-vmx-arm64.o
          file m728-vmx-arm64.o | tee m728-vmx-arm64.log
          grep -Eq 'Mach-O 64-bit object arm64|Mach-O 64-bit arm64 object' m728-vmx-arm64.log
      - name: M7.29 compile and execute scalar PPC64 FPU translated into native AOT
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.ppu_cfg_lifter import lift
          def d(op,rt,ra,disp):
              return (op<<26)|(rt<<21)|(ra<<16)|(disp&65535)
          def x(ft,fa,fb,xo):
              return (63<<26)|(ft<<21)|(fa<<16)|(fb<<11)|(xo<<1)
          opcodes=[d(50,0,1,128),x(13,0,0,846),d(48,0,2,0),
                   x(0,13,0,18),d(54,0,11,0),0x4e800020]
          src,h=lift(opcodes,0x10000,'m729_native_fp')
          assert h['fp_load']==2 and h['fp_store']==1
          assert h['fcfid']==1 and h['fdiv']==1
          harness=r'''
          int main(void){
           if(ar_bridge_init(0x4000)!=0)return 1;
           uint8_t number[8]={0,0,0,0,0x04,0xc1,0xa6,0xc0};
           uint8_t scalar[4]={0x40,0,0,0};
           if(ar_vm_load(0x1880,number,8)!=0||
              ar_vm_load(0x1900,scalar,4)!=0)return 2;
           ppu_ctx c={0};c.lr=0x1100;
           c.gpr[1]=0x1800;c.gpr[2]=0x1900;c.gpr[11]=0x1a00;
           int status=m729_native_fp(&c);
           if(status!=0||c.fpr[13]!=79800000.0||
              c.fpr[0]!=39900000.0||
              ar_read64(0x1a00)!=0x4183069b00000000ULL||
              (c.fpscr&0x1f000U)!=0x4000U)return 3;
           ar_bridge_shutdown();
           return 0;
          }'''
          Path('m729-fpu-native.c').write_text(src+'\n'+harness,encoding='utf8')
          PY
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c11 -O2 -I upstream/runtime/ppu -I runtime \
            -c m729-fpu-native.c -o m729-fpu-arm64.o
          file m729-fpu-arm64.o | tee m729-fpu-arm64.log
          grep -Eq 'Mach-O 64-bit object arm64|Mach-O 64-bit arm64 object' m729-fpu-arm64.log
          clang -std=c11 -O2 -fsanitize=undefined \
            -I upstream/runtime/ppu -I runtime \
            m729-fpu-native.c runtime/ppu_bridge.c -lm -o m729-fpu-native-host
          ./m729-fpu-native-host 2>&1 | tee m729-fpu-native-host.log
          echo "M7.29 native AOT FPR memory / integer conversion / fdiv PASS" | tee -a m729-fpu-native-host.log
      - name: M7.30 prove MFCR r12 emits real iPhone ARM64 object
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.ppu_cfg_lifter import lift
          source,h=lift([0x7d800026,0x4e800020],0x10000,'m730_mfcr_r12')
          assert h.get('mfcr')==1
          assert 'c->gpr[12]=(u64)c->cr' in source
          assert 'ar_ppc_fallback_step' not in source
          Path('m730-mfcr-native.c').write_text(source,encoding='utf8')
          PY
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c11 -O2 -I upstream/runtime/ppu -I runtime \
            -c m730-mfcr-native.c -o m730-mfcr-arm64.o
          file m730-mfcr-arm64.o | tee m730-mfcr-arm64.log
          grep -Eq 'Mach-O 64-bit object arm64|Mach-O 64-bit arm64 object' m730-mfcr-arm64.log
      - name: M7.31 crosscompile the same authentic native game block for ARM64
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c11 -O2 -Wall -Wextra -Werror -I upstream/runtime/ppu -I runtime \
            -c runtime/ppu_m731_native_mtocrf.c -o m731-cr-arm64.o
          xcrun nm -g m731-cr-arm64.o | tee m731-cr-arm64-symbols.log
          grep -Eq ' [Tt] _ar_m731_native_0052da5c$' m731-cr-arm64-symbols.log
          grep -Eq ' [Tt] _ar_m731_register_frontier$' m731-cr-arm64-symbols.log
          file m731-cr-arm64.o | tee m731-cr-arm64-file.log
          grep -Ei 'Mach-O 64-bit (object )?arm64' m731-cr-arm64-file.log
      - name: M7.32 crosscompile owner 9-op native ARM64 entry and verify symbols
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c11 -O2 -Wall -Wextra -Werror -I upstream/runtime/ppu -I runtime \
            -c runtime/ppu_m732_native_timezone.c -o m732-owner-arm64.o
          xcrun nm -g m732-owner-arm64.o | tee m732-owner-arm64-symbols.log
          grep -Eq ' [Tt] _ar_m732_native_005230e0$' m732-owner-arm64-symbols.log
          grep -Eq ' [Tt] _ar_m732_register_block$' m732-owner-arm64-symbols.log
          file m732-owner-arm64.o | tee m732-owner-arm64-file.log
          grep -Ei 'Mach-O 64-bit (object )?arm64' m732-owner-arm64-file.log
      - name: M7.34 crosscompile 11 guest blocks as signed ARM64 without interpreted PPC
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          for module in ppu_m734_native_math ppu_m734_native_batch; do
            xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk" \
              -std=c11 -O2 -Wall -Wextra -Werror \
              -I upstream/runtime/ppu -I runtime \
              -c "runtime/$module.c" -o "$module.arm64.o"
            file "$module.arm64.o"
          done
          xcrun nm -g ppu_m734_native_math.arm64.o | tee m734-native-math-symbols.log
