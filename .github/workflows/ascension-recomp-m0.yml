name: AscensionRecomp M0 - ARM64 runtime and ELF preflight

on:
  push:
    branches:
      - AscensionRecomp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascension-recomp-m0
  cancel-in-progress: false

jobs:
  m0:
    if: github.ref == 'refs/heads/AscensionRecomp'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout ONLY AscensionRecomp
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce branch isolation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/AscensionRecomp"
          test "$(git branch --show-current)" = "AscensionRecomp"
          test "$(find .github/workflows -type f | wc -l | tr -d ' ')" = "1"
      - name: Python-only PS3 ELF inventory tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee m0-tests.log
          python3 -m py_compile tools/elf_inventory.py
      - name: Xcode and build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          clang --version
          cmake --version
          ninja --version || brew install ninja
          brew list --versions sdl2 >/dev/null 2>&1 || brew install sdl2
      - name: Fetch pinned ps3recomp source
        run: |
          set -euo pipefail
          git clone https://github.com/sp00nznet/ps3recomp.git upstream
          git -C upstream checkout a2c20108af45174dbb7d3e2f87f6acaaef09c6b4
          test "$(git -C upstream rev-parse HEAD)" = "a2c20108af45174dbb7d3e2f87f6acaaef09c6b4"
      - name: Compile Apple Silicon macOS static runtime (not an IPA)
        run: |
          set -euo pipefail
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DPS3RECOMP_BUILD_TESTS=OFF -DPS3RECOMP_RSX_VULKAN=OFF 2>&1 | tee m0-configure.log
          cmake --build build --target ps3recomp_runtime --parallel 4 2>&1 | tee m0-build.log
          test -s build/libps3recomp_runtime.a
          xcrun lipo -info build/libps3recomp_runtime.a
          shasum -a 256 build/libps3recomp_runtime.a | tee m0-sha256.txt
      - name: Check recompilation tool CLI
        run: |
          set -euo pipefail
          python3 -m pip install --user -r upstream/tools/requirements.txt --break-system-packages || python3 -m pip install --user -r upstream/tools/requirements.txt
          python3 upstream/tools/ppu_loader.py --help > m0-ppu-loader-help.txt
          python3 upstream/tools/ppu_lifter.py --help > m0-ppu-lifter-help.txt
          echo "M0 compila apenas o runtime macOS/ARM64, sem dados do jogo." > m0-status.txt
      - name: Upload M0 proof - runtime and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AscensionRecomp-M0-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            m0-tests.log
            m0-configure.log
            m0-build.log
            m0-sha256.txt
            m0-ppu-loader-help.txt
            m0-ppu-lifter-help.txt
            m0-status.txt
            build/libps3recomp_runtime.a
