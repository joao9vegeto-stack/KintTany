name: Fairy2iOS - mode4 original-stream bounded retry G1T + G1S
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/mode4_retry_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-resource-stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resource-stage-trace:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact Fairy2iOS commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify original asset retry, no synthetic G1T and 18 native branches
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .upstream-ref)" = b526a50b85e4cfa3142c111e1ad491d9fd11f0eb
          python3 -m unittest discover -s fairy2/tests -p test_resource_stages.py -v
          python3 -m unittest discover -s fairy2/tests -p test_g1s_readertrace.py -v
          python3 -m unittest discover -s fairy2/tests -p test_mode4_retry.py -v
          python3 -m unittest discover -s fairy2/tests -p test_full_resource_va.py -v
          python3 - <<'PY'
          import json
          a=json.load(open('fairy2/mode4_retry_trigger.json'))
          assert a['source_run'] == 44995690307
          assert a['gameplay_fix_claimed'] is False
          assert a['shader_rebuild'] is False
          assert a['trace_sites'] == 18
          assert a['original_stream_only'] is True
          assert a['synthetic_reader_removed'] is True
          print('G1T+G1S original virtual stream retry, 18 original branch guards, shader image unchanged')
          PY
          xcodebuild -version
          brew list --formula xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m pip install --disable-pip-version-check lz4 'capstone>=5,<6' fonttools zbic backports.zstd
          python3 tools/engine.py relink
          python3 tools/engine.py check
          python3 tools/engine.py sync
          grep -q 'DM_CRASH_PEEK' engine/dm/host/crash.c
          grep -q 'static void on_crash' engine/dm/host/crash.c
      - name: Retrieve exactly verified KTGL-NoOverlap base IPA (no shader rebuild)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 44995690307 -R joao9vegeto-stack/KintTany \
            -n Fairy2iOS-KTGL-NoOverlap-1 -D "$RUNNER_TEMP/source"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['RUNNER_TEMP'])/'source'
          path=root/'Fairy2iOS-FairyTail2-KTGL-2GiB-NoOverlap.ipa'
          assert path.stat().st_size == 1622226531
          d=hashlib.sha256(path.read_bytes()).hexdigest()
          assert d == 'b1792f9eb522de53b2b252e3a85229584831434999edda98f31c87c7c8c256cd'
          report=json.loads((root/'ktgl-nooverlap-report.json').read_text())
          assert report['output_ipa_sha256']==d
          print('Verified original 19,210 shader IPA, SHA-256',d)
          PY
      - name: Repack native G1T + G1S original-stream retry without shader rebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          python3 fairy2/scripts/repack_mode4_retry.py \
            --source-ipa "$RUNNER_TEMP/source/Fairy2iOS-FairyTail2-KTGL-2GiB-NoOverlap.ipa" \
            --source-report "$RUNNER_TEMP/source/ktgl-nooverlap-report.json" \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/output"
      - name: Verify no synthetic assets, shader SHA, IPA CRC, controls and external RomFS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,zipfile,hashlib
          d=Path(os.environ['RUNNER_TEMP'])/'output'
          info=json.loads((d/'mode4-retry-report.json').read_text())
          assert info['branch_trace_sites']==18
          assert info['not_a_gameplay_fix'] is True
          assert info['device_boot_verified'] is False
          assert info['g1t_fallback_preserved'] is False
          assert info['mode4_native_retry_enabled'] is True
          assert info['original_stream_only'] is True
          assert info['retry_bound_per_thread'] == 64
          assert info['fdata_io_proof'] is True
          assert info['resource_stage_trace'] is True
          assert info['g1s_hash']=='0xac9ed13e'
          assert info['g1s_factory']=='main+0x1dbdc14'
          assert info['g1s_parser']=='main+0x6e7b60'
          assert info['g1s_header_read']=='virtual [vtable+0x20] requests 184 bytes'
          assert info['game_shaders_recompiled'] is False
          assert info['guest_modules_rewritten'] is False
          assert info['external_romfs_aoc_unchanged'] is True
          assert info['metal_shader_sha256']=='ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b'
          ipa=d/info['output_ipa'];assert ipa.exists()
          s=hashlib.sha256()
          with ipa.open('rb') as f:
            for chunk in iter(lambda:f.read(8*1024*1024),b''):s.update(chunk)
          assert s.hexdigest()==info['output_ipa_sha256']
          with zipfile.ZipFile(ipa) as z:
            assert z.testzip() is None
            names=z.namelist()
            fw='Payload/DmShell.app/Frameworks/DmGame0100B9801F872000.framework/'
            assert z.getinfo(fw+'msl/b-0724088d3779.img').file_size==2640519506
            assert 'Payload/DmShell.app/DmShell' in names
            assert z.getinfo(fw+'profile.tsv').file_size>100
            assert not any(n.endswith('/romfs.img') for n in names)
          print('FAIRY2 ORIGINAL-ONLY BOUNDED RETRY CANDIDATE:',ipa.name,'SHA',s.hexdigest())
          PY
      - name: Upload one mode4 G1T and G1S native-stream retry IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-Mode4-OriginalRetry-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/output/Fairy2iOS-FairyTail2-Mode4-BoundedRetry.ipa
            ${{ runner.temp }}/output/mode4-retry-report.json
            ${{ runner.temp }}/output/full-resource-va-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload native host Xcode build log if failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-Mode4-OriginalRetry-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/output/host-build.log
          if-no-files-found: warn
