name: Asura's Wrath iOS ARM64

on:
  push:
    branches: ["Asura'sWiOS"]
    paths:
      - ".github/workflows/asura-ios.yml"
      - "ios/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: asura-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      MESA_KOSMICKRISP_SHA: bfe063f723d436e5cdef8a98f058d4e44a64810c
      MESA_PRIMARY_URL: https://gitlab.freedesktop.org/mesa/mesa.git
      MESA_MIRROR_URL: https://github.com/Kenji-NX/mesa.git
      MESON_VERSION: 1.9.1
      LLVM_FORMULA: llvm@20
      SPIRV_LLVM_TRANSLATOR_SHA: e328468fd329342f1f60c12fdd19cc0faaa88f32
      IOS_DEPLOYMENT_TARGET: "17.4"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Asura's Wrath ReXGlue source
        run: |
          git clone --recursive https://github.com/PauloUbirajara/asuras-wrath-recomp.git upstream
          git -C upstream submodule update --init --recursive
          cp -R ios upstream/ios
          python3 upstream/ios/prepare_ios.py
          python3 ios/launcher_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import sys
          source = Path("upstream/tools/rexglue/src/ui/windowed_app_context_sdl.cpp").read_text()
          marker = "ASURA_IOS_SDL_UIKIT_DRIVER_V1"
          ios_branch = source.find("#if REX_PLATFORM_IOS")
          mac_branch = source.find("#elif REX_PLATFORM_MAC", ios_branch)
          if marker not in source or ios_branch < 0 or mac_branch < 0:
              raise SystemExit("iOS SDL UIKit driver patch is missing")
          block = source[ios_branch:mac_branch]
          if 'requested_driver = "uikit";' not in block:
              raise SystemExit("iOS SDL video backend is not explicitly UIKit")
          if 'requested_driver = "cocoa";' in block:
              raise SystemExit("macOS Cocoa video backend leaked into iOS branch")
          print("ASURA_IOS_SDL_UIKIT_DRIVER_PREFLIGHT_OK")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          generated = Path("upstream/src/asurawrath_app.h").read_text()
          hooks = re.findall(r"\bvoid\s+OnPostSetup\s*\(\)\s*override", generated)
          if len(hooks) != 1:
              raise SystemExit(f"expected exactly one OnPostSetup override, found {len(hooks)}")
          if 'AsuraIOSLog("HOOK OnPostSetup");' not in generated:
              raise SystemExit("original OnPostSetup hook was not instrumented")
          if "ASURA_IOS_PLAY_GATE_V1" not in generated:
              raise SystemExit("pre-ReXApp Play gate marker is missing")
          if "AsuraIOSWaitForGameSelection" not in generated:
              raise SystemExit("ReXApp factory does not wait for Play")
          if "OnFinalizePaths(" in generated:
              raise SystemExit("legacy post-presentation launcher remains")
          if generated.count("void OnConfigurePaths(rex::PathConfig &paths) override") != 1:
              raise SystemExit("selected path is not injected into the path hook")
          if generated.find("AsuraIOSWaitForGameSelection") > generated.find("new AsurawrathApp"):
              raise SystemExit("ReXApp is constructed before Play")
          print("ASURA_IOS_PRE_REXAPP_PLAY_GATE_PREFLIGHT_OK")
          PY
          grep -q "ASURA_IOS_PLAY_GATE_V1" upstream/src/asurawrath_app.h
          grep -q "AsuraIOSWaitForGameSelection" upstream/src/asurawrath_app.h
          ! grep -q "OnFinalizePaths" upstream/src/asurawrath_app.h
          ! grep -q "dispatch_semaphore_wait(asura_choice_ready" upstream/src/asurawrath_app.h
          grep -q "PROCESS_START" ios/asura_ios_native.mm
          grep -q "FATAL SIGNAL SIGSEGV" ios/asura_ios_native.mm
          grep -q "LAUNCHER_SCENE_WAIT" ios/asura_ios_native.mm
          grep -q "LAUNCHER_WINDOW_ATTACHED_TO_FOREGROUND_SCENE" ios/asura_ios_native.mm
          grep -q "APP_LAUNCH_GATE_WAITING_FOR_PLAY" ios/asura_ios_native.mm
          grep -q "APP_LAUNCH_GATE_PLAY_ACCEPTED" ios/asura_ios_native.mm
          ! grep -q "LAUNCHER_WINDOW_MODE_LEGACY_FALLBACK" ios/asura_ios_native.mm
          BUILD_NUMBER=$(cat ios/BUILD_NUMBER)
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Install iOS and KosmicKrisp build dependencies
        run: |
          set -euxo pipefail
          brew update
          for pkg in cmake pkg-config libclc "${LLVM_FORMULA}" spirv-tools ninja librsvg; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done
          python3 -m venv "$GITHUB_WORKSPACE/venv"
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "meson==${MESON_VERSION}" mako packaging pyyaml
          LLVM_PREFIX="$(brew --prefix "${LLVM_FORMULA}")"
          TRANSLATOR_PREFIX="$GITHUB_WORKSPACE/deps/spirv-llvm-translator-20"
          git clone --filter=blob:none --no-checkout https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git translator
          git -C translator fetch --depth=1 origin "${SPIRV_LLVM_TRANSLATOR_SHA}"
          git -C translator checkout --detach "${SPIRV_LLVM_TRANSLATOR_SHA}"
          cmake -S translator -B translator-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TRANSLATOR_PREFIX" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DLLVM_LINK_LLVM_DYLIB=OFF
          cmake --build translator-build --target LLVMSPIRVLib llvm-spirv --parallel 3
          cmake --install translator-build
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$TRANSLATOR_PREFIX/bin" >> "$GITHUB_PATH"
          echo "HOST_LDFLAGS=-L$TRANSLATOR_PREFIX/lib -L$LLVM_PREFIX/lib" >> "$GITHUB_ENV"
          echo "HOST_CPPFLAGS=-I$TRANSLATOR_PREFIX/include -I$LLVM_PREFIX/include" >> "$GITHUB_ENV"
          echo "HOST_PKG_CONFIG_PATH=$TRANSLATOR_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig:$(brew --prefix libclc)/lib/pkgconfig:$(brew --prefix spirv-tools)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Fetch pinned KosmicKrisp source and apply XOWUE iOS patches
        run: |
          set -euxo pipefail
          if git clone --filter=blob:none --no-checkout "$MESA_PRIMARY_URL" mesa-src; then
            echo "official GitLab Mesa source"
          else
            rm -rf mesa-src
            git clone --filter=blob:none --no-checkout "$MESA_MIRROR_URL" mesa-src
          fi
          git -C mesa-src fetch --depth=1 origin "$MESA_KOSMICKRISP_SHA"
          git -C mesa-src checkout --detach "$MESA_KOSMICKRISP_SHA"
          for patch in \
            "$GITHUB_WORKSPACE/ios/patches/0001-kosmickrisp-ios-m2.patch" \
            "$GITHUB_WORKSPACE/ios/patches/0002-kosmickrisp-ios-m3-metal-wsi.patch"; do
            git -C mesa-src apply --check "$patch"
            git -C mesa-src apply "$patch"
          done
          grep -q "'ios'" mesa-src/meson.options
          grep -q "with_platform_ios" mesa-src/meson.build
          grep -q "TARGET_OS_IOS" mesa-src/src/kosmickrisp/bridge/mtl_device.m
          git -C mesa-src diff --check

      - name: Build KosmicKrisp host shader tools
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          export LDFLAGS="$HOST_LDFLAGS" CPPFLAGS="$HOST_CPPFLAGS" PKG_CONFIG_PATH="$HOST_PKG_CONFIG_PATH"
          meson setup build-kk/host mesa-src --buildtype=release -Dplatforms=macos \
            -Dvulkan-drivers=kosmickrisp -Dgallium-drivers= -Dopengl=false -Dzstd=disabled \
            -Dmesa-clc=enabled -Dprecomp-compiler=enabled --prefer-static
          meson compile -C build-kk/host mesa_clc vtn_bindgen2 kk_clc
          mkdir -p host-tools/bin
          cp build-kk/host/src/compiler/clc/mesa_clc host-tools/bin/
          cp build-kk/host/src/compiler/spirv/vtn_bindgen2 host-tools/bin/
          cp build-kk/host/src/kosmickrisp/clc/kk_clc host-tools/bin/

      - name: Configure iOS ARM64 cross toolchain and build KosmicKrisp
        run: |
          set -euxo pipefail
          mkdir -p toolchain
          cat > toolchain/ios-clang <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          exec xcrun --sdk iphoneos clang -target "arm64-apple-ios${IOS_DEPLOYMENT_TARGET}" -isysroot "$SDKROOT" "$@"
          EOF
          cat > toolchain/ios-clangxx <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          exec xcrun --sdk iphoneos clang++ -target "arm64-apple-ios${IOS_DEPLOYMENT_TARGET}" -isysroot "$SDKROOT" "$@"
          EOF
          cat > toolchain/ios-ar <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphoneos ar "$@"
          EOF
          cat > toolchain/ios-strip <<'EOF'
          #!/bin/bash
          exec xcrun --sdk iphoneos strip "$@"
          EOF
          chmod +x toolchain/*
          cat > ios-arm64.cross <<EOF
          [binaries]
          c = '$GITHUB_WORKSPACE/toolchain/ios-clang'
          cpp = '$GITHUB_WORKSPACE/toolchain/ios-clangxx'
          objc = '$GITHUB_WORKSPACE/toolchain/ios-clang'
          ar = '$GITHUB_WORKSPACE/toolchain/ios-ar'
          strip = '$GITHUB_WORKSPACE/toolchain/ios-strip'
          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          EOF
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          unset LDFLAGS CPPFLAGS PKG_CONFIG_PATH
          export PATH="$GITHUB_WORKSPACE/host-tools/bin:$PATH"
          meson setup build-kk/ios mesa-src --cross-file "$GITHUB_WORKSPACE/ios-arm64.cross" \
            --buildtype=release --wrap-mode=nodownload -Dplatforms=ios \
            -Dvulkan-drivers=kosmickrisp -Dgallium-drivers= -Dopengl=false -Dzstd=disabled \
            -Dmesa-clc=system -Dprecomp-compiler=system -Dllvm=disabled -Dspirv-tools=disabled --prefer-static
          ninja -C build-kk/ios src/kosmickrisp/vulkan/libvulkan_kosmickrisp.dylib
          DRIVER="$(find build-kk/ios -type f -name 'libvulkan_kosmickrisp*.dylib' -print -quit)"
          test -n "$DRIVER"
          mkdir -p "$GITHUB_WORKSPACE/upstream/build-ios/kosmickrisp"
          cp "$DRIVER" "$GITHUB_WORKSPACE/upstream/build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib"
          install_name_tool -id "@rpath/libvulkan_kosmickrisp.dylib" "$GITHUB_WORKSPACE/upstream/build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib"
          lipo "$GITHUB_WORKSPACE/upstream/build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib" -verify_arch arm64
          SYMBOLS="$RUNNER_TEMP/kosmickrisp-symbols.txt"
          nm -g "$GITHUB_WORKSPACE/upstream/build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib" > "$SYMBOLS"
          grep -q 'vk_icdGetInstanceProcAddr' "$SYMBOLS"
          echo "KOSMICKRISP_IOS_ARM64_SYMBOL_CHECK_OK"

      - name: Build ReXGlue iOS ARM64 app bundle
        run: |
          set -euxo pipefail
          xcodebuild -version
          cmake -S upstream -B upstream/build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DASURA_IOS_BUILD_NUMBER="$BUILD_NUMBER" -DCMAKE_BUILD_TYPE=Release -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
            -DCMAKE_XCODE_ATTRIBUTE_PROVISIONING_PROFILE_SPECIFIER=""
          cmake --build upstream/build-ios --config Release --target asura_wrath_recomp --parallel 3
          APP="$(find upstream/build-ios -type d -name 'asura_wrath_recomp.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$APP/Frameworks"
          SDK_DYLIB_DIR="upstream/tools/rexglue/out/mac-arm64/Release"
          test -f "$SDK_DYLIB_DIR/librexruntime.dylib"
          test -f "$SDK_DYLIB_DIR/librexgpu-xenos.dylib"

          # ReXGlue's host executable dynamically links librexruntime and
          # loads rexgpu-xenos at runtime. Bundle both; the GPU plugin stays
          # beside the executable because the SDK's plugin loader resolves it
          # from the application directory.
          cp "$SDK_DYLIB_DIR/librexruntime.dylib" "$APP/Frameworks/"
          cp "$SDK_DYLIB_DIR/librexgpu-xenos.dylib" "$APP/"
          cp upstream/build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib "$APP/Frameworks/"
          rsvg-convert -w 1024 -h 1024 ios/icons/AppIcon.svg > "$APP/AppIcon-1024.png"
          sips -z 120 120 "$APP/AppIcon-1024.png" --out "$APP/AppIcon-60@2x.png" >/dev/null
          sips -z 180 180 "$APP/AppIcon-1024.png" --out "$APP/AppIcon-60@3x.png" >/dev/null
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$APP/Info.plist"

          # Remove every build-machine LC_RPATH from the executable and dylibs.
          # The final app uses only paths relative to its own bundle.
          for image in "$APP/asura_wrath_recomp" "$APP/Frameworks/librexruntime.dylib" "$APP/librexgpu-xenos.dylib" "$APP/Frameworks/libvulkan_kosmickrisp.dylib"; do
            while IFS= read -r rpath; do
              [[ -z "$rpath" ]] && continue
              if [[ "$rpath" == /* || "$rpath" == *:* ]]; then
                install_name_tool -delete_rpath "$rpath" "$image"
              fi
            done < <(otool -l "$image" | awk '$1 == "cmd" && $2 == "LC_RPATH" { getline; getline; print $2 }')
          done
          ensure_rpath() {
            local image="$1"
            local wanted="$2"
            if ! otool -l "$image" | awk '$1 == "cmd" && $2 == "LC_RPATH" { getline; getline; print $2 }' | grep -Fqx "$wanted"; then
              install_name_tool -add_rpath "$wanted" "$image"
            else
              echo "RPATH already present; keeping it: $wanted ($(basename "$image"))"
            fi
          }
          ensure_rpath "$APP/asura_wrath_recomp" "@executable_path/Frameworks"
          ensure_rpath "$APP/librexgpu-xenos.dylib" "@loader_path/Frameworks"

          for image in "$APP/asura_wrath_recomp" "$APP/Frameworks/librexruntime.dylib" "$APP/librexgpu-xenos.dylib" "$APP/Frameworks/libvulkan_kosmickrisp.dylib"; do
            lipo "$image" -verify_arch arm64
            otool -L "$image"
            if otool -l "$image" | grep -Eq "/Users/runner/|/upstream/|/tools/rexglue/out/"; then
              echo "ERROR: build-machine path leaked into $(basename "$image")" >&2
              exit 1
            fi
          done

          # Fail the package if any non-system @rpath dependency is absent.
          python3 - "$APP" <<'PY'
          import pathlib, subprocess, sys
          app = pathlib.Path(sys.argv[1])
          images = [app / "asura_wrath_recomp", app / "librexgpu-xenos.dylib"]
          images += sorted((app / "Frameworks").glob("*.dylib"))
          for image in images:
              output = subprocess.check_output(["otool", "-L", str(image)], text=True)
              for line in output.splitlines()[1:]:
                  dep = line.strip().split(" (", 1)[0]
                  if dep.startswith("@rpath/"):
                      name = dep[len("@rpath/"):]
                      candidates = [app / "Frameworks" / name, app / name]
                      if not any(candidate.is_file() for candidate in candidates):
                          raise SystemExit(f"Unresolved bundled dependency: {image.name} -> {dep}")
                  elif dep.startswith("@loader_path/"):
                      candidate = image.parent / dep[len("@loader_path/"):]
                      if not candidate.is_file():
                          raise SystemExit(f"Unresolved loader-relative dependency: {image.name} -> {dep}")
                  elif dep.startswith("/") and not dep.startswith(("/System/Library/", "/usr/lib/")):
                      raise SystemExit(f"Non-system absolute dependency: {image.name} -> {dep}")
          print("IOS_BUNDLE_DYLIB_DEPENDENCIES_OK")
          PY

          lipo "$APP/asura_wrath_recomp" -verify_arch arm64
          lipo "$APP/Frameworks/librexruntime.dylib" -verify_arch arm64
          lipo "$APP/librexgpu-xenos.dylib" -verify_arch arm64
          lipo "$APP/Frameworks/libvulkan_kosmickrisp.dylib" -verify_arch arm64
          plutil -lint "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" | grep -qx "asura_wrath_recomp"
          test -x "$APP/asura_wrath_recomp"
          test -f "$APP/Frameworks/libvulkan_kosmickrisp.dylib"
          mkdir -p Payload artifacts
          cp -R "$APP" Payload/AsurasWrath.app
          IPA_PATH="artifacts/AsurasWrath-iOS-Build-${BUILD_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH"
          unzip -t "$IPA_PATH"
          test -s "$APP/AppIcon-1024.png"
          echo "ASURA_IOS_BUILD_${BUILD_NUMBER}_IPA_READY=$IPA_PATH"

      - name: Upload IPA only
        uses: actions/upload-artifact@v4
        with:
          name: AsurasWrath-iOS-Build-${{ env.BUILD_NUMBER }}
          path: artifacts/AsurasWrath-iOS-Build-*.ipa
          if-no-files-found: error
          retention-days: 30
