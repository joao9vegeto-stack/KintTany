name: Mugiwara4iOS · Pirate Warriors 4 Route C

on:
  push:
    branches:
      - Mugiwara4iOS
    paths:
      - handoff.json

concurrency:
  group: mugiwara4ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-handoff:
    if: github.ref == 'refs/heads/Mugiwara4iOS' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Queue Mugiwara4iOS build ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mugiwara4iOS only
        uses: actions/checkout@v4
        with:
          ref: Mugiwara4iOS
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate branch, Title ID and prepared package handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/Mugiwara4iOS"
          python -m json.tool handoff.json >/dev/null
          python - <<'PY'
          import json, os, re, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "colab")
          sys.path.insert(0, "scripts")
          from mugiwara_contract import PREPARED_MANIFEST_KEYS, copy_prepared_manifest, prepared_manifest_mismatches
          from mugiwara_uniform_rewrite import self_test as mugiwara_uniform_self_test
          from run_mugiwara import valid_aoc_manifest as colab_aoc_valid
          mugiwara_uniform_self_test()
          print("NXNative uniform-tests workaround synthetic regression: OK")
          import importlib.util
          def load_module(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          actions_module = load_module("mugiwara_actions_validation", "scripts/prepare_mugiwara_actions.py")
          build_module = load_module("mugiwara_build_validation", "scripts/build_mugiwara_shared.py")

          # Drive range planner must cover the 14+ GiB RomFS exactly once, with no gaps or overlaps.
          romfs_bytes = 15082435598
          ranges = actions_module._drive_ranges(romfs_bytes, 64 * 1024 * 1024)
          assert ranges[0][0] == 0 and ranges[-1][1] == romfs_bytes - 1
          assert all(left[1] + 1 == right[0] for left, right in zip(ranges, ranges[1:]))
          assert sum(end - start + 1 for start, end in ranges) == romfs_bytes
          assert len(ranges) == 225, f"Unexpected RomFS range count: {len(ranges)}"
          with tempfile.TemporaryFile() as stream:
              fd = stream.fileno()
              os.ftruncate(fd, 16)
              actions_module._drive_pwrite_all(fd, b"RANGE", 5)
              assert os.pread(fd, 5, 5) == b"RANGE"
          build_src = Path("scripts/build_mugiwara_shared.py").read_text()
          diagnostic_src = Path("scripts/mugiwara_shader_diagnostic.py").read_text()
          rewrite_src = Path("scripts/mugiwara_uniform_rewrite.py").read_text()
          workflow_src = Path(".github/workflows/mugiwara4_ios.yml").read_text()
          assert "shader_threads = 8" in build_src
          assert '"J": str(shader_threads)' in build_src
          assert '"DMSH_PROCS":' not in build_src
          assert 'env.pop("DMSH_PROCS", None)' in build_src
          assert 'MUGIWARA_SHADER_DIAGNOSTIC' in build_src
          assert "DMSH_RATE_GUARD_SECONDS" not in build_src
          assert "DMSH_MIN_SHADERS_PER_SEC" not in build_src
          assert "mugiwara_uniform_rewrite_diag.select_guards(src)" in diagnostic_src
          assert "mugiwara_uniform_rewrite_diag.uniform_tests(src)" in diagnostic_src
          assert "CBSIZE_BANK = 25" in rewrite_src
          assert "def select_guards(msl" in rewrite_src
          assert "MUGIWARA_METAL_TIME" in diagnostic_src
          assert "SAMPLE_SECONDS = 150" in diagnostic_src
          assert "_UTEST_READ = r'as_type<(u?int)>" in rewrite_src
          assert "volatile constant T" in rewrite_src
          assert "mugiwara_uniform_rewrite.py" in workflow_src
          assert "MUGIWARA_SHADER_DIAGNOSTIC" in workflow_src
          assert "ShaderCacheCheckpoint" not in build_src
          print("Drive ranges/AOC contract, stock J=8 scheduler, official uniform-tests backport and bounded 150s-per-case A/B: OK")

          # Regression fixture: 44 source DLC NSPs, but two versions of 20 DLC IDs,
          # giving the same 24 unique AOC IDs reported by the Colab content-meta scan.
          app_id = int("01008FE00E2F6000", 16)
          source_dlc = [
              {"role": "dlc", "type": "NSP", "local_name": f"dlc_{i:02d}.nsp",
               "size": 100000 + i, "sha256": f"{i + 1:064x}"}
              for i in range(44)
          ]
          meta_rows = []
          cursor = 0
          for index in range(24):
              versions = (0, 65536) if index < 20 else (0,)
              for version in versions:
                  meta_rows.append({
                      "title_id": f"{app_id + 0x1001 + index:016X}",
                      "content_version": version,
                      "source_package": source_dlc[cursor]["local_name"],
                  })
                  cursor += 1
          assert cursor == 44 and len(meta_rows) == 44
          by_name = {item["local_name"]: item for item in source_dlc}
          best = {}
          for row in meta_rows:
              tid = int(row["title_id"], 16)
              package = by_name[row["source_package"]]
              key = (row["content_version"], package["size"])
              if tid not in best or key > best[tid][0]:
                  best[tid] = (key, row["source_package"], row["content_version"])
          aoc_contents, aoc_images, drive_aoc = [], [], []
          for tid in sorted(best):
              title = f"{tid:016X}"
              index = tid - app_id - 0x1000
              name = f"{index}.img"
              _, source_name, version = best[tid]
              package = by_name[source_name]
              aoc_contents.append({
                  "title_id": title, "aoc_index": index, "name": name,
                  "content_version": version, "source_package": source_name,
                  "source_size": package["size"], "source_sha256": package["sha256"],
              })
              image = {
                  "title_id": title, "aoc_index": index, "name": name,
                  "size": 4096 + index, "sha256": f"{0xABC000 + index:064x}",
              }
              aoc_images.append(image)
              drive_aoc.append({**image, "id": f"drive-aoc-{index}"})
          fixture = {
              "aoc_count": 24,
              "aoc_title_ids": [item["title_id"] for item in aoc_contents],
              "aoc_contents": aoc_contents,
              "aoc_images": aoc_images,
              "dlc_content_meta_count": len(meta_rows),
              "dlc_content_meta": meta_rows,
              "input_packages": [
                  {"role": "base", "type": "NSP", "local_name": "000_base.nsp", "size": 1, "sha256": "a" * 64},
                  {"role": "update", "type": "NSP", "local_name": "001_update.nsp", "size": 1, "sha256": "b" * 64},
                  *source_dlc,
              ],
          }
          assert all(item["content_version"] == 65536 for item in aoc_contents[:20])
          assert colab_aoc_valid(fixture, drive_aoc)
          assert actions_module.valid_aoc_manifest(fixture, drive_aoc)
          assert build_module.valid_aoc_manifest(fixture)
          assert not colab_aoc_valid({**fixture, "aoc_images": aoc_images[:-1]}, drive_aoc[:-1])
          print("NXNative AOC regression fixture: 44 DLC NSPs -> 24 unique Title IDs/images: OK")

          h = json.loads(Path("handoff.json").read_text(encoding="utf-8"))
          p = h.get("prepared") or {}
          canonical = copy_prepared_manifest(p)
          assert canonical == {key: p[key] for key in PREPARED_MANIFEST_KEYS}
          assert not prepared_manifest_mismatches(canonical, p)
          for field in PREPARED_MANIFEST_KEYS:
              assert field in canonical and field in p, f"Canonical field missing before projection test: {field}"
              reduced = {key: value for key, value in canonical.items() if key != field}
              missing = prepared_manifest_mismatches(reduced, p)
              assert (field + " (missing from left manifest)") in missing, (
                  f"Manifest projection regression: omission of {field} was not detected; got {missing}"
              )
          assert h.get("project") == "Mugiwara4iOS"
          assert h.get("branch") == "Mugiwara4iOS"
          assert h.get("title_id") == "01008FE00E2F6000"
          assert h.get("nx2apple_tag") == "v1.3.1-rc2"
          assert h.get("engine_pin") == "81906931262fb25d774cce8bca2db8926439e5a2"
          assert h.get("package_version") == p.get("package_version") and p.get("package_version") != "v0"
          assert h.get("format") == 2
          assert p.get("format") == 4
          assert p.get("display_version") == "1.8.7"
          assert p.get("base_content_version") == 0
          assert int(p.get("update_content_version", 0)) > 0
          assert isinstance(p.get("jit_required"), bool)
          assert p.get("profile_type") == "provisional"
          assert p.get("graphics_api") == "nvn"
          assert p.get("input_package_count") == 46
          assert p.get("input_nsp_count") == 46 and p.get("input_xci_count") == 0
          assert p.get("input_update_nsp_count") == 1 and p.get("input_dlc_nsp_count") == 44
          assert len(p.get("input_packages", [])) == 46
          assert h.get("source", {}).get("package_count") == 46
          assert h.get("source", {}).get("dlc_nsp_count") == 44
          assert len(h.get("source", {}).get("dlc_files", [])) == 44
          for item in p["input_packages"]:
              assert item.get("type") == "NSP"
              assert item.get("role") in ("base", "update", "dlc")
              assert int(item.get("size", 0)) > 0
              assert re.fullmatch(r"[0-9a-f]{64}", item.get("sha256", ""))
          aoc = h.get("game_data", {}).get("aoc", [])
          assert colab_aoc_valid(p, aoc), "AOC set does not match unique DLC Title IDs and NXNative's highest-version selection"
          assert h.get("game_data", {}).get("aoc_count") == p.get("aoc_count")
          for item in aoc:
              assert item.get("name", "").endswith(".img")
              assert int(item.get("size", 0)) > 0
              assert re.fullmatch(r"[0-9a-f]{64}", item.get("sha256", ""))
          assert isinstance(p.get("shader_source_flags"), dict)
          assert isinstance(p.get("shader_source_reasons"), dict)
          assert isinstance(p.get("shader_source_audit"), dict)
          assert h.get("work_archive", {}).get("sha256")
          assert h.get("game_data", {}).get("romfs", {}).get("sha256")
          print("Mugiwara4iOS / Pirate Warriors 4 handoff: OK")
          PY
          python -m pip install --quiet PyYAML
          python -m py_compile \
            colab/source_mugiwara.py \
            colab/prepare_mugiwara.py \
            colab/run_mugiwara.py \
            scripts/prepare_mugiwara_actions.py \
            scripts/build_mugiwara_shared.py \
            scripts/mugiwara_shader_diagnostic.py \
            scripts/mugiwara_uniform_rewrite.py \
            scripts/mugiwara_contract.py
          python - <<'PY'
          import ast, json, sys, tempfile, yaml
          from pathlib import Path
          sys.path.insert(0, "colab")
          import source_mugiwara
          n = json.loads(Path("colab/Mugiwara4iOS.ipynb").read_text(encoding="utf-8"))
          assert n["nbformat"] == 4 and len(n["cells"]) == 12
          joined = "\n".join("".join(c.get("source", [])) for c in n["cells"])
          assert "Mugiwara4iOS" in joined and "01008FE00E2F6000" in joined
          assert "DRIVE_FOLDER_ID" in joined and 'ROOT = Path("/content/mugi")' in joined
          assert "BASE_URL" in joined and "UPDATE_URL" in joined
          assert "44" in joined and "Mugiwara4iOS_UPDATE_v1.8.7.nsp" in joined
          assert "HANDOFF_READY" in joined
          assert "dispatch" in joined
          for index, cell in enumerate(n["cells"]):
              if cell.get("cell_type") != "code":
                  continue
              parts = cell.get("source", [])
              assert isinstance(parts, list)
              assert all(part.endswith("\n") for part in parts[:-1]), f"cell {index}: missing source-fragment newline"
              source = "".join(parts)
              normalized = "\n".join(
                  "pass" if line.lstrip().startswith(("%", "!")) else line
                  for line in source.splitlines()
              )
              ast.parse(normalized, filename=f"Mugiwara4iOS.ipynb:cell-{index}")
          with tempfile.TemporaryDirectory(prefix="mugiwara-package-contract-") as tmp:
              root = Path(tmp)
              nsp = root / "base.nsp"
              nsp.write_bytes(b"PFS0" + bytes(4096))
              xci = root / "update.xci"
              header = bytearray(0x104)
              header[0x100:0x104] = b"HEAD"
              xci.write_bytes(header)
              assert source_mugiwara.validate_package(nsp) == "NSP"
              assert source_mugiwara.validate_package(xci) == "XCI"
          workflow = yaml.safe_load(Path(".github/workflows/mugiwara4_ios.yml").read_text(encoding="utf-8"))
          assert workflow.get("jobs", {}).get("validate-handoff")
          build_job = workflow.get("jobs", {}).get("build-pirate-warriors-4")
          runner_spec = str((build_job or {}).get("runs-on", ""))
          assert runner_spec == chr(36) + "{{ vars.MUGIWARA_RUNNER || 'xcode-27' }}", runner_spec
          print("Mugiwara Python, 12-cell notebook, 46-NSP/44-DLC-NSP/unique-title-ID-AOC contract and workflow YAML: OK")
          PY

  build-pirate-warriors-4:
    needs: validate-handoff
    if: github.ref == 'refs/heads/Mugiwara4iOS' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Queue Mugiwara4iOS build ')
    runs-on: ${{ vars.MUGIWARA_RUNNER || 'xcode-27' }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout Mugiwara4iOS only
        uses: actions/checkout@v4
        with:
          ref: Mugiwara4iOS
          persist-credentials: false
      - name: Assert branch and Xcode 27 / iOS SDK on Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/Mugiwara4iOS"
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 is missing from the selected Xcode 27 runner"; exit 1; }
          test "$(uname -m)" = "arm64"
          CPU_COUNT="$(sysctl -n hw.ncpu)"
          MEMORY_BYTES="$(sysctl -n hw.memsize)"
          echo "Xcode 27 runner capacity: ${CPU_COUNT} CPUs, ${MEMORY_BYTES} bytes RAM"
          test "$CPU_COUNT" -ge 3 || { echo "::error::NXNative shader build requires at least 3 Apple Silicon CPUs; found $CPU_COUNT"; exit 1; }
          test "$MEMORY_BYTES" -ge 6442450944 || { echo "::error::NXNative shader build requires at least 6 GiB RAM; found $MEMORY_BYTES bytes"; exit 1; }
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and Python dependencies (no cache)
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang cmake ninja pkg-config
          python -m pip install --upgrade pip
          python -m pip install lz4 'capstone>=5,<6' fonttools zbic backports.zstd google-api-python-client google-auth PyYAML pycryptodome requests
      - name: Clone and pin NX2Apple / NXNative
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1-rc2 https://github.com/LNPANDY/NX2Apple.git NX2Apple
          python NX2Apple/tools/engine.py sync
          test "$(cat NX2Apple/.upstream-ref)" = "81906931262fb25d774cce8bca2db8926439e5a2"
      - name: Install explicit .NET 10 SDK and ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          DOTNET_ROOT="$RUNNER_TEMP/dotnet10-arm64"
          curl --fail --location --silent --show-error https://dot.net/v1/dotnet-install.sh \
            --output "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 10.0 \
            --architecture arm64 \
            --install-dir "$DOTNET_ROOT" \
            --no-path
          test -x "$DOTNET_ROOT/dotnet"
          "$DOTNET_ROOT/dotnet" --list-sdks | grep -E '^10\.'
          "$DOTNET_ROOT/dotnet" --list-runtimes | grep -E '^Microsoft\.NETCore\.App 10\.'
          "$DOTNET_ROOT/dotnet" --info
          {
            echo "DOTNET_ROOT=$DOTNET_ROOT"
            echo "PATH=$DOTNET_ROOT:$PATH"
          } >> "$GITHUB_ENV"
      - name: Preflight .NET 10 shader translator before Drive restore
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$DOTNET_ROOT" = "$RUNNER_TEMP/dotnet10-arm64"
          dotnet --list-sdks | grep -E '^10\.'
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 10\.'
          xlate="NX2Apple/engine/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate"
          test -x "$xlate" || { echo "::error::Pinned shader translator missing or not executable: $xlate"; exit 1; }
          "$xlate" --source-sha | tee "$RUNNER_TEMP/dmsh-xlate-source-sha.txt"
          test -s "$RUNNER_TEMP/dmsh-xlate-source-sha.txt"
      - name: Validate bounded shader diagnostic against pinned NXNative before Drive restore
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          import mugiwara_shader_diagnostic as diagnostic
          diagnostic.shader_map_fixture_test()
          tool_dir = Path("NX2Apple/engine/dm/gfx/tools")
          generated = []
          try:
              for uniform_fix in (False, True):
                  generated = diagnostic.write_diagnostic_sources(tool_dir, uniform_fix)
                  for path in generated:
                      compile(path.read_text(encoding="utf-8"), str(path), "exec")
          finally:
              for name in (
                  "dmsh_build_mugiwara_diag.py",
                  "own_compilers_mugiwara_diag.py",
                  "dmsh_mtlcache_diag.py",
                  "mugiwara_uniform_rewrite_diag.py",
              ):
                  (tool_dir / name).unlink(missing_ok=True)
          print("Pinned NXNative sidecar compile: baseline OFF and official uniform pipeline ON; shader-map parser fixture (16-char SHA prefix): OK")
          PY
      - name: Restore workspace, parallel-range RomFS and concurrent unique-title-ID AOC images from Drive (SHA-256)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_mugiwara_actions.py \
            --handoff handoff.json \
            --destination "$RUNNER_TEMP/mugiwara-actions"
      - name: Oodle/GLSLC when detected, NVN shader split with all unique-title-ID AOC images, Metal and Route C IPA
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MUGIWARA_SHADER_DIAGNOSTIC: ${{ contains(github.event.head_commit.message, 'shader diagnostic') && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_mugiwara_shared.py \
            --nx2apple-root NX2Apple \
            --prepared-json "$RUNNER_TEMP/mugiwara-actions/actions-input.json" \
            --output "$RUNNER_TEMP/mugiwara-output"
      - name: Upload bounded shader A/B diagnostic or failure logs
        if: always() && (contains(github.event.head_commit.message, 'shader diagnostic') || failure())
        uses: actions/upload-artifact@v4
        with:
          name: Mugiwara4iOS-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/mugiwara-actions/work/logs/**
            ${{ runner.temp }}/mugiwara-actions/work/shader/progress.json
            ${{ runner.temp }}/mugiwara-actions/work/shader-diagnostic/**
            ${{ runner.temp }}/mugiwara-actions/work/profile/**/shader_map.tsv
            ${{ runner.temp }}/mugiwara-actions/actions-input.json
            ${{ runner.temp }}/mugiwara-output/Mugiwara4iOS-shader-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Mugiwara4iOS IPA and build report
        if: success() && !contains(github.event.head_commit.message, 'shader diagnostic')
        uses: actions/upload-artifact@v4
        with:
          name: Mugiwara4iOS-Pirate-Warriors-4-IPA
          path: |
            ${{ runner.temp }}/mugiwara-output/Mugiwara4iOS.ipa
            ${{ runner.temp }}/mugiwara-output/build-report.json
          if-no-files-found: error
          retention-days: 14
