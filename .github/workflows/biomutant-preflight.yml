name: BioiOSMutant - Linux offline preflight
on:
  push:
    branches: [BioiOSMutant]
    paths: ['.github/workflows/biomutant-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: biomutant-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.ref == 'refs/heads/BioiOSMutant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout BioiOSMutant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install minimal Linux test runtime and archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          python3 -m pip install --disable-pip-version-check requests google-api-python-client google-auth
      - name: Python syntax check
        run: |
          python3 -m compileall -q biotant
      - name: Run offline regressions including Drive-owned output update
        run: |
          PYTHONUNBUFFERED=1 python3 -m unittest discover -s biotant/tests -p 'test_*.py' -v
