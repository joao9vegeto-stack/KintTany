name: 1. Extract Shader Kit + Split

on:
  push:
    branches: [SpkIOSzero]
    paths:
      - '.github/workflows/1-extract-shader-kit.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

env:
  GAME: '010035F022078000'
  GAME_NAME: 'DRAGON BALL: Sparking! ZERO'

jobs:
  extract_and_split:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: SpkIOSzero
          fetch-depth: 1

      - name: Setup Python virtualenv
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install lz4 capstone PyYAML zstandard requests

      - name: Create work directory
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/shader_extract_${RANDOM}_$(date +%s)"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Download shader kit part 1
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          curl -fL --retry 5 --retry-delay 2 --max-time 1800 --progress-bar \
            -o "$WORK/shader_part1.zip" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part1.zip"

      - name: Download shader kit part 2a
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/shader_part2.z00" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z00"

      - name: Download shader kit part 2b
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/shader_part2.z01" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z01"

      - name: Reconstruct shader kit part 2
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          cat "$WORK/shader_part2.z00" "$WORK/shader_part2.z01" > "$WORK/shader_part2.zip"
          unzip -t "$WORK/shader_part2.zip" > /dev/null

      - name: Download github_kit_Spk.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          curl -fL --retry 5 --retry-delay 2 --max-time 1800 --progress-bar \
            -o "$WORK/github_kit_Spk.zip" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip"

      - name: Extract all archives
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          KIT_DIR="$WORK/kit"
          mkdir -p "$KIT_DIR"
          unzip -q "$WORK/shader_part1.zip" -d "$KIT_DIR"
          unzip -q -o "$WORK/shader_part2.zip" -d "$KIT_DIR"
          unzip -q -o "$WORK/github_kit_Spk.zip" -d "$KIT_DIR"
          echo "KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"

      - name: Locate RomFS and ExeFS
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"
          ROMFS=$(find "$KIT_DIR" -type d -name "RomFS" -print -quit || true)
          EXEFS=$(find "$KIT_DIR" -type d -iname "ExeFS" -print -quit || true)

          if [ -z "$ROMFS" ]; then
            echo "ERROR: RomFS not found"
            exit 1
          fi

          if [ -z "$EXEFS" ]; then
            echo "ERROR: ExeFS not found"
            exit 1
          fi

          echo "KIT_ROMFS=$ROMFS" >> "$GITHUB_ENV"
          echo "KIT_EXEFS=$EXEFS" >> "$GITHUB_ENV"

      - name: Validate extracted kit files
        shell: bash
        run: |
          set -euo pipefail
          EXEFS="${{ env.KIT_EXEFS }}"
          ROMFS="${{ env.KIT_ROMFS }}"

          echo "=== Kit Validation ==="
          echo "ExeFS: $EXEFS"
          echo "RomFS: $ROMFS"

          if [ ! -f "$EXEFS/main" ]; then
            echo "ERROR: $EXEFS/main not found"
            exit 1
          fi

          if [ ! -f "$EXEFS/main.npdm" ]; then
            echo "WARN: $EXEFS/main.npdm not found (continuing anyway)"
          fi

          if [ ! -d "$ROMFS" ] && [ ! -f "$ROMFS" ]; then
            echo "ERROR: RomFS invalid: $ROMFS"
            exit 1
          fi

          echo "✅ Kit validation passed"

      - name: Generate game profile using profile_guess.py
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          GAME_DIR="dm/games/$GAME"
          EXEFS="${{ env.KIT_EXEFS }}"
          ROMFS="${{ env.KIT_ROMFS }}"

          mkdir -p "$GAME_DIR"

          echo "=== Running profile_guess.py ==="
          echo "Game: $GAME_NAME"
          echo "Title ID: $GAME"
          echo ""

          if ! python3 dm/games/profile_guess.py "$EXEFS" "$ROMFS" > "$GAME_DIR/profile_guess_output.txt" 2>&1; then
            echo "ERROR: profile_guess.py failed"
            cat "$GAME_DIR/profile_guess_output.txt"
            exit 1
          fi

          cat "$GAME_DIR/profile_guess_output.txt"
          echo ""
          echo "✅ profile_guess.py completed"

      - name: Create game.tsv from profile_guess output
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          GAME_DIR="dm/games/$GAME"

          PROFILE_OUTPUT="$GAME_DIR/profile_guess_output.txt"

          if [ ! -f "$PROFILE_OUTPUT" ]; then
            echo "ERROR: profile_guess output file not found"
            exit 1
          fi

          echo "=== Creating game.tsv ==="

          {
            echo "# Auto-generated game profile for $GAME_NAME"
            echo "# Generated by profile_guess.py at $(date)"
            echo "TitleID	$GAME"
            echo "Name	$GAME_NAME"
            echo ""
            grep -E '^[a-z_]+[[:space:]]' "$PROFILE_OUTPUT" || true
          } > "$GAME_DIR/game.tsv"

          if [ ! -s "$GAME_DIR/game.tsv" ]; then
            echo "ERROR: game.tsv is empty"
            exit 1
          fi

          echo "✅ game.tsv created"
          echo ""
          echo "=== Content of game.tsv ==="
          cat "$GAME_DIR/game.tsv"

      - name: Create shader_groups.tsv
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"

          echo "=== Creating shader_groups.tsv ==="

          if [ -f "$GAME_DIR/shader_groups.tsv" ]; then
            echo "shader_groups.tsv already exists, skipping"
          else
            printf "# Shader source groups\n# Automatically generated for DRAGON BALL: Sparking! ZERO\nRomFS\tromfs\nmain\tmain\n" > "$GAME_DIR/shader_groups.tsv"
            echo "✅ shader_groups.tsv created"
          fi

      - name: Validate game profile files
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"

          echo "=== Validating profile files ==="

          for FILE in game.tsv shader_groups.tsv; do
            if [ ! -f "$GAME_DIR/$FILE" ]; then
              echo "ERROR: $FILE not found"
              exit 1
            fi
            LINES=$(wc -l < "$GAME_DIR/$FILE")
            echo "✅ $FILE: $LINES lines"
          done

      - name: Complete game.tsv with required keys
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"
          GAME_TSV="$GAME_DIR/game.tsv"

          echo "=== Completing game.tsv with required keys ==="

          if ! grep -q "^shader_note" "$GAME_TSV"; then
            echo "Adding shader_note..."
            echo "shader_note	" >> "$GAME_TSV"
          fi

          if ! grep -q "^shader_groups" "$GAME_TSV"; then
            echo "Adding shader_groups..."
            echo "shader_groups	shader_groups.tsv" >> "$GAME_TSV"
          fi

          echo ""
          echo "=== Updated game.tsv ==="
          cat "$GAME_TSV"

      - name: Extract and organize shader files from kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"
          
          echo "=== Extracting and organizing shader files ==="

          UE_SHADERS="$KIT_DIR/ue_shaders"
          mkdir -p "$UE_SHADERS"

          # Find all .shaders.bin files recursively
          if find "$KIT_DIR" -type f -name "*.shaders.bin" 2>/dev/null | head -1 | grep -q .; then
            echo "Found .shaders.bin files, copying to ue_shaders..."
            find "$KIT_DIR" -type f -name "*.shaders.bin" -exec cp {} "$UE_SHADERS/" \;
            find "$KIT_DIR" -type f -name "*.shaders.tsv" -exec cp {} "$UE_SHADERS/" \;
            
            FILE_COUNT=$(find "$UE_SHADERS" -type f | wc -l)
            echo "✅ ue_shaders populated: $FILE_COUNT files"
          else
            echo "ERROR: No .shaders.bin files found in kit"
            echo "Kit contents (first 30 entries):"
            find "$KIT_DIR" -maxdepth 4 -type f | head -30
            exit 1
          fi

          echo ""
          echo "=== ue_shaders contents ==="
          ls -lh "$UE_SHADERS" | head -20
          echo ""
          echo "UE_SHADERS=$UE_SHADERS" >> "$GITHUB_ENV"

      - name: Locate decoded shader archives
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"

          echo "=== Locating decoded shader archives ==="

          # Search for .shaders.bin or ue_shaders
          SHADER_BIN=$(find "$KIT_DIR" -type f -name "*.shaders.bin" -print -quit || true)
          UE_SHADERS=$(find "$KIT_DIR" -type d -name "ue_shaders" -print -quit || true)

          if [ -z "$SHADER_BIN" ] && [ -z "$UE_SHADERS" ]; then
            echo "ERROR: No decoded shaders found (.shaders.bin or ue_shaders)"
            echo ""
            echo "Kit structure:"
            find "$KIT_DIR" -maxdepth 4 -type f -name "*.bin" -o -name "*.tsv" | head -20
            exit 1
          fi

          if [ -n "$SHADER_BIN" ]; then
            echo "✅ Found .shaders.bin files:"
            find "$KIT_DIR" -type f -name "*.shaders.bin" | wc -l
            echo "Location: $(dirname $SHADER_BIN)"
          fi

          if [ -n "$UE_SHADERS" ]; then
            echo "✅ Found ue_shaders directory: $UE_SHADERS"
            echo "Files: $(find $UE_SHADERS -type f | wc -l)"
          fi

          # Create ue_shaders symlink if needed
          if [ -z "$UE_SHADERS" ] && [ -n "$SHADER_BIN" ]; then
            SHADER_DIR=$(dirname "$SHADER_BIN")
            UE_SHADERS="$KIT_DIR/ue_shaders"
            mkdir -p "$UE_SHADERS"
            cp "$SHADER_DIR"/*.shaders.bin "$UE_SHADERS/" 2>/dev/null || true
            cp "$SHADER_DIR"/*.shaders.tsv "$UE_SHADERS/" 2>/dev/null || true
            echo "✅ Created ue_shaders from .shaders.bin"
          fi

          echo "UE_SHADERS=$UE_SHADERS" >> "$GITHUB_ENV"

      - name: Run shader_split.py
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          ROMFS="${{ env.KIT_ROMFS }}"
          EXEFS="${{ env.KIT_EXEFS }}"
          MAIN="$EXEFS/main"
          SHADER_OUT="dm/games/$GAME/shaders"

          mkdir -p "$SHADER_OUT"

          echo "=== Running shader_split.py ==="
          echo "Game: $GAME_NAME"
          echo "Title ID: $GAME"
          echo "RomFS: $ROMFS"
          echo "Main: $MAIN"
          echo "Output: $SHADER_OUT"
          echo ""

          if ! DM_GAME="$GAME" python3 dm/gfx/tools/shader_split.py \
            "$ROMFS" \
            "$MAIN" \
            "$SHADER_OUT" \
            "$SHADER_OUT/shader_map.tsv" \
            "$SHADER_OUT/shader_facts.tsv" \
            "$SHADER_OUT/shader_pairs.tsv" 2>&1 | tee "$RUNNER_TEMP/split.log"; then
            echo ""
            echo "ERROR: shader_split.py failed"
            echo ""
            echo "=== Last 50 lines of output ==="
            tail -50 "$RUNNER_TEMP/split.log"
            exit 1
          fi

          echo ""
          echo "✅ shader_split.py completed"

      - name: Verify shader TSV outputs
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          SHADER_OUT="dm/games/$GAME/shaders"

          echo "=== Verifying shader TSV files ==="

          for TSV in shader_map.tsv shader_facts.tsv shader_pairs.tsv; do
            FILE="$SHADER_OUT/$TSV"
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing $TSV"
              exit 1
            fi
            LINES=$(wc -l < "$FILE")
            SIZE=$(du -h "$FILE" | cut -f1)
            echo "✅ $TSV: $LINES lines, $SIZE"
          done

      - name: Copy shader TSVs to game profile root
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"
          SHADER_DIR="$GAME_DIR/shaders"

          echo "=== Copying shader TSVs ==="

          cp "$SHADER_DIR/shader_map.tsv" "$GAME_DIR/shader_map.tsv"
          cp "$SHADER_DIR/shader_facts.tsv" "$GAME_DIR/shader_facts.tsv"
          cp "$SHADER_DIR/shader_pairs.tsv" "$GAME_DIR/shader_pairs.tsv"

          echo "✅ Shader TSVs copied to $GAME_DIR"

      - name: Commit generated files to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shader Builder Bot"
          git config user.email "action@github.local"

          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"

          echo "=== Staging generated files ==="

          git add "$GAME_DIR/game.tsv"
          git add "$GAME_DIR/shader_groups.tsv"
          git add "$GAME_DIR/shader_map.tsv"
          git add "$GAME_DIR/shader_facts.tsv"
          git add "$GAME_DIR/shader_pairs.tsv"
          git add "$GAME_DIR/profile_guess_output.txt" 2>/dev/null || true

          if ! git diff --cached --quiet; then
            echo "Changes detected, creating commit..."

            git commit -m "chore: auto-generate game profile and shader tables" \
              -m "- game.tsv: profile metadata auto-discovered using profile_guess.py" \
              -m "- shader_groups.tsv: shader source groups configuration" \
              -m "- shader_map.tsv: shader index mapping and structure" \
              -m "- shader_facts.tsv: shader metadata and analysis data" \
              -m "- shader_pairs.tsv: shader pair relationships and dependencies" \
              -m "- profile_guess_output.txt: raw profile_guess.py output for reference"

            if git push origin HEAD:SpkIOSzero; then
              echo "✅ Successfully pushed to repository"
            else
              echo "ERROR: Push failed"
              exit 1
            fi
          else
            echo "ℹ️  No changes to commit"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shader-split-output
          path: dm/games/${{ env.GAME }}/
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup work directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          if [ -n "$WORK" ] && [ -d "$WORK" ]; then
            rm -rf "$WORK"
            echo "✅ Cleaned up work directory"
          fi

      - name: Workflow summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "  ✅ WORKFLOW 1 COMPLETE"
          echo "======================================"
          echo ""
          echo "Generated Files:"
          echo "  📄 dm/games/${{ env.GAME }}/game.tsv"
          echo "  📄 dm/games/${{ env.GAME }}/shader_groups.tsv"
          echo "  📄 dm/games/${{ env.GAME }}/shader_map.tsv"
          echo "  📄 dm/games/${{ env.GAME }}/shader_facts.tsv"
          echo "  📄 dm/games/${{ env.GAME }}/shader_pairs.tsv"
          echo ""
          echo "All files committed to repository"
          echo "Next: Workflow 2a will trigger automatically"
          echo ""

      - name: Workflow error summary
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "  ❌ WORKFLOW 1 FAILED"
          echo "======================================"
          echo ""
          echo "Check the logs above for details"
          echo "Common issues:"
          echo "  • RomFS or ExeFS not extracted correctly"
          echo "  • profile_guess.py incompatible with extracted kit"
          echo "  • shader_split.py missing or broken"
          echo ""
