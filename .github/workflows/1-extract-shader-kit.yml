name: 1. Extract Shader Kit + Split

on:
  push:
    branches: [SpkIOSzero]
    paths:
      - '.github/workflows/1-extract-shader-kit.yml'
      - 'dm/gfx/tools/shader_split.py'
      - 'dm/games/**'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

env:
  GAME: "010035F022078000"
  GAME_NAME: "DRAGON BALL: Sparking! ZERO"

jobs:
  extract_and_split:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: SpkIOSzero
          fetch-depth: 1

      - name: Setup Python virtualenv
        shell: bash
        run: |
          set -euo pipefail
          echo "═══════════════════════════════════════════"
          echo "  🔧 SETUP: Python & Virtualenv"
          echo "═══════════════════════════════════════════"
          python3 --version
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install lz4 capstone PyYAML zstandard requests
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Create work directory
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/shader_kit_extract_${RANDOM}_$(date +%s)"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "📁 Work directory: $WORK"
          df -h "$WORK" | tail -1

      - name: Download part1.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          URL="https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part1.zip"

          curl -fL --retry 5 --retry-delay 2 --max-time 1800 --progress-bar \
            -o "$WORK/part1.zip" \
            "$URL"

          test -f "$WORK/part1.zip"
          echo "✅ part1.zip downloaded"

      - name: Download part2.z00
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          URL="https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z00"

          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/part2.z00" \
            "$URL"

          test -f "$WORK/part2.z00"
          echo "✅ part2.z00 downloaded"

      - name: Download part2.z01
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          URL="https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z01"

          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/part2.z01" \
            "$URL"

          test -f "$WORK/part2.z01"
          echo "✅ part2.z01 downloaded"

      - name: Reconstruct part2.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          cat "$WORK/part2.z00" "$WORK/part2.z01" > "$WORK/part2.zip"
          unzip -t "$WORK/part2.zip" > /dev/null
          echo "✅ part2.zip reconstructed"

      - name: Extract archives
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          KIT_DIR="$WORK/kit"
          mkdir -p "$KIT_DIR"

          unzip -q "$WORK/part1.zip" -d "$KIT_DIR"
          unzip -q -o "$WORK/part2.zip" -d "$KIT_DIR"

          echo "KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "✅ archives extracted"

      - name: Locate RomFS
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"
          ROMFS="$(find "$KIT_DIR" -type d -name "RomFS" -print -quit || true)"
          if [ -z "$ROMFS" ]; then
            echo "❌ RomFS not found"
            exit 1
          fi
          echo "KIT_ROMFS=$ROMFS" >> "$GITHUB_ENV"
          echo "✅ RomFS: $ROMFS"

      - name: Locate main executable
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"
          MAIN="$(find "$KIT_DIR" -type f \( -name "main" -o -name "main.nso" \) -print -quit || true)"
          if [ -z "$MAIN" ]; then
            echo "❌ main executable not found in ExeFS"
            exit 1
          fi
          echo "KIT_MAIN=$MAIN" >> "$GITHUB_ENV"
          echo "✅ main: $MAIN"

      - name: Verify game profile exists
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          PROFILE_DIR="dm/games/$GAME"
          if [ ! -d "$PROFILE_DIR" ]; then
            echo "❌ Missing profile dir: $PROFILE_DIR"
            exit 1
          fi
          echo "✅ profile dir exists"

      - name: Run shader_split.py
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          GAME="${{ env.GAME }}"
          ROMFS="${{ env.KIT_ROMFS }}"
          MAIN="${{ env.KIT_MAIN }}"
          SHADER_OUT="dm/games/$GAME/shaders"
          mkdir -p "$SHADER_OUT"

          DM_GAME="$GAME" python dm/gfx/tools/shader_split.py \
            "$ROMFS" \
            "$MAIN" \
            "$SHADER_OUT" \
            "$SHADER_OUT/shader_map.tsv" \
            "$SHADER_OUT/shader_facts.tsv" \
            "$SHADER_OUT/shader_pairs.tsv" \
            2>&1 | tee "$RUNNER_TEMP/split.log"

      - name: Verify TSV outputs
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          SHADER_OUT="dm/games/$GAME/shaders"

          for tsv in shader_map.tsv shader_facts.tsv shader_pairs.tsv; do
            FILE="$SHADER_OUT/$tsv"
            [ -f "$FILE" ] || { echo "❌ Missing $FILE"; exit 1; }
            echo "✅ $tsv -> $(wc -l < "$FILE") lines"
          done

      - name: Copy TSVs into game profile
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"
          SHADER_DIR="$GAME_DIR/shaders"

          cp "$SHADER_DIR/shader_map.tsv" "$GAME_DIR/shader_map.tsv"
          cp "$SHADER_DIR/shader_facts.tsv" "$GAME_DIR/shader_facts.tsv"
          cp "$SHADER_DIR/shader_pairs.tsv" "$GAME_DIR/shader_pairs.tsv"

          echo "✅ TSVs copied into profile"

      - name: Commit TSVs to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dragon Ball Shader Builder"
          git config user.email "dbs-shader-builder@local"

          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"

          git add "$GAME_DIR/shader_map.tsv" \
                  "$GAME_DIR/shader_facts.tsv" \
                  "$GAME_DIR/shader_pairs.tsv"

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate shader tables for DRAGON BALL: Sparking! ZERO"
            git push origin HEAD:SpkIOSzero
          else
            echo "✅ No changes to commit"
          fi

      - name: Upload TSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shader-split-tsvs
          path: dm/games/${{ env.GAME }}/*.tsv
          retention-days: 30
          if-no-files-found: error

      - name: Upload split log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-execution-log
          path: ${{ runner.temp }}/split.log
          retention-days: 14
