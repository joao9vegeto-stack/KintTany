name: 1. Extract Shader Kit + Split

on:
  push:
    branches: [SpkIOSzero]
    paths:
      - '.github/workflows/1-extract-shader-kit.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

env:
  GAME: "010035F022078000"
  GAME_NAME: "DRAGON BALL: Sparking! ZERO"

jobs:
  extract_and_split:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: SpkIOSzero
          fetch-depth: 1

      - name: Setup Python virtualenv
        shell: bash
        run: |
          set -euo pipefail
          echo "═══════════════════════════════════════════"
          echo "  🔧 SETUP: Python & Virtualenv"
          echo "═══════════════════════════════════════════"
          python3 --version
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install lz4 capstone PyYAML zstandard requests
          echo "✅ Setup complete"

      - name: Create work directory
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/shader_kit_${RANDOM}_$(date +%s)"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "📁 Work directory: $WORK"

      - name: Download part1.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "📥 Downloading part1.zip..."
          curl -fL --retry 5 --retry-delay 2 --max-time 1800 --progress-bar \
            -o "$WORK/part1.zip" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part1.zip"
          [ -f "$WORK/part1.zip" ] && echo "✅ part1.zip downloaded" || exit 1

      - name: Download part2.z00
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "📥 Downloading part2.z00..."
          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/part2.z00" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z00"
          [ -f "$WORK/part2.z00" ] && echo "✅ part2.z00 downloaded" || exit 1

      - name: Download part2.z01
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "📥 Downloading part2.z01..."
          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/part2.z01" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z01"
          [ -f "$WORK/part2.z01" ] && echo "✅ part2.z01 downloaded" || exit 1

      - name: Reconstruct part2.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "🔗 Reconstructing part2.zip..."
          cat "$WORK/part2.z00" "$WORK/part2.z01" > "$WORK/part2.zip"
          unzip -t "$WORK/part2.zip" > /dev/null && echo "✅ part2.zip OK" || exit 1

      - name: Extract all archives
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          KIT_DIR="$WORK/kit"
          mkdir -p "$KIT_DIR"
          
          echo "📦 Extracting part1.zip..."
          unzip -q "$WORK/part1.zip" -d "$KIT_DIR"
          
          echo "📦 Extracting part2.zip..."
          unzip -q -o "$WORK/part2.zip" -d "$KIT_DIR"
          
          echo "KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "✅ Extraction complete"

      - name: Locate RomFS
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"
          
          echo "🔎 Locating RomFS..."
          ROMFS=$(find "$KIT_DIR" -type d -name "RomFS" -print -quit || true)
          
          if [ -z "$ROMFS" ]; then
            echo "❌ RomFS not found!"
            exit 1
          fi
          
          echo "KIT_ROMFS=$ROMFS" >> "$GITHUB_ENV"
          echo "✅ RomFS: $ROMFS"

      - name: Locate main executable
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"
          
          echo "🔎 Locating main executable..."
          echo ""
          echo "📁 Kit directory structure:"
          find "$KIT_DIR" -maxdepth 3 -type f -o -type d | head -100
          
          echo ""
          echo "🔍 Searching for files ~67MB (main executable)..."
          find "$KIT_DIR" -type f -size +60M -size -75M 2>/dev/null | while read f; do
            echo "  Found: $f ($(ls -lh "$f" | awk '{print $5}'))"
          done
          
          echo ""
          echo "🔍 Searching for 'main' file..."
          MAIN=$(find "$KIT_DIR" -type f -name "main" 2>/dev/null | head -1 || true)
          
          if [ -z "$MAIN" ]; then
            echo "  Searching in all directories..."
            MAIN=$(find "$KIT_DIR" -type f -size +60M -size -75M 2>/dev/null | head -1 || true)
          fi
          
          if [ -z "$MAIN" ] || [ ! -f "$MAIN" ]; then
            echo "❌ main executable not found in kit"
            echo ""
            echo "📄 All files in kit:"
            find "$KIT_DIR" -type f -exec ls -lh {} \; 2>/dev/null | head -50
            exit 1
          fi
          
          SIZE=$(ls -lh "$MAIN" | awk '{print $5}')
          echo "✅ main found: $MAIN"
          echo "   Size: $SIZE"
          echo ""
          echo "KIT_MAIN=$MAIN" >> "$GITHUB_ENV"

      - name: Verify game profile directory exists
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          PROFILE_DIR="dm/games/$GAME"
          
          if [ ! -d "$PROFILE_DIR" ]; then
            echo "❌ Profile directory missing: $PROFILE_DIR"
            exit 1
          fi
          echo "✅ Profile directory exists"

      - name: Run shader_split.py
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          
          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          ROMFS="${{ env.KIT_ROMFS }}"
          MAIN="${{ env.KIT_MAIN }}"
          SHADER_OUT="dm/games/$GAME/shaders"
          
          mkdir -p "$SHADER_OUT"
          
          echo "🔧 Running shader_split.py"
          echo "════════════════════════════════════════"
          echo "Game: $GAME_NAME"
          echo "Title ID: $GAME"
          echo "RomFS: $ROMFS"
          echo "Main: $MAIN"
          echo "Output: $SHADER_OUT"
          echo ""
          
          # Crucial: DM_GAME must be set in the same command
          DM_GAME="$GAME" python3 dm/gfx/tools/shader_split.py \
            "$ROMFS" \
            "$MAIN" \
            "$SHADER_OUT" \
            "$SHADER_OUT/shader_map.tsv" \
            "$SHADER_OUT/shader_facts.tsv" \
            "$SHADER_OUT/shader_pairs.tsv" \
            2>&1 | tee "$RUNNER_TEMP/split.log"
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ shader_split.py completed successfully"
          else
            echo "❌ shader_split.py failed!"
            tail -50 "$RUNNER_TEMP/split.log"
            exit 1
          fi

      - name: Verify TSV outputs
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          SHADER_OUT="dm/games/$GAME/shaders"
          
          echo "📊 Verifying TSV files"
          echo "════════════════════════════════════════"
          
          for tsv in shader_map.tsv shader_facts.tsv shader_pairs.tsv; do
            FILE="$SHADER_OUT/$tsv"
            if [ ! -f "$FILE" ]; then
              echo "❌ Missing: $FILE"
              exit 1
            fi
            LINES=$(wc -l < "$FILE")
            echo "✅ $tsv → $LINES lines"
          done

      - name: Copy TSVs into game profile root
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"
          SHADER_DIR="$GAME_DIR/shaders"
          
          echo "📋 Copying TSVs to game profile"
          cp "$SHADER_DIR/shader_map.tsv" "$GAME_DIR/shader_map.tsv"
          cp "$SHADER_DIR/shader_facts.tsv" "$GAME_DIR/shader_facts.tsv"
          cp "$SHADER_DIR/shader_pairs.tsv" "$GAME_DIR/shader_pairs.tsv"
          echo "✅ TSVs copied"

      - name: Commit TSVs to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shader Builder"
          git config user.email "shader-builder@local"
          
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"
          
          echo "📝 Git status:"
          git status
          
          git add "$GAME_DIR/shader_map.tsv" \
                  "$GAME_DIR/shader_facts.tsv" \
                  "$GAME_DIR/shader_pairs.tsv" 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            echo "✅ Changes detected, committing..."
            git commit -m "chore: shader tables for DRAGON BALL: Sparking! ZERO (Title: $GAME, Date: $(date -u))"
            git push origin HEAD:SpkIOSzero
          else
            echo "✅ No changes to commit"
          fi

      - name: Upload TSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shader-split-tsvs
          path: dm/games/${{ env.GAME }}/shader*.tsv
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          WORK="${{ env.WORK }}"
          if [ -n "$WORK" ] && [ -d "$WORK" ]; then
            rm -rf "$WORK"
            echo "🧹 Cleaned up"
          fi

      - name: Summary
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  ✅ WORKFLOW 1 COMPLETE"
          echo "════════════════════════════════════════"
          echo ""
          echo "Next: Workflow 2a will trigger automatically"
