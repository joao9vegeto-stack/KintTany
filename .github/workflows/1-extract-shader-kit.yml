name: 1. Extract Shader Kit + Split

on:
  push:
    branches: [SpkIOSzero]
    paths:
      - '.github/workflows/1-extract-shader-kit.yml'
      - 'dm/gfx/tools/shader_split.py'
      - 'dm/games/**'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

env:
  GAME: "010035F022078000"
  GAME_NAME: "DRAGON BALL: Sparking! ZERO"

jobs:
  extract_and_split:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: SpkIOSzero
          fetch-depth: 1

      - name: Setup Python & dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "═══════════════════════════════════════════"
          echo "  🔧 SETUP: Python & Dependencies"
          echo "═══════════════════════════════════════════"
          echo ""
          python3 --version
          python3 -m pip install --upgrade pip setuptools wheel
          pip3 install lz4 capstone PyYAML zstandard requests

      - name: Create work directory
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/shader_kit_extract_${RANDOM}_$(date +%s)"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "📁 Work directory: $WORK"
          df -h "$WORK" | tail -1

      - name: Validate GitHub token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "⚠️  No GitHub token found"
          else
            echo "✅ GitHub token available"
          fi

      - name: Download part1.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          URL="https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part1.zip"

          echo "📥 Downloading part1.zip"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --max-time 1800 \
            --progress-bar \
            -o "$WORK/part1.zip" \
            "$URL"

          test -f "$WORK/part1.zip"
          echo "✅ part1.zip downloaded"
          stat -f%z "$WORK/part1.zip" 2>/dev/null || stat -c%s "$WORK/part1.zip"

      - name: Download part2.z00
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          URL="https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z00"

          echo "📥 Downloading part2.z00"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --max-time 3600 \
            --progress-bar \
            -o "$WORK/part2.z00" \
            "$URL"

          test -f "$WORK/part2.z00"
          echo "✅ part2.z00 downloaded"

      - name: Download part2.z01
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          URL="https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z01"

          echo "📥 Downloading part2.z01"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --max-time 3600 \
            --progress-bar \
            -o "$WORK/part2.z01" \
            "$URL"

          test -f "$WORK/part2.z01"
          echo "✅ part2.z01 downloaded"

      - name: Reconstruct part2.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"

          echo "🔗 Reconstructing split archive"
          cat "$WORK/part2.z00" "$WORK/part2.z01" > "$WORK/part2.zip"

          echo "🔍 Testing zip integrity"
          unzip -t "$WORK/part2.zip" > /dev/null

          echo "✅ Reconstruction OK"

      - name: Extract part1.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          KIT_DIR="$WORK/kit"
          mkdir -p "$KIT_DIR"

          echo "📦 Extracting part1.zip"
          unzip -q "$WORK/part1.zip" -d "$KIT_DIR" 2>&1 | tee "$RUNNER_TEMP/unzip1.log"

          echo "KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "✅ part1 extracted"

      - name: Extract part2.zip
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          KIT_DIR="${{ env.KIT_DIR }}"

          echo "📦 Extracting part2.zip"
          unzip -q -o "$WORK/part2.zip" -d "$KIT_DIR" 2>&1 | tee "$RUNNER_TEMP/unzip2.log"

          echo "✅ part2 extracted"

      - name: Locate RomFS
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"

          echo "🔎 Locating RomFS"
          ROMFS="$(find "$KIT_DIR" -type d -name "RomFS" -print -quit || true)"

          if [ -z "$ROMFS" ]; then
            echo "❌ RomFS directory not found"
            find "$KIT_DIR" -maxdepth 5 -type d | head -50
            exit 1
          fi

          echo "KIT_ROMFS=$ROMFS" >> "$GITHUB_ENV"
          echo "✅ RomFS: $ROMFS"

      - name: Locate main executable
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"

          echo "🔎 Locating main executable"
          MAIN="$(find "$KIT_DIR" -type f \( -name "main" -o -name "main.nso" \) -not -path "*/.*" -print -quit || true)"

          if [ -n "$MAIN" ] && [ -f "$MAIN" ]; then
            echo "KIT_MAIN=$MAIN" >> "$GITHUB_ENV"
            echo "✅ main found: $MAIN"
          else
            echo "KIT_MAIN=" >> "$GITHUB_ENV"
            echo "⚠️ main executable not found"
          fi

      - name: Verify profile exists
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          PROFILE_DIR="dm/games/$GAME"

          echo "🔎 Verifying game profile directory"
          if [ ! -d "$PROFILE_DIR" ]; then
            echo "❌ Missing profile directory: $PROFILE_DIR"
            exit 1
          fi

          echo "✅ Profile directory exists: $PROFILE_DIR"
          ls -la "$PROFILE_DIR"

      - name: Run shader_split.py
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          ROMFS="${{ env.KIT_ROMFS }}"
          MAIN="${{ env.KIT_MAIN }}"
          SHADER_OUT="dm/games/$GAME/shaders"

          mkdir -p "$SHADER_OUT"

          echo "🔧 Running shader_split.py"
          echo "Game: $GAME_NAME"
          echo "Title ID: $GAME"
          echo "RomFS: $ROMFS"
          echo "Main: ${MAIN:-(not provided)}"
          echo "Output: $SHADER_OUT"

          if [ ! -d "$ROMFS" ]; then
            echo "❌ RomFS path invalid"
            exit 1
          fi

          if [ -z "$MAIN" ]; then
            echo "❌ main executable not found in kit"
            echo "   This workflow expects main for this title."
            exit 1
          fi

          echo "✅ Using main executable"

          DM_GAME="$GAME" python3 dm/gfx/tools/shader_split.py \
            "$ROMFS" \
            "$MAIN" \
            "$SHADER_OUT" \
            "$SHADER_OUT/shader_map.tsv" \
            "$SHADER_OUT/shader_facts.tsv" \
            "$SHADER_OUT/shader_pairs.tsv" \
            2>&1 | tee "$RUNNER_TEMP/split.log"

          echo "✅ shader_split.py completed"

      - name: Verify TSV outputs
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          SHADER_OUT="dm/games/$GAME/shaders"

          echo "📊 Verifying TSV outputs"
          for tsv in shader_map.tsv shader_facts.tsv shader_pairs.tsv; do
            FILE="$SHADER_OUT/$tsv"
            if [ ! -f "$FILE" ]; then
              echo "❌ Missing: $FILE"
              exit 1
            fi
            echo "✅ $tsv -> $(wc -l < "$FILE") lines"
          done

      - name: Build game profile from extraction
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          GAME_DIR="dm/games/$GAME"
          SHADER_DIR="$GAME_DIR/shaders"

          echo "🧩 Building game profile"

          PROFILE_OUTPUT="$(python3 dm/games/profile_guess.py "${{ env.KIT_DIR }}/ExeFS" "${{ env.KIT_ROMFS }}" 2>&1 || true)"

          MODULES="$(echo "$PROFILE_OUTPUT" | grep '^modules' | cut -f2 || echo 'main')"
          MEM_RESERVE="$(echo "$PROFILE_OUTPUT" | grep '^mem_reserve' | cut -f2 || echo '0x30000000')"
          MEM_ALIAS="$(echo "$PROFILE_OUTPUT" | grep '^mem_alias' | cut -f2 || echo '0x10000000')"
          MEM_STACK="$(echo "$PROFILE_OUTPUT" | grep '^mem_stack' | cut -f2 || echo '0x10000000')"
          APP_POOL="$(echo "$PROFILE_OUTPUT" | grep '^app_pool' | cut -f2 || echo '0xCD500000')"
          FPS_TARGET="$(echo "$PROFILE_OUTPUT" | grep '^fps_target' | cut -f2 || echo '60')"
          ROMFS_MARKER="$(echo "$PROFILE_OUTPUT" | grep '^romfs_marker' | cut -f2 || echo '')"
          BUILD="$(echo "$PROFILE_OUTPUT" | grep '^build' | cut -f2 || echo '')"
          SHADER_GROUPS="$(echo "$PROFILE_OUTPUT" | grep '^shader_groups' | cut -f2 || echo 'global=global')"
          SHADER_NOTE="$(echo "$PROFILE_OUTPUT" | grep '^shader_note' | cut -f2 || echo '')"

          mkdir -p "$GAME_DIR"

          {
            printf 'title_id\tprogram_id\tname\tipa\tbuild\tmodules\tromfs_marker\tfps_target\tmem_reserve\tmem_alias\tmem_stack\tapp_pool\tshader_groups\tshader_note\n'
            printf '%s\t%s\t%s\t\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$GAME" "$GAME" "$GAME_NAME" \
              "$BUILD" "$MODULES" "$ROMFS_MARKER" "$FPS_TARGET" \
              "$MEM_RESERVE" "$MEM_ALIAS" "$MEM_STACK" "$APP_POOL" \
              "$SHADER_GROUPS" "$SHADER_NOTE"
          } > "$GAME_DIR/game.tsv"

          cp "$SHADER_DIR/shader_map.tsv" "$GAME_DIR/shader_map.tsv"
          cp "$SHADER_DIR/shader_facts.tsv" "$GAME_DIR/shader_facts.tsv"
          cp "$SHADER_DIR/shader_pairs.tsv" "$GAME_DIR/shader_pairs.tsv"

          if [ -f "$SHADER_DIR/pso_manifest.tsv" ]; then
            cp "$SHADER_DIR/pso_manifest.tsv" "$GAME_DIR/pso_manifest.tsv"
          fi

          echo "✅ Game profile written"

      - name: Commit TSVs to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dragon Ball Shader Builder"
          git config user.email "dbs-shader-builder@local"

          GAME="${{ env.GAME }}"
          SHADER_DIR="dm/games/$GAME/shaders"
          GAME_DIR="dm/games/$GAME"

          git add "$GAME_DIR/game.tsv" \
                  "$GAME_DIR/shader_map.tsv" \
                  "$GAME_DIR/shader_facts.tsv" \
                  "$GAME_DIR/shader_pairs.tsv" \
                  "$GAME_DIR/pso_manifest.tsv" 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate shader tables for DRAGON BALL: Sparking! ZERO"
            git push origin HEAD:SpkIOSzero
          else
            echo "✅ No changes to commit"
          fi

      - name: Upload TSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shader-split-tsvs
          path: dm/games/${{ env.GAME }}/*.tsv
          retention-days: 30
          if-no-files-found: error

      - name: Upload split log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-execution-log
          path: ${{ runner.temp }}/split.log
          retention-days: 14

      - name: Upload extraction logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-logs
          path: |
            ${{ runner.temp }}/unzip1.log
            ${{ runner.temp }}/unzip2.log
          retention-days: 14
