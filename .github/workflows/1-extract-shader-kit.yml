name: 1. Extract Shader Kit + Split

on:
  push:
    branches: [SpkIOSzero]
    paths:
      - '.github/workflows/1-extract-shader-kit.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

env:
  GAME: "010035F022078000"
  GAME_NAME: "DRAGON BALL: Sparking! ZERO"

jobs:
  extract_and_split:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: SpkIOSzero
          fetch-depth: 1

      - name: Setup Python virtualenv
        shell: bash
        run: |
          set -euo pipefail
          echo "═══════════════════════════════════════════"
          echo "  🔧 SETUP: Python & Virtualenv"
          echo "═══════════════════════════════════════════"
          python3 --version
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install lz4 capstone PyYAML zstandard requests
          echo "✅ Setup complete"

      - name: Create work directory
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/shader_extract_${RANDOM}_$(date +%s)"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "📁 Work directory: $WORK"

      - name: Download shader kit (part 1)
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "📥 Downloading shader kit part 1..."
          curl -fL --retry 5 --retry-delay 2 --max-time 1800 --progress-bar \
            -o "$WORK/shader_part1.zip" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part1.zip"
          [ -f "$WORK/shader_part1.zip" ] && echo "✅ part1 downloaded" || exit 1

      - name: Download shader kit (part 2a - z00)
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "📥 Downloading shader kit part 2a (z00)..."
          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/shader_part2.z00" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z00"
          [ -f "$WORK/shader_part2.z00" ] && echo "✅ part2.z00 downloaded" || exit 1

      - name: Download shader kit (part 2b - z01)
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "📥 Downloading shader kit part 2b (z01)..."
          curl -fL --retry 5 --retry-delay 2 --max-time 3600 --progress-bar \
            -o "$WORK/shader_part2.z01" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/shader_kit_010035F022078000_part2.z01"
          [ -f "$WORK/shader_part2.z01" ] && echo "✅ part2.z01 downloaded" || exit 1

      - name: Reconstruct shader kit (part 2)
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "🔗 Reconstructing shader_part2.zip..."
          cat "$WORK/shader_part2.z00" "$WORK/shader_part2.z01" > "$WORK/shader_part2.zip"
          unzip -t "$WORK/shader_part2.zip" > /dev/null && echo "✅ part2.zip OK" || exit 1

      - name: Download github_kit_Spk.zip (contains ExeFS/main)
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          echo "📥 Downloading github_kit_Spk.zip (ExeFS with main)..."
          curl -fL --retry 5 --retry-delay 2 --max-time 1800 --progress-bar \
            -o "$WORK/github_kit_Spk.zip" \
            "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip"
          [ -f "$WORK/github_kit_Spk.zip" ] && echo "✅ github_kit_Spk.zip downloaded" || exit 1

      - name: Extract all archives
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ env.WORK }}"
          KIT_DIR="$WORK/kit"
          mkdir -p "$KIT_DIR"
          
          echo "📦 Extracting shader kit part 1..."
          unzip -q "$WORK/shader_part1.zip" -d "$KIT_DIR"
          
          echo "📦 Extracting shader kit part 2..."
          unzip -q -o "$WORK/shader_part2.zip" -d "$KIT_DIR"
          
          echo "📦 Extracting github_kit_Spk.zip..."
          unzip -q -o "$WORK/github_kit_Spk.zip" -d "$KIT_DIR"
          
          echo "KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "✅ All archives extracted"

      - name: Locate RomFS and ExeFS
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="${{ env.KIT_DIR }}"
          
          echo "🔎 Locating RomFS and ExeFS..."
          
          ROMFS=$(find "$KIT_DIR" -type d -name "RomFS" -print -quit || true)
          EXEFS=$(find "$KIT_DIR" -type d \( -iname "ExeFS" -o -iname "exefs" \) -print -quit || true)
          
          if [ -z "$ROMFS" ]; then
            echo "❌ RomFS not found!"
            exit 1
          fi
          
          if [ -z "$EXEFS" ]; then
            echo "❌ ExeFS not found!"
            exit 1
          fi
          
          echo "✅ RomFS: $ROMFS"
          echo "✅ ExeFS: $EXEFS"
          echo "KIT_ROMFS=$ROMFS" >> "$GITHUB_ENV"
          echo "KIT_EXEFS=$EXEFS" >> "$GITHUB_ENV"

      - name: Discover game profile using profile_guess.py
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          
          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          GAME_DIR="dm/games/$GAME"
          EXEFS="${{ env.KIT_EXEFS }}"
          ROMFS="${{ env.KIT_ROMFS }}"
          
          echo "🔍 Discovering game profile metadata..."
          echo "════════════════════════════════════════"
          
          mkdir -p "$GAME_DIR"
          
          # Executa profile_guess.py para extrair os fatos do game
          python3 << 'PROFILE_SCRIPT'
          import sys
          sys.path.insert(0, 'dm/games')
          import profile_guess as pg
          
          EXEFS = "${{ env.KIT_EXEFS }}"
          ROMFS = "${{ env.KIT_ROMFS }}"
          
          # Extrai fatos do game
          facts = pg.facts_of(EXEFS, ROMFS)
          
          # Gera os valores do profile
          guess_vals = pg.guess(facts)
          
          # Imprime os fatos e valores adivinhados
          print("\n📊 FACTS DISCOVERED:")
          print("════════════════════════════════════════")
          
          print(f"\nModules:")
          for mod_name, mod_info in facts['mods'].items():
              print(f"  {mod_name}: {mod_info['kind']}, build {mod_info['bid']}")
          
          print(f"\nRomFS:")
          print(f"  Files: {facts['romfs']['n']}")
          print(f"  Bytes: {facts['romfs']['bytes'] / (1024**3):.2f} GB")
          print(f"  Paks found: {facts['romfs']['exts'].get('.pak', 0)}")
          
          print(f"\nSystem Resource: {facts['sysres'] / (1024**2):.1f} MB")
          print(f"SDK Version: {facts['sdk']}")
          
          print(f"\n📝 PROFILE VALUES:")
          print("════════════════════════════════════════")
          for k, (v, reason) in guess_vals.items():
              print(f"{k}\t{v}")
              if reason:
                  print(f"  # {reason}")
          
          PROFILE_SCRIPT
          
          echo ""
          echo "✅ Profile discovery complete"

      - name: Create game.tsv with discovered metadata
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          
          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          GAME_DIR="dm/games/$GAME"
          EXEFS="${{ env.KIT_EXEFS }}"
          ROMFS="${{ env.KIT_ROMFS }}"
          
          echo "📝 Creating game.tsv..."
          
          python3 << 'CREATE_PROFILE'
          import sys
          sys.path.insert(0, 'dm/games')
          import profile_guess as pg
          
          EXEFS = "${{ env.KIT_EXEFS }}"
          ROMFS = "${{ env.KIT_ROMFS }}"
          GAME_ID = "${{ env.GAME }}"
          GAME_NAME = "${{ env.GAME_NAME }}"
          GAME_DIR = "dm/games/${{ env.GAME }}"
          
          # Extrai fatos e gera profile
          facts = pg.facts_of(EXEFS, ROMFS)
          guess_vals = pg.guess(facts)
          
          # Cria o arquivo game.tsv com os valores descobertos
          tsv_content = [
              f"# Game profile automatically generated for {GAME_NAME}",
              f"Title\t{GAME_ID}",
              f"Name\t{GAME_NAME}",
              ""
          ]
          
          for key in ['op_mode', 'pad_layout', 'modules', 'mem_reserve', 'mem_alias', 
                      'mem_stack', 'app_pool', 'sys_resource', 'graphics']:
              if key in guess_vals:
                  value, reason = guess_vals[key]
                  tsv_content.append(f"{key}\t{value}")
                  if reason:
                      tsv_content.append(f"# {reason}")
          
          # Salva o arquivo game.tsv
          with open(f"{GAME_DIR}/game.tsv", "w") as f:
              f.write("\n".join(tsv_content))
          
          print("✅ game.tsv created")
          
          # Também cria shader_groups.tsv se não existir
          import os
          if not os.path.exists(f"{GAME_DIR}/shader_groups.tsv"):
              with open(f"{GAME_DIR}/shader_groups.tsv", "w") as f:
                  f.write("# Shader source groups\n")
                  f.write("RomFS\tromfs\n")
                  f.write("main\tmain\n")
              print("✅ shader_groups.tsv created")
          
          CREATE_PROFILE
          
          echo ""
          echo "📋 Content of game.tsv:"
          cat "$GAME_DIR/game.tsv"

      - name: Run shader_split.py
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          
          GAME="${{ env.GAME }}"
          GAME_NAME="${{ env.GAME_NAME }}"
          ROMFS="${{ env.KIT_ROMFS }}"
          EXEFS="${{ env.KIT_EXEFS }}"
          SHADER_OUT="dm/games/$GAME/shaders"
          
          mkdir -p "$SHADER_OUT"
          
          echo "🔧 Running shader_split.py"
          echo "════════════════════════════════════════"
          echo "Game: $GAME_NAME"
          echo "Title ID: $GAME"
          echo "RomFS: $ROMFS"
          echo "ExeFS: $EXEFS"
          echo "Output: $SHADER_OUT"
          echo ""
          
          # Executa shader_split.py com RomFS e main
          MAIN="$EXEFS/main"
          
          DM_GAME="$GAME" python3 dm/gfx/tools/shader_split.py \
            "$ROMFS" \
            "$MAIN" \
            "$SHADER_OUT" \
            "$SHADER_OUT/shader_map.tsv" \
            "$SHADER_OUT/shader_facts.tsv" \
            "$SHADER_OUT/shader_pairs.tsv" \
            2>&1 | tee "$RUNNER_TEMP/split.log"
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ shader_split.py completed successfully"
          else
            echo "❌ shader_split.py failed!"
            tail -50 "$RUNNER_TEMP/split.log"
            exit 1
          fi

      - name: Verify TSV outputs
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          SHADER_OUT="dm/games/$GAME/shaders"
          
          echo "📊 Verifying TSV files"
          echo "════════════════════════════════════════"
          
          for tsv in shader_map.tsv shader_facts.tsv shader_pairs.tsv; do
            FILE="$SHADER_OUT/$tsv"
            if [ ! -f "$FILE" ]; then
              echo "❌ Missing: $FILE"
              exit 1
            fi
            LINES=$(wc -l < "$FILE")
            echo "✅ $tsv → $LINES lines"
          done

      - name: Copy TSVs into game profile root
        shell: bash
        run: |
          set -euo pipefail
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"
          SHADER_DIR="$GAME_DIR/shaders"
          
          echo "📋 Copying TSVs to game profile"
          cp "$SHADER_DIR/shader_map.tsv" "$GAME_DIR/shader_map.tsv"
          cp "$SHADER_DIR/shader_facts.tsv" "$GAME_DIR/shader_facts.tsv"
          cp "$SHADER_DIR/shader_pairs.tsv" "$GAME_DIR/shader_pairs.tsv"
          echo "✅ TSVs copied"

      - name: Commit all generated files to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shader Builder"
          git config user.email "shader-builder@local"
          
          GAME="${{ env.GAME }}"
          GAME_DIR="dm/games/$GAME"
          
          echo "📝 Staging generated files..."
          git add "$GAME_DIR/game.tsv" \
                  "$GAME_DIR/shader_groups.tsv" \
                  "$GAME_DIR/shader_map.tsv" \
                  "$GAME_DIR/shader_facts.tsv" \
                  "$GAME_DIR/shader_pairs.tsv" 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            echo "✅ Changes detected, committing..."
            
            # Usa variável de ambiente para mensagem multi-linha
            COMMIT_MSG="chore: auto-generated game profile and shader tables

      - game.tsv: metadata discovered using profile_guess.py
      - shader_groups.tsv: shader source groups
      - shader_map.tsv: shader indices
      - shader_facts.tsv: shader facts
      - shader_pairs.tsv: shader pairs"
            
            git commit -m "$COMMIT_MSG"
            
            if git push origin HEAD:SpkIOSzero; then
              echo "✅ Pushed to repository"
            else
              echo "⚠️  Push failed (may need retry)"
            fi
          else
            echo "✅ No changes to commit"
          fi

      - name: Upload TSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shader-split-tsvs
          path: dm/games/${{ env.GAME }}/shader*.tsv
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          WORK="${{ env.WORK }}"
          if [ -n "$WORK" ] && [ -d "$WORK" ]; then
            rm -rf "$WORK"
            echo "🧹 Cleaned up work directory"
          fi

      - name: Summary
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  ✅ WORKFLOW 1 COMPLETE"
          echo "════════════════════════════════════════"
          echo ""
          echo "Generated Files:"
          echo "  • dm/games/${{ env.GAME }}/game.tsv (profile metadata)"
          echo "  • dm/games/${{ env.GAME }}/shader_groups.tsv (shader sources)"
          echo "  • dm/games/${{ env.GAME }}/shader_map.tsv (shader indices)"
          echo "  • dm/games/${{ env.GAME }}/shader_facts.tsv (shader facts)"
          echo "  • dm/games/${{ env.GAME }}/shader_pairs.tsv (shader pairs)"
          echo ""
          echo "Next: Workflow 2a will trigger automatically"
