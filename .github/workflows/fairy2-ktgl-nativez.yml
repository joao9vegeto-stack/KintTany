name: Fairy2iOS - KTGL original zlib failure recovery (host-only)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/nativez_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-nativez-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile actual native fallback C and reject corrupted zlib data
        run: |
          set -euo pipefail
          python -m compileall -q fairy2/scripts/repack_mode4_nativez.py
          python -m unittest discover -v -s fairy2/tests -p test_mode4_nativez.py
      - name: Enforce original-byte only and no speculative header retry
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('fairy2/nativez_trigger.json').read_text())
          assert d['branch']=='Fairy2iOS'
          assert d['source_run']==44995690307
          assert d['only_original_stored_zlib'] is True
          assert d['only_on_native_codec_failure'] is True
          assert d['no_fabricated_resource'] is True
          assert d['no_repeated_header_reads'] is True
          assert d['shader_rebuild'] is False
          print('FALLBACK C TESTS OK: original libz DEFLATE/Adler32, no asset spoofing')
          PY
  repack:
    needs: reference-codec
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact Fairy2iOS commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate source, upstream pin, emulator memory layout and host build contract
        run: |
          set -euo pipefail
          test "$(cat .upstream-ref)" = b526a50b85e4cfa3142c111e1ad491d9fd11f0eb
          python3 -m unittest discover -s fairy2/tests -p test_mode4_nativez.py -v
          python3 -m unittest discover -s fairy2/tests -p test_full_resource_va.py -v
          xcodebuild -version
          brew list --formula xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m pip install --disable-pip-version-check lz4 'capstone>=5,<6' fonttools zbic backports.zstd
          python3 tools/engine.py relink
          python3 tools/engine.py check
          python3 tools/engine.py sync
          grep -q 'static void on_crash' engine/dm/host/crash.c
      - name: Recover SHA-verified source with same 19,210 compiled Metal shaders
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 44995690307 -R joao9vegeto-stack/KintTany \
            -n Fairy2iOS-KTGL-NoOverlap-1 -D "$RUNNER_TEMP/source"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['RUNNER_TEMP'])/'source'
          ipa=root/'Fairy2iOS-FairyTail2-KTGL-2GiB-NoOverlap.ipa'
          assert ipa.stat().st_size==1622226531
          with ipa.open('rb') as f:
            h=hashlib.file_digest(f,'sha256').hexdigest()
          assert h=='b1792f9eb522de53b2b252e3a85229584831434999edda98f31c87c7c8c256cd'
          report=json.loads((root/'ktgl-nooverlap-report.json').read_text())
          assert report['output_ipa_sha256']==h
          print('ORIGINAL PRECOMPILED IPHONE METAL LIB SHA-LOCKED, no shaders rebuilt')
          PY
      - name: Repack only host with fail-closed original mode4 zlib recovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          python3 fairy2/scripts/repack_mode4_nativez.py \
            --source-ipa "$RUNNER_TEMP/source/Fairy2iOS-FairyTail2-KTGL-2GiB-NoOverlap.ipa" \
            --source-report "$RUNNER_TEMP/source/ktgl-nooverlap-report.json" \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/output"
      - name: Verify IPA integrity, shader unchanged, guest sections and real-source-only checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          root=Path(os.environ['RUNNER_TEMP'])/'output'
          report=json.loads((root/'original-mode4-zlib-report.json').read_text())
          assert report['mode4_fallback_only_if_guest_inflate_fails'] is True
          assert report['mode4_fallback_codec_sites']==['main+0xc0ef8c','main+0xc0f0d4']
          assert report['g1t_synthetic_stream'] is False
          assert report['g1s_synthetic_stream'] is False
          assert report['guest_parser_skipped'] is False
          assert report['native_resource_retry'] is False
          assert report['number_of_shaders_recompiled']==0
          assert report['external_romfs_unchanged'] is True
          assert report['device_boot_verified'] is False
          assert report['not_a_gameplay_fix'] is True
          assert report['metal_shader_sha256']=='ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b'
          assert report['external_romfs_aoc_unchanged'] is True
          ipa=root/report['output_ipa'];assert ipa.is_file()
          with ipa.open('rb') as f:h=hashlib.file_digest(f,'sha256').hexdigest()
          assert h==report['output_ipa_sha256']
          with zipfile.ZipFile(ipa) as z:
            assert z.testzip() is None
            fw='Payload/DmShell.app/Frameworks/DmGame0100B9801F872000.framework/'
            assert z.getinfo(fw+'msl/b-0724088d3779.img').file_size==2640519506
            assert not any(n.endswith('/romfs.img') or n.endswith('.nsp') for n in z.namelist())
          print('FAIRY2 KTGL ZLIB FALLBACK candidate, device unverified:',ipa.name,'SHA',h)
          PY
      - name: Publish one candidate IPA and original-byte provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-KTGL-OriginalZlib-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/output/Fairy2iOS-FairyTail2-OriginalMode4ZlibFallback.ipa
            ${{ runner.temp }}/output/original-mode4-zlib-report.json
            ${{ runner.temp }}/output/full-resource-va-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload host build failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-KTGL-OriginalZlib-Failed-${{ github.run_number }}
          path: ${{ runner.temp }}/output/host-build.log
          if-no-files-found: warn
