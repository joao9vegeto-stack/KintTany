name: PsTJon KosmicKrisp M1

on:
  push:
    branches: [PsTJon-KosmicKrisp]
    paths:
      - ".github/workflows/pstjon-kosmickrisp.yml"
  workflow_dispatch:

concurrency:
  group: pstjon-kosmickrisp-m1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kosmickrisp-macos-smoke:
    name: M1 - KosmicKrisp macOS arm64
    runs-on: macos-26
    timeout-minutes: 180
    env:
      MESA_KOSMICKRISP_SHA: "bfe063f723d436e5cdef8a98f058d4e44a64810c"
      MESA_PRIMARY_URL: "https://gitlab.freedesktop.org/mesa/mesa.git"
      MESA_MIRROR_URL: "https://github.com/Kenji-NX/mesa.git"
      MESON_VERSION: "1.9.1"
      LLVM_FORMULA: "llvm@20"
      SPIRV_LLVM_TRANSLATOR_SHA: "e328468fd329342f1f60c12fdd19cc0faaa88f32"
      SPIRV_LLVM_TRANSLATOR_URL: "https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git"

    steps:
      - name: Checkout PsTJon KosmicKrisp control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable PsTJon v13 ancestry
        run: |
          set -euxo pipefail
          git cat-file -e f0944f0957bae61793679e5b3330ccfd2b53d005^{commit}
          git merge-base --is-ancestor f0944f0957bae61793679e5b3330ccfd2b53d005 HEAD
          git diff --exit-code f0944f0957bae61793679e5b3330ccfd2b53d005 HEAD -- .github/workflows/pstjon.yml
          echo "Branch head: $(git rev-parse HEAD)"
          echo "Baseline v13: f0944f0957bae61793679e5b3330ccfd2b53d005"

      - name: Verify Apple Silicon and Metal 4 host
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers
          uname -a
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          system_profiler SPDisplaysDataType || true

      - name: Install pinned build prerequisites
        run: |
          set -euxo pipefail
          brew update
          for pkg in cmake pkg-config libclc "$LLVM_FORMULA" spirv-tools vulkan-tools; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

          python3 -m venv "$GITHUB_WORKSPACE/venv"
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "meson==${MESON_VERSION}" mako packaging pyyaml

          LLVM_PREFIX="$(brew --prefix "$LLVM_FORMULA")"
          TRANSLATOR_PREFIX="$GITHUB_WORKSPACE/deps/spirv-llvm-translator-20"
          rm -rf "$GITHUB_WORKSPACE/spirv-llvm-translator-src" "$GITHUB_WORKSPACE/spirv-llvm-translator-build" "$TRANSLATOR_PREFIX"
          git clone --filter=blob:none --no-checkout "$SPIRV_LLVM_TRANSLATOR_URL" "$GITHUB_WORKSPACE/spirv-llvm-translator-src"
          git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" fetch --depth=1 origin "$SPIRV_LLVM_TRANSLATOR_SHA"
          git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" checkout --detach "$SPIRV_LLVM_TRANSLATOR_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" rev-parse HEAD)" = "$SPIRV_LLVM_TRANSLATOR_SHA"

          cmake -S "$GITHUB_WORKSPACE/spirv-llvm-translator-src" -B "$GITHUB_WORKSPACE/spirv-llvm-translator-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TRANSLATOR_PREFIX" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF
          cmake --build "$GITHUB_WORKSPACE/spirv-llvm-translator-build" --target LLVMSPIRVLib llvm-spirv -j3
          cmake --install "$GITHUB_WORKSPACE/spirv-llvm-translator-build"
          test -f "$TRANSLATOR_PREFIX/lib/libLLVMSPIRVLib.a"
          test -f "$TRANSLATOR_PREFIX/lib/pkgconfig/LLVMSPIRVLib.pc"
          test "$(PKG_CONFIG_PATH="$TRANSLATOR_PREFIX/lib/pkgconfig" pkg-config --modversion LLVMSPIRVLib)" = "20.1.0.0"

          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$TRANSLATOR_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LDFLAGS=-L$TRANSLATOR_PREFIX/lib -L$LLVM_PREFIX/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$TRANSLATOR_PREFIX/include -I$LLVM_PREFIX/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$TRANSLATOR_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig:$(brew --prefix libclc)/lib/pkgconfig:$(brew --prefix spirv-tools)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Fetch exact Mesa KosmicKrisp revision
        run: |
          set -euxo pipefail
          rm -rf mesa-src
          if git clone --filter=blob:none --no-checkout "$MESA_PRIMARY_URL" mesa-src; then
            echo "official GitLab" | tee mesa-source.txt
          else
            rm -rf mesa-src
            git clone --filter=blob:none --no-checkout "$MESA_MIRROR_URL" mesa-src
            echo "synchronized GitHub mirror fallback" | tee mesa-source.txt
          fi
          cd mesa-src
          git fetch --depth=1 origin "$MESA_KOSMICKRISP_SHA"
          git checkout --detach "$MESA_KOSMICKRISP_SHA"
          test "$(git rev-parse HEAD)" = "$MESA_KOSMICKRISP_SHA"
          git log -1 --format='%H%n%ci%n%s'
          grep -q "KosmicKrisp" docs/drivers/kosmickrisp.rst
          grep -q "Metal 4" docs/drivers/kosmickrisp.rst
          grep -q "No iOS support is present as of now" docs/drivers/kosmickrisp.rst

      - name: Record dependency versions
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          {
            echo "M1 PsTJon / KosmicKrisp macOS build manifest"
            echo "KintTany commit: $GITHUB_SHA"
            echo "PsTJon v13 baseline: f0944f0957bae61793679e5b3330ccfd2b53d005"
            echo "Mesa/KosmicKrisp commit: $MESA_KOSMICKRISP_SHA"
            echo "Mesa source: $(cat mesa-source.txt)"
            echo "Host arch: $(uname -m)"
            echo "macOS: $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "SDK: $(xcrun --sdk macosx --show-sdk-version)"
            echo "Meson: $(meson --version)"
            echo "CMake: $(cmake --version | head -1)"
            echo "LLVM: $(llvm-config --version)"
            echo "SPIR-V LLVM translator: $SPIRV_LLVM_TRANSLATOR_SHA (LLVMSPIRVLib $(pkg-config --modversion LLVMSPIRVLib))"
            echo "SPIR-V tools: $(spirv-as --version | head -1)"
            echo "Vulkan tools: $(vulkaninfo --version 2>&1 | head -1 || true)"
          } | tee M1-build.txt

      - name: Configure KosmicKrisp exactly as Mesa documents
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          meson setup build mesa-src \
            --buildtype=debug \
            -Dplatforms=macos \
            -Dvulkan-drivers=kosmickrisp \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dzstd=disabled \
            --prefer-static

      - name: Build KosmicKrisp
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          meson compile -C build
          find build -type f \( -name '*kosmickrisp*' -o -name 'libvulkan_*.dylib' -o -name '*icd*.json' \) -print | sort | tee M1-products.txt
          test -n "$(find build -type f -name 'libvulkan_kosmickrisp*.dylib' -print -quit)"

      - name: Install to isolated staging root
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          rm -rf install-root
          meson install -C build --destdir "$GITHUB_WORKSPACE/install-root"
          find install-root -type f | sort | tee M1-install-files.txt
          find install-root -type f -name '*kosmickrisp*.dylib' -exec file {} \; | tee M1-file.txt
          grep -q 'arm64' M1-file.txt

      - name: Vulkan smoke test on Apple GPU
        run: |
          set -euxo pipefail
          ICD_JSON="$(find build install-root -type f \( -name '*kosmickrisp*icd*.json' -o -name '*kosmickrisp*.json' \) -print -quit)"
          test -n "$ICD_JSON"
          echo "KosmicKrisp ICD: $ICD_JSON" | tee M1-icd.txt
          cat "$ICD_JSON" | tee M1-icd-json.txt

          export VK_DRIVER_FILES="$PWD/$ICD_JSON"
          export VK_ICD_FILENAMES="$PWD/$ICD_JSON"

          GPU_INFO="$(system_profiler SPDisplaysDataType 2>/dev/null || true)"
          printf '%s\n' "$GPU_INFO" > M1-gpu-info.txt
          if ! printf '%s\n' "$GPU_INFO" | grep -E -qi 'Chipset Model:|Metal Support:'; then
            echo "SKIP: GitHub-hosted macOS arm64 runner exposes no usable GPU device." | tee M1-vulkaninfo.txt
            echo "M1_RUNTIME_SMOKE=deferred-no-gpu" >> "$GITHUB_ENV"
            exit 0
          fi

          vulkaninfo --summary 2>&1 | tee M1-vulkaninfo.txt
          grep -E -qi 'Kosmic|Krisp|Apple' M1-vulkaninfo.txt
          ! grep -E -qi 'ERROR_INCOMPATIBLE_DRIVER|vkCreateInstance failed|No Vulkan devices found' M1-vulkaninfo.txt
          echo "M1_RUNTIME_SMOKE=pass" >> "$GITHUB_ENV"

      - name: Capture M1 capability snapshot
        if: success()
        run: |
          set -euxo pipefail
          ICD_JSON="$(find build install-root -type f \( -name '*kosmickrisp*icd*.json' -o -name '*kosmickrisp*.json' \) -print -quit)"
          export VK_DRIVER_FILES="$PWD/$ICD_JSON"
          export VK_ICD_FILENAMES="$PWD/$ICD_JSON"
          if [ "${M1_RUNTIME_SMOKE:-}" = "pass" ]; then
            vulkaninfo > M1-vulkaninfo-full.txt 2>&1
          else
            {
              echo "Runtime Vulkan capability enumeration deferred."
              echo "Reason: hosted macOS runner did not expose a GPU to KosmicKrisp."
              echo "The installed driver and ICD were still validated as arm64 artifacts."
            } > M1-vulkaninfo-full.txt
          fi
          {
            echo
            echo "Build/install result: PASS"
            echo "Runtime smoke: ${M1_RUNTIME_SMOKE:-deferred-no-gpu}"
            echo "Scope: M1 only; no RPCS3/iOS integration was performed."
            echo "Next gate: M2 cross-compile arm64-apple-ios without WSI."
          } >> M1-build.txt
          shasum -a 256 "$(find build -type f -name 'libvulkan_kosmickrisp*.dylib' -print -quit)" | tee M1-sha256.txt

      - name: Upload M1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PsTJon-KK-m01-macos
          path: |
            M1-build.txt
            M1-products.txt
            M1-install-files.txt
            M1-file.txt
            M1-icd.txt
            M1-icd-json.txt
            M1-vulkaninfo.txt
            M1-vulkaninfo-full.txt
            M1-gpu-info.txt
            M1-sha256.txt
            mesa-source.txt
            build/meson-logs/
            install-root/
          if-no-files-found: warn
          compression-level: 0
