name: Fairy2iOS - fix proven KTGL 2GiB arena overlap (host only)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/nooverlap_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-ktgl-nooverlap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nooverlap:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout only selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prove KTGL real overlap and audit both 2GiB patch sites
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .upstream-ref)" = b526a50b85e4cfa3142c111e1ad491d9fd11f0eb
          python3 -m pip install --disable-pip-version-check 'capstone>=5,<6'
          python3 -m py_compile fairy2/scripts/repack_ktgl_overlap.py fairy2/scripts/ios_allocator_probe.py
          python3 -m unittest discover -s fairy2/tests -p test_ktgl_nooverlap.py -v
          python3 -m unittest discover -s fairy2/tests -p test_global_memory.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('fairy2/nooverlap_trigger.json').read_text())
          assert d['source_run']==44992666178 and d['old_capacity']==0x50000000
          assert d['new_capacity']==0x80000000 and d['rebuild_shaders'] is False
          print("Expected 328.7 MiB overlap removed by coherent 2GiB KTGL reservation.")
          PY
      - name: Native host prerequisites and pinned engine without recompile of shaders
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          brew list --formula xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m pip install --disable-pip-version-check lz4 fonttools zbic backports.zstd
          python3 tools/engine.py relink
          python3 tools/engine.py check
          python3 tools/engine.py sync
          python3 fairy2/scripts/ios_allocator_probe.py --source engine/dm/host/probe.c --bin-offset 0xc5800178
          grep -q '0xc5800178ull' engine/dm/host/probe.c
      - name: Download exact device-crashed conservative IPA and assert SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ktgl-input"
          gh run download 44992666178 -R joao9vegeto-stack/KintTany \
            -n Fairy2iOS-Conservative-1 -D "$RUNNER_TEMP/ktgl-input"
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          p=Path(os.environ['RUNNER_TEMP'])/'ktgl-input'
          ipa=p/'Fairy2iOS-FairyTail2-ConservativeGPU-MemoryTrace.ipa'
          assert ipa.stat().st_size==1622226533
          sha=hashlib.sha256()
          with ipa.open('rb') as f:
           for chunk in iter(lambda:f.read(8*1024*1024),b''):sha.update(chunk)
          assert sha.hexdigest()=='6b3803ac5359c724fb43781688c1e3eab7cb3b80dde723a64f73e945c0574c0c'
          report=json.loads((p/'conservative-report.json').read_text())
          assert report['output_ipa_sha256']==sha.hexdigest()
          assert report['guest_root_patch']['after_sha256']
          print('Source SHA/IPA and previous 4GiB root provenance accepted')
          PY
      - name: Patch both KTGL capacities, rebuild iOS host only, preserve Metal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ktgl-output"
          python3 fairy2/scripts/repack_ktgl_overlap.py \
            --source-ipa "$RUNNER_TEMP/ktgl-input/Fairy2iOS-FairyTail2-ConservativeGPU-MemoryTrace.ipa" \
            --source-report "$RUNNER_TEMP/ktgl-input/conservative-report.json" \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ktgl-output"
      - name: IPA CRC + SHA original shaders + true 2GiB address geometry + controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('fairy2/colab').resolve()))
          from ipa_validator import validate_ipa
          p=Path(os.environ['RUNNER_TEMP'])/'ktgl-output'
          report=json.loads((p/'ktgl-nooverlap-report.json').read_text())
          source={'framework':'DmGame0100B9801F872000.framework',
                  'shader_payload':{'ipa_path':'Frameworks/DmGame0100B9801F872000.framework/msl/b-0724088d3779.img',
                                    'size_bytes':2640519506}}
          tested=validate_ipa(p/report['output_ipa'],source,verify_crc=True)
          geo=report['global_geometry'];patch=report['guest_ktgl_2g_patch']
          assert geo['old_gpu_overflow_bytes']==0x148ac000
          assert geo['new_ktgl_capacity']==0x80000000
          assert geo['new_ktgl_end']==geo['next_region_base']
          assert geo['new_gpu_gap_bytes']>0 and geo['root_free_after_initial_regions']==0x2ae00000
          assert patch['old_region_bytes']==0x50000000 and patch['new_region_bytes']==0x80000000
          assert patch['instructions_changed']==2 and patch['byte_changes']==4
          assert report['host_recompiled'] and not report['game_shaders_recompiled']
          assert report['metal_shader_sha256']=='ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b'
          assert report['bin47_alias_offset']=='0xc5800178'
          assert tested['fps']==[30,60] and tested['swap_ab']
          print('Nonoverlap repair passed all structural, shader and controller tests; iPhone boot must still validate gameplay.')
          PY
      - name: Publish one corrected experimental IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-KTGL-NoOverlap-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ktgl-output/Fairy2iOS-FairyTail2-KTGL-2GiB-NoOverlap.ipa
            ${{ runner.temp }}/ktgl-output/ktgl-nooverlap-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve single failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-KTGL-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/ktgl-output/host-build.log
          if-no-files-found: warn
