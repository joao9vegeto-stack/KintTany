name: Import God of War III iOS source into g3riOS

on:
  push:
    branches: [g3riOS]
    paths:
      - ".github/workflows/import-gow3-ios.yml"

permissions:
  contents: write

concurrency:
  group: g3rios-upstream-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout g3riOS
        uses: actions/checkout@v4
        with:
          ref: g3riOS
          fetch-depth: 0
          persist-credentials: true

      - name: Import exact upstream Git tree
        shell: bash
        run: |
          set -euo pipefail
          git remote add gow3-upstream https://github.com/MohinShaikh5689/god-of-war-3-ios.git
          git fetch --no-tags --depth=1 gow3-upstream main
          git read-tree --reset -u FETCH_HEAD
          test -f README.md
          test -f native/runtime/src/runtime_memory.c
          test -f docs/AUDIT.md
          git status --short

      - name: Commit and push imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KintTany Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Import God of War III iOS upstream into g3riOS"
          git push origin HEAD:g3riOS
