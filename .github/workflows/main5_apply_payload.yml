name: Apply main5 Stats Character

on:
  push:
    branches:
      - main5

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact main5 payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main5
        uses: actions/checkout@v4
        with:
          ref: main5
          fetch-depth: 0

      - name: Reconstruct and verify package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .main5_tmp
          cat .main5_payload_parts/part* > .main5_tmp/payload.b64
          base64 --decode .main5_tmp/payload.b64 > .main5_tmp/payload.tar.xz
          echo "02ac0c5b4e5da621684d2a5b52b561757c0cd680312e225e876139c49ca9e917  .main5_tmp/payload.tar.xz" | sha256sum -c -
          tar -xJf .main5_tmp/payload.tar.xz

          echo "ce4a33ab20321f0575d241abc5a2e7d49858cb12f0310c5a3a28cb77c67dbfc1  KintTany/Core/AppStore.swift" | sha256sum -c -
          echo "f88a351b944b64c0ae302d98a6dc98ae6dd7fc8fa1c8dd4277cb7c3240a99482  KintTany/UI/RootView.swift" | sha256sum -c -
          echo "7692dcc26972a8872f21c8e85e7a780f64313b33dc9e7d21da99e9d5565ca095  KintTanyTests/RealtimeProtocolTests.swift" | sha256sum -c -

      - name: Remove transfer-only files and validate scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .main5_tmp .main5_payload_parts
          rm -f .github/workflows/main5_apply_payload.yml
          git fetch origin main4:refs/remotes/origin/main4

          git diff --name-only origin/main4 -- | sort > /tmp/actual.txt
          printf '%s\n'             'KintTany/Core/AppStore.swift'             'KintTany/UI/RootView.swift'             'KintTanyTests/RealtimeProtocolTests.swift' | sort > /tmp/expected.txt
          echo "Final main5 diff:"
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit main5 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add authenticated character and stats UI"
          git push origin HEAD:main5
