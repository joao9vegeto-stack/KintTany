name: Dante2iOS · bootstrap NX2Apple migration

on:
  push:
    branches: [Dante2iOS]
    paths:
      - "migration/**"
      - ".github/workflows/dante-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: dante2ios-bootstrap
  cancel-in-progress: true

jobs:
  migrate:
    if: github.ref == 'refs/heads/Dante2iOS'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Dante2iOS
          fetch-depth: 0

      - name: Preserve SpkIOSzero work as a non-active reference
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/SpkIOSzero:refs/remotes/origin/SpkIOSzero
          SPK="$RUNNER_TEMP/spkioszero"
          LEGACY="$RUNNER_TEMP/legacy-spkioszero"
          mkdir -p "$LEGACY"/{workflows,colab,scripts,ios-overrides,game-profile}
          git worktree add --detach "$SPK" origin/SpkIOSzero
          copy() {
            local src="$1" dst="$2"
            test -f "$SPK/$src"
            mkdir -p "$LEGACY/$(dirname "$dst")"
            cp "$SPK/$src" "$LEGACY/$dst"
          }
          copy .github/workflows/spk_ios_zero.yml workflows/spk_ios_zero.yml
          copy colab/SpkIOSzero.ipynb colab/SpkIOSzero.ipynb
          copy colab/SpkIOSzero_Corrigido.ipynb colab/SpkIOSzero_Corrigido.ipynb
          copy colab/prepare_spk.py colab/prepare_spk.py
          copy colab/run_spk.py colab/run_spk.py
          copy colab/source_spk.py colab/source_spk.py
          copy scripts/build_spk_shared.py scripts/build_spk_shared.py
          copy scripts/prepare_spk_actions.py scripts/prepare_spk_actions.py
          copy scripts/spk_engine.py scripts/spk_engine.py
          copy dm/ios/tools/build_game_pipeline.py ios-overrides/build_game_pipeline.py
          copy dm/ios/tools/diagnose_spk_crash.py ios-overrides/diagnose_spk_crash.py
          copy dm/ios/tools/build_ipa.sh ios-overrides/build_ipa.sh
          copy dm/ios/Sources/main.m ios-overrides/main.m
          copy dm/games/010035F022078000/.gitkeep game-profile/.gitkeep
          cp migration/DANTE2IOS.md "$LEGACY/README.md"
          git worktree remove "$SPK"
          echo "Preserved $(find "$LEGACY" -type f | wc -l | tr -d ' ') SpkIOSzero reference files."

      - name: Fetch current NX2Apple main source snapshot
        shell: bash
        run: |
          set -euo pipefail
          NX2APPLE_SHA="$(git ls-remote --exit-code https://github.com/LNPANDY/NX2Apple.git refs/heads/main | awk 'NR==1 { print $1 }')"
          if [[ ! "$NX2APPLE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve LNPANDY/NX2Apple main HEAD."
            exit 1
          fi
          echo "NX2APPLE_SHA=$NX2APPLE_SHA" >> "$GITHUB_ENV"
          echo "Resolved LNPANDY/NX2Apple main HEAD: $NX2APPLE_SHA"
          git clone --no-checkout https://github.com/LNPANDY/NX2Apple.git "$RUNNER_TEMP/NX2Apple"
          git -C "$RUNNER_TEMP/NX2Apple" fetch --no-tags --depth=1 origin "$NX2APPLE_SHA"
          git -C "$RUNNER_TEMP/NX2Apple" checkout --detach "$NX2APPLE_SHA"

      - name: Assemble from the verified official NX2Apple snapshot
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/dante-migration"
          mkdir -p "$ASSETS"
          cp migration/DANTE2IOS.md "$ASSETS/DANTE2IOS.md"
          cp migration/dante-engine-validation.yml "$ASSETS/dante-engine-validation.yml"
          cp migration/dante-sync-upstream.yml "$ASSETS/dante-sync-upstream.yml"

          # The official NX2Apple main now has a newer nxnative pin and an
          # extensive, interdependent patch queue. Copy it unmodified; the
          # old migration/0001..0017 mail patches are not its valid ancestors.
          test "$(git -C "$RUNNER_TEMP/NX2Apple" rev-parse HEAD)" = "$NX2APPLE_SHA"
          test -s "$RUNNER_TEMP/NX2Apple/.upstream-ref"
          test -s "$RUNNER_TEMP/NX2Apple/patches/series"
          PINNED_NXNATIVE_SHA="$(tr -d '\\n' < "$RUNNER_TEMP/NX2Apple/.upstream-ref")"
          [[ "$PINNED_NXNATIVE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::NX2Apple snapshot has an invalid pinned nxnative SHA."
            exit 1
          }
          echo "PINNED_NXNATIVE_SHA=$PINNED_NXNATIVE_SHA" >> "$GITHUB_ENV"

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' "$RUNNER_TEMP/NX2Apple/" "$GITHUB_WORKSPACE/"
          mkdir -p legacy/spkioszero .github/workflows
          cp -a "$RUNNER_TEMP/legacy-spkioszero/." legacy/spkioszero/
          cp "$ASSETS/DANTE2IOS.md" DANTE2IOS.md
          printf '%s\n' "$NX2APPLE_SHA" > NX2APPLE_REF

          # Avoid triggering other upstream workflows or SpkIOSzero's build.
          rm -f .github/workflows/*.yml .github/workflows/*.yaml
          cp "$ASSETS/dante-engine-validation.yml" .github/workflows/dante-engine-validation.yml
          cp "$ASSETS/dante-sync-upstream.yml" .github/workflows/dante-sync-upstream.yml
          # Upstream's build/macos and version-integrity tests deliberately
          # validate these two workflow texts. Keep the originals available.
          # Their push triggers target main, not this Dante2iOS branch.
          cp "$RUNNER_TEMP/NX2Apple/.github/workflows/build-mac-app.yml" .github/workflows/build-mac-app.yml
          cp "$RUNNER_TEMP/NX2Apple/.github/workflows/sync-upstream.yml" .github/workflows/sync-upstream.yml
          rm -rf migration

          test "$(cat .upstream-ref)" = "$PINNED_NXNATIVE_SHA"
          test -f patches/0015-host-read-embedded-sections-from-the-image-that.patch
          test -f patches/0017-support-steam-controller-and-shared-mac-control.patch
          grep -Fxq '0017-support-steam-controller-and-shared-mac-control.patch' patches/series
          test -f legacy/spkioszero/README.md
          test ! -e .github/workflows/spk_ios_zero.yml
          test -f .github/workflows/build-mac-app.yml
          test -f .github/workflows/sync-upstream.yml
          echo "Official NX2Apple snapshot: $NX2APPLE_SHA"
          echo "Official nxnative pin: $PINNED_NXNATIVE_SHA"

      - name: Validate and materialize the official pinned nxnative engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .upstream-ref)" = "$PINNED_NXNATIVE_SHA"
          python3 tools/engine.py check
          python3 tools/engine.py sync
          python3 tools/engine.py relink
          test "$(cat .upstream-ref)" = "$PINNED_NXNATIVE_SHA"
          test -d engine/.git

      - name: Verify the migrated source tree (no game extraction or IPA build)
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_REPOSITORY=LNPANDY/NX2Apple python3 -m unittest discover tools/tests
          python3 -m compileall -q engine/scripts engine/dm/tools engine/dm/games engine/dm/mac
          bash -n engine/dm/ios/tools/build_ipa.sh
          test -f engine/dm/ios/Sources/main.m
          test -f engine/dm/games/profile_guess.py
          test -f frontend-ios/Package.swift
          test -f frontend/README.md
          test "$(cat .upstream-ref)" = "$PINNED_NXNATIVE_SHA"
          test -d engine/.git
          ! find . -type f \( -name '*.nsp' -o -name '*.xci' -o -name 'prod.keys' \) -print -quit | grep -q .

      - name: Commit the verified migration to Dante2iOS only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dante2iOS migration"
          git config user.email "dante2ios-migration@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bootstrap Dante2iOS on current NX2Apple with its verified nxnative pin"
          git push origin HEAD:Dante2iOS
