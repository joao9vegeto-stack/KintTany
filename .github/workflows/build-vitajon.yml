name: Build VitaJoN IPA

on:
  push:
    branches:
      - VitaJoN
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitajon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: VitaJoN arm64 iOS
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout VitaJoN branch
        uses: actions/checkout@v4

      - name: Clone pinned Tsubomi source
        run: |
          git clone --recursive https://github.com/125hz/Tsubomi.git source
          git -C source checkout --detach 7e53bac87f442e770a39b1d9b032133418337f6d
          git -C source submodule sync --recursive
          git -C source submodule update --init --recursive

      - name: Apply VitaJoN performance and entitlement patch
        run: |
          chmod +x scripts/apply-vitajon.sh
          ./scripts/apply-vitajon.sh source

      - name: Select Xcode 26
        run: |
          xcode_apps=(/Applications/Xcode_26*.app)
          if [[ ! -d "${xcode_apps[0]}" ]]; then
            echo "::error::Xcode 26 not found"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          selected_xcode="${xcode_apps[${#xcode_apps[@]}-1]}"
          sudo xcode-select --switch "${selected_xcode}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare build dependencies
        run: |
          brew list boost >/dev/null 2>&1 || brew install boost
          brew list python@3.13 >/dev/null 2>&1 || brew install python@3.13
          brew list glslang >/dev/null 2>&1 || brew install glslang
          cmake --version
          glslangValidator --version

      - name: Apply Tsubomi iOS universal-JIT patch
        working-directory: source
        run: |
          git -C external/dynarmic apply --verbose             "${GITHUB_WORKSPACE}/source/ios/patches/0001-oaknut-ios-rwx-jit.patch"
          git -C external/dynarmic diff --check

      - name: Bootstrap pinned vcpkg
        working-directory: source
        run: |
          mkdir -p build-deps
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git build-deps/vcpkg
          git -C build-deps/vcpkg checkout 77df67cfff9c12ccfdb52284e07c87c75092f723
          ./build-deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/source/build-deps/vcpkg" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vitajon-vcpkg-ios-${{ runner.os }}-${{ hashFiles('source/vcpkg.json') }}
          restore-keys: |
            vitajon-vcpkg-ios-${{ runner.os }}-

      - name: Install pinned MoltenVK
        working-directory: source
        run: |
          mkdir -p build-deps/moltenvk
          curl --fail --location --retry 3             --output build-deps/MoltenVK-ios.tar             https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          echo "b5d947b1660e6e9fed40b9cd2387e160aaab9e80b775c0cef7e14059405178c1  build-deps/MoltenVK-ios.tar" | shasum -a 256 --check
          tar -xf build-deps/MoltenVK-ios.tar -C build-deps/moltenvk
          MVK_ROOT="$PWD/build-deps/moltenvk/MoltenVK/MoltenVK"
          echo "VITA3K_IOS_MOLTENVK_LIBRARY=$MVK_ROOT/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" >> "$GITHUB_ENV"
          echo "VITA3K_IOS_MOLTENVK_INCLUDE_DIR=$MVK_ROOT/include" >> "$GITHUB_ENV"

      - name: Restore incremental VitaJoN build cache
        uses: actions/cache@v4
        with:
          path: source/build-ios-upstream
          key: vitajon-build-${{ runner.os }}-xcode26-${{ hashFiles('scripts/apply-vitajon.sh', 'config/VitaJoN.entitlements') }}
          restore-keys: |
            vitajon-build-${{ runner.os }}-xcode26-

      - name: Configure VitaJoN
        working-directory: source
        run: |
          PY313="$(brew --prefix python@3.13)/bin/python3.13"
          cmake -S . -B build-ios-upstream -G Xcode             -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"             -DVCPKG_TARGET_TRIPLET=arm64-ios             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO             -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO             -DVITA3K_BUILD_IOS_UPSTREAM_CORE=ON             -DVITA3K_BUILD_IOS=OFF             -DVITA3K_IOS_DEPLOYMENT_TARGET=26.0             -DVITA3K_IOS_BUNDLE_ID=com.joaopedro.vitajon             -DVITA3K_IOS_LINK_CORE=ON             -DVITA3K_IOS_MOLTENVK_LIBRARY="$VITA3K_IOS_MOLTENVK_LIBRARY"             -DVITA3K_IOS_MOLTENVK_INCLUDE_DIR="$VITA3K_IOS_MOLTENVK_INCLUDE_DIR"             -DPython3_EXECUTABLE="$PY313"             -DVITA3K_FORCE_SYSTEM_BOOST=ON             -DUSE_DISCORD_RICH_PRESENCE=OFF             -DUSE_VITA3K_UPDATE=OFF             -DUSE_LTO=NEVER

      - name: Build Release
        working-directory: source
        run: |
          cmake --build build-ios-upstream             --config Release             --target Vita3KiOS             --             -sdk iphoneos             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO

      - name: Ad-hoc sign with VitaJoN entitlements
        working-directory: source
        run: |
          APP_PATH="$(find build-ios-upstream -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH"
          /usr/bin/codesign --force --sign -             --entitlements ios/VitaJoN.entitlements             --generate-entitlement-der             "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" || true

      - name: Package signed VitaJoN IPA
        working-directory: source
        run: |
          APP_PATH="$(find build-ios-upstream -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf ../ipa-stage ../artifacts
          mkdir -p ../ipa-stage/Payload ../artifacts
          cp -R "$APP_PATH" ../ipa-stage/Payload/
          (
            cd ../ipa-stage
            /usr/bin/zip -qry ../artifacts/VitaJoN.ipa Payload
          )
          test -s ../artifacts/VitaJoN.ipa
          /usr/bin/unzip -t ../artifacts/VitaJoN.ipa
          shasum -a 256 ../artifacts/VitaJoN.ipa

      - name: Upload VitaJoN IPA
        uses: actions/upload-artifact@v4
        with:
          name: VitaJoN-IPA
          path: artifacts/VitaJoN.ipa
          if-no-files-found: error
          retention-days: 14
