name: Fairy2iOS - KTGL PDRK direct IO reference compatibility (NO SHADERS)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/pdrk_direct_io_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-pdrk-direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coherent:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout exact Fairy2iOS head (single workflow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prove coherent 2GiB shared KTGL source, original stream and 5GiB guest root
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .upstream-ref)" = b526a50b85e4cfa3142c111e1ad491d9fd11f0eb
          python3 -m py_compile fairy2/scripts/repack_full_resource_va.py fairy2/scripts/repack_ktgl_coherent_config.py fairy2/scripts/ios_allocator_probe.py
          python3 -m unittest discover -s fairy2/tests -p test_full_resource_va.py -v
          python3 -m unittest discover -s fairy2/tests -p test_ktgl_coherent_config.py -v
          python3 -m unittest discover -s fairy2/tests -p test_confirmed_crash_gate.py -v
          python3 -m unittest discover -s fairy2/tests -p test_ktgl_pdrk_direct_io.py -v
          python3 -m py_compile fairy2/scripts/repack_ktgl_pdrk_direct_io.py fairy2/scripts/repack_ktgl_bounded_arena.py
          python3 -m pip install --disable-pip-version-check 'unicorn>=2.1,<3'
          python3 -m unittest discover -s fairy2/tests -p test_ktgl_bounded_arena.py -v
          python3 -m unittest discover -s fairy2/tests -p test_ktgl_transform_hierarchy.py -v
          python3 -m py_compile fairy2/scripts/ktgl_native_fps.py
          clang -std=c11 -Wall -Wextra -Werror fairy2/tests/test_ktgl_fps_chain.c -o "$RUNNER_TEMP/fairy2-fps-chain"
          "$RUNNER_TEMP/fairy2-fps-chain"
          python3 -m unittest discover -s fairy2/tests -p test_ktgl_fps_pacing.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('fairy2/pdrk_direct_io_trigger.json').read_text())
          assert a['source_run']==44995690307
          assert a['guest_reserve']==0x180000000 and a['guest_alias']==0x158000000
          assert a['new_guest_root']==0x140000000 and a['keep_ktgl']==0x80000000
          assert a['compile_shaders'] is False and a['runtime_resource_diagnostics'] is True
          assert a['strategy']=='pdrk_reference_no_preload_original_native_read'
          assert a['previous_crashed_run']==45348667203
          assert a['cutscene_transform_repair'] is True
          assert a['native_fps_build']=='a588f7bb864aad5fb6a18236878d9216'
          assert a['stable_device_baseline']==45355764268
          assert a['bounded_arena_bytes']==0xc0000000 and a['allocator_growth_guards']==4
          assert a['no_synthetic_stream'] and a['pdrk_only_header_extension']
          assert a['source_artifact_id']==14744355077
          assert a['no_reader_codec_BRK'] is True
          assert a['baseline_run']==44995690307
          print('KTGL 2GiB shared source + 5GiB root proved by source opcodes, NO speculative BRK')
          PY
      - name: Install Xcode host tools and exact pinned NXNative
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          brew list --formula xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m pip install --disable-pip-version-check lz4 'capstone>=5,<6' fonttools zbic backports.zstd google-auth requests
          python3 tools/engine.py relink
          python3 tools/engine.py check
          python3 tools/engine.py sync
          # No old bin47 polling thread: layout has changed and the four
          # actual allocator growth guards enforce the constructor limit.
          grep -q 'DM_CRASH_PEEK' engine/dm/host/crash.c
      - name: Retrieve exact iPhone resource-trap IPA and verify source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 44995690307 -R joao9vegeto-stack/KintTany \
            -n Fairy2iOS-KTGL-NoOverlap-1 -D "$RUNNER_TEMP/source"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['RUNNER_TEMP'])/'source'
          ipa=root/'Fairy2iOS-FairyTail2-KTGL-2GiB-NoOverlap.ipa'
          assert ipa.stat().st_size==1622226531
          sha=hashlib.sha256()
          with ipa.open('rb') as f:
           for chunk in iter(lambda:f.read(8*1024*1024),b''):sha.update(chunk)
          assert sha.hexdigest()=='b1792f9eb522de53b2b252e3a85229584831434999edda98f31c87c7c8c256cd'
          report=json.loads((root/'ktgl-nooverlap-report.json').read_text())
          assert report['output_ipa_sha256']==sha.hexdigest()
          assert report['guest_ktgl_2g_patch']['after_sha256']
          print('Verified exact source with known resource creation failure')
          PY
      - name: PDRK reference header compatibility; original resource pointers and shaders preserved
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          python3 fairy2/scripts/repack_ktgl_bounded_arena.py \
            --source-ipa "$RUNNER_TEMP/source/Fairy2iOS-FairyTail2-KTGL-2GiB-NoOverlap.ipa" \
            --source-report "$RUNNER_TEMP/source/ktgl-nooverlap-report.json" \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/output"
      - name: Verify IPA CRC, original 19,210 shader map, five stubs, FS/crash telemetry, controllers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path('fairy2/colab').resolve()))
          from ipa_validator import validate_ipa
          folder=Path(os.environ['RUNNER_TEMP'])/'output'
          report=json.loads((folder/'ktgl-pdrk-direct-io-report.json').read_text())
          from_p={'framework':'DmGame0100B9801F872000.framework',
            'shader_payload':{'ipa_path':'Frameworks/DmGame0100B9801F872000.framework/msl/b-0724088d3779.img',
                              'size_bytes':2640519506}}
          checked=validate_ipa(folder/report['output_ipa'],from_p,verify_crc=True)
          g=report['global_geometry'];stamp=report['guest_root_5g_patch']
          assert g['guest_reserve']==0x180000000 and g['alias_after']==0x158000000
          assert g['heap_after']==0x8000000 and g['root_after']==0x140000000
          assert g['root_free_after_initial_regions']==0x2ae00000
          assert g['ktgl_child_size']==0xc0000000 and g['new_child_end']==0x42d800000
          assert report['bounded_ktgl_allocator_candidate'] and report['allocator_growth_guard_count']==4
          assert report['transform_hierarchy_repair'] and report['prior_boot_render_verified']
          assert report['native_fps_engine']['pointer_chain']==['0x2c0b558','0x170','0x18c']
          assert report['coherent_ktgl_shared_capacity']['native_fps_source_references']
          assert report['native_fps_engine']['guest_code_modified'] is True
          assert report['native_fps_engine']['dynamic_resolution_modified'] is True
          assert report['native_fps_engine']['present_interval']=='display'
          assert report['native_fps_engine']['fps_readback'] is True
          assert len(report['coherent_ktgl_shared_capacity']['native_drs']['sites'])==2
          assert report['coherent_ktgl_shared_capacity']['native_drs']['slot']=='0x2c53f00'
          assert stamp['w_before_drs_sha256']!=stamp['w_sha256']
          assert report['native_fps_device_verified'] is False
          assert len(report['coherent_ktgl_shared_capacity']['transform_hierarchy']['sites'])==3
          assert stamp['trampoline_count']==5 and stamp['new_root']==0x140000000
          assert stamp['old_cave_all_zeros'] is True
          coherent=report['coherent_ktgl_shared_capacity']
          assert coherent['new_capacity_bytes']==0xc0000000
          assert len(coherent['allocation_bound_guards'])==4
          assert coherent['guest_instruction_changes_after_5g']==5
          assert coherent['no_bypass_of_original_g1t_g1s_parsers'] is True
          assert coherent['no_inflator_or_direct_reader_brk'] is True
          assert report['compiled_guest_reader_codec_traps']==0
          assert report['pdrk_direct_io_candidate'] and report['pdrk_preload_extension_zeroed']
          assert report['pdrk_file_offsets_and_idrk_bytes_unchanged']
          assert report['no_per_resource_fallback'] and report['no_guest_parser_traps']
          assert report['source_archive_proof']['resources']['0xfb9ebd24']['inside_preloaded_prefix']
          assert report['source_archive_proof']['resources']['0xac9ed13e']['inside_preloaded_prefix']
          assert report['gameplay_verified'] is False
          assert report['no_gameplay_claim'] is True
          assert report['host_recompiled'] and report['game_shaders_recompiled'] is False
          assert report['metal_shader_sha256']=='ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b'
          assert report['runtime_fs_trace'] and report['runtime_resource_hash_trace']
          assert report['bin47_alias_offset']=='0x105800178'
          assert checked['fps']==[30,60] and checked['swap_ab']
          with zipfile.ZipFile(folder/report['output_ipa']) as z:
           path='Payload/DmShell.app/Frameworks/DmGame0100B9801F872000.framework/'
           cfg=json.loads(z.read(path+'dm/launcher.json'))
           env={x['env']:x for x in cfg['settings']}
           assert env['DM_PSO_PREPARE']['default']=='0'
           assert env['DM_FS']['default']=='1'
           assert env['DM_CRASH_PEEK']['default']=='x1'
           cfg=z.read(path+'profile.tsv').decode()
           assert 'mem_reserve\t0x180000000' in cfg and 'mem_alias\t0x158000000' in cfg
           assert 'present_interval\tdisplay' in cfg
          print('SHARED KTGL CONFIG candidate verified: original G1T/G1S readers and shaders, device test required.')
          PY
      - name: Publish ONE PDRK direct-IO compatibility candidate, device validation required
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-PDRK-DirectIO-Candidate-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/output/Fairy2iOS-FairyTail2-KTGL-FPSPacing.ipa
            ${{ runner.temp }}/output/ktgl-pdrk-direct-io-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native host build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-PDRK-DirectIO-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/output/host-build.log
          if-no-files-found: warn
