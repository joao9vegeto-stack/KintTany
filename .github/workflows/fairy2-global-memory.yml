name: Fairy2iOS - Global memory audit, correct SVC and guest VA (no shaders)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/global_memory_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-global-mem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  global-memory:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout exactly Fairy2iOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Isolated Python 3.12 for host build and dependencies
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Validate globally coherent profile, ARM64 opcodes and code
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .upstream-ref)" = b526a50b85e4cfa3142c111e1ad491d9fd11f0eb
          python3 -m py_compile fairy2/scripts/repack_global_memory.py
          python3 -m unittest discover -s fairy2/tests -p test_global_memory.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('fairy2/global_memory_trigger.json').read_text())
          assert t['source_run']==44988275455 and t['budget_enabled']
          assert t['guest_alias']==0x118000000 and t['heap']==0x8000000
          assert not t['compile_metal'] and not t['rewrite_game']
          print("Global profile and original crash geometry verified.")
          PY
      - name: Install native host Xcode tools only
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          brew list --formula xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m pip install --disable-pip-version-check lz4 'capstone>=5,<6' fonttools zbic backports.zstd
      - name: Restore pinned NXNative and inspect real SVC budget semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/engine.py relink
          python3 tools/engine.py check
          python3 tools/engine.py sync
          python3 - <<'PY'
          from pathlib import Path
          s=Path('engine/dm/host/hle_svc.c').read_text()
          for x in ('(dm_profile()->mem_map_limit) && num == 0x2C','alias_unmapped(off, size)','used_beside_heap()','device_shared(a, size','regs[0] = 0x10801'):
           assert x in s,x
          t=Path('engine/dm/games/game.py').read_text()
          assert 'mem_map_limit must be on or off' in t
          print("SVC physical accounting, ResultLimitReached, NVN device-shared guards verified.")
          PY
      - name: Download verified last real iPhone IPA and its SHA-backed report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/global-input"
          gh run download 44988275455 -R joao9vegeto-stack/KintTany \
            -n Fairy2iOS-iPhone-root3250-fixed-2 -D "$RUNNER_TEMP/global-input"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'global-input'
          f=r/'Fairy2iOS-FairyTail2-KTGL-3250MiB-root-region.ipa'
          assert f.stat().st_size==1622229855
          h=hashlib.sha256()
          with f.open('rb') as stream:
           for b in iter(lambda:stream.read(8*1024*1024),b''):h.update(b)
          assert h.hexdigest()=='a27f70cbeb1890f103887bcbc93a074b650da032778186ec799f80b2ec63a78b'
          assert json.loads((r/'root3250-report.json').read_text())['guest_root_patch']['new_guest_sha256']
          print("Source IPA and embedded main provenance fully checked.")
          PY
      - name: Rebuild only iOS host SVC and reembed exact ARM64 game, preserve Metal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/global-output"
          python3 fairy2/scripts/repack_global_memory.py \
            --source-ipa "$RUNNER_TEMP/global-input/Fairy2iOS-FairyTail2-KTGL-3250MiB-root-region.ipa" \
            --source-report "$RUNNER_TEMP/global-input/root3250-report.json" \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/global-output"
      - name: Verify IPA CRC, original shaders, map budget, 30-60 and AB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('fairy2/colab').resolve()))
          from ipa_validator import validate_ipa
          d=Path(os.environ['RUNNER_TEMP'])/'global-output'
          r=json.loads((d/'global-memory-report.json').read_text())
          x={'framework':'DmGame0100B9801F872000.framework','shader_payload':{'ipa_path':'Frameworks/DmGame0100B9801F872000.framework/msl/b-0724088d3779.img','size_bytes':2640519506}}
          v=validate_ipa(d/r['output_ipa'],x,verify_crc=True)
          g=r['global_geometry']
          assert g['alias_after']==0x118000000 and g['heap_after']==0x8000000
          assert g['root_after']==0x100000000 and g['mapped_alias_budget']==0xc1500000
          assert r['guest_root_patch']['byte_changes']==10
          assert r['host_recompiled'] and not r['game_shaders_recompiled'] and not r['guest_modules_rewritten']
          assert r['metal_shader_sha256']=='ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b'
          assert v['fps']==[30,60] and v['swap_ab'] and not r['device_boot_verified']
          print("Global corrected IPA structurally verified. Gameplay requires iPhone test.")
          PY
      - name: Publish single global corrected IPA and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-GlobalMemory-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/global-output/Fairy2iOS-FairyTail2-GlobalMemory-4GiB.ipa
            ${{ runner.temp }}/global-output/global-memory-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native-host diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-global-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/global-output/host-build.log
          if-no-files-found: warn
