name: Fairy2iOS - KTGL 32MiB arena align64 IPA repack
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/align64_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-align64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repack:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout Fairy2iOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Gate exact game instruction and skip all compilers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/Fairy2iOS"
          python3 -m py_compile fairy2/scripts/repack_align64.py
          python3 -m unittest discover -s fairy2/tests -p 'test_align64.py' -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("fairy2/align64_trigger.json").read_text())
          assert cfg["source_run_id"]==44981941022
          assert cfg["original_alignment"]==16 and cfg["updated_alignment"]==65536
          assert cfg["compile_shaders"] is False and cfg["compile_host"] is False
          print("Original KTGL MOVZ instruction must match v458752 fingerprint.")
          PY
      - name: Download most recent validated IPA, not failed predecessor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ktgl-source"
          gh run download 44981941022 -R joao9vegeto-stack/KintTany \
            -n Fairy2iOS-128MiB-heap-repack-1 -D "$RUNNER_TEMP/ktgl-source"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["RUNNER_TEMP"])/"ktgl-source"
          ipa=root/"Fairy2iOS-FairyTail2-128MiB-heap-repack.ipa"
          h=hashlib.sha256()
          with ipa.open("rb") as f:
              for chunk in iter(lambda:f.read(8*1024*1024),b""):h.update(chunk)
          assert h.hexdigest()=="d767d485ba1a262e25e8685e646b4686df3321dd43d2edb07394be47313517ad"
          d=json.loads((root/"heap128-report.json").read_text())
          assert d["heap_after_bytes"]==0x8000000
          assert d["five_region_cut_movs_preserved"]
          assert d["game_shaders_recompiled"] is False
          print("Verified original pre-alignment IPA SHA-256:",h.hexdigest())
          PY
      - name: Patch only 32MiB arena allocation alignment to 64KiB and resign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ktgl-output"
          python3 fairy2/scripts/repack_align64.py \
             --source "$RUNNER_TEMP/ktgl-source/Fairy2iOS-FairyTail2-128MiB-heap-repack.ipa" \
             --output "$RUNNER_TEMP/ktgl-output/Fairy2iOS-FairyTail2-64KiB-aligned-allocator.ipa" \
             --report "$RUNNER_TEMP/ktgl-output/align64-report.json"
      - name: Validate exact signed output, shaders, original host, FPS and A/B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ktgl-output"
          rep=json.loads((root/"align64-report.json").read_text())
          sys.path.insert(0,str(Path("fairy2/colab").resolve()))
          from ipa_validator import validate_ipa
          base={"framework":"DmGame0100B9801F872000.framework",
                "shader_payload":{"ipa_path":"Frameworks/DmGame0100B9801F872000.framework/msl/b-0724088d3779.img",
                                  "size_bytes":2640519506}}
          v=validate_ipa(root/rep["output_ipa"],base,verify_crc=True)
          assert v["fps"]==[30,60] and v["swap_ab"]
          assert rep["alloc_alignment_after_bytes"]==65536
          assert rep["arena_alignment_instruction_audit"]["byte_changes"]==3
          assert rep["heap128_mib_patch_preserved"] and rep["five_region_cut_movs_preserved"]
          assert not rep["native_host_recompiled"] and not rep["game_shaders_recompiled"]
          assert rep["game_shader_sha256"]=="ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b"
          assert rep["aligned_arena_32mib_fix_verified"] is False
          print("Validated: one guest MOVZ changes 16 to 65536 alignment; shaders and host unchanged")
          PY
      - name: Publish aligned-allocator IPA only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-KTGL-64KiB-alignment-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ktgl-output/Fairy2iOS-FairyTail2-64KiB-aligned-allocator.ipa
            ${{ runner.temp }}/ktgl-output/align64-report.json
          if-no-files-found: error
          retention-days: 14
