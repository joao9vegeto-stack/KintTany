name: Publish the built Ascension IPA to a temporary link

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful AscensionRecomp M7.82.0 build run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/AscensionRecomp'
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact built IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: AscensionRecomp-M7.82.0-LAUNCHER-ARM64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          path: delivery

      - name: Validate and publish only the IPA
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find delivery -type f -name 'AscensionRecompProbe-7.82.0-unsigned.ipa' -print -quit)"
          test -n "$ipa"
          python3 - "$ipa" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist')
                         for n in z.namelist())
          PY
          curl --fail --silent --show-error --retry 3 \
            -F "file=@${ipa};filename=AscensionRecomp-7.82.0.ipa" \
            https://tmpfiles.org/api/v1/upload > "$RUNNER_TEMP/upload.json"
          python3 - "$RUNNER_TEMP/upload.json" "$RUNNER_TEMP/tmpfiles-page.url" <<'PY'
          import json, pathlib, sys
          response=json.loads(pathlib.Path(sys.argv[1]).read_text())
          page=response['data']['url']
          if not page.startswith('https://tmpfiles.org/'):
              raise SystemExit('unexpected temporary host URL')
          pathlib.Path(sys.argv[2]).write_text(page)
          PY
          curl --fail --silent --show-error --retry 3 \
            "$(cat "$RUNNER_TEMP/tmpfiles-page.url")" -o "$RUNNER_TEMP/tmpfiles-page.html"
          python3 - "$RUNNER_TEMP/upload.json" "$RUNNER_TEMP/tmpfiles-page.html" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import html, json, pathlib, re, sys
          response=json.loads(pathlib.Path(sys.argv[1]).read_text())
          page=response['data']['url']
          markup=pathlib.Path(sys.argv[2]).read_text(errors='replace')
          match=re.search(r'href=["\'](https://tmpfiles\.org/dl/[^"\']+)',markup)
          if not match:
              raise SystemExit('could not find the direct download URL on the temporary page')
          direct=html.unescape(match.group(1))
          with open(sys.argv[3],'a') as f:
              f.write('ipa_page='+page+'\n')
              f.write('ipa_url='+direct+'\n')
          with open(sys.argv[4],'a') as f:
              f.write('IPA direta: '+direct+'\n')
              f.write('Página temporária: '+page+'\n')
          print('Temporary direct IPA URL: '+direct)
          PY
