name: Publish the built Ascension IPA to a temporary link

on:
  push:
    branches:
      - AscensionRecomp
    paths:
      - .publish-ipa-run-id.txt
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful AscensionRecomp M7.85.0 build run ID
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/AscensionRecomp'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
      - name: Read build run ID from branch marker
        id: selected-run
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          marker="$(tr -d '\r\n' < .publish-ipa-run-id.txt)"
          if [[ "$marker" == CLEANUP_ONLY* ]]; then
            echo "mode=cleanup" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id="$(printf '%s' "$marker" | tr -cd '0-9')"
          test -n "$run_id"
          echo "mode=publish" >> "$GITHUB_OUTPUT"
          echo "value=$run_id" >> "$GITHUB_OUTPUT"
      - name: Confirm source run succeeded on AscensionRecomp
        if: github.event_name == 'workflow_dispatch' || steps.selected-run.outputs.mode == 'publish'
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id || steps.selected-run.outputs.value }}
        with:
          script: |
            const id = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(id)) throw new Error("Invalid build run ID");
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: id
            });
            if (run.head_branch !== "AscensionRecomp" || run.conclusion !== "success" ||
                run.path !== ".github/workflows/ascension-recomp-m0.yml") {
              throw new Error("Source run is not a successful AscensionRecomp M7.85 build");
            }
      - name: Download the exact built IPA artifact
        if: github.event_name == 'workflow_dispatch' || steps.selected-run.outputs.mode == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: AscensionRecomp-M7.85.0-LAUNCHER-ARM64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || steps.selected-run.outputs.value }}
          path: delivery

      - name: Validate and publish only the IPA
        id: publish
        if: github.event_name == 'workflow_dispatch' || steps.selected-run.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find delivery -type f -name 'AscensionRecompProbe-7.85.0-unsigned.ipa' -print -quit)"
          test -n "$ipa"
          python3 - "$ipa" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist')
                         for n in z.namelist())
          PY
          # Litterbox retains the original .ipa suffix and expires after 72 hours.
          curl --fail --silent --show-error --retry 3 \
            -F 'reqtype=fileupload' \
            -F 'time=72h' \
            -F "fileToUpload=@${ipa};filename=AscensionRecomp-7.85.0.ipa" \
            https://litterbox.catbox.moe/resources/internals/api.php \
            -o "$RUNNER_TEMP/ipa-url.txt"
          ipa_url="$(tr -d '\r\n' < "$RUNNER_TEMP/ipa-url.txt")"
          [[ "$ipa_url" =~ ^https://litter\.catbox\.moe/[A-Za-z0-9._-]+\.ipa$ ]]
          curl --fail --silent --show-error --location --range 0-0 \
            --dump-header "$RUNNER_TEMP/ipa-download-headers.txt" \
            "$ipa_url" -o "$RUNNER_TEMP/ipa-first-byte"
          test "$(wc -c < "$RUNNER_TEMP/ipa-first-byte" | tr -d ' ')" -eq 1
          test "$(cat "$RUNNER_TEMP/ipa-first-byte")" = "P"
          grep -Eiq 'content-disposition:.*AscensionRecomp-7\.85\.0\.ipa' \
            "$RUNNER_TEMP/ipa-download-headers.txt"
          printf 'ipa_url=%s\n' "$ipa_url" >> "$GITHUB_OUTPUT"
          {
            echo "IPA temporário (72 horas): $ipa_url"
            echo "Nome conferido: AscensionRecomp-7.85.0.ipa"
            echo "Arquivo validado como IPA: ZIP íntegro com Payload/*.app/Info.plist."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary direct IPA URL: $ipa_url"
      - name: Delete the redundant GitHub IPA artifact after publishing
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id || steps.selected-run.outputs.value }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100
            });
            const artifact = data.artifacts.find(a => a.name === "AscensionRecomp-M7.85.0-LAUNCHER-ARM64");
            if (artifact) {
              await github.rest.actions.deleteArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id});
              core.notice("Deleted the duplicate Actions IPA artifact after external upload.");
            } else {
              core.notice("No matching Actions IPA artifact remained to delete.");
            }
      - name: Remove uploaded media and game archives from AscensionRecomp history
        if: steps.selected-run.outputs.mode == 'cleanup' || steps.publish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          filter_script="$RUNNER_TEMP/git-filter-repo"
          curl --fail --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/newren/git-filter-repo/v2.47.0/git-filter-repo \
            -o "$filter_script"
          chmod 755 "$filter_script"
          rewrite="$RUNNER_TEMP/ascension-history-clean"
          git clone --quiet --branch AscensionRecomp --single-branch --no-tags \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$rewrite"
          old_head="$(git -C "$rewrite" rev-parse refs/heads/AscensionRecomp)"
          if [[ "$(git -C "$rewrite" rev-parse --is-shallow-repository)" == true ]]; then
            git -C "$rewrite" fetch --unshallow origin refs/heads/AscensionRecomp
          fi
          history_count="$(git -C "$rewrite" rev-list --count HEAD)"
          echo "Branch commits loaded for history cleanup: $history_count"
          test "$history_count" -gt 1
          (
            cd "$rewrite"
            "$filter_script" --force --invert-paths \
              --path-glob '*.mov' --path-glob '*.MOV' --path-glob '*.ips' \
              --path-glob '*.jpg' --path-glob '*.JPG' \
              --path '7.79.zip' --path 'Arquivo.zip' --path 'arquivos.zip' \
              --path '.publish-ipa-run-id.txt'
          )
          if git -C "$rewrite" rev-list --objects HEAD | \
              awk '$2 ~ /\.(mov|MOV|ips|jpg|JPG)$/ {found=1; print} END {exit !found}'; then
            echo 'Uploaded captures remain in rewritten branch history' >&2
            exit 1
          fi
          if git -C "$rewrite" rev-list --objects HEAD | \
              grep -E ' (7\.79\.zip|Arquivo\.zip|arquivos\.zip|\.publish-ipa-run-id\.txt)$'; then
            echo 'Uploaded archive or delivery marker remains in rewritten branch history' >&2
            exit 1
          fi
          git -C "$rewrite" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$rewrite" push --quiet \
            --force-with-lease="refs/heads/AscensionRecomp:$old_head" \
            origin HEAD:refs/heads/AscensionRecomp
          echo "Branch history rewritten and uploaded media removed. New HEAD: $(git -C "$rewrite" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
