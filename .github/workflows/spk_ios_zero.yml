name: 1. Build ExtractorNS App IPA (v3.3)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
    paths:
      - '.github/workflows/spk_ios_zero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_extractor_ns:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 1. Checkout da Branch SpkIOSzero
        uses: actions/checkout@v4

      - name: 2. Instalar .NET 9 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          chmod +x "$RUNNER_TEMP/dotnet-install.sh"
          "$RUNNER_TEMP/dotnet-install.sh" --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: 3. Compilar ExtractorNS.ipa v3.3
        run: |
          export PATH="$HOME/.dotnet:$PATH"

          if [ ! -f "dm/tools/nx_extract/Program.cs" ]; then
            git clone --depth 1 https://github.com/seedds/nxnative.git "$RUNNER_TEMP/nx_up"
            mkdir -p dm/tools/nx_extract
            cp "$RUNNER_TEMP/nx_up/dm/tools/nx_extract/Program.cs" dm/tools/nx_extract/Program.cs
          fi

          mkdir -p "$RUNNER_TEMP/nx_ios"
          cp dm/tools/nx_extract/Program.cs "$RUNNER_TEMP/nx_ios/Program.cs"

          cat > "$RUNNER_TEMP/nx_ios/nx_extract.csproj" << 'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net9.0</TargetFramework>
              <PublishAot>true</PublishAot>
              <PublishAotUsingRuntimePack>true</PublishAotUsingRuntimePack>
              <NativeLib>Shared</NativeLib>
              <Nullable>disable</Nullable>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <InvariantGlobalization>true</InvariantGlobalization>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="LibHac" Version="0.19.0" />
            </ItemGroup>
          </Project>
          EOF

          python3 - << 'PYEOF'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "nx_ios" / "Program.cs"
          code = p.read_text(encoding="utf-8")
          entry = """
              [System.Runtime.InteropServices.UnmanagedCallersOnly(EntryPoint = "ios_libhac_inspect")]
              public static int IosLibHacInspect(IntPtr keysPtr, IntPtr pkgPtr, IntPtr outTsvPtr, IntPtr outIconPtr) {
                  try {
                      string k = System.Runtime.InteropServices.Marshal.PtrToStringUTF8(keysPtr);
                      string pkg = System.Runtime.InteropServices.Marshal.PtrToStringUTF8(pkgPtr);
                      string outTsv = System.Runtime.InteropServices.Marshal.PtrToStringUTF8(outTsvPtr);
                      string outIcon = outIconPtr != IntPtr.Zero ? System.Runtime.InteropServices.Marshal.PtrToStringUTF8(outIconPtr) : null;

                      KeySet ks = ExternalKeyReader.ReadKeyFile(k);
                      using var file = new LocalStorage(pkg, FileAccess.Read);
                      var pfs = new PartitionFileSystem();
                      if (pfs.Initialize(file).IsFailure()) return 2;

                      ulong foundTid = 0;
                      bool hasPatchNca = false;
                      bool hasAppNca = false;
                      bool hasAocNca = false;
                      string gameName = "";

                      foreach (var entry in pfs.EnumerateEntries("/", "*.nca")) {
                          using var ncaFile = new UniqueRef<IFile>();
                          if (pfs.OpenFile(ref ncaFile.Ref, entry.FullPath.ToU8Span(), OpenMode.Read).IsFailure()) continue;
                          var nca = new Nca(ks, ncaFile.Release().AsStorage());
                          ulong tid = nca.Header.TitleId;
                          if (tid != 0) {
                              ulong low = tid & 0xFFFUL;
                              if (low == 0x800UL) {
                                  hasPatchNca = true;
                                  foundTid = tid & ~0xFFFUL;
                              } else if (low != 0x000UL) {
                                  hasAocNca = true;
                                  foundTid = (tid & ~0xFFFUL) - 0x1000UL;
                              } else {
                                  hasAppNca = true;
                                  foundTid = tid;
                              }
                          }
                          if (nca.Header.ContentType == NcaContentType.Control) {
                              try {
                                  IFileSystem ctrlFs = nca.OpenFileSystem(NcaSectionType.Data, IntegrityCheckLevel.None);
                                  using var nacpFile = new UniqueRef<IFile>();
                                  if (ctrlFs.OpenFile(ref nacpFile.Ref, "/control.nacp".ToU8Span(), OpenMode.Read).IsSuccess()) {
                                      byte[] nacp = new byte[0x4000];
                                      nacpFile.Get.Read(out long _, 0, nacp);
                                      for (int lang = 0; lang < 16; lang++) {
                                          int off = lang * 0x300;
                                          int len = 0;
                                          while (len < 0x200 && nacp[off + len] != 0) len++;
                                          if (len > 0) {
                                              gameName = System.Text.Encoding.UTF8.GetString(nacp, off, len).Trim();
                                              break;
                                          }
                                      }
                                  }
                                  if (!string.IsNullOrEmpty(outIcon) && !File.Exists(outIcon)) {
                                      foreach (var ic in ctrlFs.EnumerateEntries("/", "icon_*.dat")) {
                                          using var icFile = new UniqueRef<IFile>();
                                          if (ctrlFs.OpenFile(ref icFile.Ref, ic.FullPath.ToU8Span(), OpenMode.Read).IsSuccess()) {
                                              icFile.Get.GetSize(out long sz);
                                              if (sz > 0 && sz < 512 * 1024) {
                                                  byte[] buf = new byte[sz];
                                                  icFile.Get.Read(out long _, 0, buf);
                                                  File.WriteAllBytes(outIcon, buf);
                                                  break;
                                              }
                                          }
                                      }
                                  }
                              } catch { }
                          }
                      }
                      string kind = hasPatchNca ? "Patch" : (hasAppNca ? "Application" : (hasAocNca ? "AddOnContent" : "Unknown"));
                      if (foundTid != 0) {
                          File.WriteAllText(outTsv, $"{kind}\\t{foundTid:X16}\\t{gameName}");
                          return 0;
                      }
                      return 2;
                  } catch {
                      return 1;
                  }
              }

              [System.Runtime.InteropServices.UnmanagedCallersOnly(EntryPoint = "ios_libhac_extract")]
              public static int IosLibHacExtract(IntPtr keysPtr, IntPtr basePtr, IntPtr updPtr, IntPtr outDirPtr, int mode) {
                  try {
                      g_damaged.Clear();
                      g_lenient = null;
                      g_lenientFs = null;
                      string k = System.Runtime.InteropServices.Marshal.PtrToStringUTF8(keysPtr);
                      string b = System.Runtime.InteropServices.Marshal.PtrToStringUTF8(basePtr);
                      string u = updPtr != IntPtr.Zero ? System.Runtime.InteropServices.Marshal.PtrToStringUTF8(updPtr) : "-";
                      string o = System.Runtime.InteropServices.Marshal.PtrToStringUTF8(outDirPtr);
                      if (mode == 1) return Main(new string[] { k, "--aoc", b, o, "--allow-damaged" });
                      if (mode == 2) return Main(new string[] { k, b, u, o, "--manifest", "--allow-damaged" });
                      return Main(new string[] { k, b, u, o, "--allow-damaged" });
                  } catch (Exception e) {
                      Console.Error.WriteLine(e.ToString());
                      return 1;
                  }
              }
          """
          if "ios_libhac_extract" not in code:
              code = code.replace("static int Main(string[] a) {", entry + "\n    static int Main(string[] a) {", 1)
              p.write_text(code, encoding="utf-8")
          PYEOF

          dotnet publish -r ios-arm64 -c Release "$RUNNER_TEMP/nx_ios/nx_extract.csproj" -o "$RUNNER_TEMP/libhac_ios"

          APP_DIR="$RUNNER_TEMP/Payload/ExtractorNS.app"
          FW_DIR="$APP_DIR/Frameworks/nx_extract.framework"
          mkdir -p "$FW_DIR"
          cp "$RUNNER_TEMP/libhac_ios/nx_extract.dylib" "$FW_DIR/nx_extract"
          install_name_tool -id @rpath/nx_extract.framework/nx_extract "$FW_DIR/nx_extract"

          cat > "$FW_DIR/Info.plist" << 'FWPLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>nx_extract</string>
            <key>CFBundleIdentifier</key><string>com.kinttany.extractorns.libhac</string>
            <key>CFBundleName</key><string>nx_extract</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>17.0</string>
          </dict>
          </plist>
          FWPLIST

          mkdir -p "$RUNNER_TEMP/IconGen"
          cat > "$RUNNER_TEMP/IconGen/gen_icon.m" << 'ICONEOF'
          #import <Foundation/Foundation.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <ImageIO/ImageIO.h>

          static void save_icon(NSString *path, int sz) {
              CGColorSpaceRef cs = CGColorSpaceCreateDeviceRGB();
              CGContextRef ctx = CGBitmapContextCreate(NULL, sz, sz, 8, sz * 4, cs, kCGImageAlphaPremultipliedLast);
              CGFloat s = (CGFloat)sz / 1024.0;
              CGContextSetRGBFillColor(ctx, 0.07, 0.08, 0.11, 1.0);
              CGContextFillRect(ctx, CGRectMake(0, 0, sz, sz));
              CGContextSetRGBFillColor(ctx, 0.0, 0.765, 0.890, 1.0);
              CGContextFillRect(ctx, CGRectMake(0, 0, sz * 0.5, sz));
              CGContextSetRGBFillColor(ctx, 1.0, 0.235, 0.157, 1.0);
              CGContextFillRect(ctx, CGRectMake(sz * 0.5, 0, sz * 0.5, sz));
              CGFloat pad = 92.0 * s;
              CGRect card = CGRectMake(pad, pad, sz - pad * 2, sz - pad * 2);
              CGPathRef cardPath = CGPathCreateWithRoundedRect(card, 180.0 * s, 180.0 * s, NULL);
              CGContextAddPath(ctx, cardPath);
              CGContextSetRGBFillColor(ctx, 0.09, 0.10, 0.14, 0.92);
              CGContextFillPath(ctx);
              CGPathRelease(cardPath);
              CGImageRef img = CGBitmapContextCreateImage(ctx);
              CFURLRef url = (__bridge CFURLRef)[NSURL fileURLWithPath:path];
              CGImageDestinationRef dest = CGImageDestinationCreateWithURL(url, CFSTR("public.png"), 1, NULL);
              CGImageDestinationAddImage(dest, img, NULL);
              CGImageDestinationFinalize(dest);
              CFRelease(dest);
              CGImageRelease(img);
              CGContextRelease(ctx);
              CGColorSpaceRelease(cs);
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  NSString *outDir = [NSString stringWithUTF8String:argv[1]];
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon60x60@2x.png"], 120);
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon60x60@3x.png"], 180);
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon1024.png"], 1024);
              }
              return 0;
          }
          ICONEOF

          clang -fobjc-arc "$RUNNER_TEMP/IconGen/gen_icon.m" -framework Foundation -framework CoreGraphics -framework ImageIO -o "$RUNNER_TEMP/IconGen/gen_icon"
          "$RUNNER_TEMP/IconGen/gen_icon" "$APP_DIR"

          mkdir -p "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset"
          cp "$APP_DIR/AppIcon60x60@2x.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_120.png"
          cp "$APP_DIR/AppIcon60x60@3x.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_180.png"
          cp "$APP_DIR/AppIcon1024.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_1024.png"
          cat > "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/Contents.json" << 'JSONEOF'
          {
            "images" : [
              { "filename" : "icon_120.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "icon_180.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "icon_1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

          xcrun actool "$RUNNER_TEMP/Assets.xcassets" \
            --compile "$APP_DIR" \
            --platform iphoneos \
            --minimum-deployment-target 17.0 \
            --app-icon AppIcon \
            --output-partial-info-plist "$RUNNER_TEMP/assetcatalog_info.plist" || true

          mkdir -p "$RUNNER_TEMP/ExtractorApp"
          cat > "$RUNNER_TEMP/ExtractorApp/main.m" << 'OBJCEOF'
          #import <UIKit/UIKit.h>
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <zlib.h>

          typedef int (*ios_libhac_extract_fn)(const char *keys, const char *base_nsp, const char *upd_nsp, const char *out_dir, int mode);
          typedef int (*ios_libhac_inspect_fn)(const char *keys, const char *pkg, const char *out_tsv, const char *out_icon);

          static void *get_libhac_handle(void) {
              static void *h = NULL;
              if (!h) {
                  NSString *p = [[NSBundle mainBundle].bundlePath stringByAppendingPathComponent:@"Frameworks/nx_extract.framework/nx_extract"];
                  h = dlopen(p.fileSystemRepresentation, RTLD_NOW);
              }
              return h;
          }

          static ios_libhac_extract_fn get_extractor(void) {
              void *h = get_libhac_handle();
              return h ? (ios_libhac_extract_fn)dlsym(h, "ios_libhac_extract") : NULL;
          }

          static ios_libhac_inspect_fn get_inspect_fn(void) {
              void *h = get_libhac_handle();
              return h ? (ios_libhac_inspect_fn)dlsym(h, "ios_libhac_inspect") : NULL;
          }

          #pragma pack(push, 1)
          struct zip_lfh { uint32_t sig; uint16_t ver, flags, method, mtime, mdate; uint32_t crc, csize, usize; uint16_t nlen, elen; };
          struct zip_cdh { uint32_t sig; uint16_t vmade, vext, flags, method, mtime, mdate; uint32_t crc, csize, usize; uint16_t nlen, elen, clen, disk, iattr; uint32_t eattr, off; };
          struct zip_eocd { uint32_t sig; uint16_t disk, cd_disk, entries_disk, entries_total; uint32_t cd_size, cd_off; uint16_t comment_len; };
          #pragma pack(pop)

          static BOOL build_zip_file(NSString *srcDir, NSString *zipPath) {
              NSFileManager *fm = NSFileManager.defaultManager;
              [fm removeItemAtPath:zipPath error:nil];
              FILE *zf = fopen(zipPath.fileSystemRepresentation, "wb");
              if (!zf) return NO;
              NSMutableData *cd = [NSMutableData data];
              uint16_t count = 0;
              NSDirectoryEnumerator *en = [fm enumeratorAtPath:srcDir];
              NSString *rel = nil;
              while ((rel = [en nextObject])) {
                  NSString *full = [srcDir stringByAppendingPathComponent:rel];
                  NSDictionary *attr = [fm attributesOfItemAtPath:full error:nil];
                  if (![attr.fileType isEqualToString:NSFileTypeRegular]) continue;
                  NSData *data = [NSData dataWithContentsOfFile:full options:NSDataReadingMappedIfSafe error:nil];
                  if (!data || data.length > 0xFFFFFFFFULL) continue;
                  const char *name = rel.UTF8String;
                  uint16_t nlen = (uint16_t)strlen(name);
                  uint32_t usize = (uint32_t)data.length;
                  uint32_t crc = (uint32_t)crc32(0L, (const Bytef *)data.bytes, usize);
                  uint32_t off = (uint32_t)ftell(zf);
                  struct zip_lfh lfh = {0x04034b50, 20, 0x0800, 0, 0, 0x21, crc, usize, usize, nlen, 0};
                  fwrite(&lfh, sizeof(lfh), 1, zf);
                  fwrite(name, 1, nlen, zf);
                  if (usize) fwrite(data.bytes, 1, usize, zf);
                  struct zip_cdh cdh = {0x02014b50, 20, 20, 0x0800, 0, 0, 0x21, crc, usize, usize, nlen, 0, 0, 0, 0, 0, off};
                  [cd appendBytes:&cdh length:sizeof(cdh)];
                  [cd appendBytes:name length:nlen];
                  count++;
              }
              uint32_t cdOff = (uint32_t)ftell(zf);
              if (cd.length) fwrite(cd.bytes, 1, cd.length, zf);
              struct zip_eocd eocd = {0x06054b50, 0, 0, count, count, (uint32_t)cd.length, cdOff, 0};
              fwrite(&eocd, sizeof(eocd), 1, zf);
              fclose(zf);
              return count > 0;
          }

          static BOOL should_include_in_universal_kit(NSString *relPath, unsigned long long fileSize) {
              NSString *low = relPath.lowercaseString;
              NSArray<NSString *> *exts = @[
                  @".ushaderbytecode", @".upipelinecache", @".utoc", @".ini", @".uproject", @".uplugin",
                  @".bnsh", @".fsh", @".vsh", @".csh", @".gsh", @".spv", @".spirv", @".glsl", @".hlsl",
                  @".nson", @".trs", @".trpfd", @".trpfs", @".bntx", @".byml", @".bgyml", @".zs"
              ];
              for (NSString *e in exts) {
                  if ([low hasSuffix:e] && fileSize <= 200ULL * 1024ULL * 1024ULL) return YES;
              }
              if (([low containsString:@"shader"] || [low containsString:@"boot.romfs"] || [low containsString:@"global-metadata.dat"]) &&
                  fileSize <= 250ULL * 1024ULL * 1024ULL) {
                  return YES;
              }
              if ([low hasSuffix:@".pak"] && fileSize <= 128ULL * 1024ULL * 1024ULL) return YES;
              return NO;
          }

          #define NS_BG_COLOR      [UIColor colorWithRed:0.11 green:0.12 blue:0.15 alpha:1.0]
          #define NS_CARD_COLOR    [UIColor colorWithRed:0.16 green:0.18 blue:0.22 alpha:1.0]
          #define NS_BLUE_COLOR    [UIColor colorWithRed:0.00 green:0.76 blue:0.89 alpha:1.0]
          #define NS_RED_COLOR     [UIColor colorWithRed:1.00 green:0.24 blue:0.16 alpha:1.0]
          #define NS_CYAN_GLOW     [UIColor colorWithRed:0.00 green:0.96 blue:0.83 alpha:1.0]

          @interface ExtractorVC : UIViewController
          @property (nonatomic, strong) UILabel *keysBadge;
          @property (nonatomic, strong) UILabel *pkgsBadge;
          @property (nonatomic, strong) UILabel *gamesBadge;
          @property (nonatomic, strong) UIScrollView *carousel;
          @property (nonatomic, strong) UIProgressView *progressBar;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UITextView *logView;
          @property (nonatomic, strong) UIButton *extractBtn;
          @property (nonatomic, strong) UIButton *scanBtn;
          @property (nonatomic, strong) NSMutableDictionary<NSString *, NSMutableDictionary *> *detectedGames;
          @property (nonatomic, copy) NSString *detectedKeysPath;
          @end

          @implementation ExtractorVC

          - (UIStatusBarStyle)preferredStatusBarStyle { return UIStatusBarStyleLightContent; }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = NS_BG_COLOR;
              self.detectedGames = [NSMutableDictionary dictionary];

              CGFloat w = self.view.bounds.size.width;
              CGFloat h = self.view.bounds.size.height;

              UIView *leftRail = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 5, h)];
              leftRail.autoresizingMask = UIViewAutoresizingFlexibleHeight | UIViewAutoresizingFlexibleRightMargin;
              leftRail.backgroundColor = NS_BLUE_COLOR;
              [self.view addSubview:leftRail];

              UIView *rightRail = [[UIView alloc] initWithFrame:CGRectMake(w - 5, 0, 5, h)];
              rightRail.autoresizingMask = UIViewAutoresizingFlexibleHeight | UIViewAutoresizingFlexibleLeftMargin;
              rightRail.backgroundColor = NS_RED_COLOR;
              [self.view addSubview:rightRail];

              UIView *header = [[UIView alloc] initWithFrame:CGRectMake(16, 54, w - 32, 60)];
              header.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              header.backgroundColor = NS_CARD_COLOR;
              header.layer.cornerRadius = 16;
              [self.view addSubview:header];

              UIView *joyIcon = [[UIView alloc] initWithFrame:CGRectMake(14, 12, 36, 36)];
              joyIcon.layer.cornerRadius = 10;
              joyIcon.clipsToBounds = YES;
              UIView *jl = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 18, 36)];
              jl.backgroundColor = NS_BLUE_COLOR;
              UIView *jr = [[UIView alloc] initWithFrame:CGRectMake(18, 0, 18, 36)];
              jr.backgroundColor = NS_RED_COLOR;
              [joyIcon addSubview:jl];
              [joyIcon addSubview:jr];
              UILabel *nsLbl = [[UILabel alloc] initWithFrame:joyIcon.bounds];
              nsLbl.text = @"NS";
              nsLbl.textColor = UIColor.whiteColor;
              nsLbl.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBlack];
              nsLbl.textAlignment = NSTextAlignmentCenter;
              [joyIcon addSubview:nsLbl];
              [header addSubview:joyIcon];

              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(60, 10, w - 180, 22)];
              title.text = @"ExtractorNS";
              title.textColor = UIColor.whiteColor;
              title.font = [UIFont systemFontOfSize:20 weight:UIFontWeightHeavy];
              [header addSubview:title];

              UILabel *sub = [[UILabel alloc] initWithFrame:CGRectMake(60, 33, w - 180, 14)];
              sub.text = @"NINTENDO SWITCH ➔ iOS NATIVE";
              sub.textColor = NS_CYAN_GLOW;
              sub.font = [UIFont systemFontOfSize:9.5 weight:UIFontWeightBold];
              [header addSubview:sub];

              self.scanBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.scanBtn.frame = CGRectMake(header.bounds.size.width - 94, 13, 82, 34);
              self.scanBtn.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
              self.scanBtn.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.10];
              self.scanBtn.layer.cornerRadius = 10;
              [self.scanBtn setTitle:@"↻ Scan" forState:UIControlStateNormal];
              [self.scanBtn setTitleColor:NS_CYAN_GLOW forState:UIControlStateNormal];
              self.scanBtn.titleLabel.font = [UIFont boldSystemFontOfSize:13];
              [self.scanBtn addTarget:self action:@selector(scanLibrary) forControlEvents:UIControlEventTouchUpInside];
              [header addSubview:self.scanBtn];

              CGFloat pillW = (w - 48) / 3.0;
              self.keysBadge = [self makeStatusPillWithFrame:CGRectMake(16, 122, pillW, 42) title:@"PROD.KEYS" value:@"Verificando..."];
              self.pkgsBadge = [self makeStatusPillWithFrame:CGRectMake(24 + pillW, 122, pillW, 42) title:@"ARQUIVOS" value:@"0 NSP/XCI"];
              self.gamesBadge = [self makeStatusPillWithFrame:CGRectMake(32 + pillW * 2, 122, pillW, 42) title:@"JOGOS" value:@"0 Prontos"];

              self.carousel = [[UIScrollView alloc] initWithFrame:CGRectMake(16, 174, w - 32, 88)];
              self.carousel.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              self.carousel.showsHorizontalScrollIndicator = NO;
              [self.view addSubview:self.carousel];

              self.statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 270, w - 40, 16)];
              self.statusLabel.text = @"Lendo metadados NACP/CNMT dos pacotes...";
              self.statusLabel.textColor = NS_CYAN_GLOW;
              self.statusLabel.font = [UIFont systemFontOfSize:11.5 weight:UIFontWeightSemibold];
              [self.view addSubview:self.statusLabel];

              self.progressBar = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
              self.progressBar.frame = CGRectMake(20, 292, w - 40, 5);
              self.progressBar.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              self.progressBar.trackTintColor = NS_CARD_COLOR;
              self.progressBar.progressTintColor = NS_CYAN_GLOW;
              self.progressBar.progress = 0.0;
              [self.view addSubview:self.progressBar];

              self.logView = [[UITextView alloc] initWithFrame:CGRectMake(16, 306, w - 32, h - 398)];
              self.logView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.logView.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.10 alpha:1.0];
              self.logView.textColor = [UIColor colorWithRed:0.75 green:0.88 blue:0.95 alpha:1.0];
              self.logView.font = [UIFont monospacedSystemFontOfSize:11.5 weight:UIFontWeightRegular];
              self.logView.layer.cornerRadius = 14;
              self.logView.editable = NO;
              self.logView.textContainerInset = UIEdgeInsetsMake(10, 10, 10, 10);
              self.logView.text = @"[ExtractorNS v3.3 — Suporte Total XCI + NSP + Base/Update/DLCs]\n";
              [self.view addSubview:self.logView];

              self.extractBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.extractBtn.frame = CGRectMake(16, h - 78, w - 32, 52);
              self.extractBtn.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleTopMargin;
              self.extractBtn.backgroundColor = NS_RED_COLOR;
              self.extractBtn.layer.cornerRadius = 14;
              [self.extractBtn setTitle:@"⚡ EXTRAIR JOGOS + GERAR GITHUB KIT" forState:UIControlStateNormal];
              [self.extractBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.extractBtn.titleLabel.font = [UIFont systemFontOfSize:15 weight:UIFontWeightHeavy];
              [self.extractBtn addTarget:self action:@selector(runExtract) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.extractBtn];

              [self scanLibrary];
          }

          - (UILabel *)makeStatusPillWithFrame:(CGRect)f title:(NSString *)t value:(NSString *)v {
              UIView *box = [[UIView alloc] initWithFrame:f];
              box.backgroundColor = NS_CARD_COLOR;
              box.layer.cornerRadius = 12;
              [self.view addSubview:box];

              UILabel *tl = [[UILabel alloc] initWithFrame:CGRectMake(8, 5, f.size.width - 16, 12)];
              tl.text = t;
              tl.textColor = [UIColor colorWithWhite:0.6 alpha:1.0];
              tl.font = [UIFont systemFontOfSize:9 weight:UIFontWeightBold];
              [box addSubview:tl];

              UILabel *vl = [[UILabel alloc] initWithFrame:CGRectMake(8, 19, f.size.width - 16, 18)];
              vl.text = v;
              vl.textColor = UIColor.whiteColor;
              vl.font = [UIFont systemFontOfSize:12 weight:UIFontWeightBold];
              [box addSubview:vl];
              return vl;
          }

          - (void)log:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  self.logView.text = [self.logView.text stringByAppendingFormat:@"%@\n", msg];
                  if (self.logView.text.length > 1) {
                      [self.logView scrollRangeToVisible:NSMakeRange(self.logView.text.length - 1, 1)];
                  }
              });
          }

          - (void)rebuildCarousel {
              for (UIView *sub in self.carousel.subviews) [sub removeFromSuperview];
              CGFloat fullW = self.carousel.bounds.size.width;
              if (self.detectedGames.count == 0) return;

              CGFloat x = 0;
              CGFloat cardW = (self.detectedGames.count == 1) ? fullW : 310;
              for (NSString *key in self.detectedGames) {
                  NSDictionary *g = self.detectedGames[key];
                  NSString *name = g[@"name"] ?: key;
                  NSString *tid = g[@"tid"] ?: @"N/A";
                  NSString *folder = g[@"folder"] ?: @"Raiz";
                  NSString *iconPath = g[@"icon"];
                  BOOL hasBase = (g[@"base"] != nil);
                  BOOL hasUpd = (g[@"upd"] != nil);
                  NSUInteger dlcCount = [g[@"dlcs"] count];

                  UIView *card = [[UIView alloc] initWithFrame:CGRectMake(x, 2, cardW, 84)];
                  card.backgroundColor = NS_CARD_COLOR;
                  card.layer.cornerRadius = 14;
                  card.layer.borderWidth = 2.0;
                  card.layer.borderColor = NS_CYAN_GLOW.CGColor;

                  UIImageView *imgV = [[UIImageView alloc] initWithFrame:CGRectMake(10, 10, 64, 64)];
                  imgV.backgroundColor = [UIColor colorWithWhite:0.08 alpha:1.0];
                  imgV.layer.cornerRadius = 10;
                  imgV.clipsToBounds = YES;
                  imgV.contentMode = UIViewContentModeScaleAspectFill;
                  if (iconPath && [NSFileManager.defaultManager fileExistsAtPath:iconPath]) {
                      imgV.image = [UIImage imageWithContentsOfFile:iconPath];
                  }
                  [card addSubview:imgV];

                  UILabel *nameLbl = [[UILabel alloc] initWithFrame:CGRectMake(84, 8, cardW - 94, 20)];
                  nameLbl.text = name;
                  nameLbl.textColor = UIColor.whiteColor;
                  nameLbl.font = [UIFont systemFontOfSize:14.5 weight:UIFontWeightHeavy];
                  [card addSubview:nameLbl];

                  UILabel *tidLbl = [[UILabel alloc] initWithFrame:CGRectMake(84, 28, cardW - 94, 14)];
                  tidLbl.text = [NSString stringWithFormat:@"ID: %@  •  Pasta: %@", tid, folder];
                  tidLbl.textColor = NS_CYAN_GLOW;
                  tidLbl.font = [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightBold];
                  [card addSubview:tidLbl];

                  UILabel *bBase = [[UILabel alloc] initWithFrame:CGRectMake(84, 48, 64, 24)];
                  bBase.backgroundColor = hasBase ? [NS_BLUE_COLOR colorWithAlphaComponent:0.25] : [UIColor colorWithWhite:1.0 alpha:0.08];
                  bBase.textColor = hasBase ? NS_BLUE_COLOR : UIColor.grayColor;
                  bBase.text = hasBase ? @"✓ BASE" : @"✗ BASE";
                  bBase.textAlignment = NSTextAlignmentCenter;
                  bBase.font = [UIFont boldSystemFontOfSize:10];
                  bBase.layer.cornerRadius = 6;
                  bBase.clipsToBounds = YES;
                  [card addSubview:bBase];

                  UILabel *bUpd = [[UILabel alloc] initWithFrame:CGRectMake(154, 48, 76, 24)];
                  bUpd.backgroundColor = hasUpd ? [NS_CYAN_GLOW colorWithAlphaComponent:0.22] : [UIColor colorWithWhite:1.0 alpha:0.08];
                  bUpd.textColor = hasUpd ? NS_CYAN_GLOW : UIColor.grayColor;
                  bUpd.text = hasUpd ? @"✓ UPDATE" : @"SEM UPD";
                  bUpd.textAlignment = NSTextAlignmentCenter;
                  bUpd.font = [UIFont boldSystemFontOfSize:10];
                  bUpd.layer.cornerRadius = 6;
                  bUpd.clipsToBounds = YES;
                  [card addSubview:bUpd];

                  UILabel *bDlc = [[UILabel alloc] initWithFrame:CGRectMake(236, 48, 66, 24)];
                  bDlc.backgroundColor = dlcCount > 0 ? [NS_RED_COLOR colorWithAlphaComponent:0.25] : [UIColor colorWithWhite:1.0 alpha:0.08];
                  bDlc.textColor = dlcCount > 0 ? NS_RED_COLOR : UIColor.grayColor;
                  bDlc.text = [NSString stringWithFormat:@"%lu DLC(s)", (unsigned long)dlcCount];
                  bDlc.textAlignment = NSTextAlignmentCenter;
                  bDlc.font = [UIFont boldSystemFontOfSize:10];
                  bDlc.layer.cornerRadius = 6;
                  bDlc.clipsToBounds = YES;
                  [card addSubview:bDlc];

                  [self.carousel addSubview:card];
                  x += cardW + 12;
              }
              self.carousel.contentSize = CGSizeMake(x, 84);
          }

          - (NSString *)classifyByPath:(NSString *)relPath {
              NSArray<NSString *> *parts = [relPath.lowercaseString pathComponents];
              for (NSString *p in parts) {
                  if ([p isEqualToString:@"dlc"] || [p isEqualToString:@"dlcs"] || [p isEqualToString:@"aoc"]) return @"AddOnContent";
                  if ([p isEqualToString:@"update"] || [p isEqualToString:@"updates"] || [p isEqualToString:@"upd"] || [p isEqualToString:@"patch"]) return @"Patch";
                  if ([p isEqualToString:@"base"] || [p isEqualToString:@"game"]) return @"Application";
              }
              return nil;
          }

          - (void)scanLibrary {
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSFileManager *fm = NSFileManager.defaultManager;
                  NSString *doc = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];

                  NSString *foundKeys = nil;
                  NSString *rootKeys = [doc stringByAppendingPathComponent:@"prod.keys"];
                  if ([fm fileExistsAtPath:rootKeys]) foundKeys = rootKeys;

                  NSMutableArray<NSString *> *relPkgFiles = [NSMutableArray array];
                  NSDirectoryEnumerator *en = [fm enumeratorAtPath:doc];
                  NSString *rel = nil;
                  while ((rel = [en nextObject])) {
                      NSString *low = rel.lowercaseString;
                      if ([low hasPrefix:@"games/"] || [low containsString:@"/extracted/"] || [low containsString:@"/_kit_staging/"] || [low containsString:@"/romfs/"] || [low containsString:@"/aoc/"] || [low hasPrefix:@"_"]) {
                          continue;
                      }
                      NSString *full = [doc stringByAppendingPathComponent:rel];
                      NSDictionary *attr = [fm attributesOfItemAtPath:full error:nil];
                      if (![attr.fileType isEqualToString:NSFileTypeRegular]) continue;

                      if (!foundKeys && [low hasSuffix:@".keys"]) {
                          foundKeys = full;
                          continue;
                      }
                      if ([low hasSuffix:@".nsp"] || [low hasSuffix:@".xci"]) {
                          [relPkgFiles addObject:rel];
                      }
                  }
                  [relPkgFiles sortUsingSelector:@selector(compare:)];

                  NSMutableDictionary<NSString *, NSMutableDictionary *> *games = [NSMutableDictionary dictionary];
                  ios_libhac_inspect_fn inspectFn = get_inspect_fn();
                  NSString *tmpTsv = [doc stringByAppendingPathComponent:@"_tmp_inspect.tsv"];

                  for (NSString *relPath in relPkgFiles) {
                      NSString *full = [doc stringByAppendingPathComponent:relPath];
                      NSArray<NSString *> *parts = [relPath pathComponents];
                      NSString *topFolder = (parts.count > 1) ? parts[0] : @"Raiz";
                      NSString *explicitFolderKind = [self classifyByPath:relPath];

                      NSString *detectedTid = nil;
                      NSString *detectedName = nil;
                      NSString *detectedKind = nil;
                      NSString *iconFile = [doc stringByAppendingPathComponent:[NSString stringWithFormat:@"_icon_%@.jpg", topFolder]];

                      if (foundKeys && inspectFn) {
                          [fm removeItemAtPath:tmpTsv error:nil];
                          if (inspectFn(foundKeys.UTF8String, full.UTF8String, tmpTsv.UTF8String, iconFile.UTF8String) == 0 && [fm fileExistsAtPath:tmpTsv]) {
                              NSString *tsv = [NSString stringWithContentsOfFile:tmpTsv encoding:NSUTF8StringEncoding error:nil];
                              NSArray<NSString *> *cols = [tsv componentsSeparatedByString:@"\t"];
                              if (cols.count >= 2 && cols[1].length == 16) {
                                  detectedKind = cols[0];
                                  detectedTid = cols[1];
                                  if (cols.count >= 3 && cols[2].length > 0) detectedName = cols[2];
                              }
                          }
                      }

                      // Se o arquivo esta em base/, update/ ou dlcs/, a pasta tem prioridade!
                      NSString *finalKind = explicitFolderKind ?: (detectedKind ?: @"Application");

                      NSString *groupKey = topFolder;
                      if (!games[groupKey]) {
                          games[groupKey] = [@{
                              @"tid": detectedTid ?: topFolder,
                              @"folder": topFolder,
                              @"name": detectedName ?: topFolder,
                              @"dlcs": [NSMutableArray array]
                          } mutableCopy];
                      }
                      if (detectedTid && [games[groupKey][@"tid"] isEqualToString:topFolder]) {
                          games[groupKey][@"tid"] = detectedTid;
                      }
                      if (detectedName && [games[groupKey][@"name"] isEqualToString:topFolder]) {
                          games[groupKey][@"name"] = detectedName;
                      }
                      if ([fm fileExistsAtPath:iconFile]) {
                          games[groupKey][@"icon"] = iconFile;
                      }

                      if ([finalKind isEqualToString:@"Application"]) {
                          games[groupKey][@"base"] = full;
                      } else if ([finalKind isEqualToString:@"Patch"]) {
                          games[groupKey][@"upd"] = full;
                      } else {
                          [games[groupKey][@"dlcs"] addObject:full];
                      }
                  }
                  [fm removeItemAtPath:tmpTsv error:nil];

                  for (NSString *k in games) {
                      NSDictionary *g = games[k];
                      [self log:[NSString stringWithFormat:@"✓ Jogo: %@ [ID: %@]\n  • Base: %@\n  • Update: %@\n  • DLCs: %lu arquivo(s)",
                          g[@"name"], g[@"tid"],
                          g[@"base"] ? [g[@"base"] lastPathComponent] : @"AUSENTE",
                          g[@"upd"] ? [g[@"upd"] lastPathComponent] : @"Nenhum",
                          (unsigned long)[g[@"dlcs"] count]]];
                  }

                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.detectedKeysPath = foundKeys;
                      self.keysBadge.text = foundKeys ? @"✓ Ativo" : @"✗ Ausente";
                      self.keysBadge.textColor = foundKeys ? NS_CYAN_GLOW : NS_RED_COLOR;
                      self.pkgsBadge.text = [NSString stringWithFormat:@"%lu NSP/XCI", (unsigned long)relPkgFiles.count];
                      self.gamesBadge.text = [NSString stringWithFormat:@"%lu Jogo(s)", (unsigned long)games.count];
                      self.detectedGames = games;
                      self.statusLabel.text = [NSString stringWithFormat:@"Detectados %lu arquivos em %lu jogo(s)!", (unsigned long)relPkgFiles.count, (unsigned long)games.count];
                      [self rebuildCarousel];
                  });
              });
          }

          - (void)runExtract {
              self.extractBtn.enabled = NO;
              self.progressBar.progress = 0.05;
              self.statusLabel.text = @"Iniciando motor LibHac...";

              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  ios_libhac_extract_fn fn = get_extractor();
                  NSFileManager *fm = NSFileManager.defaultManager;
                  NSString *doc = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];
                  NSString *keys = self.detectedKeysPath ?: [doc stringByAppendingPathComponent:@"prod.keys"];

                  NSUInteger total = self.detectedGames.count;
                  NSUInteger current = 0;

                  for (NSString *key in self.detectedGames) {
                      current++;
                      NSDictionary *g = self.detectedGames[key];
                      NSString *tid = g[@"tid"] ?: key;
                      NSString *folder = g[@"folder"] ?: tid;
                      NSString *basePkg = g[@"base"];
                      NSString *updPkg = g[@"upd"] ?: @"-";
                      NSArray<NSString *> *dlcs = g[@"dlcs"];
                      NSString *gName = g[@"name"] ?: folder;

                      if (!basePkg) {
                          [self log:[NSString stringWithFormat:@"❌ [%@] Pasta base/ sem arquivo .nsp/.xci!", gName]];
                          continue;
                      }

                      dispatch_async(dispatch_get_main_queue(), ^{
                          self.statusLabel.text = [NSString stringWithFormat:@"Extraindo %@ (%lu/%lu)...", gName, (unsigned long)current, (unsigned long)total];
                          self.progressBar.progress = 0.15;
                      });

                      [self log:[NSString stringWithFormat:@"\n=== [%@] %@ ===", tid, gName]];
                      NSString *gameRoot = [[doc stringByAppendingPathComponent:folder] stringByAppendingPathComponent:@"Extracted"];
                      NSString *staging = [gameRoot stringByAppendingPathComponent:@"_kit_staging"];
                      [fm removeItemAtPath:staging error:nil];
                      [fm createDirectoryAtPath:staging withIntermediateDirectories:YES attributes:nil error:nil];

                      if (tid.length == 16) {
                          [tid writeToFile:[staging stringByAppendingPathComponent:@"title_id.txt"] atomically:YES encoding:NSUTF8StringEncoding error:nil];
                      }

                      [self log:@"1/4 Gerando manifesto CNMT..."];
                      fn(keys.UTF8String, basePkg.UTF8String, updPkg.UTF8String, staging.UTF8String, 2);

                      dispatch_async(dispatch_get_main_queue(), ^{ self.progressBar.progress = 0.35; });
                      [self log:@"2/4 Extraindo e fundindo Base + Update com LibHac..."];
                      int rc = fn(keys.UTF8String, basePkg.UTF8String, updPkg.UTF8String, staging.UTF8String, 0);
                      if (rc != 0 && rc != 3) {
                          [self log:[NSString stringWithFormat:@"ERRO LibHac rc=%d", rc]];
                          continue;
                      }

                      NSString *romfsOut = [gameRoot stringByAppendingPathComponent:@"romfs"];
                      [fm removeItemAtPath:romfsOut error:nil];
                      [fm moveItemAtPath:[staging stringByAppendingPathComponent:@"RomFS"] toPath:romfsOut error:nil];
                      [self log:[NSString stringWithFormat:@"-> RomFS pronto em: %@/Extracted/romfs/", folder]];

                      dispatch_async(dispatch_get_main_queue(), ^{ self.progressBar.progress = 0.65; });
                      int idx = 1;
                      for (NSString *d in dlcs) {
                          [self log:[NSString stringWithFormat:@"3/4 Extraindo DLC #%d: %@...", idx, d.lastPathComponent]];
                          NSString *aocOut = [NSString stringWithFormat:@"%@/aoc/%03d", staging, idx];
                          NSString *docAoc = [NSString stringWithFormat:@"%@/aoc/%03d", gameRoot, idx];
                          [fm createDirectoryAtPath:aocOut withIntermediateDirectories:YES attributes:nil error:nil];
                          fn(keys.UTF8String, d.UTF8String, "-", aocOut.UTF8String, 1);
                          [fm createDirectoryAtPath:[gameRoot stringByAppendingPathComponent:@"aoc"] withIntermediateDirectories:YES attributes:nil error:nil];
                          [fm removeItemAtPath:docAoc error:nil];
                          [fm copyItemAtPath:aocOut toPath:docAoc error:nil];
                          idx++;
                      }

                      dispatch_async(dispatch_get_main_queue(), ^{ self.progressBar.progress = 0.85; });
                      [self log:@"4/4 Empacotando ExeFS + Shaders Universais no github_kit..."];
                      NSString *slimRomfs = [staging stringByAppendingPathComponent:@"RomFS"];
                      [fm createDirectoryAtPath:slimRomfs withIntermediateDirectories:YES attributes:nil error:nil];
                      NSDirectoryEnumerator *en = [fm enumeratorAtPath:romfsOut];
                      NSString *rel = nil;
                      while ((rel = [en nextObject])) {
                          NSString *full = [romfsOut stringByAppendingPathComponent:rel];
                          NSDictionary *a = [fm attributesOfItemAtPath:full error:nil];
                          if (![a.fileType isEqualToString:NSFileTypeRegular]) continue;
                          if (should_include_in_universal_kit(rel, [a fileSize])) {
                              NSString *dst = [slimRomfs stringByAppendingPathComponent:rel];
                              [fm createDirectoryAtPath:[dst stringByDeletingLastPathComponent] withIntermediateDirectories:YES attributes:nil error:nil];
                              [fm copyItemAtPath:full toPath:dst error:nil];
                          }
                      }

                      NSString *zipName = [NSString stringWithFormat:@"github_kit_%@.zip", tid];
                      NSString *zipOut = [gameRoot stringByAppendingPathComponent:zipName];
                      if (build_zip_file(staging, zipOut)) {
                          NSDictionary *za = [fm attributesOfItemAtPath:zipOut error:nil];
                          [self log:[NSString stringWithFormat:@"✓ CONCLUIDO: %@/Extracted/%@ (%.1f MB)", folder, zipName, [za fileSize] / (1024.0 * 1024.0)]];
                      }
                      [fm removeItemAtPath:staging error:nil];
                  }

                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.progressBar.progress = 1.0;
                      self.statusLabel.text = @"Processamento Concluído!";
                      self.extractBtn.enabled = YES;
                  });
              });
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [ExtractorVC new];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          OBJCEOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            -Wl,-rpath,@executable_path/Frameworks \
            "$RUNNER_TEMP/ExtractorApp/main.m" \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -lz \
            -o "$APP_DIR/ExtractorNS"

          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ExtractorNS</string>
            <key>CFBundleIdentifier</key><string>com.kinttany.extractorns</string>
            <key>CFBundleName</key><string>ExtractorNS</string>
            <key>CFBundleDisplayName</key><string>ExtractorNS</string>
            <key>CFBundleVersion</key><string>3.3</string>
            <key>CFBundleShortVersionString</key><string>3.3</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>CFBundleIconName</key><string>AppIcon</string>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array><string>AppIcon60x60</string></array>
                <key>CFBundleIconName</key><string>AppIcon</string>
                <key>UIPrerenderedIcon</key><true/>
              </dict>
            </dict>
          </dict>
          </plist>
          PLIST

          codesign -f -s - "$FW_DIR"
          codesign -f -s - "$APP_DIR"
          cd "$RUNNER_TEMP"
          zip -qry "$RUNNER_TEMP/ExtractorNS.ipa" Payload
          ls -lh "$RUNNER_TEMP/ExtractorNS.ipa"

      - name: 4. Upload do ExtractorNS.ipa nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExtractorNS-App-IPA
          path: ${{ runner.temp }}/ExtractorNS.ipa
