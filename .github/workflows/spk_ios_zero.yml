                  card.layer.cornerRadius = 16;
                  card.layer.borderWidth = 2.5;
                  card.layer.borderColor = NS_CYAN_GLOW.CGColor;

                  UIView *topBar = [[UIView alloc] initWithFrame:CGRectMake(14, 12, 48, 5)];
