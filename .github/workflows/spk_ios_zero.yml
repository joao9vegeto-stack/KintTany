          }

          - (void)rebuildCarousel {
              for (UIView *sub in self.carousel.subviews) [sub removeFromSuperview];

              if (self.detectedGames.count == 0) {
                  UIView *empty = [[UIView alloc] initWithFrame:CGRectMake(0, 0, self.carousel.bounds.size.width, 150)];
                  empty.backgroundColor = NS_CARD_COLOR;
                  empty.layer.cornerRadius = 16;
                  empty.layer.borderWidth = 1.5;
                  empty.layer.borderColor = [NS_BLUE_COLOR colorWithAlphaComponent:0.4].CGColor;

                  UILabel *l1 = [[UILabel alloc] initWithFrame:CGRectMake(16, 36, empty.bounds.size.width - 32, 24)];
                  l1.text = @"Nenhum Cartucho NSP / XCI Detectado";
                  l1.textColor = UIColor.whiteColor;
                  l1.textAlignment = NSTextAlignmentCenter;
                  l1.font = [UIFont boldSystemFontOfSize:16];
                  [empty addSubview:l1];

                  UILabel *l2 = [[UILabel alloc] initWithFrame:CGRectMake(16, 66, empty.bounds.size.width - 32, 48)];
                  l2.text = @"Coloque prod.keys na raiz e seus jogos em pastas\n(ex: ExtractorNS/Spk/base, update, dlcs)";
                  l2.textColor = [UIColor colorWithWhite:0.7 alpha:1.0];
                  l2.textAlignment = NSTextAlignmentCenter;
                  l2.numberOfLines = 2;
                  l2.font = [UIFont systemFontOfSize:12];
                  [empty addSubview:l2];

                  [self.carousel addSubview:empty];
                  self.carousel.contentSize = empty.bounds.size;
