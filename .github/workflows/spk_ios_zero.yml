              tl.font = [UIFont systemFontOfSize:9 weight:UIFontWeightBold];
              [box addSubview:tl];

              UILabel *vl = [[UILabel alloc] initWithFrame:CGRectMake(8, 20, f.size.width - 16, 18)];
