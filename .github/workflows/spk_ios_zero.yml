name: SpkIOSzero · Link2iOS Route C

on:
  push:
    branches:
      - SpkIOSzero
    paths:
      - handoff.json
      - scripts/spk_engine.py
      - scripts/prepare_spk_actions.py
      - scripts/build_spk_shared.py
      - colab/source_spk.py
      - colab/prepare_spk.py
      - colab/run_spk.py
      - colab/SpkIOSzero.ipynb
      - colab/SpkIOSzero_Corrigido.ipynb
      - .github/workflows/spk_ios_zero.yml

permissions:
  contents: read

concurrency:
  group: spkioszero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-spk-source:
    if: github.ref == 'refs/heads/SpkIOSzero'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SpkIOSzero
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile all SPK Python entry points and validate notebook/workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML
          python -m py_compile \
            scripts/spk_engine.py \
            colab/source_spk.py \
            colab/prepare_spk.py \
            colab/run_spk.py \
            scripts/prepare_spk_actions.py \
            scripts/build_spk_shared.py
          python - <<'PY'
          import ast, json, yaml
          from pathlib import Path
          notebook = json.loads(Path("colab/SpkIOSzero.ipynb").read_text(encoding="utf-8"))
          assert notebook["nbformat"] == 4
          assert len(notebook["cells"]) == 12
          notebook_source = "\n".join("".join(c.get("source", [])) for c in notebook["cells"])
          for index, cell in enumerate(notebook["cells"]):
              if cell.get("cell_type") != "code":
                  continue
              parts = cell.get("source", [])
              assert isinstance(parts, list), f"Cell {index}: source must be a list"
              assert all(part.endswith("\n") for part in parts[:-1]), (
                  f"Cell {index}: a source fragment is missing its newline; "
                  "Colab would concatenate separate Python lines"
              )
              source = "".join(parts)
              normalized = "\n".join(
                  "pass" if line.lstrip().startswith(("%", "!")) else line
                  for line in source.splitlines()
              )
              try:
                  ast.parse(normalized, filename=f"SpkIOSzero.ipynb:cell-{index}")
              except SyntaxError as exc:
                  raise AssertionError(
                      f"Notebook code cell {index} is not valid Python after IPython magic normalization: {exc}"
                  ) from exc
          cell7 = "".join(notebook["cells"][7]["source"])
          assert "\nelse:\n" in cell7, "Cell 7 if/else block lost its line breaks"
          assert cell7.startswith("# CÉLULA AUTOSSUFICIENTE"), "Preparation cell is not self-contained"
          assert 0 <= cell7.find("from pathlib import Path") < cell7.find("HANDOFF_PATH = Path")
          assert 0 <= cell7.find("HANDOFF_READY = False") < cell7.find("if not HANDOFF_READY")
          assert "drive_api_client = build(" in cell7 and "import run_spk" in cell7
          assert "RECOVERED_HANDOFF = run_spk.recover(" in cell7
          handoff_write = next(line for line in cell7.splitlines() if "HANDOFF_PATH.write_text" in line)
          assert handoff_write.count("\\") == 1, "Handoff JSON must use one escaped newline"
          assert '(".nsp", ".xci")' in cell7, "Notebook preflight must accept an XCI base"
          assert 're.fullmatch(r"dlc[^/]*\\\\.nsp"' not in cell7, "Notebook DLC regex must not be double-escaped"
          assert 're.fullmatch(r"dlc[^/]*\\.nsp"' in cell7, "Notebook must identify the ten DLC NSPs"
          assert len(notebook["cells"]) == 12
          assert "DRIVE_FOLDER_ID" in notebook_source and ('"spk"' in notebook_source or "'spk'" in notebook_source)
          assert "10 DLCs .nsp" in notebook_source
          prepare = Path("colab/prepare_spk.py").read_text(encoding="utf-8")
          assert '"ninja": "ninja-build"' in prepare
          assert 'apt-get install failed (exit ' in prepare
          assert ".znsp" not in notebook_source.lower()
          assert "run_spk.py dispatch" in notebook_source
          with Path(".github/workflows/spk_ios_zero.yml").open(encoding="utf-8") as f:
              workflow = yaml.load(f, Loader=yaml.BaseLoader)
          assert "validate-spk-source" in workflow["jobs"]
          assert "build-sparking-zero" in workflow["jobs"]
          print("SPK Python, Colab notebook JSON and Actions YAML syntax: OK")
          PY

      - name: Exercise macOS Actions-to-Colab manifest contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from build_spk_shared import validate_prepared_contract

          common = {
              "project": "SpkIOSzero", "title_id": "010035F022078000",
              "package_version": "v327680", "nx2apple_tag": "v1.3.1-rc2",
              "engine_pin": "81906931262fb25d774cce8bca2db8926439e5a2",
              "profile_type": "registered",
              "profile_source": "NXNative pinned built-in Sparking! ZERO profile",
              "main_build_id": "68edafd68c7bc1a1af50b82aac838018",
              "main_sha256": "a0f8f0644c92384ddb1baac1c21aecbeeace5bc99ad40895e216add61da78efe",
              "allocator": {"layout": "UE4_27", "getter_slot": 19},
              "modules": ["main", "subsdk0", "sdk"], "shader_chain": "0c434f1b68df",
              "input_package_count": 12, "input_nsp_count": 11, "input_xci_count": 1,
              "input_base_package_type": "XCI", "input_base_package_name": "000_base.xci",
              "unreal_shader_sources": {"ue_decode": False, "oodle_packs": False, "ue_legacy": True},
          }
          with tempfile.TemporaryDirectory(prefix="spk-manifest-contract-") as tmp:
              work = Path(tmp).resolve()
              prep = {
                  **common,
                  "romfs_relative_path": "extract/v327680/RomFS.img",
                  "romfs_id_relative_path": "extract/v327680/RomFS.img.id",
                  "aoc_relative_dir": "aoc", "romfs_size": 123456,
                  "aoc_images": [{"name": "1.img", "size": 399}],
                  "graphics_api": "nvn",
              }
              game_data = {
                  "romfs_relative_path": prep["romfs_relative_path"],
                  "aoc_relative_dir": prep["aoc_relative_dir"],
                  "romfs": {"size": prep["romfs_size"], "sha256": "a" * 64},
              }
              actions = {
                  **common,
                  "romfs_path": str(work / prep["romfs_relative_path"]),
                  "romfs_id_path": str(work / prep["romfs_id_relative_path"]),
                  "aoc_dir": str(work / prep["aoc_relative_dir"]),
                  "aoc_images": ["1.img"], "game_data": game_data,
              }
              validate_prepared_contract(actions, prep, work)
              bad_path = dict(actions, romfs_path=str(work / "wrong.img"))
              try:
                  validate_prepared_contract(bad_path, prep, work)
              except SystemExit:
                  pass
              else:
                  raise AssertionError("Mismatched absolute RomFS path was accepted")
              bad_aoc = dict(actions, aoc_images=["wrong.img"])
              try:
                  validate_prepared_contract(bad_aoc, prep, work)
              except SystemExit:
                  pass
              else:
                  raise AssertionError("Mismatched AOC filename list was accepted")
          print("Actions absolute paths + Colab relative paths/AOC projection: OK")
          PY

      - name: Exercise NSP and XCI header recognition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "colab")
          import source_spk
          with tempfile.TemporaryDirectory(prefix="spk-package-test-") as tmp:
              root = Path(tmp)
              nsp = root / "base.nsp"
              nsp.write_bytes(b"PFS0" + bytes(4096))
              xci = root / "base.XCI"
              header = bytearray(0x104)
              header[0x100:0x104] = b"HEAD"
              xci.write_bytes(header)
              assert source_spk.validate_package(nsp) == "NSP"
              assert source_spk.validate_package(xci) == "XCI"
              assert set(source_spk.find_packages(root)) == {nsp, xci}
          print("PFS0 NSP + XCI HEAD@0x100 detection: OK")
          PY

      - name: Verify native Sparking! ZERO support in the exact pinned NXNative
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1-rc2 https://github.com/LNPANDY/NX2Apple.git "$RUNNER_TEMP/NX2Apple"
          cd "$RUNNER_TEMP/NX2Apple"
          python tools/engine.py sync
          test "$(cat .upstream-ref)" = "81906931262fb25d774cce8bca2db8926439e5a2"
          cd "$GITHUB_WORKSPACE"
          python scripts/spk_engine.py --engine-root "$RUNNER_TEMP/NX2Apple/engine"
          python - <<'PY'
          from pathlib import Path
          import json, os
          engine = Path(os.environ["RUNNER_TEMP"]) / "NX2Apple" / "engine"
          profile = engine / "dm/games/010035F022078000"
          allocator = (engine / "dm/tools/ue_malloc.py").read_text(encoding="utf-8")
          rewriter = (engine / "dm/tools/patch_nso.py").read_text(encoding="utf-8")
          hle = (engine / "dm/host/hle_uemalloc.c").read_text(encoding="utf-8")
          source = Path("colab/source_spk.py").read_text(encoding="utf-8")
          prepare = Path("colab/prepare_spk.py").read_text(encoding="utf-8")
          shared = Path("scripts/build_spk_shared.py").read_text(encoding="utf-8")
          actions = Path("scripts/prepare_spk_actions.py").read_text(encoding="utf-8")
          run_spk = Path("colab/run_spk.py").read_text(encoding="utf-8")
          upstream_builder = (engine / "scripts" / "build_ipa_from_nsp.py").read_text(encoding="utf-8")
          game_profile = (profile / "game.tsv").read_text(encoding="utf-8")
          game_note = (profile / "README.md").read_text(encoding="utf-8")
          notebook = json.loads(Path("colab/SpkIOSzero.ipynb").read_text(encoding="utf-8"))
          cell9 = "".join(notebook["cells"][9]["source"])
          assert "build\tv327680\t2.0.76\tmain=68edafd68c7bc1a1af50b82aac838018" in game_profile
          assert "main+0x1e4db30" in game_note and "main+0x1e4e048" in game_note
          assert "19: 'Unreal Engine 4.26 / 4.27'" in allocator
          assert "return tuple(calls), vt, slot" in allocator
          assert "for _c in UE_CALLS or ():" in rewriter
          assert "FMallocBinned3 constructor call (cut)" in rewriter
          assert "[UE4_27] = { 19, 21, 3, 4, 5, 6, 7, 8, 9," in hle
          assert "SPK_FIXED_MAIN" not in rewriter and "f9035293" not in rewriter
          assert "spk_engine.verify(nx / \"engine\")" in prepare
          assert '"--provisional"' not in prepare
          assert '"Crypto.Cipher", "pycryptodome"' in prepare
          assert "uepak.aes_decrypt = aes_decrypt" in prepare
          assert 'sys.modules.pop(module_name, None)' in prepare
          assert '"uepak", "uepak_extract"' in prepare
          assert 'expected_ue_flags = {"ue_decode": False, "oodle_packs": False, "ue_legacy": True}' in prepare
          assert 'expected_ue_flags = {"ue_decode": False, "oodle_packs": False, "ue_legacy": True}' in shared
          assert 'expected_calls = set(spk_engine.ALLOCATOR_CALLS)' in prepare
          assert 'profile_dir = nx / "engine" / "dm/games" / TITLE_ID' in prepare
          assert 'prepared_manifest.get("allocator") != expected_allocator' in actions
          assert 'prepared.get("unreal_shader_sources") != expected_ue_flags' in run_spk
          assert 'prepared["profile_type"] == "registered"' in cell9
          assert '"ue_legacy": True' in cell9
          assert 'upload_drive_file(api, base_path, spk_folder["id"], f"base{base_extension}")' in source
          assert "return h[:4] == b'PFS0' or h[0x100:] == b'HEAD'" in upstream_builder
          assert "PACKAGE_SUFFIXES = ('.nsp', '.xci', '.nsz', '.xcz')" in upstream_builder
          assert 'PACKAGE_SUFFIXES = {".nsp", ".xci"}' in source
          assert 'header[0x100:0x104] != b"HEAD"' in source
          assert "def find_packages(" in source and "validate_package(" in source
          assert 'files_with_suffix(nsp_dir, ".nsp", ".xci")' in prepare
          assert 'expected_calls = set(spk_engine.ALLOCATOR_CALLS)' in prepare
          assert 'profile_dir = nx / "engine" / "dm/games" / TITLE_ID' in prepare
          print("Registered game profile + upstream two-call allocator support: OK")
          PY

  build-sparking-zero:
    if: github.ref == 'refs/heads/SpkIOSzero' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Queue SpkIOSzero build ')
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout the SpkIOSzero handoff commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce branch isolation and validate the SPK handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/SpkIOSzero"
          test "$GITHUB_REF_NAME" = "SpkIOSzero"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, re
          with open("handoff.json", encoding="utf-8") as f:
              d = json.load(f)
          assert d.get("project") == "SpkIOSzero"
          assert d.get("branch") == "SpkIOSzero"
          assert d.get("title_id") == "010035F022078000"
          assert d.get("package_version")
          assert d.get("nx2apple_tag") == "v1.3.1-rc2"
          assert d.get("engine_pin") == "81906931262fb25d774cce8bca2db8926439e5a2"
          assert re.fullmatch(r"[0-9a-f-]{36}", d.get("request_id", ""))
          w = d.get("work_archive", {})
          assert w.get("id") and int(w.get("size", 0)) > 0
          assert re.fullmatch(r"[0-9a-f]{64}", w.get("sha256", ""))
          p = d.get("prepared", {})
          assert p.get("title_id") == d.get("title_id")
          assert p.get("package_version") == d.get("package_version")
          assert p.get("main_build_id") == "68edafd68c7bc1a1af50b82aac838018"
          assert p.get("main_sha256") == "a0f8f0644c92384ddb1baac1c21aecbeeace5bc99ad40895e216add61da78efe"
          src = d.get("source", {})
          assert src.get("package_count") == 12
          assert src.get("update_nsp_count") == 1
          assert src.get("dlc_nsp_count") == 10
          base_type = src.get("base_type")
          assert base_type in ("NSP", "XCI")
          assert src.get("base_extension") == (".xci" if base_type == "XCI" else ".nsp")
          assert p.get("input_package_count") == 12
          assert p.get("input_base_package_type") == base_type
          assert p.get("input_nsp_count") == (11 if base_type == "XCI" else 12)
          assert p.get("input_xci_count") == (1 if base_type == "XCI" else 0)
          assert p.get("input_base_nsp_count") == (1 if base_type == "NSP" else 0)
          assert p.get("input_base_xci_count") == (1 if base_type == "XCI" else 0)
          assert p.get("input_update_nsp_count") == 1
          assert p.get("input_dlc_nsp_count") == 10
          assert p.get("graphics_api") == "nvn"
          assert any((p.get("unreal_shader_sources") or {}).get(k) for k in ("ue_decode", "oodle_packs", "ue_legacy"))
          gd = d.get("game_data", {})
          assert gd.get("romfs", {}).get("id") and gd.get("romfs", {}).get("sha256")
          assert isinstance(gd.get("aoc"), list) and len(gd["aoc"]) > 0
          assert {x.get("name") for x in gd["aoc"]} == {x.get("name") for x in p.get("aoc_images", [])}
          print("SpkIOSzero handoff validated:", d["request_id"], d["package_version"])
          PY

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Apple build toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 is missing from xcode-27"; exit 1; }
          xcodebuild -version
          brew install xcodegen zstd glslang cmake ninja pkg-config
          brew list --cask dotnet-sdk >/dev/null 2>&1 || brew install --cask dotnet-sdk
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools zbic backports.zstd google-api-python-client google-auth PyYAML

      - name: Sync the exact NX2Apple release and engine pin
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1-rc2 https://github.com/LNPANDY/NX2Apple.git "$RUNNER_TEMP/NX2Apple"
          cd "$RUNNER_TEMP/NX2Apple"
          python tools/engine.py sync
          EXPECTED="81906931262fb25d774cce8bca2db8926439e5a2"
          test "$(cat .upstream-ref)" = "$EXPECTED"

      - name: Verify built-in Sparking! ZERO support in the pinned engine
        shell: bash
        run: |
          set -euo pipefail
          python scripts/spk_engine.py --engine-root "$RUNNER_TEMP/NX2Apple/engine"

      - name: Restore and verify the Colab workspace and external game data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_spk_actions.py \
            --handoff "$GITHUB_WORKSPACE/handoff.json" \
            --destination "$RUNNER_TEMP/spk-ios-zero"

      - name: Build Unreal/Oodle shaders, Metal libraries, game framework and Shared Shell IPA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_spk_shared.py \
            --nx2apple-root "$RUNNER_TEMP/NX2Apple" \
            --prepared-json "$RUNNER_TEMP/spk-ios-zero/actions-input.json" \
            --output "$RUNNER_TEMP/spk-ios-zero-output"

      - name: Upload installable IPA and build report
        uses: actions/upload-artifact@v4
        with:
          name: SpkIOSzero-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/spk-ios-zero-output/SpkIOSzero.ipa
            ${{ runner.temp }}/spk-ios-zero-output/build-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpkIOSzero-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/spk-ios-zero/work/logs/**
            ${{ runner.temp }}/spk-ios-zero-output/build-report.json
          if-no-files-found: ignore
          retention-days: 7
