name: XOWUE Startup Stream AOT Audit

on:
  push:
    branches:
      - XOWUE
    paths:
      - ".github/workflows/xowue-stream-aot-audit.yml"
      - "tools/probe_xowue_stream_stall.py"
      - "audit/probe_xowue_stream_support.py"
      - "audit/probe_xowue_stream_field_xrefs.py"
      - "audit/probe_xowue_async_manager_xrefs.py"
      - "audit/inspect_xowue_guest_tables.py"
      - "audit/xowue-stream-aot-audit.trigger"
      - "audit/xowue-stream-aot-audit.trigger"

concurrency:
  group: xowue-stream-aot-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  extract-native-source:
    name: Extract Wolverine stream-stall AOT source
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout XOWUE only
        uses: actions/checkout@v4
        with:
          ref: XOWUE

      - name: Verify branch and reconstruct pinned PPC AOT archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "XOWUE"
          cat dist/XOWUE-AOT-source.part* > "$RUNNER_TEMP/XOWUE-AOT-source.tar.gz"
          expected="$(awk '$2=="dist/XOWUE-AOT-source.tar.gz"{print $1}' dist/SHA256SUMS)"
          actual="$(shasum -a 256 "$RUNNER_TEMP/XOWUE-AOT-source.tar.gz" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/generated"
          tar -xzf "$RUNNER_TEMP/XOWUE-AOT-source.tar.gz" -C "$RUNNER_TEMP/generated"
          test -s "$RUNNER_TEMP/generated/ppc/ppc_recomp.64.cpp"

      - name: Extract exact native AOT function and callsite windows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/probe_xowue_stream_stall.py
          python3 tools/probe_xowue_stream_stall.py \
            --ppc-dir "$RUNNER_TEMP/generated/ppc" \
            --report "$RUNNER_TEMP/xowue-stream-stall-aot-source.json"
          test -s "$RUNNER_TEMP/xowue-stream-stall-aot-source.json"
          python3 -m json.tool "$RUNNER_TEMP/xowue-stream-stall-aot-source.json" >/dev/null

      - name: Extract polling wrapper and stream helper source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile audit/probe_xowue_stream_support.py
          python3 audit/probe_xowue_stream_support.py \
            --ppc-dir "$RUNNER_TEMP/generated/ppc" \
            --report "$RUNNER_TEMP/xowue-stream-support-aot-source.json"
          test -s "$RUNNER_TEMP/xowue-stream-support-aot-source.json"
          python3 -m json.tool "$RUNNER_TEMP/xowue-stream-support-aot-source.json" >/dev/null

      - name: Upload stream polling wrapper and helper source
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-Stream-Poll-Support-AOT-Source
          path: ${{ runner.temp }}/xowue-stream-support-aot-source.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Extract direct +168 field cross-references and wait implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile audit/probe_xowue_stream_field_xrefs.py
          python3 audit/probe_xowue_stream_field_xrefs.py \
            --ppc-dir "$RUNNER_TEMP/generated/ppc" \
            --report "$RUNNER_TEMP/xowue-stream-field168-xrefs.json"
          test -s "$RUNNER_TEMP/xowue-stream-field168-xrefs.json"
          python3 -m json.tool "$RUNNER_TEMP/xowue-stream-field168-xrefs.json" >/dev/null

      - name: Upload stream object +168 producer cross-references
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-Stream-Field168-Xrefs
          path: ${{ runner.temp }}/xowue-stream-field168-xrefs.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Find all PPC references to async stream manager
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile audit/probe_xowue_async_manager_xrefs.py
          python3 audit/probe_xowue_async_manager_xrefs.py \
            --ppc-dir "$RUNNER_TEMP/generated/ppc" \
            --report "$RUNNER_TEMP/xowue-async-stream-manager-xrefs.json"
          test -s "$RUNNER_TEMP/xowue-async-stream-manager-xrefs.json"
          python3 -m json.tool "$RUNNER_TEMP/xowue-async-stream-manager-xrefs.json" >/dev/null

      - name: Upload async stream manager call graph
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-Async-Stream-Manager-Xrefs
          path: ${{ runner.temp }}/xowue-async-stream-manager-xrefs.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Inspect compressed guest table for manager vtable data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile audit/inspect_xowue_guest_tables.py
          python3 audit/inspect_xowue_guest_tables.py
          test -s xowue-guest-tables-inspection.json
          python3 -m json.tool xowue-guest-tables-inspection.json >/dev/null

      - name: Upload guest static-table inspection
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-Guest-Static-Table-Inspection
          path: xowue-guest-tables-inspection.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Inspect generated PPC memory ABI and guest table decoder inputs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== generated archive files ==="
            find "$RUNNER_TEMP/generated" -maxdepth 3 -type f | sort
            echo "=== PPC store/load definitions ==="
            grep -R -n -E 'PPC_STORE_U32|PPC_STORE_U64|PPC_LOAD_U32|#define PPC_STORE|storeGuestBe32' Runtime "$RUNNER_TEMP/generated" 2>/dev/null | head -n 1200 || true
            echo "=== generated shared headers ==="
            find "$RUNNER_TEMP/generated" Runtime -type f \( -name '*shared*.h' -o -name '*recomp*.h' \) -print
          } > "$RUNNER_TEMP/xowue-ppc-memory-abi.txt"
          test -s "$RUNNER_TEMP/xowue-ppc-memory-abi.txt"

          python3 - <<'PY'
          from pathlib import Path
          import json, zlib, hashlib
          packed=Path("tools/xowue_tables.guest.bin.z").read_bytes()
          assert packed[4233:4236] == bytes.fromhex("e42fe9")
          packed=bytearray(packed)
          packed[4233:4236]=bytes.fromhex("e5c3ea")
          assert hashlib.sha256(packed).hexdigest()=="64738d001baa4bf0c6c18b9fdfc1d48fd4aa4fdd593550e214d2307f581f9212"
          decoded=zlib.decompress(packed)
          Path("/tmp/xowue-guest-tables-decoded.bin").write_bytes(decoded)
          Path("/tmp/xowue-guest-tables-header.json").write_text(json.dumps({
            "compressed_sha256":hashlib.sha256(packed).hexdigest(),
            "decoded_sha256":hashlib.sha256(decoded).hexdigest(),
            "decoded_size":len(decoded),
            "prefix_hex":decoded[:128].hex()
          },indent=2))
          PY
          cp /tmp/xowue-guest-tables-decoded.bin "$RUNNER_TEMP/"
          cp /tmp/xowue-guest-tables-header.json "$RUNNER_TEMP/"
          find "$RUNNER_TEMP/generated" Runtime -type f \( -name 'ppc_recomp_shared.h' -o -name '*ppc*shared*.h' -o -name 'ppc_context.h' -o -name 'ppc_config.h' \) -print > "$RUNNER_TEMP/xowue-ppc-shared-header-paths.txt"
          while IFS= read -r file; do
            test -n "$file" || continue
            cat "$file" >> "$RUNNER_TEMP/xowue-ppc-memory-abi.txt"
          done < "$RUNNER_TEMP/xowue-ppc-shared-header-paths.txt"

      - name: Upload PPC memory ABI and decoded guest tables
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-PPC-Memory-ABI
          path: |
            ${{ runner.temp }}/xowue-ppc-memory-abi.txt
            \${{ runner.temp }}/xowue-ppc-shared-header-paths.txt
            \${{ runner.temp }}/xowue-guest-tables-decoded.bin
            \${{ runner.temp }}/xowue-guest-tables-header.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload native stream-stall source evidence
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-Startup-Stream-AOT-Source
          path: ${{ runner.temp }}/xowue-stream-stall-aot-source.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
