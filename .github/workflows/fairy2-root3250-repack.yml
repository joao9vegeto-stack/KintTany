name: Fairy2iOS - Fix iPhone second allocator crash (3.25 GiB root, IPA repack)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/root3250_repack_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-iphone-root3250-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repack:
    if: github.ref == 'refs/heads/Fairy2iOS'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout exact Fairy2iOS commit (no other branches)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify full crash memory geometry and guest fingerprint test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile fairy2/scripts/repack_root3250.py
          python3 -m unittest discover -s fairy2/tests -p test_root3250.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path('fairy2/scripts').resolve()))
          import repack_root3250 as fix
          m=fix.memory_geometry()
          t=json.loads(Path('fairy2/root3250_repack_trigger.json').read_text())
          assert t['source_run']==fix.SOURCE_RUN==44986770915
          assert t['source_sha256']==fix.SOURCE_SHA
          assert t['iPhone_crash_pc']=='main+0x227bd9c'
          assert t['iPhone_crash_address']=='0x4257d9e00'
          assert t['new_root_size']==0xd0000000
          assert not t['compile_metal'] and not t['rebuild_native_host']
          assert m['inner_overrun_bytes_before']==24*1024*1024
          assert m['alias_headroom_bytes_after']==192*1024*1024
          print('iPhone crash 23.85MiB outside old root; all five MOVZ cuts 3.25GiB tested')
          PY
      - name: Download the EXACT latest real iPhone IPA by SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/root3250-input"
          gh run download 44986770915 -R joao9vegeto-stack/KintTany \
             -n Fairy2iOS-KTGL-1250MiB-proven-1 -D "$RUNNER_TEMP/root3250-input"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          p=Path(os.environ["RUNNER_TEMP"])/"root3250-input/Fairy2iOS-FairyTail2-KTGL-1250MiB-region-cap.ipa"
          assert p.is_file()
          h=hashlib.sha256()
          with p.open("rb") as f:
           for block in iter(lambda:f.read(8*1024*1024),b""):h.update(block)
          assert h.hexdigest()=="3d2b464701d72eb9abf2a9aaa42e8d59f3cef3efe33203710e515bddf7b315a8"
          print('Trusted previous IPA sha256',h.hexdigest(),'bytes',p.stat().st_size)
          PY
      - name: Repack five verified AArch64 root-region MOVZs, preserve host and all shaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/root3250-output"
          python3 fairy2/scripts/repack_root3250.py \
             --source "$RUNNER_TEMP/root3250-input/Fairy2iOS-FairyTail2-KTGL-1250MiB-region-cap.ipa" \
             --output "$RUNNER_TEMP/root3250-output/Fairy2iOS-FairyTail2-KTGL-3250MiB-root-region.ipa" \
             --report "$RUNNER_TEMP/root3250-output/root3250-report.json"
      - name: Validate final IPA CRC, signed framework, original Metal, FPS and controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path("fairy2/colab").resolve()))
          from ipa_validator import validate_ipa
          p=Path(os.environ['RUNNER_TEMP'])/'root3250-output'
          r=json.loads((p/'root3250-report.json').read_text())
          model={"framework":"DmGame0100B9801F872000.framework",
                 "shader_payload":{"ipa_path":"Frameworks/DmGame0100B9801F872000.framework/msl/b-0724088d3779.img",
                                   "size_bytes":2640519506}}
          proof=validate_ipa(p/r['output_ipa'],model,verify_crc=True)
          assert proof['fps']==[30,60] and proof['swap_ab']
          assert r['guest_root_patch']['changed_bytes']==5
          assert r['guest_root_new_size']==0xd0000000
          assert r['prior_ktgl_1_25g_capacity_preserved']
          assert r['prior_64k_alignment_preserved']
          assert r['prior_128m_heap_preserved']
          assert r['original_metal_lib_sha256']=="ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b"
          assert r['new_ipa_runtime_verified_on_iphone'] is False
          assert r['no_shader_rebuild'] and r['no_native_host_rebuild']
          print("IPA signed and CRC verified; 5 guest bytes only; 2.64 GB original Metal shaders unmodified")
          PY
      - name: Publish only the new corrected IPA and memory geometry proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-iPhone-root3250-fixed-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/root3250-output/Fairy2iOS-FairyTail2-KTGL-3250MiB-root-region.ipa
            ${{ runner.temp }}/root3250-output/root3250-report.json
          if-no-files-found: error
          retention-days: 14
