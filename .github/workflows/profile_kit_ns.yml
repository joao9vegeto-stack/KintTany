name: 2a. Build ProfileKitNS App IPA (v3.1 - FILE COORDINATOR)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
    paths:
      - '.github/workflows/profile_kit_ns.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_profile_kit_ns:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ProfileKitNS v3.1 - WITH FILE COORDINATOR
        run: |
          set -e
          APP_DIR="$RUNNER_TEMP/Payload/ProfileKitNS.app"
          mkdir -p "$APP_DIR" "$RUNNER_TEMP/IconGen" "$RUNNER_TEMP/App"

          cat > "$RUNNER_TEMP/IconGen/gen_icon.m" << 'ICONEOF'
          #import <Foundation/Foundation.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <CoreText/CoreText.h>
          #import <ImageIO/ImageIO.h>

          static void draw_text(CGContextRef ctx, NSString *text, CGFloat fontSize, CGFloat cx, CGFloat cy, CGColorRef color) {
              CTFontRef font = CTFontCreateWithName(CFSTR("Helvetica-Bold"), fontSize, NULL);
              NSDictionary *attrs = @{(id)kCTFontAttributeName:(__bridge id)font,(id)kCTForegroundColorAttributeName:(__bridge id)color};
              NSAttributedString *as = [[NSAttributedString alloc] initWithString:text attributes:attrs];
              CTLineRef line = CTLineCreateWithAttributedString((__bridge CFAttributedStringRef)as);
              CGFloat asc, desc;
              double w = CTLineGetTypographicBounds(line, &asc, &desc, NULL);
              CGContextSetTextMatrix(ctx, CGAffineTransformIdentity);
              CGContextSetTextPosition(ctx, cx - w / 2.0, cy - (asc - desc) / 2.0);
              CTLineDraw(line, ctx);
              CFRelease(line); CFRelease(font);
          }

          static void save_icon(NSString *path, int sz) {
              CGColorSpaceRef cs = CGColorSpaceCreateDeviceRGB();
              CGContextRef ctx = CGBitmapContextCreate(NULL, sz, sz, 8, sz * 4, cs, kCGImageAlphaPremultipliedLast);
              CGFloat s = (CGFloat)sz / 1024.0;
              CGContextSetRGBFillColor(ctx, 0.6, 0.2, 0.8, 1.0);
              CGContextFillRect(ctx, CGRectMake(0, 0, sz, sz));
              CGFloat pad = 92.0 * s;
              CGRect card = CGRectMake(pad, pad, sz - pad * 2, sz - pad * 2);
              CGPathRef cardPath = CGPathCreateWithRoundedRect(card, 180.0 * s, 180.0 * s, NULL);
              CGContextAddPath(ctx, cardPath);
              CGContextSetRGBFillColor(ctx, 0.09, 0.10, 0.14, 1.0);
              CGContextFillPath(ctx);
              CGPathRelease(cardPath);
              CGColorRef white = CGColorCreateGenericRGB(1, 1, 1, 1);
              CGColorRef cyan = CGColorCreateGenericRGB(0.0, 0.96, 0.83, 1);
              draw_text(ctx, @"PK", 420.0 * s, sz / 2.0, sz * 0.56, white);
              draw_text(ctx, @"PROFILE", 78.0 * s, sz / 2.0, sz * 0.25, cyan);
              CGColorRelease(white); CGColorRelease(cyan);
              CGImageRef img = CGBitmapContextCreateImage(ctx);
              CGImageDestinationRef dest = CGImageDestinationCreateWithURL((__bridge CFURLRef)[NSURL fileURLWithPath:path], CFSTR("public.png"), 1, NULL);
              CGImageDestinationAddImage(dest, img, NULL);
              CGImageDestinationFinalize(dest);
              CFRelease(dest); CGImageRelease(img); CGContextRelease(ctx); CGColorSpaceRelease(cs);
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  NSString *outDir = [NSString stringWithUTF8String:argv[1]];
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon60x60@2x.png"], 120);
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon60x60@3x.png"], 180);
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon1024.png"], 1024);
              }
              return 0;
          }
          ICONEOF

          clang -fobjc-arc "$RUNNER_TEMP/IconGen/gen_icon.m" -framework Foundation -framework CoreGraphics -framework CoreText -framework ImageIO -o "$RUNNER_TEMP/IconGen/gen_icon"
          "$RUNNER_TEMP/IconGen/gen_icon" "$APP_DIR"

          mkdir -p "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset"
          cp "$APP_DIR/AppIcon60x60@2x.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_120.png"
          cp "$APP_DIR/AppIcon60x60@3x.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_180.png"
          cp "$APP_DIR/AppIcon1024.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_1024.png"
          cat > "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/Contents.json" << 'JSONEOF'
          {"images":[{"filename":"icon_120.png","idiom":"iphone","scale":"2x","size":"60x60"},{"filename":"icon_180.png","idiom":"iphone","scale":"3x","size":"60x60"},{"filename":"icon_1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSONEOF

          xcrun actool "$RUNNER_TEMP/Assets.xcassets" --compile "$APP_DIR" --platform iphoneos --minimum-deployment-target 17.0 --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/assetcatalog_info.plist" || true

          cat > "$RUNNER_TEMP/App/main.m" << 'OBJCEOF'
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>

          #define PK_BG_COLOR [UIColor colorWithRed:0.11 green:0.12 blue:0.15 alpha:1.0]
          #define PK_CARD_COLOR [UIColor colorWithRed:0.16 green:0.18 blue:0.22 alpha:1.0]
          #define PK_PURPLE_COLOR [UIColor colorWithRed:0.6 green:0.2 blue:0.8 alpha:1.0]
          #define PK_CYAN_GLOW [UIColor colorWithRed:0.0 green:0.96 blue:0.83 alpha:1.0]

          @interface FileAnalyzer : NSObject
          + (NSDictionary *)analyzeDirectory:(NSURL *)dirURL;
          @end

          @implementation FileAnalyzer

          + (NSDictionary *)analyzeDirectory:(NSURL *)dirURL {
              NSMutableDictionary *result = [NSMutableDictionary dictionary];
              NSFileManager *fm = NSFileManager.defaultManager;
              NSError *err = nil;
              
              __block NSInteger pakCount = 0, ucasCount = 0, utocCount = 0;
              __block BOOL hasManifest = NO;
              __block NSString *gameName = @"Unknown";
              __block NSString *buildInfo = @"";
              __block NSString *titleId = @"0100000000000000";
              
              // 🔑 ACESSO COM NSFileCoordinator
              NSFileCoordinator *coordinator = [[NSFileCoordinator alloc] initWithFilePresenter:nil];
              [coordinator coordinateReadingItemAtURL:dirURL options:NSFileCoordinatorReadingForUploading error:&err byAccessor:^(NSURL *newURL) {
                  NSArray *contents = [fm contentsOfDirectoryAtURL:newURL includingPropertiesForKeys:@[NSURLTypeIdentifierKey] options:NSDirectoryEnumerationSkipsHiddenFiles error:nil];
                  
                  for (NSURL *item in contents) {
                      NSString *filename = item.lastPathComponent;
                      
                      // Detectar Manifest
                      if ([filename.lowercaseString hasPrefix:@"manifest_ufsfiles"]) {
                          hasManifest = YES;
                      }
                      
                      // Ler UECommandLine.txt
                      if ([filename.lowercaseString isEqualToString:@"uecommandline.txt"]) {
                          NSString *content = [NSString stringWithContentsOfURL:item encoding:NSUTF8StringEncoding error:nil];
                          if (content) buildInfo = [content stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
                      }
                      
                      // Ler title_id.txt
                      if ([filename.lowercaseString isEqualToString:@"title_id.txt"]) {
                          NSString *content = [NSString stringWithContentsOfURL:item encoding:NSUTF8StringEncoding error:nil];
                          if (content) {
                              content = [content stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
                              if (content.length == 16) titleId = content;
                          }
                      }
                      
                      // Extrair nome do jogo (pasta de primeiro nível)
                      if ([filename.lowercaseString isEqualToString:@"sparkingzero"]) {
                          gameName = filename;
                      }
                      
                      // Procurar recursivamente por .pak, .ucas, .utoc
                      [self scanDirectoryRecursive:item forPakCount:&pakCount ucasCount:&ucasCount utocCount:&utocCount fm:fm];
                  }
              }];
              
              result[@"gameName"] = gameName;
              result[@"titleId"] = titleId;
              result[@"buildInfo"] = buildInfo;
              result[@"pakCount"] = @(pakCount);
              result[@"ucasCount"] = @(ucasCount);
              result[@"utocCount"] = @(utocCount);
              result[@"hasManifest"] = @(hasManifest);
              
              // Determinar shader groups REAL
              NSString *shaderGroups = @"default=default";
              if (hasManifest && pakCount > 0 && ucasCount > 0 && utocCount > 0) {
                  shaderGroups = @"ShaderArchive-Global-=global ShaderArchive-=game";
              } else if (pakCount > 0 && utocCount > 0) {
                  shaderGroups = @"ShaderArchive-=game";
              }
              result[@"shaderGroups"] = shaderGroups;
              
              // Memory
              NSString *memReserve = @"0x30000000", *memAlias = @"0x10000000";
              if (hasManifest) {
                  memReserve = @"0x1028000000";
                  memAlias = @"0x1000000000";
              }
              result[@"memReserve"] = memReserve;
              result[@"memAlias"] = memAlias;
              result[@"fps"] = @"60";
              
              return result;
          }

          + (void)scanDirectoryRecursive:(NSURL *)dirURL forPakCount:(NSInteger *)pakCount ucasCount:(NSInteger *)ucasCount utocCount:(NSInteger *)utocCount fm:(NSFileManager *)fm {
              NSError *err = nil;
              NSArray *contents = [fm contentsOfDirectoryAtURL:dirURL includingPropertiesForKeys:@[NSURLTypeIdentifierKey] options:NSDirectoryEnumerationSkipsHiddenFiles error:&err];
              
              for (NSURL *item in contents) {
                  NSString *filename = item.lastPathComponent.lowercaseString;
                  
                  if ([filename hasSuffix:@".pak"]) (*pakCount)++;
                  else if ([filename hasSuffix:@".ucas"]) (*ucasCount)++;
                  else if ([filename hasSuffix:@".utoc"]) (*utocCount)++;
                  
                  // Recursivo
                  BOOL isDir = NO;
                  if ([fm fileExistsAtPath:item.path isDirectory:&isDir] && isDir) {
                      [self scanDirectoryRecursive:item forPakCount:pakCount ucasCount:ucasCount utocCount:utocCount fm:fm];
                  }
              }
          }

          @end

          @interface ProfileKitVC : UIViewController
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UIProgressView *progressBar;
          @property (nonatomic, strong) UITextView *logView;
          @property (nonatomic, strong) UIButton *analyzeBtn;
          @property (nonatomic, strong) NSURL *romfsURL;
          @end

          @implementation ProfileKitVC

          - (UIStatusBarStyle)preferredStatusBarStyle { return UIStatusBarStyleLightContent; }
          - (NSString *)docs { return NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0]; }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = PK_BG_COLOR;
              CGFloat w = self.view.bounds.size.width, h = self.view.bounds.size.height;

              UIView *leftRail = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 5, h)];
              leftRail.autoresizingMask = UIViewAutoresizingFlexibleHeight;
              leftRail.backgroundColor = PK_PURPLE_COLOR;
              [self.view addSubview:leftRail];

              UIView *rightRail = [[UIView alloc] initWithFrame:CGRectMake(w - 5, 0, 5, h)];
              rightRail.autoresizingMask = UIViewAutoresizingFlexibleHeight | UIViewAutoresizingFlexibleLeftMargin;
              rightRail.backgroundColor = PK_PURPLE_COLOR;
              [self.view addSubview:rightRail];

              UIView *header = [[UIView alloc] initWithFrame:CGRectMake(16, 54, w - 32, 60)];
              header.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              header.backgroundColor = PK_CARD_COLOR;
              header.layer.cornerRadius = 16;
              [self.view addSubview:header];

              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(20, 10, w - 60, 22)];
              title.text = @"ProfileKitNS";
              title.textColor = UIColor.whiteColor;
              title.font = [UIFont systemFontOfSize:20 weight:UIFontWeightHeavy];
              [header addSubview:title];

              UILabel *sub = [[UILabel alloc] initWithFrame:CGRectMake(20, 33, w - 60, 14)];
              sub.text = @"REAL ANALYZER v3.1 - FILE COORDINATOR";
              sub.textColor = PK_CYAN_GLOW;
              sub.font = [UIFont systemFontOfSize:9.5 weight:UIFontWeightBold];
              [header addSubview:sub];

              self.statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 130, w - 40, 16)];
              self.statusLabel.textColor = PK_CYAN_GLOW;
              self.statusLabel.font = [UIFont systemFontOfSize:11.5 weight:UIFontWeightSemibold];
              self.statusLabel.text = @"🔍 Buscando...";
              [self.view addSubview:self.statusLabel];

              self.progressBar = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
              self.progressBar.frame = CGRectMake(20, 152, w - 40, 5);
              self.progressBar.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              self.progressBar.trackTintColor = PK_CARD_COLOR;
              self.progressBar.progressTintColor = PK_CYAN_GLOW;
              [self.view addSubview:self.progressBar];

              self.logView = [[UITextView alloc] initWithFrame:CGRectMake(16, 170, w - 32, h - 262)];
              self.logView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.logView.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.10 alpha:1.0];
              self.logView.textColor = [UIColor colorWithRed:0.75 green:0.88 blue:0.95 alpha:1.0];
              self.logView.font = [UIFont monospacedSystemFontOfSize:11.5 weight:UIFontWeightRegular];
              self.logView.layer.cornerRadius = 14;
              self.logView.editable = NO;
              self.logView.textContainerInset = UIEdgeInsetsMake(10, 10, 10, 10);
              self.logView.text = @"[ProfileKitNS v3.1]\nCom NSFileCoordinator\n\nAnalisando estrutura...";
              [self.view addSubview:self.logView];

              self.analyzeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.analyzeBtn.frame = CGRectMake(16, h - 78, w - 32, 52);
              self.analyzeBtn.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleTopMargin;
              self.analyzeBtn.backgroundColor = PK_PURPLE_COLOR;
              self.analyzeBtn.layer.cornerRadius = 14;
              [self.analyzeBtn setTitle:@"EXTRAIR VALORES REAIS" forState:UIControlStateNormal];
              [self.analyzeBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.analyzeBtn.titleLabel.font = [UIFont systemFontOfSize:15 weight:UIFontWeightHeavy];
              [self.analyzeBtn addTarget:self action:@selector(doAnalysis) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.analyzeBtn];

              [[NSFileManager defaultManager] createDirectoryAtPath:[self.docs stringByAppendingPathComponent:@"Profiles"] withIntermediateDirectories:YES attributes:nil error:nil];

              [self findRomfs];
          }

          - (void)log:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  self.logView.text = [self.logView.text stringByAppendingFormat:@"%@\n", msg];
                  [self.logView scrollRangeToVisible:NSMakeRange(self.logView.text.length - 1, 1)];
              });
          }

          - (void)findRomfs {
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSFileManager *fm = NSFileManager.defaultManager;
                  NSString *doc = self.docs;
                  NSError *err = nil;
                  NSArray *contents = [fm contentsOfDirectoryAtPath:doc error:&err];
                  
                  for (NSString *item in contents) {
                      NSString *full = [doc stringByAppendingPathComponent:item];
                      BOOL isDir = NO;
                      if ([fm fileExistsAtPath:full isDirectory:&isDir] && isDir) {
                          if ([item isEqualToString:@"romfs"]) {
                              self.romfsURL = [NSURL fileURLWithPath:full isDirectory:YES];
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  self.statusLabel.text = @"✅ RomFS encontrada!";
                                  self.analyzeBtn.enabled = YES;
                                  [self log:@"✓ RomFS detectada com sucesso!"];
                              });
                              return;
                          }
                      }
                  }
                  
                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.statusLabel.text = @"❌ RomFS não encontrada";
                      self.analyzeBtn.enabled = NO;
                      [self log:@"❌ Pasta romfs/ não encontrada"];
                  });
              });
          }

          - (void)doAnalysis {
              if (!self.romfsURL) return;
              self.analyzeBtn.enabled = NO;
              self.progressBar.progress = 0.1;
              self.statusLabel.text = @"🔬 Analisando com NSFileCoordinator...";

              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  [self log:@"\n════════════════════════════════\n📊 ANÁLISE REAL v3.1\n════════════════════════════════\n"];

                  // ⏱️ TIMING REAL
                  CFTimeInterval start = CFAbsoluteTimeGetCurrent();
                  NSDictionary *analysis = [FileAnalyzer analyzeDirectory:self.romfsURL];
                  CFTimeInterval elapsed = CFAbsoluteTimeGetCurrent() - start;

                  dispatch_async(dispatch_get_main_queue(), ^{ self.progressBar.progress = 0.5; });

                  NSString *gameTitle = analysis[@"gameName"];
                  NSString *titleId = analysis[@"titleId"];
                  NSString *profileFolder = [NSString stringWithFormat:@"profile-%@-%@", gameTitle, titleId];
                  NSString *profilePath = [[self.docs stringByAppendingPathComponent:@"Profiles"] stringByAppendingPathComponent:profileFolder];

                  [[NSFileManager defaultManager] removeItemAtPath:profilePath error:nil];
                  [[NSFileManager defaultManager] createDirectoryAtPath:profilePath withIntermediateDirectories:YES attributes:nil error:nil];

                  [self log:[NSString stringWithFormat:@"⏱️ Análise levou: %.2f segundos\n", elapsed]];
                  [self log:[NSString stringWithFormat:@"📁 Pasta: %@\n", profileFolder]];
                  [self log:[NSString stringWithFormat:@"🎮 Jogo: %@", gameTitle]];
                  [self log:[NSString stringWithFormat:@"🔑 Title ID: %@", titleId]];
                  [self log:[NSString stringWithFormat:@"📦 .pak files: %ld", (long)[analysis[@"pakCount"] integerValue]]];
                  [self log:[NSString stringWithFormat:@"📦 .ucas files: %ld", (long)[analysis[@"ucasCount"] integerValue]]];
                  [self log:[NSString stringWithFormat:@"📦 .utoc files: %ld", (long)[analysis[@"utocCount"] integerValue]]];
                  [self log:[NSString stringWithFormat:@"✅ Manifest: %@", [analysis[@"hasManifest"] boolValue] ? @"SIM (Unreal!)" : @"NÃO"]];

                  NSString *shaderGroups = analysis[@"shaderGroups"];
                  NSString *memReserve = analysis[@"memReserve"];
                  NSString *memAlias = analysis[@"memAlias"];
                  NSString *build = analysis[@"buildInfo"];
                  NSString *fps = analysis[@"fps"];

                  NSString *gameTsv = [NSString stringWithFormat:@"title_id\tprogram_id\tname\tipa\tbuild\tmodules\tromfs_marker\tfps_target\tmem_reserve\tmem_alias\tmem_stack\tapp_pool\tshader_groups\tshader_note\n%@\t%@\t%@\t\t%@\tmain\t\t%@\t%@\t%@\t0x10000000\t0xCD500000\t%@\t\n",
                      titleId, titleId, gameTitle, build, fps, memReserve, memAlias, shaderGroups];

                  [gameTsv writeToFile:[profilePath stringByAppendingPathComponent:@"game.tsv"] atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  [@"key\toffset\tarchive\tcompressed\n" writeToFile:[profilePath stringByAppendingPathComponent:@"shader_map.tsv"] atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  [@"key\tstage\tbindings\tregisters\n" writeToFile:[profilePath stringByAppendingPathComponent:@"shader_facts.tsv"] atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  [@"vertex\tpixel\n" writeToFile:[profilePath stringByAppendingPathComponent:@"shader_pairs.tsv"] atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  [@"hash\tvertex_shader\tpixel_shader\tstate\n" writeToFile:[profilePath stringByAppendingPathComponent:@"pso_manifest.tsv"] atomically:YES encoding:NSUTF8StringEncoding error:nil];

                  dispatch_async(dispatch_get_main_queue(), ^{ self.progressBar.progress = 0.9; });

                  [self log:[NSString stringWithFormat:@"\n✅ Shaders: %@", shaderGroups]];
                  [self log:[NSString stringWithFormat:@"✅ Memória: %@", memReserve]];
                  [self log:[NSString stringWithFormat:@"✅ FPS: %@", fps]];
                  [self log:@"\n════════════════════════════════"];
                  [self log:@"✅ PERFIL CRIADO COM VALORES REAIS!"];
                  [self log:@"════════════════════════════════"];

                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.progressBar.progress = 1.0;
                      self.statusLabel.text = @"✅ Análise REAL completa!";
                      self.analyzeBtn.enabled = YES;
                  });
              });
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [ProfileKitVC new];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          OBJCEOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -isysroot "$SDK_PATH" -fobjc-arc "$RUNNER_TEMP/App/main.m" -framework UIKit -framework Foundation -framework CoreGraphics -o "$APP_DIR/ProfileKitNS"

          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ProfileKitNS</string>
            <key>CFBundleIdentifier</key><string>com.kinttany.profilekitns</string>
            <key>CFBundleName</key><string>ProfileKitNS</string>
            <key>CFBundleDisplayName</key><string>ProfileKitNS</string>
            <key>CFBundleVersion</key><string>3.1</string>
            <key>CFBundleShortVersionString</key><string>3.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>CFBundleIconName</key><string>AppIcon</string>
          </dict>
          </plist>
          PLIST

          codesign -f -s - "$APP_DIR"
          cd "$RUNNER_TEMP"
          zip -qry "$RUNNER_TEMP/ProfileKitNS.ipa" Payload
          ls -lh "$RUNNER_TEMP/ProfileKitNS.ipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfileKitNS-v3.1-IPA
          path: ${{ runner.temp }}/ProfileKitNS.ipa

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0-kit "$RUNNER_TEMP/ProfileKitNS.ipa" --repo "$GITHUB_REPOSITORY" --clobber || true
