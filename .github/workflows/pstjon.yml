name: PsTJon iOS

on:
  push:
    branches: [PsTJon]
  workflow_dispatch:

concurrency:
  group: pstjon-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      IOS_DEPLOYMENT_TARGET: "17.4"
      RPCS3_IOS_SHA: "3ec23f1fef57071c808726f68121cfeb601eeb1e"
      MOLTENVK_VERSION: "1.4.2"
      FFMPEG_VERSION: "8.1.1"
      OFFICIAL_IPA_SHA256: "e017a90947c3058f2c55b33d8a177be6591157afcdcdd97c7725b15e9ec1b625"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 and toolchain
        run: |
          set -euxo pipefail
          xcode_apps=(/Applications/Xcode_26*.app)
          if [[ ! -d "${xcode_apps[0]}" ]]; then
            echo "::error::Xcode 26 not found"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          selected_xcode="${xcode_apps[${#xcode_apps[@]}-1]}"
          sudo xcode-select --switch "${selected_xcode}/Contents/Developer"
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          brew list ccache >/dev/null 2>&1 || brew install ccache
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          ccache --version

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: pstjon-ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.RPCS3_IOS_SHA }}-v1
          restore-keys: |
            pstjon-ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.RPCS3_IOS_SHA }}-
            pstjon-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=4G
          ccache --zero-stats

      - name: Fetch RPCS3 ios-port
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/XITRIX/rpcs3.git rpcs3-src
          cd rpcs3-src
          git checkout "$RPCS3_IOS_SHA"
          git submodule update --init --recursive --depth 1
          git rev-parse HEAD

      - name: Apply iOS compiler compatibility fixes
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("rpcs3-src/rpcs3/Emu/Cell/PPUDisAsm.h")
          s = p.read_text()
          old = 'default: fmt::throw_exception("Unreachable");\n\t\t}'
          new = 'default: fmt::throw_exception("Unreachable");\n\t\t}\n\t\t__builtin_unreachable();'
          if old not in s:
              raise SystemExit("PPUDisAsm pattern not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("rpcs3-src/rpcs3/Emu/Cell/SPUThread.h")
          s = p.read_text()
          old = 'default:\n\t\t\tfmt::throw_exception("Unexpected slice value (%d)", slice);\n\t\t}'
          new = 'default:\n\t\t\tfmt::throw_exception("Unexpected slice value (%d)", slice);\n\t\t}\n\t\t__builtin_unreachable();'
          if old not in s:
              raise SystemExit("SPUThread pattern not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("rpcs3-src/rpcs3/util/atomic.cpp")
          s = p.read_text()
          old = 'fmt::throw_exception("Thread semaphore limit (65535) reached in atomic wait.");\n}'
          new = 'fmt::throw_exception("Thread semaphore limit (65535) reached in atomic wait.");\n\t__builtin_unreachable();\n}'
          if old not in s:
              raise SystemExit("atomic.cpp pattern not found")
          p.write_text(s.replace(old, new, 1))

          # Xcode 26 / AppleClang 17 diagnoses several upstream constructs more
          # aggressively than the toolchain used by the iOS port. Keep every
          # warning visible, but do not make warning-only portability diagnostics
          # fatal for the iOS build. This prevents one 30+ minute CI cycle per
          # newly encountered warning while preserving real compiler/link errors.
          p = Path("rpcs3-src/buildfiles/cmake/ConfigureCompiler.cmake")
          s = p.read_text()
          count = s.count("add_compile_options(-Werror=")
          if count < 5:
              raise SystemExit(f"unexpected Werror layout: {count}")
          s = s.replace("add_compile_options(-Werror=", "add_compile_options(-Wno-error=")
          p.write_text(s)
          PY

      - name: Verify modern Ascension Vulkan fixes
        run: |
          set -euxo pipefail
          cd rpcs3-src
          git merge-base --is-ancestor c27b38f3001ffecfddc1d71c3b34d37cd596e754 HEAD
          python3 rpcs3/ios/tests/run-vk-image-pool-tests.py
          python3 rpcs3/ios/tests/run-vk-memory-pressure-tests.py

      - name: Apply PsTJon v11 Ascension FIFO 1K safe iounmap and 30 FPS profile
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # v8 proved that post-facto NV3089 suppression is the wrong layer:
          # thousands of destination commands were discarded, textures degraded,
          # and the next invalid source still entered recover_fifo(). Restore the
          # modern upstream blit decoder completely and prevent the command-stream
          # desync earlier by restoring precise FIFO GET publication for Ascension.
          p = Path("rpcs3-src/rpcs3/Emu/System.cpp")
          s = p.read_text()
          old = '''\t\t\t// Force audio provider
          \t\t\tif (m_path.ends_with("vsh.self"sv))'''
          new = '''#ifdef RPCS3_IOS
          \t\t\tif (m_title_id == "BCUS98232")
          \t\t\t{
          \t\t\t\tconst bool had_cpu_blit = g_cfg.video.force_cpu_blit_processing.get();
          \t\t\t\tconst bool had_sync_memory = g_cfg.video.disable_async_host_memory_manager.get();
          \t\t\t\tconst u32 had_wakeup_delay = g_cfg.video.driver_wakeup_delay.get();
          \t\t\t\tg_cfg.video.force_cpu_blit_processing.set(false);
          \t\t\t\tg_cfg.video.disable_async_host_memory_manager.set(false);
          \t\t\t\tg_cfg.core.rsx_fifo_accuracy.set(rsx_fifo_mode::atomic_ordered);
          \t\t\t\t// Ascension recycles/unmaps RSX IO aggressively. Keep the
          \t\t\t\t// original RPCS3-sized read-ahead window and expose the
          \t\t\t\t// execution position without the mobile GET deferral.
          \t\t\t\tg_cfg.ios_experimental.fifo_cache_size.set(ios_fifo_cache_size::_1_kib);
          \t\t\t\tg_cfg.ios_experimental.fifo_idle_mode.set(ios_fifo_idle_mode::yield);
          \t\t\t\tg_cfg.ios_experimental.deferred_get_publishing.set(ios_experimental_mode::disabled);
          \t\t\t\tg_cfg.video.driver_wakeup_delay.set(0);
          \t\t\t\tg_cfg.video.shadermode.set(shader_mode::async_recompiler);
          \t\t\t\tg_cfg.video.shader_precision.set(gpu_preset_level::high);
          \t\t\t\tg_cfg.video.frame_limit.set(frame_limit_type::_30);
          \t\t\t\tg_cfg.video.output_scaling.set(output_scaling_mode::bilinear);
          \t\t\t\tg_cfg.video.write_color_buffers.set(true);
          \t\t\t\tsys_log.notice("PsTJon v11 Ascension policy: CPU Blit %d->0, Async Memory Manager %d->active, Ordered & Atomic, FIFO 1KiB/yield, deferred GET off, wake %u->0, Async Recompiler, High precision, WCB, 30 FPS",
          \t\t\t\t\thad_cpu_blit, had_sync_memory, had_wakeup_delay);
          \t\t\t}
          #endif

          \t\t\t// Force audio provider
          \t\t\tif (m_path.ends_with("vsh.self"sv))'''
          if old not in s:
              raise SystemExit("System.cpp Ascension policy insertion pattern not found")
          p.write_text(s.replace(old, new, 1))

          # Audio: keep the v7 lifecycle bridge proven healthy by the v8 log.
          p = Path("rpcs3-src/rpcs3/ios/RPCS3IOSPlatform.mm")
          s = p.read_text()

          old = '''\trpcs3::ios::graphics_lifecycle_state().set_active(false);
          \tios_graphics_log.notice("Vulkan submissions suspended and GPU work drained before backgrounding");'''
          new = '''\trpcs3::ios::graphics_lifecycle_state().set_active(false);
          \trpcs3::ios::audio_session_state().set_active(false);
          \tios_graphics_log.notice("Vulkan submissions suspended and GPU work drained before backgrounding");'''
          if old not in s:
              raise SystemExit("audio willResignActive pattern not found")
          s = s.replace(old, new, 1)

          old = '''\trpcs3::ios::graphics_lifecycle_state().set_active(true);
          \tios_graphics_log.notice("Vulkan submissions resumed; next frame will refresh the swapchain");'''
          new = '''\trpcs3::ios::graphics_lifecycle_state().set_active(true);
          \trpcs3::ios::audio_session_state().set_active(true);
          \tios_graphics_log.notice("Vulkan submissions resumed; next frame will refresh the swapchain");'''
          if old not in s:
              raise SystemExit("audio didBecomeActive pattern not found")
          s = s.replace(old, new, 1)

          old = '''\t\t\tgraphics_lifecycle_state().set_active(UIApplication.sharedApplication.applicationState == UIApplicationStateActive);
          \t\t});'''
          new = '''\t\t\tconst bool active = UIApplication.sharedApplication.applicationState == UIApplicationStateActive;
          \t\t\tgraphics_lifecycle_state().set_active(active);
          \t\t\taudio_session_state().set_active(active);
          \t\t});'''
          if old not in s:
              raise SystemExit("audio initial activation pattern not found")
          s = s.replace(old, new, 1)

          # Keep title-scoped physical iPhone haptics from v7/v8.
          anchor = '''#include <dispatch/dispatch.h>

          '''
          haptic = '''#include <dispatch/dispatch.h>

          extern "C" void pstjon_ios_haptic_pulse(uint8_t large_motor, uint8_t small_motor) noexcept
          {
          #if TARGET_OS_OSX || TARGET_OS_VISION
          \t(void)large_motor;
          \t(void)small_motor;
          #else
          \tif (!large_motor && !small_motor)
          \t{
          \t\treturn;
          \t}
          \tconst uint8_t strength = large_motor > small_motor ? large_motor : small_motor;
          \tconst UIImpactFeedbackStyle style =
          \t\tstrength >= 170 ? UIImpactFeedbackStyleHeavy :
          \t\tstrength >= 80 ? UIImpactFeedbackStyleMedium :
          \t\tUIImpactFeedbackStyleLight;
          \tconst CGFloat intensity = 0.20 + (0.80 * (static_cast<CGFloat>(strength) / 255.0));
          \tdispatch_async(dispatch_get_main_queue(), ^
          \t{
          \t\t@autoreleasepool
          \t\t{
          \t\t\tUIImpactFeedbackGenerator* generator = [[UIImpactFeedbackGenerator alloc] initWithStyle:style];
          \t\t\t[generator prepare];
          \t\t\t[generator impactOccurredWithIntensity:intensity];
          \t\t\t[generator release];
          \t\t}
          \t});
          #endif
          }

          '''
          if anchor not in s:
              raise SystemExit("haptic insertion anchor not found")
          s = s.replace(anchor, haptic, 1)
          p.write_text(s)

          p = Path("rpcs3-src/rpcs3/Emu/Io/IOS/IOSPadHandler.cpp")
          s = p.read_text()
          old = '#include "Emu/Io/pad_config.h"\n'
          new = '#include "Emu/Io/pad_config.h"\n#include "Emu/System.h"\n#include "util/logs.hpp"\n#include <array>\n#include <atomic>\n\nextern "C" void pstjon_ios_haptic_pulse(unsigned char large_motor, unsigned char small_motor) noexcept;\n\nLOG_CHANNEL(ios_pad_log, "iOS Pad");\n'
          if old not in s:
              raise SystemExit("IOSPadHandler include pattern not found")
          s = s.replace(old, new, 1)

          old = '''\tconst u8 large_motor = device->config->get_large_motor_speed(pad->m_vibrate_motors);
          \tconst u8 small_motor = device->config->get_small_motor_speed(pad->m_vibrate_motors);
          \trpcs3::ios::shared_pad_feedback().update(device->player_id, large_motor, small_motor);'''
          new = '''\tconst u8 large_motor = device->config->get_large_motor_speed(pad->m_vibrate_motors);
          \tconst u8 small_motor = device->config->get_small_motor_speed(pad->m_vibrate_motors);
          \trpcs3::ios::shared_pad_feedback().update(device->player_id, large_motor, small_motor);

          \tstatic std::array<std::atomic<u16>, rpcs3::ios::pad_player_count> s_last_feedback{};
          \tif (device->player_id < s_last_feedback.size())
          \t{
          \t\tconst u16 packed = static_cast<u16>(large_motor) | (static_cast<u16>(small_motor) << 8);
          \t\tconst u16 previous = s_last_feedback[device->player_id].exchange(packed, std::memory_order_relaxed);
          \t\tif (previous != packed && (previous != 0 || packed != 0))
          \t\t{
          \t\t\tios_pad_log.notice("PsTJon v11 rumble p%u: large=%u small=%u", device->player_id + 1, large_motor, small_motor);
          \t\t\tif (device->player_id == 0 && packed != 0 && Emu.GetTitleID() == "BCUS98232")
          \t\t\t{
          \t\t\t\tpstjon_ios_haptic_pulse(large_motor, small_motor);
          \t\t\t}
          \t\t}
          \t}'''
          if old not in s:
              raise SystemExit("IOSPadHandler rumble pattern not found")
          p.write_text(s.replace(old, new, 1))

          # v11: serialize destructive IO unmaps against the RSX frontend
          # without holding the VM writer lock while waiting for RSX to pause.
          # Also discard prefetched FIFO bytes and publish the true executed GET
          # before the translation entries are destroyed.
          p = Path("rpcs3-src/rpcs3/Emu/Cell/lv2/sys_rsx.cpp")
          s = p.read_text()
          old = '''\tvm::writer_lock rlock;

          \tstd::scoped_lock lock(render->sys_rsx_mtx);

          \tfor (const u64 end = (io >>= 20) + (size >>= 20); io < end;)
          '''
          new = '''\t// Stop RSX before taking the VM writer lock. The opposite order
          \t// can deadlock if RSX needs VM access while acknowledging pause.
          \trsx::eng_lock fifo_lock(render);
          \tvm::writer_lock rlock;

          \t// Drop prefetched commands and publish the actual execution
          \t// position before invalidating their IO translations.
          \tif (render->fifo_ctrl)
          \t{
          \t\trender->fifo_ctrl->invalidate_cache();
          \t\trender->fifo_ctrl->sync_get_force();
          \t}

          \tstd::scoped_lock lock(render->sys_rsx_mtx);

          \tfor (const u64 end = (io >>= 20) + (size >>= 20); io < end;)
          '''
          if old not in s:
              raise SystemExit("sys_rsx_context_iounmap synchronization anchor not found")
          p.write_text(s.replace(old, new, 1))

          # Universal JIT is healthy and used only a fraction of its 1024 MiB
          # arena in every PsTJon trace. Universal preparation touches executable
          # pages, so cap the shell's 1024 MiB request at 512 MiB and return that
          # physical headroom to the renderer.
          p = Path("rpcs3-src/Utilities/JITIOS.cpp")
          s = p.read_text()
          old = '''u32 process_expanded_jit_arena_capacity() noexcept
          {
          \tconst char* const value = std::getenv(expanded_jit_arena_environment);
          \treturn value ? rpcs3::ios::jit::parse_expanded_arena_capacity(value) : 0;
          }
          '''
          new = '''u32 process_expanded_jit_arena_capacity() noexcept
          {
          \tconst char* const value = std::getenv(expanded_jit_arena_environment);
          \tif (!value)
          \t{
          \t\treturn 0;
          \t}
          \tconst u32 requested = rpcs3::ios::jit::parse_expanded_arena_capacity(value);
          \treturn requested != std::numeric_limits<u32>::max() && requested > 512 ? 512 : requested;
          }
          '''
          if old not in s:
              raise SystemExit("JIT arena capacity anchor not found")
          p.write_text(s.replace(old, new, 1))

          # The A19 Pro exposes 11.7 GiB unified memory. Reinvest the 512 MiB
          # saved above into Vulkan's pressure ceiling: 2.0 -> 2.5 GiB. This is
          # deliberately conservative; process-headroom pressure still wins and
          # the v7 severe/fatal reclaim policy remains active.
          p = Path("rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/VRAMBudgetPolicy.h")
          s = p.read_text()
          old = 'inline constexpr std::uint64_t ios_vram_budget_max = 2048 * vram_budget_mib;'
          new = 'inline constexpr std::uint64_t ios_vram_budget_max = 2560 * vram_budget_mib;'
          if old not in s:
              raise SystemExit("iOS VRAM budget anchor not found")
          p.write_text(s.replace(old, new, 1))

          # Keep the v7 iOS unified-memory safety. It prevents allocator
          # overcommit from being downgraded after 100%.
          p = Path("rpcs3-src/rpcs3/Emu/RSX/VK/VKResourceManager.cpp")
          s = p.read_text()
          anchor = '''\t\t\t\telse if (local_memory_available > mem_threshold_2)                                   // Enough to hold basic resources like textures, buffers, etc
          \t\t\t\t{
          \t\t\t\t\t// At least 512MB left, do not overreact
          \t\t\t\t\tload_severity = rsx::problem_severity::moderate;
          \t\t\t\t}

          \t\t\t\tif (load_severity >= rsx::problem_severity::moderate)
          '''
          patched = '''\t\t\t\telse if (local_memory_available > mem_threshold_2)                                   // Enough to hold basic resources like textures, buffers, etc
          \t\t\t\t{
          \t\t\t\t\t// At least 512MB left, do not overreact
          \t\t\t\t\tload_severity = rsx::problem_severity::moderate;
          \t\t\t\t}

          #ifdef RPCS3_IOS
          \t\t\t\tif (vmm_load >= 120.f && process_headroom <= rpcs3::ios::process_headroom_severe_enter)
          \t\t\t\t{
          \t\t\t\t\tload_severity = rsx::problem_severity::fatal;
          \t\t\t\t}
          \t\t\t\telse if (vmm_load >= 100.f && load_severity < rsx::problem_severity::severe)
          \t\t\t\t{
          \t\t\t\t\tload_severity = rsx::problem_severity::severe;
          \t\t\t\t}
          #endif

          \t\t\t\tif (load_severity >= rsx::problem_severity::moderate)
          '''
          if anchor not in s:
              raise SystemExit("VK memory-severity anchor not found")
          p.write_text(s.replace(anchor, patched, 1))
          PY

          cd rpcs3-src
          python3 rpcs3/ios/tests/run-vk-image-pool-tests.py
          python3 rpcs3/ios/tests/run-vk-memory-pressure-tests.py
          grep -q 'PsTJon v11 Ascension policy' rpcs3/Emu/System.cpp
          grep -q 'fifo_cache_size.set(ios_fifo_cache_size::_1_kib)' rpcs3/Emu/System.cpp
          grep -q 'fifo_idle_mode.set(ios_fifo_idle_mode::yield)' rpcs3/Emu/System.cpp
          grep -q 'deferred_get_publishing.set(ios_experimental_mode::disabled)' rpcs3/Emu/System.cpp
          grep -q 'shadermode.set(shader_mode::async_recompiler)' rpcs3/Emu/System.cpp
          grep -q 'shader_precision.set(gpu_preset_level::high)' rpcs3/Emu/System.cpp
          grep -q 'frame_limit.set(frame_limit_type::_30)' rpcs3/Emu/System.cpp
          grep -q 'rsx::eng_lock fifo_lock(render)' rpcs3/Emu/Cell/lv2/sys_rsx.cpp
          grep -q 'render->fifo_ctrl->invalidate_cache();' rpcs3/Emu/Cell/lv2/sys_rsx.cpp
          grep -q 'render->fifo_ctrl->sync_get_force();' rpcs3/Emu/Cell/lv2/sys_rsx.cpp
          grep -q 'requested > 512 ? 512 : requested' Utilities/JITIOS.cpp
          grep -q 'ios_vram_budget_max = 2560' rpcs3/Emu/RSX/VK/vkutils/VRAMBudgetPolicy.h
          grep -q 'deferred_get_publishing.set(ios_experimental_mode::disabled)' rpcs3/Emu/System.cpp
          grep -q 'rsx_fifo_accuracy.set(rsx_fifo_mode::atomic_ordered)' rpcs3/Emu/System.cpp
          grep -q 'driver_wakeup_delay.set(0)' rpcs3/Emu/System.cpp
          grep -q 'pstjon_ios_haptic_pulse' rpcs3/ios/RPCS3IOSPlatform.mm
          grep -q 'vmm_load >= 120.f' rpcs3/Emu/RSX/VK/VKResourceManager.cpp
          test -z "$(git diff -- rpcs3/Emu/RSX/NV47/HW/nv3089.cpp)"
          ! grep -E -q 'PsTJon v(3|4|5|7|8)|discarded invalid Ascension|Ascension NV3089' rpcs3/Emu/RSX/NV47/HW/nv3089.cpp

      - name: Fetch MoltenVK
        run: |
          set -euxo pipefail
          mkdir -p deps/mvk
          curl -L --fail --retry 4 "https://github.com/KhronosGroup/MoltenVK/releases/download/v${MOLTENVK_VERSION}/MoltenVK-ios.tar" -o deps/MoltenVK-ios.tar
          tar -xf deps/MoltenVK-ios.tar -C deps/mvk
          MVK_INCLUDE="$(find "$PWD/deps/mvk" -type d -path '*/MoltenVK/include' -print -quit)"
          test -n "$MVK_INCLUDE"
          MVK_ROOT="${MVK_INCLUDE%/MoltenVK/include}"
          test -f "$MVK_ROOT/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          echo "RPCS3_MOLTENVK_ROOT=$MVK_ROOT" >> "$GITHUB_ENV"

      - name: Build FFmpeg 8.1.1 for iOS
        run: |
          set -euxo pipefail
          mkdir -p deps/ffmpeg-src deps/ffmpeg-ios
          curl -L --fail --retry 4 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" -o deps/ffmpeg.tar.xz
          tar -xf deps/ffmpeg.tar.xz -C deps/ffmpeg-src --strip-components=1
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"
          cd deps/ffmpeg-src
          ./configure \
            --prefix="$GITHUB_WORKSPACE/deps/ffmpeg-ios" \
            --target-os=darwin --arch=arm64 --cc="$CC" --cxx="$CXX" --sysroot="$SDKROOT" \
            --enable-cross-compile --enable-pic --disable-shared --enable-static \
            --disable-programs --disable-doc --disable-debug --disable-autodetect \
            --extra-cflags="-arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            --extra-cxxflags="-arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            --extra-ldflags="-arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET} -isysroot $SDKROOT"
          make -j3
          make install
          test -f "$GITHUB_WORKSPACE/deps/ffmpeg-ios/lib/libavcodec.a"
          echo "RPCS3_FFMPEG_ROOT=$GITHUB_WORKSPACE/deps/ffmpeg-ios" >> "$GITHUB_ENV"

      - name: Build native llvm-tblgen
        run: |
          set -euxo pipefail
          LLVM_SRC="$GITHUB_WORKSPACE/rpcs3-src/3rdparty/llvm/llvm/llvm"
          cmake -S "$LLVM_SRC" -B llvm-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF
          cmake --build llvm-host --target llvm-tblgen -j3
          echo "LLVM_NATIVE_TOOL_DIR=$GITHUB_WORKSPACE/llvm-host/bin" >> "$GITHUB_ENV"

      - name: Configure RPCS3Core for iPhone
        run: |
          set -euxo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          CXX="$(xcrun --sdk iphoneos --find clang++)"
          TARGET="arm64-apple-ios$IOS_DEPLOYMENT_TARGET"
          CLANG_RESOURCE="$("$CC" --print-resource-dir)"
          IOS_COMPILER_RT="$CLANG_RESOURCE/lib/darwin/libclang_rt.ios.a"
          test -s "$IOS_COMPILER_RT"
          cmake -S rpcs3-src -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_TARGET="$TARGET" -DCMAKE_CXX_COMPILER_TARGET="$TARGET" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="$IOS_COMPILER_RT" \
            -DRPCS3_FRONTEND=IOS -DUSE_VULKAN=ON \
            -DWITH_LLVM=ON -DBUILD_LLVM=ON -DSTATIC_LINK_LLVM=ON \
            -DLLVM_NATIVE_TOOL_DIR="$LLVM_NATIVE_TOOL_DIR" \
            -DLLVM_TABLEGEN="$LLVM_NATIVE_TOOL_DIR/llvm-tblgen" \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_TARGETS_TO_BUILD=AArch64 -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DBUILD_RPCS3_TESTS=OFF -DRUN_RPCS3_TESTS=OFF \
            -DHAVE_ACCEPT4=0 \
            -DUSE_PRECOMPILED_HEADERS=OFF -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DWITH_DISCORD_RPC=OFF -DWITH_FAUDIO=OFF \
            -DRPCS3_MOLTENVK_ROOT="$RPCS3_MOLTENVK_ROOT" \
            -DRPCS3_FFMPEG_ROOT="$RPCS3_FFMPEG_ROOT"

      - name: Build RPCS3Core
        run: |
          set -euxo pipefail
          cmake --build build-ios --target RPCS3Core -j3
          CORE="$(find build-ios -type f -name 'libRPCS3Core.dylib' -print -quit)"
          test -n "$CORE"
          file "$CORE"
          lipo -info "$CORE"
          cp "$CORE" "$GITHUB_WORKSPACE/libRPCS3Core.dylib"
          ccache --show-stats || true

      - name: Repack official RPCS3 shell
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 "https://github.com/XITRIX/RPCS3-iOS-Releases/releases/download/v0.10.1/RPCS3.ipa" -o RPCS3-official.ipa
          echo "$OFFICIAL_IPA_SHA256  RPCS3-official.ipa" | shasum -a 256 -c -
          rm -rf package && mkdir package
          ditto -x -k RPCS3-official.ipa package
          APP="package/Payload/RPCS3.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.xitrix.RPCS3"
          cp libRPCS3Core.dylib "$APP/Frameworks/libRPCS3Core.dylib"
          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"
          codesign --force --sign - "$APP/Frameworks/libRPCS3Core.dylib"
          codesign --force --sign - --entitlements PsTJon.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>&1 | tee pstjon-entitlements.txt
          (
            cd package
            ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/PsTJon.ipa"
          )
          shasum -a 256 PsTJon.ipa

      - name: Build report
        run: |
          {
            echo "PsTJon v11 - Ascension FIFO 1KiB yield safe iounmap 512MiB JIT 2560MiB Vulkan 30FPS"
            echo "RPCS3 ios-port: $RPCS3_IOS_SHA"
            echo "Shell bundle id: com.xitrix.RPCS3"
            echo "MoltenVK: $MOLTENVK_VERSION"
            echo "FFmpeg: $FFMPEG_VERSION"
            echo "Core: $(shasum -a 256 libRPCS3Core.dylib | awk '{print $1}')"
            echo "IPA: $(shasum -a 256 PsTJon.ipa | awk '{print $1}')"
          } > PsTJon-build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PsTJon-v11-IPA
          path: |
            PsTJon.ipa
            PsTJon-build.txt
            pstjon-entitlements.txt
          if-no-files-found: error
          compression-level: 0
