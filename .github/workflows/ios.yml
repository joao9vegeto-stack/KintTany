name: KintTany iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      XCODE_PROJECT: KintTany.xcodeproj
      XCODE_SCHEME: KintTany

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_26.5.app/Contents/Developer" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Validate project and scheme
        shell: bash
        run: |
          set -euo pipefail
          test -d "$XCODE_PROJECT"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for _, devices in data.get("devices", {}).items():
              for d in devices:
                  if d.get("isAvailable") and str(d.get("name", "")).startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_ID"

      - name: Run XCTest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs artifacts/tests
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath "$GITHUB_WORKSPACE/artifacts/tests/KintTanyTests.xcresult" \
            ENABLE_TESTABILITY=YES \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$GITHUB_WORKSPACE/artifacts/logs/xcodebuild-test.log"

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-iphoneos Payload artifacts/unsigned
          mkdir -p artifacts/unsigned artifacts/logs
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$GITHUB_WORKSPACE/artifacts/logs/xcodebuild-iphoneos.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build-iphoneos/Build/Products/Release-iphoneos/KintTany.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: KintTany.app was not generated."
            find "$GITHUB_WORKSPACE/build-iphoneos" -name "*.app" -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload artifacts/unsigned
          cp -R "$APP_PATH" Payload/KintTany.app
          ditto -c -k --sequesterRsrc --keepParent Payload artifacts/unsigned/KintTany-unsigned.ipa
          cp -R "$APP_PATH" artifacts/unsigned/KintTany.app
          shasum -a 256 artifacts/unsigned/KintTany-unsigned.ipa > artifacts/unsigned/KintTany-unsigned.ipa.sha256
          ls -lh artifacts/unsigned

      - name: Upload KintTany build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: KintTany-iOS-unsigned-${{ github.run_number }}
          path: |
            artifacts/unsigned/KintTany-unsigned.ipa
            artifacts/unsigned/KintTany-unsigned.ipa.sha256
            artifacts/unsigned/KintTany.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KintTany-build-logs-${{ github.run_number }}
          path: |
            artifacts/logs/*.log
            artifacts/tests/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
