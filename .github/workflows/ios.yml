name: KintTany iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: KintTany.xcodeproj
  SCHEME: KintTany
  BUNDLE_ID: com.joaopedro.kinttany

jobs:
  build-test-package:
    name: Test and package iOS app
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select an installed Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_26.6.app/Contents/Developer \
            /Applications/Xcode_26.5.app/Contents/Developer \
            /Applications/Xcode_26.4.1.app/Contents/Developer \
            /Applications/Xcode_26.3.app/Contents/Developer \
            /Applications/Xcode_26.2.app/Contents/Developer \
            /Applications/Xcode_26.1.1.app/Contents/Developer \
            /Applications/Xcode_26.0.1.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer; do
            if [ -d "$candidate" ]; then
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Select an available iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          SIM_UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          preferred=[]
          fallback=[]
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if not d.get("isAvailable"):
                      continue
                  name=d.get("name", "")
                  udid=d.get("udid")
                  if not udid or not name.startswith("iPhone"):
                      continue
                  fallback.append((runtime, name, udid))
                  if name == "iPhone 17 Pro":
                      preferred.append((runtime, name, udid))
          choices=preferred or fallback
          if not choices:
              raise SystemExit("No available iPhone simulator found")
          choices.sort(reverse=True)
          print(choices[0][2])
          ')
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$SIM_UDID" || true

      - name: Run XCTest on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            ENABLE_TESTABILITY=YES \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      - name: Build unsigned iphoneos app
        run: |
          set -euo pipefail
          rm -rf build-iphoneos Payload artifacts
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          mkdir -p Payload artifacts/unsigned
          cp -R "build-iphoneos/Build/Products/Release-iphoneos/KintTany.app" Payload/KintTany.app
          ditto -c -k --sequesterRsrc --keepParent Payload artifacts/unsigned/KintTany-unsigned.ipa
          cp -R Payload/KintTany.app artifacts/unsigned/KintTany.app

      - name: Validate packaged background configuration
        shell: bash
        run: |
          set -euo pipefail
          APP_PLIST="artifacts/unsigned/KintTany.app/Info.plist"
          echo "Validating $APP_PLIST"
          plutil -p "$APP_PLIST" | grep -F 'BGTaskSchedulerPermittedIdentifiers'
          plutil -p "$APP_PLIST" | grep -F 'com.joaopedro.kinttany.continuedBot.*'
          plutil -p "$APP_PLIST" | grep -F 'com.joaopedro.kinttany.939CVZZW65.continuedBot.*'
          plutil -p "$APP_PLIST" | grep -F 'processing'
          echo "Background configuration present in packaged .app"

      - name: Detect optional signing Secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ] && \
             [ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ] && \
             [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && \
             [ -n "$APPLE_TEAM_ID" ]; then
            echo "IOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "IOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate and provisioning profile
        if: env.IOS_SIGNING_ENABLED == 'true'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-keychain-password}"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/kinttany-signing.keychain-db"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Build signed archive and export IPA
        if: env.IOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf signed-archive signed-export
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/signed-archive/KintTany.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          mkdir -p signed-export
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$PWD/signed-archive/KintTany.xcarchive" \
            -exportPath "$PWD/signed-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p artifacts/signed
          cp signed-export/*.ipa artifacts/signed/KintTany.ipa

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KintTany-iOS-unsigned-${{ github.run_number }}
          path: |
            artifacts/unsigned/KintTany-unsigned.ipa
            artifacts/unsigned/KintTany.app
          if-no-files-found: error

      - name: Upload signed IPA artifact
        if: env.IOS_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KintTany-iOS-signed-${{ github.run_number }}
          path: artifacts/signed/KintTany.ipa
          if-no-files-found: error
