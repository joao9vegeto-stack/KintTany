name: Madeira 0.1.3 Actual Madsync Fix

on:
  push:
    branches:
      - madeira011-consolidated

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout consolidated overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build corrected Madeira 0.1.3 IPA
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          bash ci/build-013-brawlhalla.sh 2>&1 | tee work/ci.log

      - name: Upload corrected IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-0.1.3-Madsync-Actual
          path: |
            work/output/*
            work/build-report.txt
            work/ci.log
          compression-level: 0
          if-no-files-found: warn
