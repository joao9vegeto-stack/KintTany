name: Fairy2iOS - signed first-to-latest IPA regression audit (NO BUILD)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/ipa_diff_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-signed-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare-signed-ipas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact Fairy2iOS audit code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock project, exact historical artifacts and NO game compilation
        run: |
          set -euo pipefail
          python -m py_compile fairy2/scripts/audit_signed_ipa_diff.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('fairy2/ipa_diff_trigger.json').read_text())
          assert d['branch']=='Fairy2iOS'
          assert d['title_id']=='0100B9801F872000'
          assert d['first_run']==44965722551 and d['first_artifact']==14733824582
          assert d['last_run']==45078767146 and d['last_artifact']==14776607212
          assert d['no_ipa_build'] and d['no_shaders_recompiled']
          PY
      - name: Download two ORIGINAL signed artifact archives from GitHub
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          for rec in first:14733824582 last:14776607212; do
            label="${rec%%:*}"; id="${rec#*:}"
            echo "Downloading pinned historical artifact id=${id}, label=${label}, no source NSP/ROMFS"
            curl --location --fail --silent --show-error --retry 5 --retry-all-errors \
              --connect-timeout 30 --max-time 1200 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/joao9vegeto-stack/KintTany/actions/artifacts/${id}/zip" \
              -o "$RUNNER_TEMP/source/${label}.zip"
          done
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'source'
          for name in ['first','last']:
            p=root/(name+'.zip')
            assert 1_500_000_000 < p.stat().st_size < 1_800_000_000,(name,p.stat().st_size)
            with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if n.endswith('.ipa')]
              assert len(names)==1,(name,names)
              print('VERIFIED ORIGINAL GITHUB ARTIFACT',name,'ZIP bytes',p.stat().st_size,'IPA',names[0])
          PY
      - name: Diff actual signed IPA three guest Mach-O sections, host and profile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          python fairy2/scripts/audit_signed_ipa_diff.py \
            --first "$RUNNER_TEMP/source/first.zip" \
            --latest "$RUNNER_TEMP/source/last.zip" \
            --output "$RUNNER_TEMP/audit/fairy2-first-vs-latest-signed-ipa.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'audit/fairy2-first-vs-latest-signed-ipa.json'
          d=json.loads(p.read_text())
          assert d['first']['ipa_size_bytes']==1622225666
          assert d['latest']['ipa_sha256']=='ef2e6edff30d0072796066d9ae46eb1be0ec27248dbec5b52b958cf001f4c22b'
          assert d['shader_bytes_crc_unchanged'] and d['shader_map_bytes_crc_unchanged']
          assert set(d['site_opcodes'])=={'KTGL_child_2GiB','global_root_5GiB','G1T_parser','G1S_reader','KTGL_direct_reader','mode4_inflater'}
          print('FIRST vs LAST SIGNED IPA DIFF COMPLETE; no gameplay claim, no shader/game recompilation')
          PY
      - name: Publish only nonproprietary hashes, offsets and opcode differences
        uses: actions/upload-artifact@v4
        with:
          name: Fairy2iOS-First-vs-Latest-Signed-IPA-Audit-${{ github.run_number }}
          path: ${{ runner.temp }}/audit/fairy2-first-vs-latest-signed-ipa.json
          if-no-files-found: error
          retention-days: 21
