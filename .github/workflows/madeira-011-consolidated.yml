name: Madeira 0.1.1 Consolidated LSE RMW

on:
  push:
    branches:
      - madeira011-consolidated

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout Madeira overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build, test and package source-corrected Madeira
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          bash ci/build-consolidated.sh 2>&1 | tee work/ci.log

      - name: Upload IPA, explicit artifact ZIP and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-0.1.1-Consolidated-LSE
          path: |
            work/output/*
            work/build-report.txt
            work/test-results.txt
            work/ci.log
            work/d3d9-report.txt
            work/xcodebuild.log
          compression-level: 0
          if-no-files-found: warn
