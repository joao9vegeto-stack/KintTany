name: Madeira 0.1.1 Consolidated Expendabros Fix

on:
  push:
    branches: [madeira011-consolidated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Prepare Metal toolchain
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -version
          if ! xcrun --sdk iphoneos --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos --find metal
          xcrun --sdk iphoneos metal --version || true

      - name: Download official Madeira 0.1.1 and exact DXMT source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          curl -fL --retry 5 --retry-all-errors             https://github.com/willfaust/Madeira/releases/download/v0.1.1/Madeira-0.1.1.ipa             -o work/Madeira-0.1.1-official.ipa
          echo "045aeb8fd4c71c2e6a78fb4511f94c56f8ed7af14c47a3b0ea2937a4fc8bfcee  work/Madeira-0.1.1-official.ipa" | shasum -a 256 -c -
          curl -fL --retry 5 --retry-all-errors             https://raw.githubusercontent.com/willfaust/dxmt/a5e0cd3d41bf248fd1c030a2e1c515ba3522f4ef/src/dxmt/dxmt_command.metal             -o work/dxmt_command.metal

      - name: Compile D3D9 command library for iPhoneOS Metal 3.2
        shell: bash
        run: |
          set -euxo pipefail
          METAL="$(xcrun --sdk iphoneos --find metal)"
          METALLIB="$(xcrun --sdk iphoneos --find metallib)"
          "$METAL" -std=metal3.2 -mios-version-min=18.0 -Os             -c work/dxmt_command.metal -o work/dxmt_command.air
          "$METALLIB" work/dxmt_command.air -o work/dxmt_command.metallib
          test "$(dd if=work/dxmt_command.metallib bs=1 count=4 2>/dev/null)" = "MTLB"
          shasum -a 256 work/dxmt_command.metallib

      - name: Build and test case-4 LSE RMW helper
        shell: bash
        run: |
          set -euxo pipefail
          cat > work/lse-rmw-helper.c <<'C'
          #include <stdint.h>
          #include <stddef.h>

          __attribute__((noinline, visibility("default")))
          int madeira_lse_rmw(uint32_t insn, uintptr_t rw_addr, uint64_t gpr[29])
          {
              unsigned rs, rt, size, width, kind;
              uint32_t family = insn & 0x3f20fc00u;
              uint64_t src, old = 0;

              switch (family)
              {
              case 0x38200000u: kind = 0; break; /* LDADD */
              case 0x38201000u: kind = 1; break; /* LDCLR */
              case 0x38202000u: kind = 2; break; /* LDEOR */
              case 0x38203000u: kind = 3; break; /* LDSET */
              default: return 0;                 /* SWP stays on Madeira's proven path */
              }

              rs = (insn >> 16) & 31;
              rt = insn & 31;
              size = (insn >> 30) & 3;
              width = 1u << size;

              if ((rs >= 29 && rs != 31) || (rt >= 29 && rt != 31)) return 0;
              if (!rw_addr || (rw_addr & (width - 1))) return 0;
              src = rs == 31 ? 0 : gpr[rs];

          #define IOS_LSE_RMW_CASE(type) do {                                          \
                  type *ptr = (type *)rw_addr;                                          \
                  type val = (type)src;                                                 \
                  type seen;                                                            \
                  switch (kind)                                                         \
                  {                                                                     \
                  case 0: seen = __atomic_fetch_add(ptr, val, __ATOMIC_SEQ_CST); break; \
                  case 1: seen = __atomic_fetch_and(ptr, (type)~val,                    \
                                                    __ATOMIC_SEQ_CST); break;            \
                  case 2: seen = __atomic_fetch_xor(ptr, val, __ATOMIC_SEQ_CST); break; \
                  default: seen = __atomic_fetch_or(ptr, val,                           \
                                                    __ATOMIC_SEQ_CST); break;            \
                  }                                                                     \
                  old = seen;                                                           \
              } while (0)

              switch (size)
              {
              case 0: IOS_LSE_RMW_CASE(uint8_t);  break;
              case 1: IOS_LSE_RMW_CASE(uint16_t); break;
              case 2: IOS_LSE_RMW_CASE(uint32_t); break;
              default: IOS_LSE_RMW_CASE(uint64_t); break;
              }
          #undef IOS_LSE_RMW_CASE

              if (rt != 31) gpr[rt] = old;
              return 1;
          }
          C

          cat > work/lse-rmw-probe.c <<'C'
          #include <assert.h>
          #include <stdint.h>
          #include <stdio.h>
          #include "lse-rmw-helper.c"

          static uint32_t op(uint32_t family, unsigned size, unsigned rs, unsigned rt)
          {
              return family | (size << 30) | (rs << 16) | rt;
          }

          static uint64_t read_width(uint64_t *p, unsigned size)
          {
              if (size == 0) return *(uint8_t *)p;
              if (size == 1) return *(uint16_t *)p;
              if (size == 2) return *(uint32_t *)p;
              return *p;
          }

          static uint64_t mask_for(unsigned size)
          {
              return size == 0 ? UINT8_MAX :
                     size == 1 ? UINT16_MAX :
                     size == 2 ? UINT32_MAX : UINT64_MAX;
          }

          int main(void)
          {
              uint64_t gpr[29] = {0};
              uint32_t m32 = 7;

              assert((0xb8f50314u & 0x3f20fc00u) == 0x38200000u);
              assert((0xb8e40304u & 0x3f20fc00u) == 0x38200000u);
              assert((0xc80afec9u & 0x3f20fc00u) != 0x38200000u);

              gpr[21] = 5;
              assert(madeira_lse_rmw(0xb8f50314u, (uintptr_t)&m32, gpr) == 1);
              assert(m32 == 12 && gpr[20] == 7);

              m32 = 11; gpr[4] = 3;
              assert(madeira_lse_rmw(0xb8e40304u, (uintptr_t)&m32, gpr) == 1);
              assert(m32 == 14 && gpr[4] == 11);

              const uint32_t fam[4] = {0x38200000u,0x38201000u,0x38202000u,0x38203000u};
              for (unsigned k = 0; k < 4; ++k)
                  for (unsigned size = 0; size < 4; ++size)
                  {
                      uint64_t mem = 0x55aa33cc11224488ULL;
                      uint64_t old = read_width(&mem, size);
                      uint64_t src = 0x0f0f0f0f0f0f0f0fULL & mask_for(size);
                      uint64_t expect = k == 0 ? old + src :
                                        k == 1 ? old & ~src :
                                        k == 2 ? old ^ src : old | src;
                      expect &= mask_for(size);
                      for (unsigned i=0;i<29;i++) gpr[i]=0;
                      gpr[1]=src;
                      assert(madeira_lse_rmw(op(fam[k],size,1,2),(uintptr_t)&mem,gpr)==1);
                      assert(read_width(&mem,size)==expect);
                      assert(gpr[2]==old);
                  }

              _Alignas(8) unsigned char unaligned[16] = {0};
              for (unsigned i=0;i<29;i++) gpr[i]=0;
              gpr[1]=1;
              assert(madeira_lse_rmw(op(0x38200000u,2,1,2),(uintptr_t)(unaligned+1),gpr)==0);

              m32=9; gpr[1]=4;
              assert(madeira_lse_rmw(op(0x38200000u,2,1,31),(uintptr_t)&m32,gpr)==1);
              assert(m32==13);

              m32=9; gpr[2]=0;
              assert(madeira_lse_rmw(op(0x38200000u,2,31,2),(uintptr_t)&m32,gpr)==1);
              assert(m32==9 && gpr[2]==9);

              m32=9;
              assert(madeira_lse_rmw(op(0x38200000u,2,29,2),(uintptr_t)&m32,gpr)==0);
              assert(madeira_lse_rmw(op(0x38200000u,2,30,2),(uintptr_t)&m32,gpr)==0);
              assert(madeira_lse_rmw(op(0x38200000u,2,1,29),(uintptr_t)&m32,gpr)==0);
              assert(madeira_lse_rmw(op(0x38200000u,2,1,30),(uintptr_t)&m32,gpr)==0);

              puts("LSE RMW probe OK");
              return 0;
          }
          C

          xcrun clang -O2 -Wall -Wextra work/lse-rmw-probe.c -o work/lse-rmw-probe
          work/lse-rmw-probe | tee work/lse-rmw-probe.txt

          IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
          "$IOS_CLANG" -target arm64-apple-ios18.0 -O2 -march=armv8.1-a+lse \
            -ffreestanding -fno-stack-protector -c \
            work/lse-rmw-helper.c -o work/lse-rmw-helper.o

          python3 - work/lse-rmw-helper.o work/lse-rmw-helper.bin <<'PY_EXTRACT'
          from pathlib import Path
          import struct, sys
          src=Path(sys.argv[1]).read_bytes()
          out=Path(sys.argv[2])
          if struct.unpack_from("<I",src,0)[0] != 0xfeedfacf:
              raise SystemExit("unexpected helper Mach-O magic")
          ncmds=struct.unpack_from("<I",src,16)[0]
          p=32
          found=None
          for _ in range(ncmds):
              cmd,cmdsize=struct.unpack_from("<II",src,p)
              if cmd==0x19:
                  nsects=struct.unpack_from("<I",src,p+64)[0]
                  sp=p+72
                  for _ in range(nsects):
                      sect=src[sp:sp+16].rstrip(bytes([0]))
                      seg=src[sp+16:sp+32].rstrip(bytes([0]))
                      size=struct.unpack_from("<Q",src,sp+40)[0]
                      off=struct.unpack_from("<I",src,sp+48)[0]
                      nreloc=struct.unpack_from("<I",src,sp+60)[0]
                      if sect==b"__text" and seg==b"__TEXT":
                          if nreloc:
                              raise SystemExit(f"helper __text has {nreloc} relocations")
                          found=src[off:off+size]
                          break
                      sp+=80
              if found is not None: break
              p+=cmdsize
          if not found:
              raise SystemExit("helper __TEXT,__text not found")
          if len(found)>512:
              raise SystemExit(f"helper unexpectedly large: {len(found)} bytes")
          out.write_bytes(found)
          print(f"extracted helper: {len(found)} bytes")
          PY_EXTRACT

          xcrun llvm-objdump -d work/lse-rmw-helper.o | tee work/lse-rmw-helper-disasm.txt
          grep -Eqi 'ldaddal(b|h)?' work/lse-rmw-helper-disasm.txt
          grep -Eqi 'ldclral(b|h)?' work/lse-rmw-helper-disasm.txt
          grep -Eqi 'ldeoral(b|h)?' work/lse-rmw-helper-disasm.txt
          grep -Eqi 'ldsetal(b|h)?' work/lse-rmw-helper-disasm.txt

      - name: Unpack and patch official 0.1.1
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/unpack
          mkdir -p work/unpack
          ditto -x -k work/Madeira-0.1.1-official.ipa work/unpack

          APP="work/unpack/Payload/Madeira.app"
          TARGET="$APP/i386-windows/d3d9-emulated.dll"
          DYLIB="$APP/Madeira.debug.dylib"
          test -f "$TARGET"
          test -f "$DYLIB"

          /usr/bin/codesign -d --entitlements :- "$APP" > work/original-entitlements.plist 2>/dev/null
          plutil -lint work/original-entitlements.plist
          xcrun dwarfdump --uuid "$DYLIB" | tee work/runtime-uuid.txt
          grep -qi '577C5C66-A7E8-359A-9301-546A52513969' work/runtime-uuid.txt

          python3 - "$APP" "$TARGET" "$DYLIB" work/dxmt_command.metallib work/patch-report.txt work/lse-rmw-helper.bin <<'PY'
          from pathlib import Path
          import struct, sys, hashlib

          app = Path(sys.argv[1])
          target = Path(sys.argv[2])
          dylib = Path(sys.argv[3])
          new = Path(sys.argv[4]).read_bytes()
          report = Path(sys.argv[5])
          lse_helper = bytearray(Path(sys.argv[6]).read_bytes())

          def fail(msg):
              raise SystemExit("PATCH ERROR: " + msg)

          # ---------- 1) D3D9 / Metal 3.2 ----------
          if new[:4] != b"MTLB" or len(new) < 32:
              fail("replacement metallib invalid")
          if struct.unpack_from("<Q", new, 16)[0] != len(new):
              fail("replacement metallib header length mismatch")

          data = bytearray(target.read_bytes())
          markers = (
              b"clear_texture_1d_uint",
              b"fs_blit_quad",
              b"vs_present_quad",
              b"cs_clear_buffer_uint",
          )
          candidates=[]
          pos=0
          while True:
              p=data.find(b"MTLB",pos)
              if p<0: break
              if p+24<=len(data):
                  sz=struct.unpack_from("<Q",data,p+16)[0]
                  if 128<=sz<=16*1024*1024 and p+sz<=len(data):
                      blob=data[p:p+sz]
                      score=sum(m in blob for m in markers)
                      if score: candidates.append((score,p,sz))
              pos=p+4

          exact=[x for x in candidates if x[0]==4]
          if len(exact)!=1:
              fail(f"expected exactly one DXMT command metallib in d3d9-emulated.dll, got {exact}")
          _,blob_off,old_len=exact[0]
          if len(new)>old_len:
              fail(f"replacement {len(new)} > embedded {old_len}")

          needle=struct.pack("<I",old_len)
          hits=[]
          p=0
          while True:
              q=data.find(needle,p)
              if q<0: break
              if not (blob_off<=q<blob_off+old_len): hits.append(q)
              p=q+1
          if not hits: fail("dxmt_command_len not found")
          hits.sort(key=lambda q:abs(q-(blob_off+old_len)))
          len_off=hits[0]

          old_blob_sha=hashlib.sha256(data[blob_off:blob_off+old_len]).hexdigest()
          d3d9_before=hashlib.sha256(data).hexdigest()
          new_sha=hashlib.sha256(new).hexdigest()
          data[blob_off:blob_off+len(new)]=new
          if len(new)<old_len:
              data[blob_off+len(new):blob_off+old_len]=b"\0"*(old_len-len(new))
          struct.pack_into("<I",data,len_off,len(new))
          target.write_bytes(data)

          chk=target.read_bytes()
          if chk[blob_off:blob_off+4]!=b"MTLB": fail("MTLB magic mismatch after write")
          if struct.unpack_from("<Q",chk,blob_off+16)[0]!=len(new): fail("MTLB size mismatch")
          if struct.unpack_from("<I",chk,len_off)[0]!=len(new): fail("dxmt_command_len mismatch")
          if hashlib.sha256(chk[blob_off:blob_off+len(new)]).hexdigest()!=new_sha:
              fail("replacement metallib hash mismatch")
          d3d9_after=hashlib.sha256(chk).hexdigest()

          # ---------- 2) Madeira.debug.dylib consolidated runtime fixes ----------
          r = bytearray(dylib.read_bytes())
          def word(off):
              return struct.unpack_from("<I",r,off)[0]
          def put(off,w):
              struct.pack_into("<I",r,off,w)

          runtime_before=hashlib.sha256(r).hexdigest()

          # 2a) Anonymous JIT alias -> existing ios_emulate_store path.
          hook_off=0x83af3c
          cave_off=0x1c67608
          if word(hook_off)!=0x4f00e400:
              fail(f"alias hook guard failed: 0x{word(hook_off):08x}")
          for i in range(14):
              if word(cave_off+i*4)!=0xd503201f:
                  fail(f"alias cave guard failed @0x{cave_off+i*4:x}")

          put(hook_off,0x1450b1b3)
          alias_stub=[
              0xaa1903e0,0x97ae90d5,0xb4000120,0xaa0003e2,
              0xaa1a03f8,0xf90057f6,0xaa1b03fa,0xf9401a68,
              0xf9408908,0xb9400116,0x17af4e14,0x4f00e400,
              0x17af4e42,0xd503201f,
          ]
          for i,w in enumerate(alias_stub): put(cave_off+i*4,w)

          # 2b) Mach case-4 LSE RMW dispatch + existing proven Q/SIMD path.
          #
          # The Consolidated phone log proved that 0xb8f50314 / 0xb8e40304
          # reach the Mach case-4 store-undecoded edge with a valid RW alias.
          # Handle the full LDADD/LDCLR/LDEOR/LDSET family there, preserving
          # Madeira's existing SWP/CAS paths and the already-proven Q/SIMD fix.
          hook=0x844f30
          cave_a=0x1c68688
          cave_b=0x1c6a6cc
          helper_off=0x2104aa4
          helper_capacity=880
          counter_va=0x3b2dd10
          dprintf_stub=0x1de76e0
          success_tail=0x849b4c

          if word(hook)!=0xf000fa08:
              fail(f"Mach case-4 hook guard failed: 0x{word(hook):08x}")
          for base,count in ((cave_a,14),(cave_b,13)):
              for i in range(count):
                  if word(base+i*4)!=0xd503201f:
                      fail(f"Mach SIMD cave guard failed @0x{base+i*4:x}")
          if any(r[helper_off:helper_off+helper_capacity]):
              fail("LSE helper padding is no longer zero in official 0.1.1")
          if [word(dprintf_stub+i*4) for i in range(3)] != [0xd0003490,0xf9402e10,0xd61f0200]:
              fail("dprintf stub guard changed")

          sections=[]
          segments=[]
          ncmds=struct.unpack_from("<I",r,16)[0]
          p=32
          for _ in range(ncmds):
              cmd,cmdsize=struct.unpack_from("<II",r,p)
              if cmd==0x19:
                  segname=bytes(r[p+8:p+24]).rstrip(bytes([0])).decode("ascii","ignore")
                  vmaddr,vmsize,fileoff,filesize=struct.unpack_from("<QQQQ",r,p+24)
                  maxprot,initprot=struct.unpack_from("<ii",r,p+56)
                  nsects=struct.unpack_from("<I",r,p+64)[0]
                  segments.append((segname,vmaddr,vmsize,fileoff,filesize,initprot))
                  sp=p+72
                  for _ in range(nsects):
                      sect=bytes(r[sp:sp+16]).rstrip(bytes([0])).decode("ascii","ignore")
                      sseg=bytes(r[sp+16:sp+32]).rstrip(bytes([0])).decode("ascii","ignore")
                      addr,size=struct.unpack_from("<QQ",r,sp+32)
                      sections.append((sseg,sect,addr,size))
                      sp+=80
              p+=cmdsize

          bss=next((x for x in sections if x[0]=="__DATA" and x[1]=="__bss"),None)
          common=next((x for x in sections if x[0]=="__DATA" and x[1]=="__common"),None)
          if not bss or not common or not (bss[2]+bss[3] <= counter_va and counter_va+4 <= common[2]):
              fail(f"LSE counter is not in expected __DATA zero gap: bss={bss} common={common}")
          if any(addr <= counter_va < addr+size for _,_,addr,size in sections):
              fail("LSE counter unexpectedly overlaps a Mach-O section")
          data_seg=next((x for x in segments if x[0]=="__DATA" and x[1] <= counter_va < x[1]+x[2]),None)
          if not data_seg or not (data_seg[5] & 2):
              fail(f"LSE counter is not in writable __DATA: {data_seg}")

          text_seg=next((x for x in segments if x[0]=="__TEXT" and
                         x[3] <= helper_off < x[3]+x[4]),None)
          if not text_seg or not (text_seg[5] & 4):
              fail(f"LSE helper padding is not executable __TEXT: {text_seg}")
          helper_va=text_seg[1] + (helper_off-text_seg[3])
          if helper_va != helper_off:
              fail(f"expected 1:1 helper VA/file mapping, got 0x{helper_va:x}")

          def enc_b(src,target,link=False):
              d=target-src
              if d%4: fail(f"unaligned branch 0x{src:x}->0x{target:x}")
              imm=d//4
              if not (-(1<<25) <= imm < (1<<25)):
                  fail(f"branch out of range 0x{src:x}->0x{target:x}")
              return (0x94000000 if link else 0x14000000) | (imm & 0x03ffffff)

          def enc_adrp(pc,target,rd):
              delta=(target & ~0xfff) - (pc & ~0xfff)
              if delta%0x1000: fail("ADRP page delta is not aligned")
              imm=delta//0x1000
              if not (-(1<<20) <= imm < (1<<20)):
                  fail("ADRP target out of range")
              u=imm & 0x1fffff
              return 0x90000000 | ((u & 3)<<29) | (((u>>2)&0x7ffff)<<5) | rd

          def enc_add_imm(rd,rn,imm):
              if not (0 <= imm < 4096): fail("ADD immediate out of range")
              return 0x91000000 | (imm<<10) | (rn<<5) | rd

          r[helper_off:helper_off+len(lse_helper)] = lse_helper
          wrapper_off=(helper_off+len(lse_helper)+3)&~3
          wrapper_va=helper_va+(wrapper_off-helper_off)
          fmt=b"[lse-rmw-emul] #%u insn=0x%08x\\n\\0"

          wrapper=[
              0xa9be53f3,0xa9017bfd,0x2a0003f3,0,
              0x2a0003f4,0x340001d4,0,0,
              0xb940012a,0x7100215f,0x54000122,0x1100054b,
              0xb900012b,0x52800040,0,0,
              0x2a0b03e2,0x2a1303e3,0,
              0x2a1403e0,0xa9417bfd,0xa8c253f3,0xd65f03c0,
          ]
          fmt_off=wrapper_off+len(wrapper)*4
          fmt_va=helper_va+(fmt_off-helper_off)
          dispatch_off=(fmt_off+len(fmt)+3)&~3
          dispatch_va=helper_va+(dispatch_off-helper_off)
          dispatch=[
              0xb94903e0, # ldr w0,[sp,#0x900]  faulting insn
              0xaa1303e1, # mov x1,x19          resolved RW alias
              0x910e43e2, # add x2,sp,#0x390   state.__x
              0,          # bl wrapper
              0x34000040, # cbz w0,+8
              0,          # handled -> official success tail
              0,          # fallback -> proven SIMD decoder cave
          ]
          total_end=dispatch_off+len(dispatch)*4
          if total_end > helper_off+helper_capacity:
              fail(f"LSE helper bundle exceeds padding: {total_end-helper_off}>{helper_capacity}")

          wrapper[3]=enc_b(wrapper_va+3*4,helper_va,True)
          wrapper[6]=enc_adrp(wrapper_va+6*4,counter_va,9)
          wrapper[7]=enc_add_imm(9,9,counter_va & 0xfff)
          wrapper[14]=enc_adrp(wrapper_va+14*4,fmt_va,1)
          wrapper[15]=enc_add_imm(1,1,fmt_va & 0xfff)
          wrapper[18]=enc_b(wrapper_va+18*4,dprintf_stub,True)
          dispatch[3]=enc_b(dispatch_va+3*4,wrapper_va,True)
          dispatch[5]=enc_b(dispatch_va+5*4,success_tail,False)
          dispatch[6]=enc_b(dispatch_va+6*4,cave_a,False)

          for i,w in enumerate(wrapper): put(wrapper_off+i*4,w)
          r[fmt_off:fmt_off+len(fmt)] = fmt
          for i,w in enumerate(dispatch): put(dispatch_off+i*4,w)

          put(hook,enc_b(hook,dispatch_va,False))
          simd_a=[
              0xb9412be8,0x35010248,0xb94903e8,0x53157d09,
              0x7107953f,0x540101c1,0x12160509,0x7120013f,
              0x54010161,0x12001108,0x9105c3e9,0x8b285129,
              0xa9402d2a,0x14000804,
          ]
          simd_b=[
              0xa9002e6a,0x17af7d1f,0xf000fa08,0x17af6a17,
          ]
          for i,w in enumerate(simd_a): put(cave_a+i*4,w)
          for i,w in enumerate(simd_b): put(cave_b+i*4,w)

          if (0xb8f50314 & 0x3f20fc00) != 0x38200000: fail("LDADD mask self-check #1 failed")
          if (0xb8e40304 & 0x3f20fc00) != 0x38200000: fail("LDADD mask self-check #2 failed")
          if (0xc80afec9 & 0x3f20fc00) == 0x38200000: fail("STLXR must not match LSE RMW helper")

          dylib.write_bytes(r)
          rr=dylib.read_bytes()

          verifies={
              hook_off:0x1450b1b3,
              hook:enc_b(hook,dispatch_va,False),
          }
          verifies.update({cave_off+i*4:w for i,w in enumerate(alias_stub)})
          verifies.update({cave_a+i*4:w for i,w in enumerate(simd_a)})
          verifies.update({cave_b+i*4:w for i,w in enumerate(simd_b)})
          verifies.update({wrapper_off+i*4:w for i,w in enumerate(wrapper)})
          verifies.update({dispatch_off+i*4:w for i,w in enumerate(dispatch)})
          for off,exp in verifies.items():
              got=struct.unpack_from("<I",rr,off)[0]
              if got!=exp:
                  fail(f"runtime verify failed @0x{off:x}: expected 0x{exp:08x} got 0x{got:08x}")
          if rr[helper_off:helper_off+len(lse_helper)] != bytes(lse_helper):
              fail("LSE helper bytes changed after injection")
          if rr[fmt_off:fmt_off+len(fmt)] != fmt:
              fail("LSE runtime log format string verify failed")

          runtime_after=hashlib.sha256(rr).hexdigest()

          lines=[
              "Madeira 0.1.1 consolidated Expendabros patch",
              "official release commit: ca3183ea3dfb0fd706aff1bea2abb871b5d27aec",
              "official IPA sha256: 045aeb8fd4c71c2e6a78fb4511f94c56f8ed7af14c47a3b0ea2937a4fc8bfcee",
              "runtime LC_UUID: 577C5C66-A7E8-359A-9301-546A52513969",
              "",
              "1) ONLY D3D9 payload patched: i386-windows/d3d9-emulated.dll",
              f"   embedded metallib off=0x{blob_off:x} old_len={old_len} new_len={len(new)}",
              f"   old metallib sha256={old_blob_sha}",
              f"   new metallib sha256={new_sha}",
              f"   d3d9 sha256 before={d3d9_before}",
              f"   d3d9 sha256 after ={d3d9_after}",
              "   compiler=iphoneos Metal 3.2 iOS 18.0",
              "",
              "2) Madeira.debug.dylib runtime fixes, all on official 0.1.1:",
              "   - anon JIT alias BUS routing -> official ios_emulate_store path",
              "   - Mach Q/SIMD register-offset stores 0x3ca74a70 / 0x3cb84a70",
              "   - Mach case-4 LSE RMW: LDADD/LDCLR/LDEOR/LDSET, 8/16/32/64-bit, atomic RW alias",
              "   - observed 0xb8f50314 / 0xb8e40304 handled before store-undecoded",
              "   - 0xc80afec9 STLXR deliberately NOT patched; treated as prior LDADD fallout",
              f"   - LSE helper VA=0x{helper_va:x} wrapper=0x{wrapper_va:x} dispatch=0x{dispatch_va:x}",
              f"   runtime sha256 before={runtime_before}",
              f"   runtime sha256 after ={runtime_after}",
              "",
              "Unchanged: FEX PE payloads, Wine PE payloads, D3D11 payloads, JIT allocator from official 0.1.1.",
          ]
          report.write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

          # Prove the final binary shape from the file that will actually be signed.
          xcrun llvm-objdump -d --start-address=0x83af30 --stop-address=0x83af50 "$DYLIB" | tee work/alias-bus.txt
          xcrun llvm-objdump -d --start-address=0x844f20 --stop-address=0x844f40 "$DYLIB" | tee work/mach-simd.txt
          python3 - "$DYLIB" work/lse-rmw-helper.bin <<'PY_LSE_VERIFY' | tee work/lse-case4.txt
          from pathlib import Path
          import hashlib, struct, sys
          data=Path(sys.argv[1]).read_bytes()
          helper=Path(sys.argv[2]).read_bytes()
          off=0x2104aa4
          hook=0x844f30
          if data[off:off+len(helper)] != helper:
              raise SystemExit("embedded LSE helper differs from compiled helper")
          hook_word=struct.unpack_from("<I",data,hook)[0]
          if hook_word == 0xf000fa08:
              raise SystemExit("case-4 hook was not redirected")
          if b"[lse-rmw-emul] #%u insn=0x%08x\\n\\0" not in data[off:off+880]:
              raise SystemExit("LSE proof log format missing")
          print(f"case4_hook_word=0x{hook_word:08x}")
          print(f"helper_bytes={len(helper)}")
          print(f"helper_sha256={hashlib.sha256(helper).hexdigest()}")
          print("state_gpr_base=sp+0x390")
          print("fault_insn=sp+0x900")
          print("rw_alias=x19")
          print("success_tail=0x849b4c")
          print("0xb8f50314 family=LDADD")
          print("0xb8e40304 family=LDADD")
          print("0xc80afec9 excluded_from_LSE_RMW=yes")
          PY_LSE_VERIFY
          grep -Eqi 'ldaddal(b|h)?' work/lse-rmw-helper-disasm.txt
          grep -Eqi 'ldclral(b|h)?' work/lse-rmw-helper-disasm.txt
          grep -Eqi 'ldeoral(b|h)?' work/lse-rmw-helper-disasm.txt
          grep -Eqi 'ldsetal(b|h)?' work/lse-rmw-helper-disasm.txt
          strings "$DYLIB" | grep -F '[lse-rmw-emul]'

      - name: Re-sign and package
        shell: bash
        run: |
          set -euxo pipefail
          APP="work/unpack/Payload/Madeira.app"

          /usr/bin/codesign --force --sign - --timestamp=none "$APP/Madeira.debug.dylib"
          /usr/bin/codesign --force --sign - --timestamp=none             --entitlements work/original-entitlements.plist "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" 2>/dev/null | tee work/final-entitlements.plist

          (
            cd work/unpack
            ditto -c -k --sequesterRsrc --keepParent Payload ../Madeira-0.1.1-Consolidated-LSE.ipa
          )
          shasum -a 256 work/Madeira-0.1.1-Consolidated-LSE.ipa | tee -a work/patch-report.txt
          ls -lh work/Madeira-0.1.1-Consolidated-LSE.ipa
          (
            cd work
            zip -0 -j Madeira-0.1.1-Consolidated-LSE-artifact.zip \
              Madeira-0.1.1-Consolidated-LSE.ipa patch-report.txt \
              runtime-uuid.txt final-entitlements.plist alias-bus.txt mach-simd.txt \
              lse-case4.txt lse-rmw-helper.c lse-rmw-helper-disasm.txt lse-rmw-probe.txt
          )
          unzip -l work/Madeira-0.1.1-Consolidated-LSE-artifact.zip | tee work/artifact-contents.txt

      - name: Upload consolidated IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-0.1.1-Consolidated-LSE
          path: |
            work/Madeira-0.1.1-Consolidated-LSE.ipa
            work/patch-report.txt
            work/runtime-uuid.txt
            work/final-entitlements.plist
            work/alias-bus.txt
            work/mach-simd.txt
            work/lse-case4.txt
            work/lse-rmw-helper.c
            work/lse-rmw-helper-disasm.txt
            work/lse-rmw-probe.txt
            work/artifact-contents.txt
            work/Madeira-0.1.1-Consolidated-LSE-artifact.zip
          compression-level: 0
          if-no-files-found: error
