name: Fairy2iOS - Real allocator Mac reproduction (no Metal shaders)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/mac_audit_trigger.json']
permissions:
  contents: read
concurrency:
  group: fairy2-mac-allocator-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-allocator:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout audited Fairy2iOS only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate audit script and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/Fairy2iOS
          test "$(cat .upstream-ref)" = b526a50b85e4cfa3142c111e1ad491d9fd11f0eb
          python3 -m py_compile fairy2/scripts/audit_mac_allocator.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path("fairy2/mac_audit_trigger.json").read_text())
          assert t["source_run_id"]==44983552364
          assert t["latest_main_cut"]=="3GiB+128MiB+64KiB"
          assert not t["recompile_shaders"] and not t["build_ipa"]
          s=Path("fairy2/scripts/audit_mac_allocator.py").read_text()
          for x in ["main:227d2d0","main:227d448","main:21b6a80","main:21b6dbc","DM_PROBE"]:
            assert x in s
          for x in ["build_ipa.sh","dmsh_build.py","xcodebuild"]:
            assert x not in s
          print("Audit will capture real allocator arguments, no Metal shader compilation")
          PY
      - name: Synchronize pinned NXNative engine without touching shaders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/engine.py relink
          python3 tools/engine.py check
          python3 tools/engine.py sync
          python3 tools/engine.py stale
      - name: Host-only build requirements
        shell: bash
        run: |
          set -euo pipefail
          brew install zstd glslang || true
          python3 -m pip install --disable-pip-version-check requests google-api-python-client google-auth lz4 'capstone>=5,<6' fonttools zbic backports.zstd
      - name: Restore verified Colab workspace, existing rewritten game, external RomFS and DLC
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 fairy2/scripts/prepare_actions.py \
            --handoff "$GITHUB_WORKSPACE/fairy2/handoff.json" \
            --destination "$RUNNER_TEMP/fairy2"
      - name: Run exact-repack main through real Mac host with allocator return probes
        shell: bash
        run: |
          set -euo pipefail
          python3 fairy2/scripts/audit_mac_allocator.py \
            --repository "$GITHUB_WORKSPACE" \
            --prepared "$RUNNER_TEMP/fairy2/actions-input.json" \
            --output "$RUNNER_TEMP/fairy2-mac-audit" \
            --seconds 45
      - name: Publish full region table, allocator probes, host build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-allocator-Mac-proof-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/fairy2-mac-audit/
            ${{ runner.temp }}/fairy2/work/logs/
          if-no-files-found: warn
          retention-days: 14
