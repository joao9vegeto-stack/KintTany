              jl.backgroundColor = NS_BLUE_COLOR;
              UIView *jr = [[UIView alloc] initWithFrame:CGRectMake(18, 0, 18, 36)];
              jr.backgroundColor = NS_RED_COLOR;
              [joy addSubview:jl];
              [joy addSubview:jr];

              UILabel *sk = [[UILabel alloc] initWithFrame:joy.bounds];
              sk.text = @"SK";
              sk.textColor = UIColor.whiteColor;
              sk.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBlack];
              sk.textAlignment = NSTextAlignmentCenter;
              [joy addSubview:sk];

              [header addSubview:joy];

              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(60, 10, w - 100, 22)];
              title.text = @"ShaderKitNS";
              title.textColor = UIColor.whiteColor;
              title.font = [UIFont systemFontOfSize:20 weight:UIFontWeightHeavy];
              [header addSubview:title];

              UILabel *sub = [[UILabel alloc] initWithFrame:CGRectMake(60, 33, w - 100, 14)];
              sub.text = @"SPLIT ZIP .z00/.z01/...";
              sub.textColor = NS_CYAN_GLOW;
              sub.font = [UIFont systemFontOfSize:9.5 weight:UIFontWeightBold];
              [header addSubview:sub];

              self.scanBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.scanBtn.frame = CGRectMake(w - 90, 66, 66, 36);
              self.scanBtn.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
              self.scanBtn.backgroundColor = NS_BG_COLOR;
              self.scanBtn.layer.cornerRadius = 10;
              [self.scanBtn setTitle:@"Scan" forState:UIControlStateNormal];
              [self.scanBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.scanBtn.titleLabel.font = [UIFont systemFontOfSize:12 weight:UIFontWeightBold];
              [self.scanBtn addTarget:self action:@selector(scan) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.scanBtn];

              UILabel *tl = [[UILabel alloc] initWithFrame:CGRectMake(20, 124, w - 40, 14)];
