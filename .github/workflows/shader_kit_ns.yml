name: 1b. Build ShaderKitNS App IPA (v1.5 - Split Zip Fixed)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
    paths:
      - '.github/workflows/shader_kit_ns.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_shader_kit_ns:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Compilar ShaderKitNS.ipa (v1.5)
        run: |
          set -e
          APP_DIR="$RUNNER_TEMP/Payload/ShaderKitNS.app"
          mkdir -p "$APP_DIR" "$RUNNER_TEMP/IconGen" "$RUNNER_TEMP/App"

          cat > "$RUNNER_TEMP/IconGen/gen_icon.m" << 'ICONEOF'
          #import <Foundation/Foundation.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <CoreText/CoreText.h>
          #import <ImageIO/ImageIO.h>

          static void draw_text(CGContextRef ctx, NSString *text, CGFloat fontSize, CGFloat cx, CGFloat cy, CGColorRef color) {
              CTFontRef font = CTFontCreateWithName(CFSTR("Helvetica-Bold"), fontSize, NULL);
              NSDictionary *attrs = @{ (id)kCTFontAttributeName: (__bridge id)font, (id)kCTForegroundColorAttributeName: (__bridge id)color };
              NSAttributedString *as = [[NSAttributedString alloc] initWithString:text attributes:attrs];
              CTLineRef line = CTLineCreateWithAttributedString((__bridge CFAttributedStringRef)as);
              CGFloat asc, desc;
              double w = CTLineGetTypographicBounds(line, &asc, &desc, NULL);
              CGContextSetTextMatrix(ctx, CGAffineTransformIdentity);
              CGContextSetTextPosition(ctx, cx - w / 2.0, cy - (asc - desc) / 2.0);
              CTLineDraw(line, ctx);
              CFRelease(line); CFRelease(font);
          }

          static void save_icon(NSString *path, int sz) {
              CGColorSpaceRef cs = CGColorSpaceCreateDeviceRGB();
              CGContextRef ctx = CGBitmapContextCreate(NULL, sz, sz, 8, sz * 4, cs, kCGImageAlphaPremultipliedLast);
              CGFloat s = (CGFloat)sz / 1024.0;
              CGContextSetRGBFillColor(ctx, 0.0, 0.765, 0.890, 1.0);
              CGContextFillRect(ctx, CGRectMake(0, 0, sz * 0.5, sz));
              CGContextSetRGBFillColor(ctx, 1.0, 0.235, 0.157, 1.0);
              CGContextFillRect(ctx, CGRectMake(sz * 0.5, 0, sz * 0.5, sz));
              CGFloat pad = 92.0 * s;
              CGRect card = CGRectMake(pad, pad, sz - pad * 2, sz - pad * 2);
              CGPathRef cardPath = CGPathCreateWithRoundedRect(card, 180.0 * s, 180.0 * s, NULL);
              CGContextAddPath(ctx, cardPath);
              CGContextSetRGBFillColor(ctx, 0.09, 0.10, 0.14, 1.0);
              CGContextFillPath(ctx);
              CGPathRelease(cardPath);
              CGColorRef white = CGColorCreateGenericRGB(1, 1, 1, 1);
              CGColorRef cyan  = CGColorCreateGenericRGB(0.0, 0.96, 0.83, 1);
              draw_text(ctx, @"SK", 420.0 * s, sz / 2.0, sz * 0.56, white);
              draw_text(ctx, @"SHADER KIT", 78.0 * s, sz / 2.0, sz * 0.25, cyan);
              CGColorRelease(white); CGColorRelease(cyan);
              CGImageRef img = CGBitmapContextCreateImage(ctx);
              CGImageDestinationRef dest = CGImageDestinationCreateWithURL((__bridge CFURLRef)[NSURL fileURLWithPath:path], CFSTR("public.png"), 1, NULL);
              CGImageDestinationAddImage(dest, img, NULL);
              CGImageDestinationFinalize(dest);
              CFRelease(dest); CGImageRelease(img); CGContextRelease(ctx); CGColorSpaceRelease(cs);
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  NSString *outDir = [NSString stringWithUTF8String:argv[1]];
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon60x60@2x.png"], 120);
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon60x60@3x.png"], 180);
                  save_icon([outDir stringByAppendingPathComponent:@"AppIcon1024.png"], 1024);
              }
              return 0;
          }
          ICONEOF
          clang -fobjc-arc "$RUNNER_TEMP/IconGen/gen_icon.m" -framework Foundation -framework CoreGraphics -framework CoreText -framework ImageIO -o "$RUNNER_TEMP/IconGen/gen_icon"
          "$RUNNER_TEMP/IconGen/gen_icon" "$APP_DIR"

          mkdir -p "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset"
          cp "$APP_DIR/AppIcon60x60@2x.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_120.png"
          cp "$APP_DIR/AppIcon60x60@3x.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_180.png"
          cp "$APP_DIR/AppIcon1024.png" "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/icon_1024.png"

          cat > "$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset/Contents.json" << 'JSONEOF'
          {
            "images" : [
              { "filename" : "icon_120.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "icon_180.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "icon_1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

          xcrun actool "$RUNNER_TEMP/Assets.xcassets" --compile "$APP_DIR" --platform iphoneos \
            --minimum-deployment-target 17.0 --app-icon AppIcon \
            --output-partial-info-plist "$RUNNER_TEMP/assetcatalog_info.plist" || true

          cat > "$RUNNER_TEMP/App/main.m" << 'OBJCEOF'
          #import <UIKit/UIKit.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <zlib.h>

          #define NS_BG_COLOR    [UIColor colorWithRed:0.11 green:0.12 blue:0.15 alpha:1.0]
          #define NS_CARD_COLOR  [UIColor colorWithRed:0.16 green:0.18 blue:0.22 alpha:1.0]
          #define NS_BLUE_COLOR  [UIColor colorWithRed:0.00 green:0.76 blue:0.89 alpha:1.0]
          #define NS_RED_COLOR   [UIColor colorWithRed:1.00 green:0.24 blue:0.16 alpha:1.0]
          #define NS_CYAN_GLOW   [UIColor colorWithRed:0.00 green:0.96 blue:0.83 alpha:1.0]

          #pragma pack(push, 1)
          struct zip_lfh { uint32_t sig; uint16_t ver, flags, method, mtime, mdate; uint32_t crc, csize, usize; uint16_t nlen, elen; };
          struct zip_cdh { uint32_t sig; uint16_t vmade, vext, flags, method, mtime, mdate; uint32_t crc, csize, usize; uint16_t nlen, elen, clen, disk, iattr; uint32_t eattr, off; };
          struct zip_eocd { uint32_t sig; uint16_t disk, cd_disk, entries_disk, entries_total; uint32_t cd_size, cd_off; uint16_t comment_len; };
          #pragma pack(pop)

          static BOOL build_split_zip_file(NSString *srcDir, NSString *baseZipPath, unsigned long long maxPartSize, void (^logf)(NSString *)) {
    NSFileManager *fm = NSFileManager.defaultManager;
    NSMutableArray *files = [NSMutableArray array];
    NSDirectoryEnumerator *en = [fm enumeratorAtPath:srcDir];
    NSString *rel = nil;

    while ((rel = [en nextObject])) {
        NSString *full = [srcDir stringByAppendingPathComponent:rel];
        NSDictionary *attr = [fm attributesOfItemAtPath:full error:nil];
        if (![attr.fileType isEqualToString:NSFileTypeRegular]) continue;
        unsigned long long fsz = [attr fileSize];
        if (fsz > 0xFFFFFFFFULL) continue;
        [files addObject:@{@"path": full, @"rel": rel, @"size": @(fsz)}];
    }

    if (files.count == 0) return NO;

    for (int i = 0; i < 50; i++) {
        NSString *p = (i == 0)
            ? [baseZipPath stringByAppendingPathExtension:@"z00"]
            : [baseZipPath stringByAppendingFormat:@".z%02d", i];
        [fm removeItemAtPath:p error:nil];
    }

    FILE *parts[50] = {0};
    int numParts = 1;
    int currentPart = 0;

    NSString *part0 = [baseZipPath stringByAppendingPathExtension:@"z00"];
    parts[0] = fopen(part0.fileSystemRepresentation, "wb");
    if (!parts[0]) return NO;

    NSMutableData *cd = [NSMutableData data];
    uint16_t count = 0;
    uint8_t *buf = malloc(1 << 20);
    if (!buf) { fclose(parts[0]); return NO; }

    for (NSDictionary *fileInfo in files) {
        NSString *full = fileInfo[@"path"];
        NSString *relPath = fileInfo[@"rel"];
        unsigned long long fsz = [fileInfo[@"size"] unsignedLongLongValue];
        const char *name = relPath.UTF8String;
        uint16_t nlen = (uint16_t)strlen(name);
        uint32_t usize = (uint32_t)fsz;
        
        // ✅ CRÍTICO: Contar tamanho REAL do arquivo aberto
        unsigned long long headerSize = sizeof(struct zip_lfh) + nlen;
        unsigned long long totalNeeded = headerSize + fsz;
        unsigned long long currentSize = (unsigned long long)ftello(parts[currentPart]);
        
        // Se vai ultrapassar o limite E não é o primeiro arquivo da parte
        if (currentSize > 0 && currentSize + totalNeeded > maxPartSize && currentPart < 49) {
            logf([NSString stringWithFormat:@"  parte %d cheia (%.0f MB), abrindo parte %d", 
                  currentPart, currentSize / 1048576.0, currentPart + 1]);
            
            fclose(parts[currentPart]);
            parts[currentPart] = NULL;

            currentPart++;
            numParts++;

            NSString *nextPartPath = [baseZipPath stringByAppendingFormat:@".z%02d", currentPart];
            parts[currentPart] = fopen(nextPartPath.fileSystemRepresentation, "wb");
            if (!parts[currentPart]) {
                free(buf);
                for (int i = 0; i < numParts; i++) if (parts[i]) fclose(parts[i]);
                return NO;
            }
        }

        FILE *in = fopen(full.fileSystemRepresentation, "rb");
        if (!in) continue;

        uint32_t crc = 0;
        size_t n;
        while ((n = fread(buf, 1, 1 << 20, in)) > 0) crc = (uint32_t)crc32(crc, buf, (uInt)n);

        uint32_t off = (uint32_t)ftello(parts[currentPart]);
        struct zip_lfh lfh = {0x04034b50, 20, 0x0800, 0, 0, 0x21, crc, usize, usize, nlen, 0};
        fwrite(&lfh, sizeof(lfh), 1, parts[currentPart]);
        fwrite(name, 1, nlen, parts[currentPart]);

        fseeko(in, 0, SEEK_SET);
        while ((n = fread(buf, 1, 1 << 20, in)) > 0) fwrite(buf, 1, n, parts[currentPart]);
        fclose(in);

        struct zip_cdh cdh = {0x02014b50, 20, 20, 0x0800, 0, 0, 0x21, crc, usize, usize, nlen, 0, 0, 0, 0, 0, off};
        [cd appendBytes:&cdh length:sizeof(cdh)];
        [cd appendBytes:name length:nlen];

        count++;
    }

    free(buf);

    uint32_t cdOff = (uint32_t)ftello(parts[currentPart]);
    if (cd.length) fwrite(cd.bytes, 1, cd.length, parts[currentPart]);

    struct zip_eocd eocd = {0x06054b50, 0, 0, count, count, (uint32_t)cd.length, cdOff, 0};
    fwrite(&eocd, sizeof(eocd), 1, parts[currentPart]);

    for (int i = 0; i < numParts; i++) {
        if (parts[i]) fclose(parts[i]);
    }

    if (count == 0) return NO;

    for (int i = 0; i < numParts; i++) {
        NSString *partPath = (i == 0)
            ? [baseZipPath stringByAppendingPathExtension:@"z00"]
            : [baseZipPath stringByAppendingFormat:@".z%02d", i];
        NSDictionary *za = [fm attributesOfItemAtPath:partPath error:nil];
        if (za) {
            logf([NSString stringWithFormat:@"  ✓ %@.z%02d (%.1f MB)",
                  [baseZipPath lastPathComponent], i, [za fileSize] / 1048576.0]);
        }
    }

    return YES;
}

          static uint64_t be40(const uint8_t *p) { return ((uint64_t)p[0]<<32)|((uint64_t)p[1]<<24)|((uint64_t)p[2]<<16)|((uint64_t)p[3]<<8)|p[4]; }
          static uint64_t le40(const uint8_t *p) { return (uint64_t)p[0]|((uint64_t)p[1]<<8)|((uint64_t)p[2]<<16)|((uint64_t)p[3]<<24)|((uint64_t)p[4]<<32); }
          static uint32_t le24(const uint8_t *p) { return (uint32_t)p[0]|((uint32_t)p[1]<<8)|((uint32_t)p[2]<<16); }
          static uint32_t rd32(const uint8_t *p) { uint32_t v; memcpy(&v, p, 4); return v; }
          static uint64_t rd64(const uint8_t *p) { uint64_t v; memcpy(&v, p, 8); return v; }

          static BOOL carve_shader_chunks(NSString *utocPath, NSString *outDir, void (^logf)(NSString *)) {
              NSData *toc = [NSData dataWithContentsOfFile:utocPath options:NSDataReadingMappedIfSafe error:nil];
              if (!toc || toc.length < 144) { logf([NSString stringWithFormat:@"  %@: nao li o .utoc", utocPath.lastPathComponent]); return NO; }
              const uint8_t *t = toc.bytes;
              if (memcmp(t, "-==--==--==--==-", 16) != 0) { logf([NSString stringWithFormat:@"  %@: magic invalido", utocPath.lastPathComponent]); return NO; }
              uint8_t ver = t[0x10];
              uint32_t hdr = rd32(t+0x14), nent = rd32(t+0x18), nblk = rd32(t+0x1c), blkEntSz = rd32(t+0x20);
              uint32_t ncm = rd32(t+0x24), cml = rd32(t+0x28), blkSz = rd32(t+0x2c);
              uint8_t flags = t[0x50];
              uint32_t seeds = rd32(t+0x54), noHash = rd32(t+0x60);
              uint64_t partSz = rd64(t+0x58);
              uint64_t p = hdr;
              const uint8_t *ids = t + p; p += 12ULL * nent;
              const uint8_t *ols = t + p; p += 10ULL * nent;
              if (ver >= 4) p += 4ULL * seeds;
              if (ver >= 5) p += 4ULL * noHash;
              const uint8_t *blks = t + p; p += (uint64_t)blkEntSz * nblk;
              const uint8_t *cmn = t + p; p += (uint64_t)ncm * cml;
              if (p > toc.length || blkEntSz != 12 || blkSz == 0) { logf([NSString stringWithFormat:@"  %@: TOC com layout inesperado (v%u)", utocPath.lastPathComponent, ver]); return NO; }

              NSString *base = [utocPath.lastPathComponent stringByDeletingPathExtension];
              NSString *stem = [utocPath stringByDeletingPathExtension];
              NSString *binPath = [outDir stringByAppendingPathComponent:[base stringByAppendingString:@".shaders.bin"]];
              NSString *tsvPath = [outDir stringByAppendingPathComponent:[base stringByAppendingString:@".shaders.tsv"]];
              FILE *bin = fopen(binPath.fileSystemRepresentation, "wb");
              FILE *tsv = fopen(tsvPath.fileSystemRepresentation, "w");
              if (!bin || !tsv) { if (bin) fclose(bin); if (tsv) fclose(tsv); return NO; }

              fprintf(tsv, "# utoc=%s version=%u flags=0x%02x block_size=%u entries=%u blocks=%u partition_size=%llu methods=",
                      base.UTF8String, ver, flags, blkSz, nent, nblk, (unsigned long long)partSz);
              for (uint32_t i = 0; i < ncm; i++) fprintf(tsv, "%s%.*s", i ? "," : "", (int)cml, (const char *)(cmn + (uint64_t)i * cml));
              fprintf(tsv, "\n# chunk\tchunk_id_hex\ttype\toffset\tlength\n# block\tblock_index\tbin_offset\tdisk_size\tcomp_size\tuncomp_size\tmethod\n");

              FILE *ucas = NULL; int curPart = -1;
              uint64_t binOff = 0, carved = 0; uint32_t nChunks = 0, nBlocks = 0; int64_t lastBlk = -1;
              uint8_t *buf = malloc(blkSz + 16);
              for (uint32_t i = 0; i < nent; i++) {
                  const uint8_t *id = ids + 12ULL * i;
                  uint8_t type = id[11];
                  if (type != 8 && type != 9) continue;
                  uint64_t off = be40(ols + 10ULL * i), len = be40(ols + 10ULL * i + 5);
                  if (len == 0) continue;
                  uint64_t b0 = off / blkSz, b1 = (off + len - 1) / blkSz;
                  nChunks++;
                  fprintf(tsv, "chunk\t");
                  for (int k = 0; k < 12; k++) fprintf(tsv, "%02x", id[k]);
                  fprintf(tsv, "\t%u\t%llu\t%llu\n", type, (unsigned long long)off, (unsigned long long)len);
                  for (uint64_t b = b0; b <= b1 && b < nblk; b++) {
                      if ((int64_t)b <= lastBlk) continue;
                      lastBlk = (int64_t)b;
                      const uint8_t *e = blks + 12ULL * b;
                      uint64_t boff = le40(e); uint32_t csz = le24(e + 5), usz = le24(e + 8); uint8_t m = e[11];
                      uint32_t dsz = (flags & 2) ? ((csz + 15u) & ~15u) : csz;
                      int part = partSz ? (int)(boff / partSz) : 0;
                      uint64_t poff = partSz ? (boff % partSz) : boff;
                      if (part != curPart) {
                          if (ucas) fclose(ucas);
                          NSString *path = part == 0 ? [stem stringByAppendingPathExtension:@"ucas"] : [stem stringByAppendingFormat:@"_s%d.ucas", part];
                          ucas = fopen(path.fileSystemRepresentation, "rb"); curPart = part;
                          if (!ucas) { logf([NSString stringWithFormat:@"  ERRO: nao abri %@ (o .ucas esta na mesma pasta?)", path.lastPathComponent]); free(buf); fclose(bin); fclose(tsv); return NO; }
                      }
                      if (dsz > blkSz + 16) continue;
                      fseeko(ucas, (off_t)poff, SEEK_SET);
                      size_t got = fread(buf, 1, dsz, ucas);
                      if (got != dsz) logf([NSString stringWithFormat:@"  AVISO: bloco %llu curto (%zu/%u)", (unsigned long long)b, got, dsz]);
                      fwrite(buf, 1, got, bin);
                      fprintf(tsv, "block\t%llu\t%llu\t%zu\t%u\t%u\t%u\n", (unsigned long long)b, (unsigned long long)binOff, got, csz, usz, m);
                      binOff += got; carved += got; nBlocks++;
                  }
              }
              free(buf); if (ucas) fclose(ucas); fclose(bin); fclose(tsv);
              logf([NSString stringWithFormat:@"  %@: v%u flags=0x%02x  %u chunks de shader, %u blocos, %.1f MB", base, ver, flags, nChunks, nBlocks, carved / (1024.0 * 1024.0)]);
              if (nChunks == 0) { [NSFileManager.defaultManager removeItemAtPath:binPath error:nil]; [NSFileManager.defaultManager removeItemAtPath:tsvPath error:nil]; }
              return nChunks > 0;
          }

          @interface KitVC : UIViewController
          @property (nonatomic, strong) UITextField *tidField;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UIProgressView *progressBar;
          @property (nonatomic, strong) UITextView *logView;
          @property (nonatomic, strong) UIButton *scanBtn;
          @property (nonatomic, strong) UIButton *runBtn;
          @property (nonatomic, strong) NSArray<NSString *> *utocs;
          @property (nonatomic, strong) NSArray<NSString *> *paks;
          @property (nonatomic, strong) NSString *manifest;
          @end

          @implementation KitVC
          - (UIStatusBarStyle)preferredStatusBarStyle { return UIStatusBarStyleLightContent; }
          - (NSString *)docs { return NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0]; }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = NS_BG_COLOR;
              CGFloat w = self.view.bounds.size.width, h = self.view.bounds.size.height;

              UIView *leftRail = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 5, h)];
              leftRail.autoresizingMask = UIViewAutoresizingFlexibleHeight; leftRail.backgroundColor = NS_BLUE_COLOR; [self.view addSubview:leftRail];
              UIView *rightRail = [[UIView alloc] initWithFrame:CGRectMake(w - 5, 0, 5, h)];
