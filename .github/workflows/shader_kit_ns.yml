              UIView *header = [[UIView alloc] initWithFrame:CGRectMake(16, 54, w - 32, 60)];
              header.autoresizingMask = UIViewAutoresizingFlexibleWidth; header.backgroundColor = NS_CARD_COLOR; header.layer.cornerRadius = 16; [self.view addSubview:header];
              UIView *joy = [[UIView alloc] initWithFrame:CGRectMake(14, 12, 36, 36)]; joy.layer.cornerRadius = 10; joy.clipsToBounds = YES;
              UIView *jl = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 18, 36)]; jl.backgroundColor = NS_BLUE_COLOR;
              UIView *jr = [[UIView alloc] initWithFrame:CGRectMake(18, 0, 18, 36)]; jr.backgroundColor = NS_RED_COLOR;
              [joy addSubview:jl]; [joy addSubview:jr];
              UILabel *sk = [[UILabel alloc] initWithFrame:joy.bounds]; sk.text = @"SK"; sk.textColor = UIColor.whiteColor; sk.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBlack]; sk.textAlignment = NSTextAlignmentCenter; [joy addSubview:sk];
              [header addSubview:joy];
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(60, 10, w - 100, 22)]; title.text = @"ShaderKitNS"; title.textColor = UIColor.whiteColor; title.font = [UIFont systemFontOfSize:20 weight:UIFontWeightHeavy]; [header addSubview:title];
              UILabel *sub = [[UILabel alloc] initWithFrame:CGRectMake(60, 33, w - 100, 14)]; sub.text = @"IOSTORE + PAKCHUNK0"; sub.textColor = NS_CYAN_GLOW; sub.font = [UIFont systemFontOfSize:9.5 weight:UIFontWeightBold]; [header addSubview:sub];

              self.scanBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.scanBtn.frame = CGRectMake(w - 90, 66, 66, 36); self.scanBtn.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
              self.scanBtn.backgroundColor = NS_BG_COLOR; self.scanBtn.layer.cornerRadius = 10;
              [self.scanBtn setTitle:@"↻ Scan" forState:UIControlStateNormal]; [self.scanBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.scanBtn.titleLabel.font = [UIFont systemFontOfSize:12 weight:UIFontWeightBold];
              [self.scanBtn addTarget:self action:@selector(scan) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.scanBtn];

              UILabel *tl = [[UILabel alloc] initWithFrame:CGRectMake(20, 124, w - 40, 14)]; tl.text = @"TITLE ID"; tl.textColor = [UIColor colorWithWhite:0.6 alpha:1]; tl.font = [UIFont systemFontOfSize:9 weight:UIFontWeightBold]; [self.view addSubview:tl];
              self.tidField = [[UITextField alloc] initWithFrame:CGRectMake(16, 140, w - 32, 40)];
              self.tidField.autoresizingMask = UIViewAutoresizingFlexibleWidth; self.tidField.backgroundColor = NS_CARD_COLOR; self.tidField.textColor = UIColor.whiteColor;
              self.tidField.font = [UIFont monospacedSystemFontOfSize:14 weight:UIFontWeightBold]; self.tidField.layer.cornerRadius = 12; self.tidField.text = @"010035F022078000";
              self.tidField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 12, 1)]; self.tidField.leftViewMode = UITextFieldViewModeAlways;
              self.tidField.autocapitalizationType = UITextAutocapitalizationTypeAllCharacters; self.tidField.autocorrectionType = UITextAutocorrectionTypeNo;
              [self.view addSubview:self.tidField];

              self.statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 190, w - 40, 32)];
              self.statusLabel.numberOfLines = 2; self.statusLabel.textColor = NS_CYAN_GLOW; self.statusLabel.font = [UIFont systemFontOfSize:11.5 weight:UIFontWeightSemibold];
              self.statusLabel.autoresizingMask = UIViewAutoresizingFlexibleWidth; [self.view addSubview:self.statusLabel];

              self.progressBar = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
              self.progressBar.frame = CGRectMake(20, 228, w - 40, 5); self.progressBar.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              self.progressBar.trackTintColor = NS_CARD_COLOR; self.progressBar.progressTintColor = NS_CYAN_GLOW; [self.view addSubview:self.progressBar];

              self.logView = [[UITextView alloc] initWithFrame:CGRectMake(16, 242, w - 32, h - 334)];
              self.logView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.logView.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.10 alpha:1.0];
              self.logView.textColor = [UIColor colorWithRed:0.75 green:0.88 blue:0.95 alpha:1.0];
              self.logView.font = [UIFont monospacedSystemFontOfSize:11.5 weight:UIFontWeightRegular];
              self.logView.layer.cornerRadius = 14; self.logView.editable = NO; self.logView.textContainerInset = UIEdgeInsetsMake(10, 10, 10, 10);
              self.logView.text = @"[ShaderKitNS v1.5 — split zip real]\nNo app Arquivos, mova a pasta romfs (inteira) para\n  Neste iPhone > ShaderKitNS\nDepois toque em Scan.\nAgora gera partes reais .z00/.z01/... por ZIP.\n";
              [self.view addSubview:self.logView];

              self.runBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.runBtn.frame = CGRectMake(16, h - 78, w - 32, 52); self.runBtn.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleTopMargin;
              self.runBtn.backgroundColor = NS_RED_COLOR; self.runBtn.layer.cornerRadius = 14;
              [self.runBtn setTitle:@"⚡ GERAR SHADER KIT" forState:UIControlStateNormal];
              [self.runBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal]; self.runBtn.titleLabel.font = [UIFont systemFontOfSize:15 weight:UIFontWeightHeavy];
              [self.runBtn addTarget:self action:@selector(runKit) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.runBtn];

              [NSFileManager.defaultManager createDirectoryAtPath:[self.docs stringByAppendingPathComponent:@"romfs"] withIntermediateDirectories:YES attributes:nil error:nil];
              [self scan];
          }

          - (void)log:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  self.logView.text = [self.logView.text stringByAppendingFormat:@"%@\n", msg];
                  [self.logView scrollRangeToVisible:NSMakeRange(self.logView.text.length - 1, 1)];
              });
          }

          - (void)scan {
              NSFileManager *fm = NSFileManager.defaultManager;
              NSMutableArray *found = [NSMutableArray array];
              NSMutableArray *paks = [NSMutableArray array];
              NSString *manifest = nil;
              NSDirectoryEnumerator *en = [fm enumeratorAtPath:self.docs];
              NSString *rel = nil;
              while ((rel = [en nextObject])) {
                  if ([rel hasPrefix:@"_shader_staging"]) { [en skipDescendants]; continue; }
                  if ([rel.lowercaseString hasSuffix:@".utoc"]) [found addObject:rel];
                  if ([rel.lowercaseString hasSuffix:@".pak"]) [paks addObject:rel];
                  if ([rel.lastPathComponent isEqualToString:@"Manifest_UFSFiles_Switch.txt"]) manifest = rel;
              }
              [found sortUsingSelector:@selector(compare:)];
              [paks sortUsingSelector:@selector(compare:)];
              self.utocs = found;
              self.paks = paks;
              self.manifest = manifest;

              unsigned long long ioStoreBytes = 0, pakBytes = 0;
              for (NSString *r in found) {
                  NSString *ucas = [[[self.docs stringByAppendingPathComponent:r] stringByDeletingPathExtension] stringByAppendingPathExtension:@"ucas"];
                  NSDictionary *a = [fm attributesOfItemAtPath:ucas error:nil];
                  if (a) ioStoreBytes += [a fileSize];
              }
              for (NSString *r in paks) {
                  NSDictionary *a = [fm attributesOfItemAtPath:[self.docs stringByAppendingPathComponent:r] error:nil];
                  if (a) pakBytes += [a fileSize];
              }

              [self log:[NSString stringWithFormat:@"IoStore: %lu .utoc, %.1f GB", (unsigned long)found.count, ioStoreBytes / 1073741824.0]];
              [self log:[NSString stringWithFormat:@"Pak: %lu arquivos, %.1f GB", (unsigned long)paks.count, pakBytes / 1073741824.0]];

              for (NSString *r in paks) {
                  NSDictionary *a = [fm attributesOfItemAtPath:[self.docs stringByAppendingPathComponent:r] error:nil];
                  [self log:[NSString stringWithFormat:@"  pak %7.1f MB  %@", [a fileSize] / 1048576.0, r.lastPathComponent]];
              }

              if (manifest) {
                  NSString *txt = [NSString stringWithContentsOfFile:[self.docs stringByAppendingPathComponent:manifest] encoding:NSUTF8StringEncoding error:nil];
                  int n = 0;
                  for (NSString *ln in [txt componentsSeparatedByString:@"\n"]) {
                      if ([ln rangeOfString:@"ShaderArchive" options:NSCaseInsensitiveSearch].location != NSNotFound ||
                          [ln rangeOfString:@"ushaderbytecode" options:NSCaseInsensitiveSearch].location != NSNotFound) {
                          n++;
                      }
                  }
                  [self log:[NSString stringWithFormat:@"Manifest: %d linhas de shader", n]];
              }

              BOOL ok = found.count > 0 || paks.count > 0;
              self.runBtn.enabled = ok; self.runBtn.alpha = ok ? 1.0 : 0.5;
              self.statusLabel.text = [NSString stringWithFormat:@"%lu .utoc + %lu .pak → split zips", (unsigned long)found.count, (unsigned long)paks.count];
          }

          - (void)runKit {
              self.runBtn.enabled = NO; self.scanBtn.enabled = NO;
              [self.tidField resignFirstResponder];
              NSString *tid = [self.tidField.text stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
              if (tid.length != 16) tid = @"unknown";
              NSArray<NSString *> *utocs = self.utocs;
              NSArray<NSString *> *paksArr = self.paks;
              NSString *manifestPath = self.manifest;
              NSString *doc = self.docs;
              self.progressBar.progress = 0.05;

              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSFileManager *fm = NSFileManager.defaultManager;
                  NSString *staging1 = [doc stringByAppendingPathComponent:@"_shader_staging_iostore"];
                  NSString *staging2 = [doc stringByAppendingPathComponent:@"_shader_staging_pak"];
                  [fm removeItemAtPath:staging1 error:nil];
                  [fm removeItemAtPath:staging2 error:nil];
                  [fm createDirectoryAtPath:staging1 withIntermediateDirectories:YES attributes:nil error:nil];
                  [fm createDirectoryAtPath:staging2 withIntermediateDirectories:YES attributes:nil error:nil];

                  [tid writeToFile:[staging1 stringByAppendingPathComponent:@"title_id.txt"] atomically:YES encoding:NSUTF8StringEncoding error:nil];

                  int found = 0, i = 0;
                  for (NSString *r in utocs) {
                      i++;
                      dispatch_async(dispatch_get_main_queue(), ^{
                          self.statusLabel.text = [NSString stringWithFormat:@"IoStore: %d/%lu", i, (unsigned long)utocs.count];
                          self.progressBar.progress = 0.05 + 0.35 * i / (float)(utocs.count + 1);
                      });
                      NSString *full = [doc stringByAppendingPathComponent:r];
                      NSString *relKit = r;
                      NSRange rr = [r rangeOfString:@"romfs/"];
                      if (rr.location != NSNotFound) relKit = [r substringFromIndex:rr.location + rr.length];
                      NSString *dstDir = [staging1 stringByAppendingPathComponent:[@"RomFS" stringByAppendingPathComponent:relKit.stringByDeletingLastPathComponent]];
                      [fm createDirectoryAtPath:dstDir withIntermediateDirectories:YES attributes:nil error:nil];
                      [fm copyItemAtPath:full toPath:[dstDir stringByAppendingPathComponent:r.lastPathComponent] error:nil];
                      if (carve_shader_chunks(full, dstDir, ^(NSString *m) { [self log:m]; })) found++;
                  }

                  int paksCopied = 0;
                  for (NSString *r in paksArr) {
                      NSString *full = [doc stringByAppendingPathComponent:r];
                      unsigned long long sz = [[fm attributesOfItemAtPath:full error:nil] fileSize];
                      BOOL isPakchunk0 = [r.lastPathComponent.lowercaseString hasPrefix:@"pakchunk0-"];
                      if (!isPakchunk0) continue;

                      NSString *relKit = r;
                      NSRange rr = [r rangeOfString:@"romfs/"];
                      if (rr.location != NSNotFound) relKit = [r substringFromIndex:rr.location + rr.length];

                      NSString *dstDir = [staging2 stringByAppendingPathComponent:[@"RomFS" stringByAppendingPathComponent:relKit.stringByDeletingLastPathComponent]];
                      [fm createDirectoryAtPath:dstDir withIntermediateDirectories:YES attributes:nil error:nil];

                      dispatch_async(dispatch_get_main_queue(), ^{
                          self.statusLabel.text = [NSString stringWithFormat:@"Pak: %.0f MB", sz / 1048576.0];
                          self.progressBar.progress = 0.45 + 0.30 * paksCopied / (float)(paksArr.count + 1);
                      });
                      if ([fm copyItemAtPath:full toPath:[dstDir stringByAppendingPathComponent:r.lastPathComponent] error:nil]) {
                          paksCopied++;
                          [self log:[NSString stringWithFormat:@"  pak copiado: %@ (%.0f MB)", r.lastPathComponent, sz / 1048576.0]];
                      }
                  }

                  if (manifestPath) {
                      NSString *full = [doc stringByAppendingPathComponent:manifestPath];
                      [fm copyItemAtPath:full toPath:[staging1 stringByAppendingPathComponent:@"RomFS/Manifest_UFSFiles_Switch.txt"] error:nil];
                      [fm copyItemAtPath:full toPath:[staging2 stringByAppendingPathComponent:@"RomFS/Manifest_UFSFiles_Switch.txt"] error:nil];
                      [self log:@"  manifest copiado para ambos os zips"];
                  }

                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.statusLabel.text = @"Empacotando part1 (IoStore)...";
                      self.progressBar.progress = 0.8;
                  });
                  NSString *zipBase1 = [doc stringByAppendingPathComponent:[NSString stringWithFormat:@"shader_kit_%@_part1", tid]];
                  BOOL zip1Ok = found > 0 && build_split_zip_file(staging1, zipBase1, 1900ULL * 1024ULL * 1024ULL, ^(NSString *m) { [self log:m]; });
                  if (zip1Ok) [self log:@"✓ Part1 gerado em partes .z00/.z01/..."];

                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.statusLabel.text = @"Empacotando part2 (Pak)...";
                      self.progressBar.progress = 0.88;
                  });
                  NSString *zipBase2 = [doc stringByAppendingPathComponent:[NSString stringWithFormat:@"shader_kit_%@_part2", tid]];
                  BOOL zip2Ok = paksCopied > 0 && build_split_zip_file(staging2, zipBase2, 1900ULL * 1024ULL * 1024ULL, ^(NSString *m) { [self log:m]; });
                  if (zip2Ok) [self log:@"✓ Part2 gerado em partes .z00/.z01/..." ];

                  if (zip1Ok || zip2Ok) {
                      [self log:@""];
                      [self log:@"✓✓ SHADER KIT COMPLETO!"];
                      [self log:@"  Baixe as partes de part1 e part2."];
                      [self log:@"  Use todas as partes do mesmo prefixo."];
                  } else {
                      [self log:@"✗ Nenhum zip gerado."];
                  }

                  [fm removeItemAtPath:staging1 error:nil];
                  [fm removeItemAtPath:staging2 error:nil];

                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.progressBar.progress = 1.0;
                      self.statusLabel.text = @"Concluido";
                      self.runBtn.enabled = YES;
                      self.scanBtn.enabled = YES;
                  });
              });
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [KitVC new];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class])); }
          }
          OBJCEOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            "$RUNNER_TEMP/App/main.m" \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -lz \
            -o "$APP_DIR/ShaderKitNS"

          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ShaderKitNS</string>
            <key>CFBundleIdentifier</key><string>com.kinttany.shaderkitns</string>
            <key>CFBundleName</key><string>ShaderKitNS</string>
            <key>CFBundleDisplayName</key><string>ShaderKitNS</string>
            <key>CFBundleVersion</key><string>1.5</string>
            <key>CFBundleShortVersionString</key><string>1.5</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>CFBundleIconName</key><string>AppIcon</string>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array><string>AppIcon60x60</string></array>
                <key>CFBundleIconName</key><string>AppIcon</string>
                <key>UIPrerenderedIcon</key><true/>
              </dict>
            </dict>
          </dict>
          </plist>
          PLIST

          codesign -f -s - "$APP_DIR"
          cd "$RUNNER_TEMP"
          zip -qry "$RUNNER_TEMP/ShaderKitNS.ipa" Payload
          ls -lh "$RUNNER_TEMP/ShaderKitNS.ipa"

      - name: 3. Upload nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShaderKitNS-App-IPA
          path: ${{ runner.temp }}/ShaderKitNS.ipa

      - name: 4. Publicar na Release v1.0-kit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0-kit "$RUNNER_TEMP/ShaderKitNS.ipa" --repo "$GITHUB_REPOSITORY" --clobber || echo "aviso: nao publiquei na release"
