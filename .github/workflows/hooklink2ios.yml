name: HookLink2iOS Ocarina native build

on:
  push:
    branches:
      - HookLink2iOS
    paths:
      - hooklink2ios/handoff.json

permissions:
  contents: read

concurrency:
  group: hooklink2ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/HookLink2iOS'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Checkout only the requested branch and commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce branch isolation and validate handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/HookLink2iOS"
          test "$GITHUB_REF_NAME" = "HookLink2iOS"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s hooklink2ios/handoff.json
          python3 - <<'PY'
          import json, os, re
          h=json.load(open("hooklink2ios/handoff.json", encoding="utf-8"))
          assert h.get("project") == "HookLink2iOS"
          assert h.get("branch") == "HookLink2iOS"
          assert h.get("title_id") == "0400486024DEC000"
          assert h.get("package_version") == "v131072"
          assert h.get("package_version_number") == 131072
          assert h.get("engine", {}).get("commit") == "cf2a2fecc6ce3fb841131ffeffa90915cdadf109"
          assert h.get("gpu_arch") == "g18p", "iPhone 17 Pro requires HookLink's documented g18p pipeline archive."
          for key in ("nup", "romfs", "resolution_overlay"):
              item=h[key]
              assert item.get("id") and int(item.get("size",0)) > 0
              assert re.fullmatch(r"[0-9a-f]{64}", item.get("sha256",""))
          assert h.get("drive",{}).get("run_folder_id")
          print("Handoff validado:",h["request_id"])
          PY

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the exact Xcode 27.2 and iOS Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 is missing from xcode-27"; exit 1; }
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version

      - name: Install pinned Xcode, Metal and Python build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version
          brew install xcodegen zstd glslang
          dotnet --list-sdks
          dotnet --list-sdks | grep -Eq '^(8|9|10|11)[.]' || { echo "::error::.NET SDK 8+ is required by the pinned NXNative toolchain."; exit 1; }
          python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd google-api-python-client google-auth requests

      - name: Fetch exact HookLink nxnative engine commit
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(python -c 'import json; print(json.load(open("hooklink2ios/handoff.json"))["engine"]["commit"])')"
          test "$PIN" = "cf2a2fecc6ce3fb841131ffeffa90915cdadf109"
          git init "$RUNNER_TEMP/nxnative"
          git -C "$RUNNER_TEMP/nxnative" remote add origin https://github.com/dsi-hub/nxnative.git
          git -C "$RUNNER_TEMP/nxnative" fetch --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/nxnative" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nxnative" rev-parse HEAD)" = "$PIN"

      - name: Preflight HookLink build storage before large downloads
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "RAM bytes: $(sysctl -n hw.memsize)"
          df -h "$RUNNER_TEMP"
          AVAILABLE_KB="$(df -Pk "$RUNNER_TEMP" | awk 'END {print $4}')"
          AVAILABLE_BYTES="$((AVAILABLE_KB * 1024))"
          REQUIRED_BYTES="$((80 * 1024 * 1024 * 1024))"
          echo "Available workspace storage: $((AVAILABLE_BYTES / 1024 / 1024 / 1024)) GiB"
          echo "HookLink documented minimum: 80 GiB free"
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "::error::Insufficient disk for HookLink's full native build. Refusing to download the 25.6 GB NUP: need at least 80 GiB free."
            exit 1
          fi

      - name: Build native iOS IPA using the existing Link2iOS Drive service-account pattern
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON Actions secret is missing."; exit 1; }
          python scripts/hooklink2ios_build.py \
            --handoff hooklink2ios/handoff.json \
            --engine "$RUNNER_TEMP/nxnative" \
            --output "$RUNNER_TEMP/hooklink2ios-output"

      - name: Publish IPA, overlay and report as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: HookLink2iOS-Ocarina-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/hooklink2ios-output/OcarinaOfTime-HookLink2iOS.ipa
            ${{ runner.temp }}/hooklink2ios-output/res_overlay/Pack/Bootup.Nin_Ounce_NVN2.pack.zs
            ${{ runner.temp }}/hooklink2ios-output/build-report.json
          if-no-files-found: error
          retention-days: 7
