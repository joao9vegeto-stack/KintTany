name: HookLink2iOS Ocarina native build

on:
  push:
    branches:
      - HookLink2iOS
    paths:
      - hooklink2ios/handoff.json

permissions:
  contents: read

concurrency:
  group: hooklink2ios-${ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/HookLink2iOS'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"

    steps:
      - name: Checkout only the requested branch and commit
        uses: actions/checkout@v4
        with:
          ref: ${ github.sha }}
          persist-credentials: false

      - name: Enforce branch isolation and validate prepared handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/HookLink2iOS"
          test "$GITHUB_REF_NAME" = "HookLink2iOS"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s hooklink2ios/handoff.json
          python3 - <<'PY'
          import json, re
          h=json.load(open("hooklink2ios/handoff.json", encoding="utf-8"))
          assert h.get("schema") == 3, "Only the prepared-workspace handoff schema 3 is valid."
          assert h.get("project") == "HookLink2iOS"
          assert h.get("branch") == "HookLink2iOS"
          assert h.get("title_id") == "0400486024DEC000"
          assert h.get("package_version") == "v131072"
          assert h.get("package_version_number") == 131072
          assert h.get("engine", {}).get("commit") == "cf2a2fecc6ce3fb841131ffeffa90915cdadf109"
          assert h.get("gpu_arch") == "none"
          assert h.get("builder", {}).get("iphoneos_deployment_target") == "26.0"
          assert h.get("builder", {}).get("nup_download_in_actions") is False
          assert h.get("prepared", {}).get("engine_pin") == h["engine"]["commit"]
          assert h.get("prepared", {}).get("shader_package_key")
          assert h.get("prepared", {}).get("shader_chain")
          for key in ("nup", "work_archive", "romfs", "resolution_overlay"):
              item=h[key]
              assert item.get("id") and int(item.get("size",0)) > 0
              assert re.fullmatch(r"[0-9a-f]{64}", item.get("sha256","")), key
          assert h.get("drive",{}).get("run_folder_id")
          print("Prepared workspace handoff validated:",h["request_id"])
          print("NUP remains in Drive cache; Actions downloads only work_archive + RomFS + overlay.")
          PY

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax, embedded Colab helper and iOS target
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/hooklink2ios_build.py colab/hooklink2ios_prepare.py
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          helper=Path("colab/hooklink2ios_prepare.py").read_text(encoding="utf-8")
          ast.parse(helper)
          ast.parse(Path("scripts/hooklink2ios_build.py").read_text(encoding="utf-8"))
          notebook=json.loads(Path("colab/HookLink2iOS_Colab.ipynb").read_text(encoding="utf-8"))
          cell="".join(notebook["cells"][4]["source"])
          start="HELPER_SOURCE = r'''"
          end="\n'''\nHELPER_SHA256 = hashlib.sha256(HELPER_SOURCE.encode(\"utf-8\")).hexdigest()"
          p=cell.index(start); q=cell.index(end,p)
          embedded=cell[p+len(start)+1:q]
          assert embedded==helper, "Colab embedded helper diverges from the versioned helper."
          print("Python syntax, exact Colab helper parity and iOS 26 target validated.")
          print("Helper SHA-256:",hashlib.sha256(helper.encode()).hexdigest())
          PY

      - name: Verify Xcode 27.2 and iOS 26 SDK/Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 is missing from xcode-27"; exit 1; }
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 27.2"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version
          echo "Deployment target: $IPHONEOS_DEPLOYMENT_TARGET (toolchain Xcode 27.2)"

      - name: Install native nxnative build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang
          dotnet --list-sdks
          dotnet --list-sdks | grep -Eq '^(8|9|10|11)[.]' || { echo "::error::.NET SDK 8+ is required by the pinned nxnative toolchain."; exit 1; }
          python -m pip install lz4 "capstone>=5,<6" fonttools zbic backports.zstd google-api-python-client google-auth requests

      - name: Fetch exact HookLink nxnative engine commit
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(python -c 'import json; print(json.load(open("hooklink2ios/handoff.json"))["engine"]["commit"])')"
          test "$PIN" = "cf2a2fecc6ce3fb841131ffeffa90915cdadf109"
          git init "$RUNNER_TEMP/nxnative"
          git -C "$RUNNER_TEMP/nxnative" remote add origin https://github.com/dsi-hub/nxnative.git
          git -C "$RUNNER_TEMP/nxnative" fetch --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/nxnative" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nxnative" rev-parse HEAD)" = "$PIN"

      - name: Preflight Ocarina profile, compiler lock and iOS 26 project
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/nxnative"
          python - "$ENGINE" <<'PY'
          import pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          profile=root/"dm/games/0400486024DEC000"
          fields={}
          for line in (profile/"game.tsv").read_text().splitlines():
              if line and not line.startswith("#") and "\t" in line:
                  key,value=line.split("\t",1); fields[key]=value
          assert fields.get("title_id")=="0400486024DEC000"
          assert fields.get("package")=="v131072"
          assert fields.get("pso_mtl4")=="on"
          for table in ("shader_pairs.tsv","pso_pairs.tsv"):
              path=profile/table
              rows=sum(1 for line in path.read_text().splitlines() if line.strip() and not line.startswith("#"))
              assert rows>1000, f"{table}: only {rows} rows"
              print(f"{table}: {rows:,} entries")
          lock_fields={}
          for line in (root/"dm/gfx/tools/dmsh_chain.lock").read_text().splitlines():
              if "\t" in line and not line.startswith("#"):
                  key,value=line.split("\t",1); lock_fields[key]=value
          for key in ("metal_macosx","metal_iphoneos","dmsh_xlate","xlate_source","spirv_cross"):
              assert lock_fields.get(key), f"{key} absent from dmsh_chain.lock"
          project=(root/"dm/ios/project.yml").read_text()
          assert re.search(r'^\s+iOS:\s*["\']26\.0["\']\s*$',project,re.M), "nxnative DmIOS deployment target must remain iOS 26.0"
          assert (root/"dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate").is_file()
          assert (root/"dm/gfx/tools/spirv_cross_bin/spirv-cross").is_file()
          builder=(root/"scripts/build_ipa_from_nsp.py").read_text()
          assert "def build_shaders(" in builder
          assert "dm/ios/tools/build_ipa.sh" in builder
          print("Pinned Ocarina profile, NVN tables, real Metal-lock keys, iOS 26 project and native builder validated.")
          PY
          python "$ENGINE/dm/gfx/tools/own_compilers.py" --check-metal

      - name: Inspect actual runner storage (no destructive Xcode cleanup)
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "RAM bytes: $(sysctl -n hw.memsize)"
          df -h "$RUNNER_TEMP"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build native IPA from the Colab-prepared workspace
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON Actions secret is missing."; exit 1; }
          python scripts/hooklink2ios_build.py \
            --handoff hooklink2ios/handoff.json \
            --engine "$RUNNER_TEMP/nxnative" \
            --output "$RUNNER_TEMP/hooklink2ios-output"

      - name: Publish IPA, overlay and report as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: HookLink2iOS-Ocarina-${ github.run_number }}
          path: |
            ${ runner.temp }}/hooklink2ios-output/OcarinaOfTime-HookLink2iOS.ipa
            ${ runner.temp }}/hooklink2ios-output/res_overlay/Pack/Bootup.Nin_Ounce_NVN2.pack.zs
            ${ runner.temp }}/hooklink2ios-output/build-report.json
          if-no-files-found: error
          retention-days: 7
