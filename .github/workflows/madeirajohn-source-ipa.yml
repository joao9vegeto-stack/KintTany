name: MadeiraJohn source IPA

on:
  push:
    branches:
      - MadeiraJohn

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout MadeiraJohn source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Build corrected Madeira IPA entirely from repository sources
        shell: bash
        run: |
          set -o pipefail
          bash ci/build-madeirajohn.sh 2>&1 | tee build-madeirajohn-ci.log

      - name: Upload MadeiraJohn IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MadeiraJohn-0.1.1-Source
          path: |
            out/*
            build-madeirajohn-ci.log
          compression-level: 0
          if-no-files-found: warn
