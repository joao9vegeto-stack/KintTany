name: KaKaRoTiOS Kakarot build

on:
  push:
    branches:
      - KaKaRoTiOS
    paths:
      - handoff.json

concurrency:
  group: kakarotios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-handoff:
    if: github.ref == 'refs/heads/KaKaRoTiOS' && startsWith(github.event.head_commit.message, 'Queue KaKaRoTiOS build ')
    runs-on: macos-26
    steps:
      - name: Checkout KaKaRoTiOS only
        uses: actions/checkout@v4
        with:
          ref: KaKaRoTiOS
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate branch scope and Kakarot handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/KaKaRoTiOS"
          python -m json.tool handoff.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          h = json.loads(Path("handoff.json").read_text())
          p = h.get("prepared") or {}
          assert h.get("project") == "KaKaRoTiOS"
          assert h.get("branch") == "KaKaRoTiOS"
          assert h.get("title_id") == "010051C0134F8000"
          assert h.get("nx2apple_tag") == "v1.3.1-rc2"
          assert h.get("engine_pin") == "81906931262fb25d774cce8bca2db8926439e5a2"
          assert h.get("package_version") == p.get("package_version")
          assert p.get("profile_type") == "provisional"
          assert p.get("graphics_api") == "nvn"
          inputs = p.get("input_packages", [])
          dlc_inputs = [x for x in inputs if str(x.get("name", "")).startswith("dlc_")]
          assert p.get("input_package_count") == 22
          assert len(inputs) == 22
          assert p.get("input_dlc_package_count") == 20
          assert len(dlc_inputs) == 20
          assert len({x.get("name") for x in inputs}) == 22
          assert all(x.get("type") in ("NSP", "XCI") and x.get("size", 0) > 0 and len(x.get("sha256", "")) == 64 for x in inputs)
          assert sum(x.get("name") in ("base.nsp", "base.xci") for x in inputs) == 1
          assert sum(x.get("name") in ("update.nsp", "update.xci") for x in inputs) == 1
          src = h.get("source") or {}
          src_dlcs = src.get("dlc_packages") or []
          assert src.get("package_count") == 2
          assert src.get("base_rar_volume_count") == 3
          assert src.get("update_download_kind") == "direct_nsp"
          assert src.get("dlc_package_count") == 20
          assert len(src_dlcs) == 20
          assert src.get("dlc_inventory", {}).get("total") == 20
          assert {x.get("local_name"): x.get("size") for x in src_dlcs} == {x.get("name"): x.get("size") for x in dlc_inputs}
          assert src.get("rar_parts_deleted_after_upload") is True
          for label in ("base", "update"):
              item = src.get(label) or {}
              drive = src.get(label + "_drive") or {}
              assert item.get("type") in ("NSP", "XCI") and item.get("archive", {}).get("package_type") == item.get("type")
              assert item.get("size", 0) > 0 and len(item.get("sha256", "")) == 64
              assert drive.get("id") and drive.get("size") == item["size"]
              assert len(drive.get("sha256", "")) == 64 and drive.get("md5")
          base_archive = src["base"]["archive"]
          assert base_archive.get("source_kind") == "three_volume_rar"
          assert len(base_archive.get("rar_volumes", [])) == 3
          assert all(v.get("size", 0) > 0 and len(v.get("sha256", "")) == 64 for v in base_archive["rar_volumes"])
          update = src["update"]
          update_archive = update["archive"]
          assert update.get("type") == "NSP"
          assert update_archive.get("source_kind") == "direct_nsp_download"
          assert update_archive.get("package_type") == "NSP"
          assert update_archive.get("rar_volumes") == []
          assert len(update_archive.get("source_url_sha256", "")) == 64
          assert update_archive.get("download_size") == update.get("size")
          assert update_archive.get("download_sha256") == update.get("sha256")
          gd = h.get("game_data") or {}
          assert gd.get("base_package", {}).get("id")
          assert gd.get("update_package", {}).get("id")
          assert gd.get("romfs", {}).get("sha256")
          assert gd.get("aoc_folder_id")
          assert gd.get("aoc_count") == len(gd.get("aoc", [])) == p.get("aoc_count")
          assert {x.get("name"): x.get("sha256") for x in gd.get("aoc", [])} == {x.get("name"): x.get("sha256") for x in p.get("aoc_images", [])}
          assert h.get("work_archive", {}).get("sha256")
          print("KaKaRoTiOS RAR/base/update/Drive/RomFS/AOC handoff contract: OK")
          PY
          python -m py_compile colab/source_kakarot.py colab/prepare_kakarot.py colab/run_kakarot.py scripts/prepare_kakarot_actions.py scripts/build_kakarot_shared.py
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "colab")
          import source_kakarot
          page = source_kakarot.AkiraBoxDownloadPageParser()
          page.feed('<div id="download-button" class="download-file-link"><a id="download" class="download-ready" href="/download/abcdefgh1234/signedtoken">Download</a></div>')
          assert page.download_href == "/download/abcdefgh1234/signedtoken"
          assert source_kakarot._akirabox_signed_download_code(
              "https://akirabox.com/download/abcdefgh1234/signedtoken"
          ) == "abcdefgh1234"
          mega_base = [
              "https://megadl.boats/download/DRAGON%20BALL%20Z%20KAKAROT%20%2B%20A%20NEW%20POWER%20AWAKENS%20SET%5B010051C0134F8000%5D%5Bv0%5D%5BUS%5D%28eShop%29.nsp.part1.rar?download_token=x1",
              "https://megadl.boats/download/DRAGON%20BALL%20Z%20KAKAROT%20%2B%20A%20NEW%20POWER%20AWAKENS%20SET%5B010051C0134F8000%5D%5Bv0%5D%5BUS%5D%28eShop%29.nsp.part2.rar?download_token=x2",
              "https://megadl.boats/download/DRAGON%20BALL%20Z%20KAKAROT%20%2B%20A%20NEW%20POWER%20AWAKENS%20SET%5B010051C0134F8000%5D%5Bv0%5D%5BUS%5D%28eShop%29.nsp.part3.rar?download_token=x3",
          ]
          mega_update = "https://megadl.boats/download/DRAGON%20BALL%20Z%20KAKAROT%20%2B%20A%20NEW%20POWER%20AWAKENS%20SET%20%5B010051C0134F8800%5D%5Bv1048576%5D%5BUPD1.70%5D%5BUS%5D.nsp?download_token=update"
          mega_preflight = source_kakarot.preflight_megadl_sources(mega_base, mega_update)
          assert len(mega_preflight["base"]) == 3
          assert mega_preflight["update"]["kind"] == "nsp"
          assert "download_token" not in str(mega_preflight)
          with tempfile.TemporaryDirectory(prefix="kakarot-package-contract-") as tmp:
              root = Path(tmp)
              nsp = root / "base.nsp"
              nsp.write_bytes(b"PFS0" + bytes(4096))
              xci = root / "update.xci"
              header = bytearray(0x104)
              header[0x100:0x104] = b"HEAD"
              xci.write_bytes(header)
              assert source_kakarot.validate_package(nsp) == "NSP"
              assert source_kakarot.validate_package(xci) == "XCI"
              try:
                  source_kakarot.validate_package(nsp, ".xci")
              except SystemExit:
                  pass
              else:
                  raise AssertionError("NSP mislabeled as XCI was accepted")
          assert source_kakarot.validate_volume_sequence(
              ["base.part1.rar", "base.part2.rar", "base.part3.rar"], "BASE"
          )["scheme"] == "modern"
          assert source_kakarot.validate_volume_sequence(
              ["update.rar", "update.r00", "update.r01"], "UPDATE"
          )["scheme"] == "legacy"
          assert source_kakarot.safe_volume_name("update.r00", "UPDATE") == "update.r00"
          assert source_kakarot.safe_volume_name("update.r01", "UPDATE") == "update.r01"
          with tempfile.TemporaryDirectory(prefix="kakarot-rar-contract-") as rar_tmp:
              rar5 = Path(rar_tmp) / "volume.part1.rar"
              rar5.write_bytes(b"Rar!\x1a\x07\x01\x00" + bytes(32))
              assert source_kakarot.is_rar_volume(rar5)
          try:
              source_kakarot.validate_volume_sequence(
                  ["base.part1.rar", "base.part3.rar", "base.part2.rar"], "BASE"
              )
          except SystemExit:
              pass
          else:
              raise AssertionError("Out-of-order RAR volumes were accepted")
          try:
              source_kakarot.validate_volume_sequence(
                  ["base.part1.rar", "base.part2.rar", "other.part3.rar"], "BASE"
              )
          except SystemExit:
              pass
          else:
              raise AssertionError("Mixed RAR archive sets were accepted")
          print("NSP/XCI header and modern/legacy multipart RAR sequence contract: OK")

          # Kakarot restore must use the same tested parallel Drive range planner as Mugiwara4iOS.
          import os
          sys.path.insert(0, "scripts")
          import prepare_kakarot_actions as restore
          romfs_size = 24296032714
          spans = restore._drive_ranges(romfs_size, 64 * 1024 * 1024)
          assert spans[0][0] == 0 and spans[-1][1] == romfs_size - 1
          assert all(a[1] + 1 == b[0] for a, b in zip(spans, spans[1:]))
          assert sum(end - start + 1 for start, end in spans) == romfs_size
          assert len(spans) == 363, f"Unexpected Kakarot RomFS range count: {len(spans)}"
          with tempfile.TemporaryFile() as stream:
              fd = stream.fileno()
              os.ftruncate(fd, 32)
              restore._drive_pwrite_all(fd, b"RANGE", 11)
              assert os.pread(fd, 5, 11) == b"RANGE"

          # Regression test: builder metadata keys are retained before the large RomFS transfer.
          fixture = {key: f"fixture:{key}" for key in restore.BUILDER_PREP_COMPARE_KEYS}
          fixture.update({
              "project": "KaKaRoTiOS",
              "title_id": "010051C0134F8000",
              "package_version": "v1048576",
              "nx2apple_tag": "v1.3.1-rc2",
              "engine_pin": "81906931262fb25d774cce8bca2db8926439e5a2",
              "profile_relative_dir": "profile/010051C0134F8000",
              "romfs_relative_path": "extract/v1048576/RomFS.img",
              "romfs_id_relative_path": "extract/v1048576/RomFS.img.id",
              "survey_relative_path": "survey/survey.md",
              "aoc_relative_dir": "aoc",
              "aoc_count": 1,
              "aoc_images": [{"name": "1.img", "size": 1, "sha256": "0" * 64}],
          })
          fixture_root = Path("/tmp/kakarot-actions-contract")
          projected = restore.build_actions_input_manifest(
              fixture, {"request_id": "fixture-request"}, fixture_root, {}, {}, {}
          )
          restore.validate_actions_input_projection(projected, fixture)
          assert projected["profile_relative_dir"] == fixture["profile_relative_dir"]
          assert projected["aoc_image_manifest"] == fixture["aoc_images"]
          assert projected["aoc_images"] == [str(fixture_root / "aoc" / "1.img")]
          print("Kakarot parallel Drive ranges + builder manifest projection contract: OK")
          PY

  build-kakarot:
    needs: validate-handoff
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    if: github.ref == 'refs/heads/KaKaRoTiOS' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Queue KaKaRoTiOS build ')
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout KaKaRoTiOS only
        uses: actions/checkout@v4
        with:
          ref: KaKaRoTiOS
          persist-credentials: false

      - name: Assert branch and Xcode 27 / iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/KaKaRoTiOS"
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 is missing from xcode-27"; exit 1; }
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version
          test "$(uname -m)" = "arm64"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and Python dependencies (no cache)
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang cmake ninja pkg-config
          python -m pip install --upgrade pip
          python -m pip install lz4 'capstone>=5,<6' fonttools zbic backports.zstd google-api-python-client google-auth PyYAML

      - name: Install explicit .NET 10 SDK and ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          DOTNET_ROOT="$RUNNER_TEMP/dotnet10-arm64"
          curl --fail --location --silent --show-error https://dot.net/v1/dotnet-install.sh \
            --output "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 10.0 \
            --architecture arm64 \
            --install-dir "$DOTNET_ROOT" \
            --no-path
          test -x "$DOTNET_ROOT/dotnet"
          "$DOTNET_ROOT/dotnet" --list-sdks | grep -E '^10\\.'
          "$DOTNET_ROOT/dotnet" --list-runtimes | grep -E '^Microsoft\\.NETCore\\.App 10\\.'
          "$DOTNET_ROOT/dotnet" --info
          {
            echo "DOTNET_ROOT=$DOTNET_ROOT"
            echo "PATH=$DOTNET_ROOT:$PATH"
          } >> "$GITHUB_ENV"

      - name: Clone and pin NX2Apple / NXNative
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1-rc2 https://github.com/LNPANDY/NX2Apple.git NX2Apple
          python NX2Apple/tools/engine.py sync
          test "$(cat NX2Apple/.upstream-ref)" = "81906931262fb25d774cce8bca2db8926439e5a2"

      - name: Preflight .NET 10 shader translator before Drive restore
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$DOTNET_ROOT" = "$RUNNER_TEMP/dotnet10-arm64"
          dotnet --list-sdks | grep -E '^10\\.'
          dotnet --list-runtimes | grep -E '^Microsoft\\.NETCore\\.App 10\\.'
          xlate="NX2Apple/engine/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate"
          test -x "$xlate" || { echo "::error::Pinned shader translator missing or not executable: $xlate"; exit 1; }
          "$xlate" --source-sha | tee "$RUNNER_TEMP/dmsh-xlate-source-sha.txt"
          test -s "$RUNNER_TEMP/dmsh-xlate-source-sha.txt"

      - name: Restore workspace and external RomFS from Drive (size + SHA-256)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python scripts/prepare_kakarot_actions.py \
            --handoff handoff.json \
            --destination "$RUNNER_TEMP/kakarot-actions"

      - name: Build Oodle/shaders, iOS Metal, framework, Shared Shell and thin IPA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_kakarot_shared.py \
            --nx2apple-root NX2Apple \
            --prepared-json "$RUNNER_TEMP/kakarot-actions/actions-input.json" \
            --output "$RUNNER_TEMP/kakarot-output"

      - name: Upload KaKaRoTiOS IPA and report
        uses: actions/upload-artifact@v4
        with:
          name: KaKaRoTiOS-Kakarot-IPA
          path: |
            ${{ runner.temp }}/kakarot-output/KaKaRoTiOS.ipa
            ${{ runner.temp }}/kakarot-output/build-report.json
          if-no-files-found: error
          retention-days: 14
