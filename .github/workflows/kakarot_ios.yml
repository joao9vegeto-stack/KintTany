name: KaKaRoTiOS Kakarot build

on:
  push:
    branches:
      - KaKaRoTiOS
    paths:
      - handoff.json

concurrency:
  group: kakarotios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-handoff:
    if: github.ref == 'refs/heads/KaKaRoTiOS' && startsWith(github.event.head_commit.message, 'Queue KaKaRoTiOS build ')
    runs-on: macos-26
    steps:
      - name: Checkout KaKaRoTiOS only
        uses: actions/checkout@v4
        with:
          ref: KaKaRoTiOS
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate branch scope and Kakarot handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/KaKaRoTiOS"
          python -m json.tool handoff.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          h = json.loads(Path("handoff.json").read_text())
          p = h.get("prepared") or {}
          assert h.get("project") == "KaKaRoTiOS"
          assert h.get("branch") == "KaKaRoTiOS"
          assert h.get("title_id") == "010051C0134F8000"
          assert h.get("nx2apple_tag") == "v1.3.1-rc2"
          assert h.get("engine_pin") == "81906931262fb25d774cce8bca2db8926439e5a2"
          assert h.get("package_version") == p.get("package_version")
          assert p.get("profile_type") == "provisional"
          assert p.get("graphics_api") == "nvn"
          inputs = p.get("input_packages", [])
          dlc_inputs = [x for x in inputs if str(x.get("name", "")).startswith("dlc_")]
          assert p.get("input_package_count") == 22
          assert len(inputs) == 22
          assert p.get("input_dlc_package_count") == 20
          assert len(dlc_inputs) == 20
          assert len({x.get("name") for x in inputs}) == 22
          assert all(x.get("type") in ("NSP", "XCI") and x.get("size", 0) > 0 and len(x.get("sha256", "")) == 64 for x in inputs)
          assert sum(x.get("name") in ("base.nsp", "base.xci") for x in inputs) == 1
          assert sum(x.get("name") in ("update.nsp", "update.xci") for x in inputs) == 1
          src = h.get("source") or {}
          src_dlcs = src.get("dlc_packages") or []
          assert src.get("package_count") == 2
          assert src.get("dlc_package_count") == 20
          assert len(src_dlcs) == 20
          assert src.get("dlc_inventory", {}).get("total") == 20
          assert {x.get("local_name"): x.get("size") for x in src_dlcs} == {x.get("name"): x.get("size") for x in dlc_inputs}
          assert src.get("rar_parts_deleted_after_upload") is True
          for label in ("base", "update"):
              item = src.get(label) or {}
              drive = src.get(label + "_drive") or {}
              assert item.get("type") in ("NSP", "XCI") and item.get("archive", {}).get("package_type") == item.get("type")
              assert item.get("size", 0) > 0 and len(item.get("sha256", "")) == 64
              assert len(item.get("archive", {}).get("rar_volumes", [])) == 3
              assert all(len(v.get("sha256", "")) == 64 and v.get("size", 0) > 0 for v in item["archive"]["rar_volumes"])
              assert drive.get("id") and drive.get("size") == item["size"]
              assert len(drive.get("sha256", "")) == 64 and drive.get("md5")
          gd = h.get("game_data") or {}
          assert gd.get("base_package", {}).get("id")
          assert gd.get("update_package", {}).get("id")
          assert gd.get("romfs", {}).get("sha256")
          assert gd.get("aoc_folder_id")
          assert gd.get("aoc_count") == len(gd.get("aoc", [])) == p.get("aoc_count")
          assert {x.get("name"): x.get("sha256") for x in gd.get("aoc", [])} == {x.get("name"): x.get("sha256") for x in p.get("aoc_images", [])}
          assert h.get("work_archive", {}).get("sha256")
          print("KaKaRoTiOS RAR/base/update/Drive/RomFS/AOC handoff contract: OK")
          PY
          python -m py_compile colab/source_kakarot.py colab/prepare_kakarot.py colab/run_kakarot.py scripts/prepare_kakarot_actions.py scripts/build_kakarot_shared.py
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "colab")
          import source_kakarot
          page = source_kakarot.AkiraBoxDownloadPageParser()
          page.feed('<div id="download-button" class="download-file-link"><a id="download" class="download-ready" href="/download/abcdefgh1234/signedtoken">Download</a></div>')
          assert page.download_href == "/download/abcdefgh1234/signedtoken"
          assert source_kakarot._akirabox_signed_download_code(
              "https://akirabox.com/download/abcdefgh1234/signedtoken"
          ) == "abcdefgh1234"
          with tempfile.TemporaryDirectory(prefix="kakarot-package-contract-") as tmp:
              root = Path(tmp)
              nsp = root / "base.nsp"
              nsp.write_bytes(b"PFS0" + bytes(4096))
              xci = root / "update.xci"
              header = bytearray(0x104)
              header[0x100:0x104] = b"HEAD"
              xci.write_bytes(header)
              assert source_kakarot.validate_package(nsp) == "NSP"
              assert source_kakarot.validate_package(xci) == "XCI"
              try:
                  source_kakarot.validate_package(nsp, ".xci")
              except SystemExit:
                  pass
              else:
                  raise AssertionError("NSP mislabeled as XCI was accepted")
          assert source_kakarot.validate_volume_sequence(
              ["base.part1.rar", "base.part2.rar", "base.part3.rar"], "BASE"
          )["scheme"] == "modern"
          assert source_kakarot.validate_volume_sequence(
              ["update.rar", "update.r00", "update.r01"], "UPDATE"
          )["scheme"] == "legacy"
          assert source_kakarot.safe_volume_name("update.r00", "UPDATE") == "update.r00"
          assert source_kakarot.safe_volume_name("update.r01", "UPDATE") == "update.r01"
          rar5 = root / "volume.part1.rar"
          rar5.write_bytes(b"Rar!\x1a\x07\x01\x00" + bytes(32))
          assert source_kakarot.is_rar_volume(rar5)
          try:
              source_kakarot.validate_volume_sequence(
                  ["base.part1.rar", "base.part3.rar", "base.part2.rar"], "BASE"
              )
          except SystemExit:
              pass
          else:
              raise AssertionError("Out-of-order RAR volumes were accepted")
          try:
              source_kakarot.validate_volume_sequence(
                  ["base.part1.rar", "base.part2.rar", "other.part3.rar"], "BASE"
              )
          except SystemExit:
              pass
          else:
              raise AssertionError("Mixed RAR archive sets were accepted")
          print("NSP/XCI header and modern/legacy multipart RAR sequence contract: OK")
          PY

  build-kakarot:
    needs: validate-handoff
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    if: github.ref == 'refs/heads/KaKaRoTiOS' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Queue KaKaRoTiOS build ')
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout KaKaRoTiOS only
        uses: actions/checkout@v4
        with:
          ref: KaKaRoTiOS
          persist-credentials: false

      - name: Assert branch and Xcode 27 / iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/KaKaRoTiOS"
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 is missing from xcode-27"; exit 1; }
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version
          test "$(uname -m)" = "arm64"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and Python dependencies (no cache)
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang cmake ninja pkg-config
          brew list --cask dotnet-sdk >/dev/null 2>&1 || brew install --cask dotnet-sdk
          python -m pip install --upgrade pip
          python -m pip install lz4 'capstone>=5,<6' fonttools zbic backports.zstd google-api-python-client google-auth PyYAML

      - name: Clone and pin NX2Apple / NXNative
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1-rc2 https://github.com/LNPANDY/NX2Apple.git NX2Apple
          python NX2Apple/tools/engine.py sync
          test "$(cat NX2Apple/.upstream-ref)" = "81906931262fb25d774cce8bca2db8926439e5a2"

      - name: Restore workspace and external RomFS from Drive (size + SHA-256)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python scripts/prepare_kakarot_actions.py \
            --handoff handoff.json \
            --destination "$RUNNER_TEMP/kakarot-actions"

      - name: Build Oodle/shaders, iOS Metal, framework, Shared Shell and thin IPA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_kakarot_shared.py \
            --nx2apple-root NX2Apple \
            --prepared-json "$RUNNER_TEMP/kakarot-actions/actions-input.json" \
            --output "$RUNNER_TEMP/kakarot-output"

      - name: Upload KaKaRoTiOS IPA and report
        uses: actions/upload-artifact@v4
        with:
          name: KaKaRoTiOS-Kakarot-IPA
          path: |
            ${{ runner.temp }}/kakarot-output/KaKaRoTiOS.ipa
            ${{ runner.temp }}/kakarot-output/build-report.json
          if-no-files-found: error
          retention-days: 14
