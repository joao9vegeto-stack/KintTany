name: Madeira no-EVA test

on:
  push:
    branches: [madeiratest]
  workflow_dispatch:

jobs:
  inspect-and-patch:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout CI harness
        uses: actions/checkout@v4

      - name: Clone upstream Madeira source
        run: |
          git clone --depth 1 https://github.com/willfaust/Madeira.git upstream-Madeira
          echo "UPSTREAM=$(git -C upstream-Madeira rev-parse HEAD)"
          sed -n '495,535p' upstream-Madeira/app/Madeira/StikJITHelper.swift

      - name: Download official Madeira IPA
        run: |
          curl -fL --retry 3 -o Madeira-original.ipa \
            https://github.com/willfaust/Madeira/releases/download/v0.1.0/Madeira-0.1.0.ipa
          shasum -a 256 Madeira-original.ipa
          unzip -q Madeira-original.ipa -d ipa
          find ipa/Payload/Madeira.app -maxdepth 2 -type f -print0 | \
            xargs -0 file > app-files.txt
          cat app-files.txt

      - name: Locate compiled Madeira implementation
        run: |
          set -e
          APP=ipa/Payload/Madeira.app
          : > candidates.txt
          while IFS= read -r -d '' f; do
            if grep -aFq "vm_remap failed:" "$f" 2>/dev/null; then
              echo "$f" | tee -a candidates.txt
            fi
          done < <(find "$APP" -type f -print0)
          echo "=== candidates ==="
          cat candidates.txt
          test -s candidates.txt
          BIN="$(head -n1 candidates.txt)"
          echo "$BIN" > target-bin.txt
          echo "TARGET=$BIN"
          file "$BIN"
          strings -a "$BIN" | grep -n -E "vm_remap failed|ml977: RX=|Allocating .*JIT pool|no early pool placeholder" \
            > strings-hits.txt || true
          cat strings-hits.txt

      - name: Disassemble actual target
        run: |
          BIN="$(cat target-bin.txt)"
          nm -m "$BIN" > nm.txt || true
          otool -tvV "$BIN" > disasm.txt
          echo "=== vm_remap references ==="
          grep -n -B 35 -A 50 "vm_remap" disasm.txt | head -n 1200 > vm-remap-context.txt || true
          cat vm-remap-context.txt
          echo "=== likely 448GB materialization ==="
          grep -n -E -B 20 -A 50 "0x7000000000|0x70|#0x70|#112" disasm.txt | head -n 2000 > constant-context.txt || true
          cat constant-context.txt

      - name: Scan AArch64 constant-building instructions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, re
          p=Path(Path("target-bin.txt").read_text().strip())
          b=p.read_bytes()
          out=[]
          # Decode MOVZ/MOVN/MOVK wide-immediate instructions and report pieces
          # which can participate in constructing 0x7000000000.
          for off in range(0, len(b)-4, 4):
              ins=struct.unpack_from("<I",b,off)[0]
              if (ins & 0x1f800000) == 0x12800000:
                  sf=(ins>>31)&1
                  opc=(ins>>29)&3
                  hw=(ins>>21)&3
                  imm16=(ins>>5)&0xffff
                  rd=ins&31
                  if sf and (imm16 in (0x70,0x7000,0x7) or (imm16 << (16*hw)) == 0x7000000000):
                      out.append((off,ins,sf,opc,hw,imm16,rd))
          text="\n".join("file_off=0x%x ins=0x%08x opc=%d hw=%d imm=0x%x rd=x%d"%(
              off,ins,opc,hw,imm,rd) for off,ins,sf,opc,hw,imm,rd in out)
          print(text or "NO WIDE-IMM CANDIDATES")
          Path("wide-imm-hits.txt").write_text(text+"\n")
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-diagnostics-2
          path: |
            app-files.txt
            candidates.txt
            target-bin.txt
            disasm.txt
            nm.txt
            strings-hits.txt
            vm-remap-context.txt
            constant-context.txt
            wide-imm-hits.txt
          if-no-files-found: warn
