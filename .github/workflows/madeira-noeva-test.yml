name: Madeira no-EVA test

on:
  push:
    branches: [madeiratest]
  workflow_dispatch:

jobs:
  inspect-and-patch:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout CI harness
        uses: actions/checkout@v4

      - name: Clone upstream Madeira source
        run: |
          git clone --depth 1 https://github.com/willfaust/Madeira.git upstream-Madeira
          git -C upstream-Madeira rev-parse HEAD
          sed -n '495,535p' upstream-Madeira/app/Madeira/StikJITHelper.swift

      - name: Download official Madeira IPA
        run: |
          curl -fL --retry 3 -o Madeira-original.ipa \
            https://github.com/willfaust/Madeira/releases/download/v0.1.0/Madeira-0.1.0.ipa
          shasum -a 256 Madeira-original.ipa
          unzip -q Madeira-original.ipa -d ipa
          file ipa/Payload/Madeira.app/Madeira

      - name: Inspect vm_remap call sites and 448GB constant
        run: |
          BIN=ipa/Payload/Madeira.app/Madeira
          nm -m "$BIN" > nm.txt || true
          otool -tvV "$BIN" > disasm.txt
          echo "=== vm_remap references ==="
          grep -n -B 20 -A 20 "vm_remap" disasm.txt | head -n 400 || true
          echo "=== 0x70 shifted constants ==="
          grep -n -E -B 12 -A 24 "0x70|#112" disasm.txt | grep -E -B 12 -A 24 "lsl|movz|movk|vm_remap" | head -n 800 || true
          strings -a "$BIN" | grep -n -E "vm_remap failed|ml977: RX=|Allocating .*JIT pool" > strings-hits.txt || true

      - name: Find likely MOVZ 0x70 LSL 32 instructions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("ipa/Payload/Madeira.app/Madeira")
          b=p.read_bytes()
          hits=[]
          # AArch64 MOVZ (64-bit): sf=1 opc=10 fixed=100101, mask 0x7f800000 = 0x52800000,
          # 64-bit form has bit31 set. Decode imm16 + hw.
          for off in range(0, len(b)-4, 4):
              ins=struct.unpack_from("<I",b,off)[0]
              if (ins & 0x7f800000) == 0x52800000 and (ins>>31)&1:
                  hw=(ins>>21)&3
                  imm16=(ins>>5)&0xffff
                  rd=ins&31
                  val=imm16 << (16*hw)
                  if val == 0x7000000000:
                      hits.append((off,ins,rd,hw,imm16))
          print("MOVZ hits for 0x7000000000:", len(hits))
          for h in hits:
              print("file_off=0x%x ins=0x%08x rd=x%d hw=%d imm=0x%x"%h)
          Path("movz-hits.txt").write_text("\n".join(
              "file_off=0x%x ins=0x%08x rd=x%d hw=%d imm=0x%x"%h for h in hits
          )+"\n")
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-diagnostics
          path: |
            disasm.txt
            nm.txt
            movz-hits.txt
            strings-hits.txt
          if-no-files-found: warn
