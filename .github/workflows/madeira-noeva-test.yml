name: Madeira no-EVA test

on:
  push:
    branches: [madeiratest]
  workflow_dispatch:

jobs:
  patch-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout madeiratest harness
        uses: actions/checkout@v4

      - name: Clone original Madeira source
        run: |
          git clone --depth 1 --branch v0.1.0 https://github.com/willfaust/Madeira.git Madeira-upstream
          echo "UPSTREAM_TAG=$(git -C Madeira-upstream rev-parse HEAD)"
          grep -n -A 14 -B 8 'rwAddr = 0x7000000000' Madeira-upstream/app/Madeira/StikJITHelper.swift

      - name: Record equivalent source patch
        run: |
          cp Madeira-upstream/app/Madeira/StikJITHelper.swift StikJITHelper.before.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Madeira-upstream/app/Madeira/StikJITHelper.swift")
          s = p.read_text()
          old = "        rwAddr = 0x7000000000\n"
          new = (
              "        // madeiratest / no-EVA: do not seed vm_remap at 448 GB.\n"
              "        // With VM_FLAGS_ANYWHERE a zero hint lets XNU choose a valid low-VA hole.\n"
              "        rwAddr = 0\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one production rwAddr high-VA assignment, found {s.count(old)}")
          p.write_text(s.replace(old, new))
          PY
          diff -u StikJITHelper.before.swift Madeira-upstream/app/Madeira/StikJITHelper.swift > madeira-noeva-source.patch || true
          cat madeira-noeva-source.patch

      - name: Download official Madeira 0.1.0 IPA
        run: |
          curl -fL --retry 3 -o Madeira-original.ipa \
            https://github.com/willfaust/Madeira/releases/download/v0.1.0/Madeira-0.1.0.ipa
          echo "29054bb5d167382f004ba3ae04d3995e31070e67f4c0acf7eb4f180280f93335  Madeira-original.ipa" | shasum -a 256 -c -
          rm -rf ipa
          unzip -q Madeira-original.ipa -d ipa
          test -f ipa/Payload/Madeira.app/Madeira.debug.dylib

      - name: Patch compiled no-EVA vm_remap hint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path("ipa/Payload/Madeira.app/Madeira.debug.dylib")
          data = bytearray(p.read_bytes())

          # Madeira 0.1.0 / StikJITHelper.allocatePool:
          # 0x604530: mov x8, #0x7000000000
          # 0x604534: str x8, [x19, #0x1f80]  -> rwAddr
          # Patch ONLY the first instruction to: mov x8, #0
          off = 0x604530
          original = bytes.fromhex("08 0e c0 d2")  # 0xd2c00e08
          patched  = bytes.fromhex("08 00 80 d2")  # 0xd2800008

          got = bytes(data[off:off+4])
          print(f"offset 0x{off:x}: before={got.hex(' ')}")
          if got != original:
              raise SystemExit(
                  f"binary guard failed at 0x{off:x}: expected {original.hex(' ')}, got {got.hex(' ')}"
              )

          data[off:off+4] = patched
          p.write_bytes(data)
          print(f"offset 0x{off:x}: after ={patched.hex(' ')}")
          PY

          otool -tvV ipa/Payload/Madeira.app/Madeira.debug.dylib | \
            awk '$1=="0000000000604530"{print; found=1} END{exit !found}' | tee patched-instruction.txt
          grep -q 'mov.*#0x0' patched-instruction.txt

      - name: Re-sign bundle ad hoc while preserving app entitlements
        run: |
          APP=ipa/Payload/Madeira.app
          /usr/bin/codesign -d --entitlements :- "$APP" > original-entitlements.plist 2>/dev/null || true
          echo "=== original entitlements ==="
          cat original-entitlements.plist || true

          /usr/bin/codesign --force --sign - "$APP/Madeira.debug.dylib"
          if plutil -lint original-entitlements.plist >/dev/null 2>&1; then
            /usr/bin/codesign --force --sign - --entitlements original-entitlements.plist "$APP"
          else
            /usr/bin/codesign --force --sign - "$APP"
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package test IPA
        run: |
          rm -f "Madeira no EVA Test.ipa"
          (
            cd ipa
            /usr/bin/zip -qry "../Madeira no EVA Test.ipa" Payload
          )
          shasum -a 256 "Madeira no EVA Test.ipa" | tee Madeira-noEVA-Test.sha256
          unzip -l "Madeira no EVA Test.ipa" | head -n 20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-noEVA-Test
          path: Madeira no EVA Test.ipa
          if-no-files-found: error
          compression-level: 0
