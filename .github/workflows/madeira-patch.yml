name: Madeira MSL 3.2 Patch

on:
  push:
    branches: [madeira-patch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Prepare Metal toolchain
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          if ! xcrun --sdk iphoneos --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos --find metal
          xcrun --sdk iphoneos metal --version || true

      - name: Download exact Madeira release and DXMT shader
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          curl -fL --retry 5 --retry-all-errors             https://github.com/willfaust/Madeira/releases/download/v0.1.0/Madeira-0.1.0.ipa             -o work/Madeira-base.ipa
          echo "29054bb5d167382f004ba3ae04d3995e31070e67f4c0acf7eb4f180280f93335  work/Madeira-base.ipa" | shasum -a 256 -c -
          curl -fL --retry 5 --retry-all-errors             https://raw.githubusercontent.com/willfaust/dxmt/a5e0cd3d41bf248fd1c030a2e1c515ba3522f4ef/src/dxmt/dxmt_command.metal             -o work/dxmt_command.metal
          curl -fL --retry 5 --retry-all-errors             https://raw.githubusercontent.com/willfaust/Madeira/3ccbf9b8bc97f7a59727d10bb9e98717d2c91d64/app/Madeira/Madeira.entitlements             -o work/Madeira.entitlements
          plutil -lint work/Madeira.entitlements

      - name: Recompile internal DXMT command library for iOS
        shell: bash
        run: |
          set -euxo pipefail
          METAL="$(xcrun --sdk iphoneos --find metal)"
          METALLIB="$(xcrun --sdk iphoneos --find metallib)"
          "$METAL" -std=metal3.2 -mios-version-min=18.0 -Os             -c work/dxmt_command.metal -o work/dxmt_command.air
          "$METALLIB" work/dxmt_command.air -o work/dxmt_command.metallib
          test "$(dd if=work/dxmt_command.metallib bs=1 count=4 2>/dev/null)" = "MTLB"
          ls -lh work/dxmt_command.metallib
          shasum -a 256 work/dxmt_command.metallib

      - name: Patch the embedded metallib in Madeira executable
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/unpack
          mkdir -p work/unpack
          ditto -x -k work/Madeira-base.ipa work/unpack
          APP="work/unpack/Payload/Madeira.app"
          test -d "$APP"

          # Preserve the entitlements that are actually signed into the official
          # release. Do NOT sign with the source Madeira.entitlements file: it
          # requests allow-jit, but the shipped iOS app's effective signature
          # intentionally contains only increased-memory-limit + get-task-allow.
          /usr/bin/codesign -d --entitlements :- "$APP" > work/original-entitlements.plist 2>/dev/null
          plutil -lint work/original-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit' work/original-entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :get-task-allow' work/original-entitlements.plist | grep -qx true
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' work/original-entitlements.plist >/dev/null 2>&1; then
            echo "ERROR: official release unexpectedly contains allow-jit entitlement"
            exit 1
          fi

          python3 - "$APP" work/dxmt_command.metallib work/patch-report.txt <<'PY'
          from pathlib import Path
          import struct, sys, hashlib

          app = Path(sys.argv[1])
          new_path = Path(sys.argv[2])
          report_path = Path(sys.argv[3])
          new = new_path.read_bytes()

          def fail(msg):
              raise SystemExit("PATCH ERROR: " + msg)

          if new[:4] != b"MTLB" or len(new) < 32:
              fail("new metallib is invalid")
          if struct.unpack_from("<Q", new, 16)[0] != len(new):
              fail("new metallib header length does not match file length")

          markers = (
              b"clear_texture_1d_uint",
              b"fs_blit_quad",
              b"vs_present_quad",
              b"cs_clear_buffer_uint",
          )
          candidates = []
          for path in app.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  b = path.read_bytes()
              except Exception:
                  continue
              pos = 0
              while True:
                  p = b.find(b"MTLB", pos)
                  if p < 0:
                      break
                  if p + 24 <= len(b):
                      sz = struct.unpack_from("<Q", b, p+16)[0]
                      if 128 <= sz <= 16*1024*1024 and p + sz <= len(b):
                          chunk = b[p:p+sz]
                          score = sum(m in chunk for m in markers)
                          if score:
                              candidates.append((score, path, p, sz))
                  pos = p + 4

          candidates.sort(key=lambda x:(x[0], x[3]), reverse=True)
          if not candidates:
              fail("no embedded DXMT MTLB candidate found anywhere in Madeira.app")

          # Score 4/4 means the binary contains the same dxmt_command source
          # used for the release's D3D9/D3D11 frontends. Patch every such copy:
          # this covers default emulated D3D9, native D3D9 and both i386/ARM64EC
          # D3D11 paths without touching older/different shader libraries.
          targets = [x for x in candidates if x[0] == 4 and x[3] >= len(new)]
          if not targets:
              fail("no exact DXMT command-library copy large enough for the iOS metallib")

          new_sha = hashlib.sha256(new).hexdigest()
          report_lines = [
              "Madeira v0.1.0 targeted D3D9/D3D11 Metal patch",
              "release base sha256: 29054bb5d167382f004ba3ae04d3995e31070e67f4c0acf7eb4f180280f93335",
              "DXMT source commit: a5e0cd3d41bf248fd1c030a2e1c515ba3522f4ef",
              f"new metallib bytes: {len(new)}",
              f"new metallib sha256: {new_sha}",
              f"new platform bytes: {new[4:6].hex()}",
              f"new target OS byte: 0x{new[11]:02x}",
              "compiler target: iphoneos, Metal language 3.2, iOS deployment 18.0",
              "JIT/Wine/FEX code: unchanged",
              "first-log mitigation retained: madeira.cfg pool=512 is still expected on the device",
              "",
              "patched copies:",
          ]

          for score, target, blob_off, old_len in targets:
              data = bytearray(target.read_bytes())
              if data[blob_off:blob_off+4] != b"MTLB":
                  fail(f"{target}: selected target lost MTLB magic")
              if len(new) > old_len:
                  fail(f"{target}: new metallib {len(new)} > embedded array {old_len}")

              needle = struct.pack("<I", old_len)
              hits = []
              p = 0
              while True:
                  q = data.find(needle, p)
                  if q < 0:
                      break
                  if not (blob_off <= q < blob_off + old_len):
                      hits.append(q)
                  p = q + 1
              if not hits:
                  fail(f"{target}: no dxmt_command_len word ({old_len}) found")

              # The xxd length global belongs to the same object and is normally
              # very close to the blob. Prefer the nearest occurrence.
              hits.sort(key=lambda q: abs(q - (blob_off + old_len)))
              len_off = hits[0]
              if len(hits) > 1:
                  d0 = abs(hits[0] - (blob_off + old_len))
                  d1 = abs(hits[1] - (blob_off + old_len))
                  if d0 == d1:
                      fail(f"{target}: ambiguous dxmt_command_len locations {hits[:10]}")

              old_blob = bytes(data[blob_off:blob_off+old_len])
              old_sha = hashlib.sha256(old_blob).hexdigest()
              old_platform = old_blob[4:6].hex()
              old_os = old_blob[11] if len(old_blob) > 11 else -1

              data[blob_off:blob_off+len(new)] = new
              if len(new) < old_len:
                  data[blob_off+len(new):blob_off+old_len] = b"\0" * (old_len-len(new))
              struct.pack_into("<I", data, len_off, len(new))
              target.write_bytes(data)

              check = target.read_bytes()
              if check[blob_off:blob_off+4] != b"MTLB":
                  fail(f"{target}: post-write magic mismatch")
              if struct.unpack_from("<Q", check, blob_off+16)[0] != len(new):
                  fail(f"{target}: post-write MTLB header size mismatch")
              if struct.unpack_from("<I", check, len_off)[0] != len(new):
                  fail(f"{target}: post-write dxmt_command_len mismatch")
              if hashlib.sha256(check[blob_off:blob_off+len(new)]).hexdigest() != new_sha:
                  fail(f"{target}: post-write metallib hash mismatch")

              rel = target.relative_to(app)
              line = (
                  f"- {rel}: off=0x{blob_off:x} len_off=0x{len_off:x} "
                  f"old={old_len} old_sha256={old_sha} "
                  f"old_platform={old_platform} old_os=0x{old_os:02x}"
              )
              report_lines.append(line)
              print("PATCHED", line)

          report_lines += ["", "all embedded candidates (including intentionally unpatched):"]
          for x in candidates[:20]:
              report_lines.append(f"- score={x[0]}/4 {x[1].relative_to(app)} off=0x{x[2]:x} bytes={x[3]}")
          report = "\n".join(report_lines) + "\n"
          report_path.write_text(report)
          print(report)

          PY

      - name: Patch JIT RW alias for non-EVA devices
        shell: bash
        run: |
          set -euxo pipefail
          APP="work/unpack/Payload/Madeira.app"
          DYLIB="$APP/Madeira.debug.dylib"
          test -f "$DYLIB"
          python3 - "$DYLIB" work/patch-report.txt <<'PY'
          from pathlib import Path
          import struct, sys, hashlib

          path = Path(sys.argv[1])
          report = Path(sys.argv[2])
          data = bytearray(path.read_bytes())

          # Madeira v0.1.0, release commit 3ccbf9b...:
          # StikJITHelper.allocatePool() unconditionally seeds rwAddr with
          # 0x7000000000 (448 GiB) before vm_remap(VM_FLAGS_ANYWHERE).
          # On the user's non-EVA process that high address is outside the
          # usable VA map and vm_remap returns KERN_NO_SPACE (3), even when
          # the RX pool itself lands correctly in a low hole.
          #
          # Exact instruction at __TEXT+0x604530:
          #   d2c00e08  mov x8, #0x7000000000
          # Replace only that instruction with:
          #   d2800008  mov x8, #0
          # so VM_FLAGS_ANYWHERE starts from the normal low address space.
          # The executable window is already held and RX is already mapped,
          # so the kernel cannot overlap either.
          off = 0x604530
          old = bytes.fromhex("080ec0d2")
          new = bytes.fromhex("080080d2")

          if data[off:off+4] != old:
              raise SystemExit(
                  f"JIT PATCH ERROR: unexpected instruction at 0x{off:x}: "
                  f"{data[off:off+4].hex()} expected {old.hex()}"
              )

          before = hashlib.sha256(data).hexdigest()
          data[off:off+4] = new
          path.write_bytes(data)
          check = path.read_bytes()
          if check[off:off+4] != new:
              raise SystemExit("JIT PATCH ERROR: post-write instruction mismatch")
          after = hashlib.sha256(check).hexdigest()

          extra = f"""JIT RW-alias non-EVA patch:\ntarget: Madeira.debug.dylib\nfile/text offset: 0x{off:x}\nold instruction: {old.hex()} (mov x8,#0x7000000000)\nnew instruction: {new.hex()} (mov x8,#0)\nreason: both supplied device logs reached RX allocation then failed vm_remap with KERN_NO_SPACE=3; latest log has extended-virtual-addressing=false and RX=0x148000000 at pool=512\ndylib sha256 before: {before}\ndylib sha256 after: {after}\n"""
          report.write_text(report.read_text() + extra)
          print(extra)
          PY

      - name: Patch BUS writes to anonymous JIT aliases
        shell: bash
        run: |
          set -euxo pipefail
          APP="work/unpack/Payload/Madeira.app"
          DYLIB="$APP/Madeira.debug.dylib"
          test -f "$DYLIB"

          python3 - "$DYLIB" work/patch-report.txt <<'PY'
          from pathlib import Path
          import hashlib, sys

          path = Path(sys.argv[1])
          report = Path(sys.argv[2])
          data = bytearray(path.read_bytes())

          # madeira-log(8): BUS write at guest alias 0x4037002c0 loops 2000x.
          # The Mach exception path already resolves anonymous JIT aliases with
          # ios_jit_anon_alias_lookup(), but bus_handler's data-write path only
          # recognizes the primary RX pool. Extend that path to anon aliases.
          #
          # Madeira v0.1.0 exact offsets/symbols:
          #   bus_handler                0x828b3c
          #   ios_jit_anon_alias_lookup  0x7f9a60
          #   ios_emulate_store          0x82fd54
          #
          # Redirect the three out-of-primary-pool tests to a small trampoline
          # placed over the old fatal-path diagnostics at 0x82916c. The stub:
          #   lookup(fault)
          #   if no alias -> original AV path
          #   emulate_store(ctx, insn, rw_alias)
          #   if success -> existing PC+4/fixup/return path
          #   else -> original AV path
          guards = {
              0x828e6c: bytes.fromhex("170800b4"), # cbz x23, 0x828f6c
              0x828e74: bytes.fromhex("c3070054"), # b.lo 0x828f6c
              0x828e7c: bytes.fromhex("89070054"), # b.ls 0x828f6c
              0x828ebc: bytes.fromhex("80150034"), # cbz w0, 0x82916c (existing)
              0x82916c: bytes.fromhex("28fa00b0"), # old diagnostic code
          }
          for off, expected in guards.items():
              got = bytes(data[off:off+4])
              if got != expected:
                  raise SystemExit(
                      f"BUS-ALIAS PATCH ERROR at 0x{off:x}: "
                      f"expected {expected.hex()}, got {got.hex()}"
                  )

          before = hashlib.sha256(data).hexdigest()

          # Out-of-primary-pool -> alias trampoline.
          data[0x828e6c:0x828e70] = bytes.fromhex("171800b4") # cbz x23,0x82916c
          data[0x828e74:0x828e78] = bytes.fromhex("c3170054") # b.lo 0x82916c
          data[0x828e7c:0x828e80] = bytes.fromhex("89170054") # b.ls 0x82916c

          stub = {
              0x82916c: "e00319aa", # mov x0,x25 (fault)
              0x829170: "3c42ff97", # bl ios_jit_anon_alias_lookup
              0x829174: "c0efffb4", # cbz x0,0x828f6c
              0x829178: "e20300aa", # mov x2,x0 (rw_addr)
              0x82917c: "f8031aaa", # mov x24,x26 (preserve success-tail expectation)
              0x829180: "fa031baa", # mov x26,x27
              0x829184: "681a40f9", # ldr x8,[x19,#0x30]
              0x829188: "088940f9", # ldr x8,[x8,#0x110] (faulting PC)
              0x82918c: "160140b9", # ldr w22,[x8] (instruction)
              0x829190: "e00313aa", # mov x0,x19 (ucontext)
              0x829194: "e10316aa", # mov x1,x22 (insn)
              0x829198: "ef1a0094", # bl ios_emulate_store
              0x82919c: "80eeff34", # cbz w0,0x828f6c
              0x8291a0: "48ffff17", # b 0x828ec0 existing success tail
          }
          for off, hx in stub.items():
              data[off:off+4] = bytes.fromhex(hx)
          for off in range(0x8291a4, 0x8291e0, 4):
              data[off:off+4] = bytes.fromhex("1f2003d5") # nop

          path.write_bytes(data)
          check = path.read_bytes()

          # Strong post-write guards.
          verifies = {
              0x828e6c:"171800b4", 0x828e74:"c3170054", 0x828e7c:"89170054",
              0x82916c:"e00319aa", 0x829170:"3c42ff97", 0x829174:"c0efffb4",
              0x829178:"e20300aa", 0x82917c:"f8031aaa", 0x829180:"fa031baa",
              0x829184:"681a40f9", 0x829188:"088940f9", 0x82918c:"160140b9",
              0x829190:"e00313aa", 0x829194:"e10316aa", 0x829198:"ef1a0094",
              0x82919c:"80eeff34", 0x8291a0:"48ffff17",
          }
          for off,hx in verifies.items():
              if check[off:off+4] != bytes.fromhex(hx):
                  raise SystemExit(f"BUS-ALIAS post-write verification failed at 0x{off:x}")

          after = hashlib.sha256(check).hexdigest()
          extra = (
              "\nBUS anonymous-JIT-alias write patch:\n"
              "symptom: 2000 identical redeliveries at pc=0x1662e63b0 "
              "fault=0x4037002c0, then process termination\n"
              "root cause: bus_handler handled primary JIT RX only; anon alias "
              "lookup existed only in the Mach exception path\n"
              "change: route out-of-pool BUS writes through "
              "ios_jit_anon_alias_lookup + ios_emulate_store\n"
              f"dylib sha256 before BUS patch: {before}\n"
              f"dylib sha256 after BUS patch: {after}\n"
          )
          report.write_text(report.read_text() + extra)
          print(extra)
          PY

          # Verify the exact control flow using the runner's objdump if present.
          if command -v llvm-objdump >/dev/null 2>&1; then
            llvm-objdump -d --start-address=0x828e50 --stop-address=0x8291e0 "$DYLIB"               | tee work/bus-alias-disasm.txt
            grep -q 'bl.*0x7f9a60' work/bus-alias-disasm.txt
            grep -q 'bl.*0x82fd54' work/bus-alias-disasm.txt
          else
            echo "llvm-objdump unavailable; byte-level verification already passed"               | tee work/bus-alias-disasm.txt
          fi

      - name: Re-sign bundle ad-hoc and package IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="work/unpack/Payload/Madeira.app"

          # Match the signing path of the earlier no-EVA tracker build that
          # successfully reported CS_DEBUGGED=SET under StikDebug.
          /usr/bin/codesign --force --sign - --timestamp=none "$APP/Madeira.debug.dylib"
          /usr/bin/codesign --force --sign - --timestamp=none             --entitlements work/original-entitlements.plist "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

          echo "=== final app entitlements ==="
          /usr/bin/codesign -d --entitlements :- "$APP" 2>/dev/null | tee work/final-entitlements.plist
          if grep -q 'com.apple.security.cs.allow-jit' work/final-entitlements.plist; then
            echo "ERROR: allow-jit leaked back into final IPA"
            exit 1
          fi

          rm -f work/Madeira-0.1.0-MSL32-RWalias-BUSalias.ipa
          (
            cd work/unpack
            ditto -c -k --sequesterRsrc --keepParent Payload ../Madeira-0.1.0-MSL32-RWalias-BUSalias.ipa
          )
          shasum -a 256 work/Madeira-0.1.0-MSL32-RWalias-BUSalias.ipa | tee -a work/patch-report.txt
          ls -lh work/Madeira-0.1.0-MSL32-RWalias-BUSalias.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-0.1.0-MSL32-RWalias-BUSalias
          path: |
            work/Madeira-0.1.0-MSL32-RWalias-BUSalias.ipa
            work/patch-report.txt
            work/dxmt_command.metallib
            work/bus-alias-disasm.txt
          compression-level: 0
          if-no-files-found: error
