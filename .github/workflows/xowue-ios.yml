name: XOWUE iOS IPA

on:
  push:
    branches:
      - XOWUE
    paths:
      - ".github/workflows/xowue-ios.yml"
      - "Runtime/**"
      - "iOS/**"
      - "generated/**"
      - "dist/**"
      - "patches/**"
      - "tools/**"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: xowue-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-unsigned-ipa:
    name: Build XOWUE iOS runner
    runs-on: macos-26
    timeout-minutes: 360
    env:
      MESA_KOSMICKRISP_SHA: "bfe063f723d436e5cdef8a98f058d4e44a64810c"
      MESA_PRIMARY_URL: "https://gitlab.freedesktop.org/mesa/mesa.git"
      MESA_MIRROR_URL: "https://github.com/Kenji-NX/mesa.git"
      MESON_VERSION: "1.9.1"
      LLVM_FORMULA: "llvm@20"
      SPIRV_LLVM_TRANSLATOR_SHA: "e328468fd329342f1f60c12fdd19cc0faaa88f32"
      SPIRV_LLVM_TRANSLATOR_URL: "https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git"
      IOS_DEPLOYMENT_TARGET: "17.4"
    steps:
      - name: Checkout XOWUE branch
        uses: actions/checkout@v4

      - name: Assign app build number
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "XOWUE",
              status: "completed",
              per_page: 100
            });
            // Build 1 is successful run #8. Count only successful XOWUE IPA runs
            // from that baseline so failed CI attempts never consume a build number.
            const completedIPAs = runs.filter(run =>
              run.path === ".github/workflows/xowue-ios.yml" &&
              run.conclusion === "success" &&
              run.run_number >= 8 &&
              run.id !== context.runId
            ).length;
            const buildNumber = completedIPAs + 1;
            core.exportVariable("XOWUE_BUILD_NUMBER", String(buildNumber));
            core.setOutput("build_number", String(buildNumber));
            core.info("XOWUE Build " + buildNumber);

      - name: Select Xcode and validate AOT archive
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cat dist/XOWUE-AOT-source.part* > dist/XOWUE-AOT-source.tar.gz
          shasum -a 256 -c dist/SHA256SUMS
          tar -xzf dist/XOWUE-AOT-source.tar.gz -C generated
          test "$(find generated/ppc -maxdepth 1 -name 'ppc_recomp.*.cpp' | wc -l | tr -d ' ')" = "344"

      - name: Test PPC dispatch guard and AOT entry instrumentation
        run: |
          set -euo pipefail
          clang++ -std=c++23 -Wall -Wextra -Werror -pedantic Runtime/DispatchGuardSmoke.cpp -o "$RUNNER_TEMP/xowue-dispatch-guard-smoke"
          "$RUNNER_TEMP/xowue-dispatch-guard-smoke"
          python3 tools/test_xowue_aot_instrumentation.py

      - name: Fetch pinned XenonRecomp runtime utilities
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git "$RUNNER_TEMP/XenonRecomp"
          git -C "$RUNNER_TEMP/XenonRecomp" checkout ddd128bcca99fe8bfbb99bea583c972351fa6ace
          git -C "$RUNNER_TEMP/XenonRecomp" submodule update --init --recursive
          git -C "$RUNNER_TEMP/XenonRecomp" apply --check "$GITHUB_WORKSPACE/patches/XenonRecomp-XOWUE.patch"
          git -C "$RUNNER_TEMP/XenonRecomp" apply "$GITHUB_WORKSPACE/patches/XenonRecomp-XOWUE.patch"
          PPC_CONTEXT="$RUNNER_TEMP/XenonRecomp/XenonUtils/ppc_context.h"
          grep -Fq '#define PPC_WEAK_FUNC(x) __attribute__((noinline)) PPC_FUNC(x)' "$PPC_CONTEXT"
          grep -Fq '#define PPC_CALL_INDIRECT_FUNC(x) xowue_dispatch_indirect(ctx, base, uint32_t(x))' "$PPC_CONTEXT"
          grep -Fq '#define PPC_LOOKUP_FUNC(x, y) xowue_lookup_indirect(ctx, x, uint32_t(y))' "$PPC_CONTEXT"
          grep -Fq 'PPCFunc* xowue_lookup_indirect(struct PPCContext& ctx, uint8_t* base, uint32_t target);' "$PPC_CONTEXT"
          grep -Fq 'void xowue_dispatch_indirect(struct PPCContext& ctx, uint8_t* base, uint32_t target);' "$PPC_CONTEXT"
          if grep -Fq '#define PPC_WEAK_FUNC(x) __attribute__((weak,noinline)) PPC_FUNC(x)' "$PPC_CONTEXT"; then
            echo "XOWUE AOT aliases must not use weak linkage" >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tools/patch_xowue_aot_symbols.py" --ppc-dir "$GITHUB_WORKSPACE/generated/ppc"

          # The archived AOT source tree is compiled from generated/ppc, whose
          # quoted includes take precedence over XenonUtils. Put the patched
          # context header beside those sources so the build cannot silently
          # pick an older archived copy.
          AOT_PPC_CONTEXT="$GITHUB_WORKSPACE/generated/ppc/ppc_context.h"
          cp "$PPC_CONTEXT" "$AOT_PPC_CONTEXT"
          cmp -s "$PPC_CONTEXT" "$AOT_PPC_CONTEXT"
          grep -Fq '#define PPC_CALL_INDIRECT_FUNC(x) xowue_dispatch_indirect(ctx, base, uint32_t(x))' "$AOT_PPC_CONTEXT"
          grep -Fq '#define PPC_LOOKUP_FUNC(x, y) xowue_lookup_indirect(ctx, x, uint32_t(y))' "$AOT_PPC_CONTEXT"

          INDIRECT_CALL_SOURCES=$(grep -lE 'PPC_CALL_INDIRECT_FUNC\\(|PPC_LOOKUP_FUNC\\(' "$GITHUB_WORKSPACE"/generated/ppc/ppc_recomp.*.cpp || true)
          if [[ -z "$INDIRECT_CALL_SOURCES" ]]; then
            echo "Archived AOT sources contain no guarded indirect-dispatch macro callsites" >&2
            exit 1
          fi
          echo "Patched PPC context copied beside AOT sources; indirect-call units: $(printf '%s\\n' "$INDIRECT_CALL_SOURCES" | wc -l | tr -d ' ')"

          echo "XENONRECOMP_ROOT=$RUNNER_TEMP/XenonRecomp" >> "$GITHUB_ENV"

      - name: Install KosmicKrisp iOS cross-build prerequisites
        run: |
          set -euxo pipefail
          brew update
          for pkg in cmake pkg-config libclc "$LLVM_FORMULA" spirv-tools ninja; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

          python3 -m venv "$GITHUB_WORKSPACE/venv"
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "meson==${MESON_VERSION}" mako packaging pyyaml

          LLVM_PREFIX="$(brew --prefix "$LLVM_FORMULA")"
          TRANSLATOR_PREFIX="$GITHUB_WORKSPACE/deps/spirv-llvm-translator-20"
          rm -rf "$GITHUB_WORKSPACE/spirv-llvm-translator-src" "$GITHUB_WORKSPACE/spirv-llvm-translator-build" "$TRANSLATOR_PREFIX"

          git clone --filter=blob:none --no-checkout "$SPIRV_LLVM_TRANSLATOR_URL" "$GITHUB_WORKSPACE/spirv-llvm-translator-src"
          git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" fetch --depth=1 origin "$SPIRV_LLVM_TRANSLATOR_SHA"
          git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" checkout --detach "$SPIRV_LLVM_TRANSLATOR_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" rev-parse HEAD)" = "$SPIRV_LLVM_TRANSLATOR_SHA"

          cmake -S "$GITHUB_WORKSPACE/spirv-llvm-translator-src" -B "$GITHUB_WORKSPACE/spirv-llvm-translator-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TRANSLATOR_PREFIX" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF
          cmake --build "$GITHUB_WORKSPACE/spirv-llvm-translator-build" --target LLVMSPIRVLib llvm-spirv -j3
          cmake --install "$GITHUB_WORKSPACE/spirv-llvm-translator-build"

          test -f "$TRANSLATOR_PREFIX/lib/libLLVMSPIRVLib.a"
          test "$(PKG_CONFIG_PATH="$TRANSLATOR_PREFIX/lib/pkgconfig" pkg-config --modversion LLVMSPIRVLib)" = "20.1.0.0"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$TRANSLATOR_PREFIX/bin" >> "$GITHUB_PATH"
          echo "HOST_LDFLAGS=-L$TRANSLATOR_PREFIX/lib -L$LLVM_PREFIX/lib" >> "$GITHUB_ENV"
          echo "HOST_CPPFLAGS=-I$TRANSLATOR_PREFIX/include -I$LLVM_PREFIX/include" >> "$GITHUB_ENV"
          echo "HOST_PKG_CONFIG_PATH=$TRANSLATOR_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig:$(brew --prefix libclc)/lib/pkgconfig:$(brew --prefix spirv-tools)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Fetch pinned Mesa and apply PsTJohn iOS Metal WSI patches
        run: |
          set -euxo pipefail
          rm -rf mesa-src
          if git clone --filter=blob:none --no-checkout "$MESA_PRIMARY_URL" mesa-src; then
            echo "official GitLab" | tee mesa-source.txt
          else
            rm -rf mesa-src
            git clone --filter=blob:none --no-checkout "$MESA_MIRROR_URL" mesa-src
            echo "synchronized GitHub mirror fallback" | tee mesa-source.txt
          fi
          git -C mesa-src fetch --depth=1 origin "$MESA_KOSMICKRISP_SHA"
          git -C mesa-src checkout --detach "$MESA_KOSMICKRISP_SHA"
          test "$(git -C mesa-src rev-parse HEAD)" = "$MESA_KOSMICKRISP_SHA"

          for patch in \
            "$GITHUB_WORKSPACE/Runtime/Graphics/KosmicKrisp/patches/0001-kosmickrisp-ios-m2.patch" \
            "$GITHUB_WORKSPACE/Runtime/Graphics/KosmicKrisp/patches/0002-kosmickrisp-ios-m3-metal-wsi.patch"; do
            git -C mesa-src apply --check "$patch"
            git -C mesa-src apply "$patch"
          done
          grep -q "'ios'" mesa-src/meson.options
          grep -q "with_platform_ios" mesa-src/meson.build
          grep -q "TARGET_OS_IOS" mesa-src/src/kosmickrisp/bridge/mtl_device.m
          grep -q "with_platform_macos or with_platform_ios" mesa-src/src/vulkan/meson.build
          grep -q "with_platform_macos or with_platform_ios" mesa-src/src/vulkan/wsi/meson.build
          git -C mesa-src diff --check

      - name: Build KosmicKrisp host shader tools
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          export LDFLAGS="$HOST_LDFLAGS"
          export CPPFLAGS="$HOST_CPPFLAGS"
          export PKG_CONFIG_PATH="$HOST_PKG_CONFIG_PATH"
          rm -rf build-kk/host host-tools
          meson setup build-kk/host mesa-src \
            --buildtype=release \
            -Dplatforms=macos \
            -Dvulkan-drivers=kosmickrisp \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dzstd=disabled \
            -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled \
            --prefer-static
          meson compile -C build-kk/host mesa_clc vtn_bindgen2 kk_clc
          mkdir -p host-tools/bin
          cp build-kk/host/src/compiler/clc/mesa_clc host-tools/bin/
          cp build-kk/host/src/compiler/spirv/vtn_bindgen2 host-tools/bin/
          cp build-kk/host/src/kosmickrisp/clc/kk_clc host-tools/bin/
          chmod +x host-tools/bin/*
          file host-tools/bin/*

      - name: Configure KosmicKrisp arm64 iOS toolchain
        run: |
          set -euxo pipefail
          mkdir -p toolchain
          cat > toolchain/ios-clang <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          exec xcrun --sdk iphoneos clang -target "arm64-apple-ios${IOS_DEPLOYMENT_TARGET}" -isysroot "$SDKROOT" "$@"
          EOF
          cat > toolchain/ios-clangxx <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          exec xcrun --sdk iphoneos clang++ -target "arm64-apple-ios${IOS_DEPLOYMENT_TARGET}" -isysroot "$SDKROOT" "$@"
          EOF
          cat > toolchain/ios-ar <<'EOF'
          #!/bin/bash
          set -euo pipefail
          exec xcrun --sdk iphoneos ar "$@"
          EOF
          cat > toolchain/ios-strip <<'EOF'
          #!/bin/bash
          set -euo pipefail
          exec xcrun --sdk iphoneos strip "$@"
          EOF
          chmod +x toolchain/*
          cat > ios-arm64.cross <<EOF
          [binaries]
          c = '$GITHUB_WORKSPACE/toolchain/ios-clang'
          cpp = '$GITHUB_WORKSPACE/toolchain/ios-clangxx'
          objc = '$GITHUB_WORKSPACE/toolchain/ios-clang'
          ar = '$GITHUB_WORKSPACE/toolchain/ios-ar'
          strip = '$GITHUB_WORKSPACE/toolchain/ios-strip'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF
          "$GITHUB_WORKSPACE/toolchain/ios-clang" -dM -E -x c /dev/null | grep -E '__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__|__arm64__'

      - name: Configure and compile KosmicKrisp iOS Metal WSI
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          unset LDFLAGS CPPFLAGS PKG_CONFIG_PATH
          export PATH="$GITHUB_WORKSPACE/host-tools/bin:$PATH"
          rm -rf build-kk/ios
          meson setup build-kk/ios mesa-src \
            --cross-file "$GITHUB_WORKSPACE/ios-arm64.cross" \
            --buildtype=release \
            --wrap-mode=nodownload \
            -Dplatforms=ios \
            -Dvulkan-drivers=kosmickrisp \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Dspirv-tools=disabled \
            --prefer-static
          # Build Mesa's aggregate ICD target so Meson carries its complete
          # Vulkan runtime, NIR, utility, WSI, and weak-dispatch dependencies.
          ninja -C build-kk/ios src/kosmickrisp/vulkan/libvulkan_kosmickrisp.dylib
          mkdir -p build-ios/kosmickrisp
          DRIVER_SOURCE="$(find build-kk/ios -type f -name 'libvulkan_kosmickrisp*.dylib' -print -quit)"
          test -n "$DRIVER_SOURCE"
          cp "$DRIVER_SOURCE" build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib
          install_name_tool -id "@rpath/libvulkan_kosmickrisp.dylib" build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib
          lipo build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib -verify_arch arm64
          nm -g build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib > build-ios/kosmickrisp/driver-symbols.txt
          nm -u build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib > build-ios/kosmickrisp/driver-undefined.txt
          grep -q "vk_icdGetInstanceProcAddr" build-ios/kosmickrisp/driver-symbols.txt
          if grep -E "[[:space:]](__mesa_|_mesa_|_nir_|_vk_|_kk_|_wsi_)" build-ios/kosmickrisp/driver-undefined.txt; then
            echo "KosmicKrisp ICD contains unresolved Mesa/Vulkan internal symbols" >&2
            exit 1
          fi
          echo "KosmicKrisp arm64 iOS ICD dylib built from $MESA_KOSMICKRISP_SHA" | tee build-ios/kosmickrisp/BUILD.txt

      - name: Build arm64 AOT engine
        run: |
          set -euo pipefail
          cmake -S Runtime -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DXENONRECOMP_ROOT="$XENONRECOMP_ROOT"
          cmake --build build-ios --config Release --target XOWUEEngine --parallel 3
          ENGINE_LIB=$(find build-ios -name libXOWUEEngine.a -print -quit)
          UTILS_LIB=$(find build-ios -name libXenonUtils.a -print -quit)
          DISASM_LIB=$(find build-ios -name libdisasm.a -print -quit)
          test -n "$ENGINE_LIB" && test -n "$UTILS_LIB" && test -n "$DISASM_LIB"

          # A successful compile is insufficient if the patched AOT dispatch
          # helper is not referenced by any generated guest function.
          nm -u "$ENGINE_LIB" > build-ios/aot-undefined-symbols.txt
          if ! grep -Eq 'xowue_(dispatch|lookup)_indirect' build-ios/aot-undefined-symbols.txt; then
            echo "Generated AOT objects do not reference the validated XOWUE PPC dispatch helper" >&2
            cat build-ios/aot-undefined-symbols.txt | grep -E 'PPC|xowue' | head -80 || true
            exit 1
          fi
          grep -E 'xowue_(dispatch|lookup)_indirect' build-ios/aot-undefined-symbols.txt | head -20
          libtool -static -o build-ios/libXOWUEEngineComplete.a "$ENGINE_LIB" "$UTILS_LIB" "$DISASM_LIB"
          lipo build-ios/libXOWUEEngineComplete.a -verify_arch arm64

      - name: Generate Xcode project and build app
        run: |
          set -euo pipefail
          brew install xcodegen
          cd iOS
          xcodegen generate --spec project.yml
          cd "$GITHUB_WORKSPACE"
          xcodebuild build \
            -project iOS/XOWUE.xcodeproj \
            -scheme XOWUE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-app \
            CURRENT_PROJECT_VERSION="$XOWUE_BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload artifacts
          APP_SOURCE="build-app/Build/Products/Release-iphoneos/XOWUE.app"
          cp -R "$APP_SOURCE" Payload/XOWUE.app
          mkdir -p Payload/XOWUE.app/Frameworks
          cp build-ios/kosmickrisp/libvulkan_kosmickrisp.dylib Payload/XOWUE.app/Frameworks/
          mkdir -p Payload/XOWUE.app/ThirdPartyLicenses/Mesa/licenses
          cp THIRD_PARTY_NOTICES.md Payload/XOWUE.app/THIRD_PARTY_NOTICES.md
          cp "$XENONRECOMP_ROOT/LICENSE.md" Payload/XOWUE.app/ThirdPartyLicenses/XenonRecomp-LICENSE.md
          cp mesa-src/docs/license.rst Payload/XOWUE.app/ThirdPartyLicenses/Mesa/license.rst
          cp -R mesa-src/licenses/. Payload/XOWUE.app/ThirdPartyLicenses/Mesa/licenses/
          mkdir -p "$RUNNER_TEMP/xowue-ipa-check/Payload"
          APP="$RUNNER_TEMP/xowue-ipa-check/Payload/XOWUE.app"
          cp -R Payload/XOWUE.app "$APP"
          plutil -lint "$APP/Info.plist"
          test -f "$APP/Assets.car"
          test -f "$APP/Frameworks/libvulkan_kosmickrisp.dylib"
          test -f "$APP/THIRD_PARTY_NOTICES.md"
          test -f "$APP/ThirdPartyLicenses/XenonRecomp-LICENSE.md"
          test -f "$APP/ThirdPartyLicenses/Mesa/licenses/MIT"
          lipo "$APP/XOWUE" -verify_arch arm64
          python3 "$GITHUB_WORKSPACE/tools/verify_xowue_aot_symbols.py" "$APP/XOWUE"
          lipo "$APP/Frameworks/libvulkan_kosmickrisp.dylib" -verify_arch arm64
          otool -L "$APP/XOWUE" | grep -F "@rpath/libvulkan_kosmickrisp.dylib"
          python3 - "$APP/Info.plist" "$XOWUE_BUILD_NUMBER" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          assert str(info.get("CFBundleVersion")) == sys.argv[2], info.get("CFBundleVersion")
          assert info.get("UIFileSharingEnabled") is True
          assert info.get("LSSupportsOpeningDocumentsInPlace") is True
          assert info.get("UIApplicationSupportsDocumentBrowser") is True
          types = info.get("CFBundleDocumentTypes", [])
          assert any("com.xowue.xex" in entry.get("LSItemContentTypes", []) for entry in types)
          exported = info.get("UTExportedTypeDeclarations", [])
          assert any(entry.get("UTTypeIdentifier") == "com.xowue.xex" for entry in exported)
          print(f"Info.plist OK · Build {sys.argv[2]} · Files sharing · XEX document type")
          PY
          IPA_NAME="XOWUE-Build-${XOWUE_BUILD_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "artifacts/$IPA_NAME"
          unzip -t "artifacts/$IPA_NAME"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-Build-${{ steps.version.outputs.build_number }}
          path: artifacts/XOWUE-Build-*.ipa
          if-no-files-found: error
          retention-days: 30
