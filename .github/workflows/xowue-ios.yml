name: XOWUE iOS IPA

on:
  push:
    branches:
      - XOWUE
    paths:
      - ".github/workflows/xowue-ios.yml"
      - "XOWUE/Runtime/**"
      - "XOWUE/iOS/**"
      - "XOWUE/generated/**"
      - "XOWUE/dist/**"
      - "XOWUE/patches/**"
      - "XOWUE/tools/**"
  workflow_dispatch:

concurrency:
  group: xowue-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build XOWUE iOS runner
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout XOWUE branch
        uses: actions/checkout@v4

      - name: Assign app build number
        id: version
        run: |
          set -euo pipefail
          # Runs 1-6 cover bootstrap, handoff, and XcodeGen correction. First IPA is Build 1.
          build_number=$((GITHUB_RUN_NUMBER - 6))
          if [ "$build_number" -lt 1 ]; then build_number=1; fi
          echo "XOWUE_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "XOWUE Build $build_number"

      - name: Select Xcode and validate AOT archive
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cat XOWUE/dist/XOWUE-AOT-source.part* > XOWUE/dist/XOWUE-AOT-source.tar.gz
          shasum -a 256 -c XOWUE/dist/SHA256SUMS
          tar -xzf XOWUE/dist/XOWUE-AOT-source.tar.gz -C XOWUE/generated
          test "$(find XOWUE/generated/ppc -maxdepth 1 -name 'ppc_recomp.*.cpp' | wc -l | tr -d ' ')" = "344"

      - name: Fetch pinned XenonRecomp runtime utilities
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git "$RUNNER_TEMP/XenonRecomp"
          git -C "$RUNNER_TEMP/XenonRecomp" checkout ddd128bcca99fe8bfbb99bea583c972351fa6ace
          git -C "$RUNNER_TEMP/XenonRecomp" submodule update --init --recursive
          git -C "$RUNNER_TEMP/XenonRecomp" apply "$GITHUB_WORKSPACE/XOWUE/patches/XenonRecomp-XOWUE.patch"
          echo "XENONRECOMP_ROOT=$RUNNER_TEMP/XenonRecomp" >> "$GITHUB_ENV"

      - name: Build arm64 AOT engine
        run: |
          set -euo pipefail
          cmake -S XOWUE/Runtime -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DXENONRECOMP_ROOT="$XENONRECOMP_ROOT"
          cmake --build build-ios --config Release --target XOWUEEngine --parallel 3
          ENGINE_LIB=$(find build-ios -name libXOWUEEngine.a -print -quit)
          UTILS_LIB=$(find build-ios -name libXenonUtils.a -print -quit)
          DISASM_LIB=$(find build-ios -name libdisasm.a -print -quit)
          test -n "$ENGINE_LIB" && test -n "$UTILS_LIB" && test -n "$DISASM_LIB"
          libtool -static -o build-ios/libXOWUEEngineComplete.a "$ENGINE_LIB" "$UTILS_LIB" "$DISASM_LIB"
          lipo build-ios/libXOWUEEngineComplete.a -verify_arch arm64

      - name: Generate Xcode project and build app
        run: |
          set -euo pipefail
          brew install xcodegen
          cd XOWUE/iOS
          xcodegen generate --spec project.yml
          cd "$GITHUB_WORKSPACE"
          xcodebuild build \
            -project XOWUE/iOS/XOWUE.xcodeproj \
            -scheme XOWUE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-app \
            CURRENT_PROJECT_VERSION="$XOWUE_BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload artifacts
          APP_SOURCE="build-app/Build/Products/Release-iphoneos/XOWUE.app"
          cp -R "$APP_SOURCE" Payload/XOWUE.app
          mkdir -p "$RUNNER_TEMP/xowue-ipa-check"
          APP="$RUNNER_TEMP/xowue-ipa-check/Payload/XOWUE.app"
          cp -R Payload/XOWUE.app "$APP"
          plutil -lint "$APP/Info.plist"
          test -f "$APP/Assets.car"
          lipo "$APP/XOWUE" -verify_arch arm64
          python3 - "$APP/Info.plist" "$XOWUE_BUILD_NUMBER" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          assert str(info.get("CFBundleVersion")) == sys.argv[2], info.get("CFBundleVersion")
          assert info.get("UIFileSharingEnabled") is True
          assert info.get("LSSupportsOpeningDocumentsInPlace") is True
          assert info.get("UIApplicationSupportsDocumentBrowser") is True
          types = info.get("CFBundleDocumentTypes", [])
          assert any("com.xowue.xex" in entry.get("LSItemContentTypes", []) for entry in types)
          exported = info.get("UTExportedTypeDeclarations", [])
          assert any(entry.get("UTTypeIdentifier") == "com.xowue.xex" for entry in exported)
          print(f"Info.plist OK · Build {sys.argv[2]} · Files sharing · XEX document type")
          PY
          IPA_NAME="XOWUE-Build-${XOWUE_BUILD_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "artifacts/$IPA_NAME"
          unzip -t "artifacts/$IPA_NAME"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: XOWUE-Build-${{ steps.version.outputs.build_number }}
          path: artifacts/XOWUE-Build-*.ipa
          if-no-files-found: error
          retention-days: 30