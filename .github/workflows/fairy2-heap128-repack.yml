name: Fairy2iOS - Verified 128 MiB guest heap repack (no compilation)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/heap128_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-heap128-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repack:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout Fairy2iOS only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify patch identity and regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/Fairy2iOS"
          python3 -m py_compile fairy2/scripts/repack_heap_128.py
          python3 -m unittest discover -s fairy2/tests -p 'test_heap_128.py' -v
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("fairy2/heap128_trigger.json").read_text())
          assert d["source_run_id"] == 44980090949
          assert d["heap_old_mib"] == 20 and d["heap_new_mib"] == 128
          assert d["native_compile"] is False and d["shaders_compile"] is False
          print("Guard passed: one ARM64 MOVZ and the original compiled shaders")
          PY
      - name: Download the latest verified 3 GiB region-cut IPA only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fairy2-heap-source"
          gh run download 44980090949 -R joao9vegeto-stack/KintTany \
            -n Fairy2iOS-3GiB-region-cut-1 -D "$RUNNER_TEMP/fairy2-heap-source"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path(os.environ["RUNNER_TEMP"])/"fairy2-heap-source"
          f=p/"Fairy2iOS-FairyTail2-3GiB-region-cut.ipa"
          assert f.is_file()
          h=hashlib.sha256()
          with f.open("rb") as inp:
              for chunk in iter(lambda: inp.read(8*1024*1024),b""):h.update(chunk)
          assert h.hexdigest()=="42f2895219c938f40d3b26967abfa1ef4d685e6e694c87dbb95ae5f023e2bb74"
          d=json.loads((p/"region-cut-report.json").read_text())
          assert d["allocator_patched_bytes"] == 0xc0000000
          assert d["guest_main_instruction_patches"] == 5
          assert d["game_shaders_recompiled"] is False
          print("Source 3GiB region cut and shader provenance verified")
          PY
      - name: Increase guest heap request to 128 MiB; preserve all Metal and original framework host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fairy2-heap-result"
          python3 fairy2/scripts/repack_heap_128.py \
            --source "$RUNNER_TEMP/fairy2-heap-source/Fairy2iOS-FairyTail2-3GiB-region-cut.ipa" \
            --output "$RUNNER_TEMP/fairy2-heap-result/Fairy2iOS-FairyTail2-128MiB-heap-repack.ipa" \
            --report "$RUNNER_TEMP/fairy2-heap-result/heap128-report.json"
      - name: Validate final signed IPA and precise report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys,json,os
          root=Path(os.environ["RUNNER_TEMP"])/"fairy2-heap-result"
          report=json.loads((root/"heap128-report.json").read_text())
          sys.path.insert(0,str(Path("fairy2/colab").resolve()))
          from ipa_validator import validate_ipa
          ipa=root/report["output_ipa"]
          base={"framework":"DmGame0100B9801F872000.framework",
                "shader_payload":{"ipa_path":"Frameworks/DmGame0100B9801F872000.framework/msl/b-0724088d3779.img",
                                  "size_bytes":2640519506}}
          valid=validate_ipa(ipa,base,verify_crc=True)
          assert valid["fps"] == [30,60] and valid["swap_ab"]
          assert report["heap_after_bytes"] == 134217728
          assert report["heap_instruction_audit"]["byte_changes"] == 2
          assert report["five_region_cut_movs_preserved"]
          assert report["game_shader_sha256"] == "ab35b0ef89c907a38c8462da78ba6864153c86f8c203d613b321d45ce0aa262b"
          assert not report["native_host_recompiled"] and not report["game_shaders_recompiled"]
          assert report["romfs_aoc_external_unchanged"]
          assert report["runtime_32mib_allocator_fix_verified"] is False
          print("Heap128 IPA checks passed; device initialization remains to be tested.")
          PY
      - name: Publish original-shader IPA and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-128MiB-heap-repack-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/fairy2-heap-result/Fairy2iOS-FairyTail2-128MiB-heap-repack.ipa
            ${{ runner.temp }}/fairy2-heap-result/heap128-report.json
          if-no-files-found: error
          retention-days: 14
