name: Link2iOS BOTW Host Optimization

on:
  push:
    branches:
      - Link2iOS
    paths:
      - scripts/optimize_existing_ipa.py
      - scripts/patches/botw-metal4-encode-thread.patch
      - scripts/patches/botw-compute-dispatch-order.patch
      - scripts/patches/t_dispatch_barrier.m
      - .github/workflows/link2ios-optimize.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: link2ios-optimize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize-host-only:
    if: github.ref == 'refs/heads/Link2iOS' && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout Link2iOS optimizer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate optimizer and sync exact NX2Apple pin
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/Link2iOS"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python -m py_compile scripts/optimize_existing_ipa.py
          brew list --formula xcodegen >/dev/null 2>&1 || brew install xcodegen
          git clone --depth 1 --branch v1.3.1-rc2 https://github.com/LNPANDY/NX2Apple.git "$RUNNER_TEMP/NX2Apple"
          cd "$RUNNER_TEMP/NX2Apple"
          python3 tools/engine.py sync
          test "$(cat .upstream-ref)" = "81906931262fb25d774cce8bca2db8926439e5a2"
          git -C engine apply --check "$GITHUB_WORKSPACE/scripts/patches/botw-metal4-encode-thread.patch"
          git -C engine fetch --no-tags https://github.com/seedds/nxnative.git 301cf6c9f9f41fa2b13ca6f348cdf86bdbe98138
          git -C engine apply --3way --check "$GITHUB_WORKSPACE/scripts/patches/botw-compute-dispatch-order.patch"
          echo "BOTW_HOST_PATCHES_APPLY_TO_PINNED_ENGINE=1"

      - name: Select and download the previous optimized IPA (skip run #6)
        id: select-source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = "Link2iOS"
          current_run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          workflow_id = 413938550
          ignored_run_numbers = {6}
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Link2iOS-Artifact-Chain",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          runs = get_json(f"{api}/actions/runs?branch={branch}&per_page=100")
          candidates = []
          for run in runs.get("workflow_runs", []):
              number = int(run.get("run_number", 0))
              if (run.get("workflow_id") != workflow_id
                      or run.get("path") != ".github/workflows/link2ios-optimize.yml"
                      or run.get("head_branch") != branch
                      or run.get("event") != "push"
                      or run.get("status") != "completed"
                      or run.get("conclusion") != "success"
                      or number >= current_run_number
                      or number in ignored_run_numbers):
                  continue
              artifacts = get_json(f"{api}/actions/runs/{run['id']}/artifacts")
              expected_name = f"Link2iOS-BOTW-Optimized-{number}"
              matches = [
                  item for item in artifacts.get("artifacts", [])
                  if item.get("name") == expected_name and not item.get("expired", False)
              ]
              if len(matches) == 1:
                  candidates.append((number, run, matches[0]))
              elif len(matches) > 1:
                  raise SystemExit(f"Ambiguous output artifacts for run #{number}")

          if not candidates:
              raise SystemExit("No previous successful optimized IPA artifact found; refusing to use the original/base IPA")
          number, source_run, artifact = max(candidates, key=lambda item: item[0])
          if number == 6:
              raise SystemExit("Run #6 is explicitly excluded from the source chain")
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"source_artifact_id={artifact['id']}\n")
              stream.write(f"source_artifact_name={artifact['name']}\n")
              stream.write(f"source_run_id={source_run['id']}\n")
              stream.write(f"source_run_number={number}\n")
          print(f"SOURCE_RUN_NUMBER={number}")
          print(f"SOURCE_RUN_ID={source_run['id']}")
          print(f"SOURCE_ARTIFACT_ID={artifact['id']}")
          print(f"SOURCE_ARTIFACT_NAME={artifact['name']}")
          PY

      - name: Download the selected optimized IPA archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ steps.select-source.outputs.source_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/Link2iOS-BOTW-previous-optimized.zip"
          test -s "$RUNNER_TEMP/Link2iOS-BOTW-previous-optimized.zip"
          echo "PREVIOUS_OPTIMIZED_IPA_ARTIFACT_BYTES=$(stat -f%z "$RUNNER_TEMP/Link2iOS-BOTW-previous-optimized.zip")"

      - name: Rebuild only DmShellGame host framework
        shell: bash
        run: |
          set -euo pipefail
          python scripts/optimize_existing_ipa.py \
            --artifact-zip "$RUNNER_TEMP/Link2iOS-BOTW-previous-optimized.zip" \
            --source-artifact-id "${{ steps.select-source.outputs.source_artifact_id }}" \
            --source-artifact-name "${{ steps.select-source.outputs.source_artifact_name }}" \
            --source-run-id "${{ steps.select-source.outputs.source_run_id }}" \
            --source-run-number "${{ steps.select-source.outputs.source_run_number }}" \
            --nx2apple-root "$RUNNER_TEMP/NX2Apple" \
            --output "$RUNNER_TEMP/link2ios-optimized-output" \
            --work "$RUNNER_TEMP/link2ios-optimized-work"

      - name: Publish optimized IPA and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Link2iOS-BOTW-Optimized-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/link2ios-optimized-output/Link2iOS-BOTW-Optimized.ipa
            ${{ runner.temp }}/link2ios-optimized-output/build-report.json
          if-no-files-found: error
          retention-days: 14
