name: Fairy2iOS - Crash memory probe repack (no compile)
on:
  push:
    branches: [Fairy2iOS]
    paths: ['fairy2/crash_repack_trigger.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: fairy2-crash-repack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repack:
    if: github.ref == 'refs/heads/Fairy2iOS'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout Fairy2iOS repack scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm source and crash signature before downloading
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile fairy2/scripts/repack_ipa.py fairy2/colab/ipa_validator.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path("fairy2/crash_repack_trigger.json").read_text())
          assert v["original_run_id"] == 44965722551
          assert v["original_ipa_sha256"] == "b390754af72fc8b6c00bd54bd5d5d5dbbeb393d77b9aa1292d288e0131fabcf9"
          assert v["crash"]["main_pc"] == "0x227b750" and v["crash"]["invalid_write_address"] == "0x12c00280"
          print("Source IPA and precise Fairy Tail 2 crash verified")
          PY
      - name: Download original completed IPA, not the source NSPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fairy2-repack/input"
          gh run download 44965722551 -R joao9vegeto-stack/KintTany -n Fairy2iOS-FairyTail2-1 -D "$RUNNER_TEMP/fairy2-repack/input"
          python3 - <<'PY'
          import hashlib, pathlib, os, json
          src=pathlib.Path(os.environ["RUNNER_TEMP"])/"fairy2-repack/input"
          ipa=src/"Fairy2iOS-FairyTail2.ipa"
          report=json.loads((src/"build-report.json").read_text())
          assert report["project"]=="Fairy2iOS" and report["title_id"]=="0100B9801F872000"
          assert ipa.is_file() and ipa.stat().st_size==1622225666
          h=hashlib.sha256()
          with ipa.open("rb") as f:
              for block in iter(lambda:f.read(8*1024*1024),b""):h.update(block)
          assert h.hexdigest()=="b390754af72fc8b6c00bd54bd5d5d5dbbeb393d77b9aa1292d288e0131fabcf9", "Source IPA SHA mismatch"
          print("Original signed IPA verified: 1,622,225,666 bytes, SHA-256",h.hexdigest())
          PY
      - name: Repack exact original IPA with memory SVC diagnostics, no shader compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fairy2-repack/output"
          python3 fairy2/scripts/repack_ipa.py \
            --source "$RUNNER_TEMP/fairy2-repack/input/Fairy2iOS-FairyTail2.ipa" \
            --output "$RUNNER_TEMP/fairy2-repack/output/Fairy2iOS-FairyTail2-crash-probe-repack.ipa" \
            --report "$RUNNER_TEMP/fairy2-repack/output/crash-probe-report.json"
      - name: Validate newly signed IPA and guarantee original shaders and frame controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("fairy2/colab").resolve()))
          from ipa_validator import validate_ipa
          base=Path(os.environ["RUNNER_TEMP"])/"fairy2-repack"
          orig=json.loads((base/"input/build-report.json").read_text())
          audit=json.loads((base/"output/crash-probe-report.json").read_text())
          ipa=base/"output/Fairy2iOS-FairyTail2-crash-probe-repack.ipa"
          v=validate_ipa(ipa, orig, verify_crc=True)
          assert v["fps"]==[30,60] and v["swap_ab"]
          assert audit["native_macho_recompiled"] is False and audit["metal_recompiled"] is False
          assert audit["unchanged_macho_text_sha256"]["game_macho"]
          assert audit["crash_probe"]["actual_fix_verified"] is False
          print("VALIDATED: intact executable text, compiled shaders, 30/60 FPS, A/B swap; diagnostic DM_SVC enabled")
          PY
      - name: Upload diagnostic IPA and accurate report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Fairy2iOS-crash-probe-no-recompile-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/fairy2-repack/output/Fairy2iOS-FairyTail2-crash-probe-repack.ipa
            ${{ runner.temp }}/fairy2-repack/output/crash-probe-report.json
          if-no-files-found: error
          retention-days: 14
