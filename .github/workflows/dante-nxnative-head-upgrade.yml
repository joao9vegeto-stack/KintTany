name: Dante2iOS | nxnative HEAD gated migration

on:
  push:
    branches: [Dante2iOS]
    paths:
      - ".github/workflows/dante-nxnative-head-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dante2ios-nxnative-head-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/Dante2iOS'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout protected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Dante2iOS
          fetch-depth: 0

      - name: Probe every official patch against selected nxnative HEAD
        id: probe
        env:
          TARGET: 14f54e4c18e2a97905c3481e5e5c4d7764c272f2
        run: |
          set -euo pipefail
          # Materialize every original intermediate patch preimage first so git am -3 can three-way merge.
          python3 tools/engine.py sync
          set +e
          python3 tools/engine.py bump --to "$TARGET" --dry 2>&1 | tee /tmp/dante-nxnative-probe.log
          status=${PIPESTATUS[0]}
          set -e
          echo "result=$status" >> "$GITHUB_OUTPUT"
          echo "## Dante2iOS engine migration probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target nxnative: \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry-run exit code: \`$status\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != "0" ]]; then
            echo "- **No engine changes were published.** Conflicts must be resolved against the 56-patch queue." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Preserve detailed conflict report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dante-nxnative-head-probe
          path: /tmp/dante-nxnative-probe.log
          if-no-files-found: warn

      - name: Migrate only when the official queue is conflict-free
        if: steps.probe.outputs.result == '0'
        env:
          TARGET: 14f54e4c18e2a97905c3481e5e5c4d7764c272f2
        run: |
          set -euo pipefail
          python3 tools/engine.py bump --to "$TARGET"
          python3 tools/engine.py check
          python3 tools/engine.py sync
          python3 tools/engine.py relink

      - name: Run complete tool, UI, and workflow tests
        if: steps.probe.outputs.result == '0'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --only-binary=:all: 'lz4==4.4.5' 'capstone==5.0.9' 'unicorn==2.1.4'
          GITHUB_REPOSITORY=LNPANDY/NX2Apple python3 -m unittest discover tools/tests
          python3 -m unittest discover -s frontend-qt/tests
          python3 -m unittest discover -s .github/scripts/tests
          python3 -m compileall -q engine/scripts engine/dm/tools engine/dm/games engine/dm/mac
          bash -n engine/dm/ios/tools/build_ipa.sh
          (cd frontend-ios && swift build)

      - name: Commit verified engine upgrade exclusively on Dante2iOS
        if: steps.probe.outputs.result == '0'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "Dante2iOS"
          git config user.name "dante2ios-engine-upgrade"
          git config user.email "dante2ios-engine-upgrade@users.noreply.github.com"
          git add .upstream-ref patches/ README.md frontend/README.md frontend-qt/README.md
          if git diff --cached --quiet; then
            echo "Engine upgrade required no changes."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Dante2iOS: rebase official engine queue onto nxnative HEAD"
          git push origin HEAD:Dante2iOS
