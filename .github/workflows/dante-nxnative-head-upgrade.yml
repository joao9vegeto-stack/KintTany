name: Dante2iOS | full nxnative HEAD rebase and verification
on:
  push:
    branches: [Dante2iOS]
    paths:
      - ".github/workflows/dante-nxnative-head-upgrade.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dante2ios-nxnative-full-rebase
  cancel-in-progress: false
jobs:
  rebase-and-verify:
    if: github.ref == 'refs/heads/Dante2iOS'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out only Dante2iOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Dante2iOS
          fetch-depth: 0

      - name: Use verified Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Rebase every patch onto pinned nxnative HEAD
        run: |
          set -euo pipefail
          python3 .github/migrations/dante_full_rebase.py --target ee998ae6d73d5960671ec837ea2ae4a8a0489fec 2>&1 | tee /tmp/dante-full-nxnative-rebase.log

      - name: Preserve exact conflict and merge report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dante-nxnative-full-rebase-report
          path: |
            /tmp/dante-full-nxnative-rebase.log
            /tmp/dante-full-nxnative-rebase.json
          if-no-files-found: warn

      - name: Rebuild all fork patches from scratch at the new upstream pin
        run: |
          set -euo pipefail
          python3 tools/engine.py check
          # The rebase leaves a deliberately modified engine/ HEAD; sync --force
          # makes a local backup before rebuilding from the new 57-patch queue.
          python3 tools/engine.py sync --force
          python3 tools/engine.py relink
          test "$(cat .upstream-ref)" = "ee998ae6d73d5960671ec837ea2ae4a8a0489fec"
          test "$(git -C engine rev-list --count ee998ae6d73d5960671ec837ea2ae4a8a0489fec..HEAD)" -ge 12

      - name: Preserve iOS shell and graphic compatibility features
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("engine")
          checks={
              "dynamic shell frameworks":("dm/ios/tools/build_ipa.sh","DM_FRAMEWORK_ONLY"),
              "shared runtime profiles":("dm/host/hle_profile.c","dm_profile"),
              "recycled NVN render targets":("dm/gfx/nvn/nvn_mtl.m","DM_NVN_RT_RECYCLE"),
              "iOS controller mapping":("dm/ios/Sources/DmGamepad.m","DM_PAD_MAP")
          }
          for label,(file,key) in checks.items():
              if key not in (root/file).read_text(errors="replace"):
                  raise SystemExit("Missing downstream integration: "+label+": "+file)
              print("PRESERVED: "+label,flush=True)
          PY

      - name: Full engine tooling tests and iOS Swift build and tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --only-binary=:all: 'lz4==4.4.5' 'capstone==5.0.9' 'unicorn==2.1.4'
          GITHUB_REPOSITORY=LNPANDY/NX2Apple python3 -m unittest discover tools/tests
          python3 -m unittest discover -s frontend-qt/tests
          python3 -m unittest discover -s .github/scripts/tests
          python3 -m compileall -q engine/scripts engine/dm/tools engine/dm/games engine/dm/mac
          bash -n engine/dm/ios/tools/build_ipa.sh
          (cd frontend-ios && swift build && swift test)

      - name: Publish verified full rebase exclusively to Dante2iOS
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "Dante2iOS"
          git config user.name "dante2ios-upstream-integration"
          git config user.email "dante2ios-upstream-integration@users.noreply.github.com"
          git add .upstream-ref patches/ README.md frontend/README.md frontend-qt/README.md
          git diff --cached --check -- .upstream-ref patches/series patches/fork_env_switches.tsv README.md frontend/README.md frontend-qt/README.md
          if git diff --cached --quiet; then
            echo "Already fully aligned; nothing to push."
            exit 0
          fi
          git commit -m "Dante2iOS: verified full nxnative upstream rebase"
          git push origin HEAD:Dante2iOS
