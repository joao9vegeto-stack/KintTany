name: SwiftPilot iOS Build

on:
  push:
    branches:
      - AItest
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd Apps
          xcodegen generate
          xcodebuild -list -project SwiftPilot.xcodeproj
      - name: Build for iPhoneOS
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Apps/SwiftPilot.xcodeproj \
            -scheme SwiftPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          APP="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name 'SwiftPilot.app' -print -quit)"
          test -d "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          IPA="$GITHUB_WORKSPACE/SwiftPilot-$SHORT_SHA.ipa"
          (cd "$RUNNER_TEMP" && zip -qry "$IPA" Payload)
          test -s "$IPA"
          ls -lh "$IPA"
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftPilot-IPA
          path: SwiftPilot-*.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwiftPilot-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
