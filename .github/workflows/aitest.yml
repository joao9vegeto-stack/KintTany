name: AItest SDK XCTest + IPA

on:
  push:
    branches: [AItest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout AItest
        uses: actions/checkout@v4
        with:
          ref: AItest
          fetch-depth: 1

      - name: Select Xcode 16.4 for XCTest
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Resolve Swift package
        shell: bash
        run: |
          set -euo pipefail
          swift package resolve

      - name: XCTest
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Generate Apps Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd Apps
          xcodegen generate
          test -d SwiftAIApps.xcodeproj
          xcodebuild -list -project SwiftAIApps.xcodeproj

  build_ipa:
    needs: test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout AItest
        uses: actions/checkout@v4
        with:
          ref: AItest
          fetch-depth: 1

      - name: Select Xcode 26.0.1
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Apps Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd Apps
          xcodegen generate
          test -d SwiftAIApps.xcodeproj
          xcodebuild -list -project SwiftAIApps.xcodeproj

      - name: Build StreamTextDemo for iPhoneOS
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Apps/SwiftAIApps.xcodeproj \
            -scheme StreamTextDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name 'StreamTextDemo.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          (
            cd "$RUNNER_TEMP"
            zip -qry "$GITHUB_WORKSPACE/SwiftAIApps-AItest.ipa" Payload
          )
          test -s "$GITHUB_WORKSPACE/SwiftAIApps-AItest.ipa"
          ls -lh "$GITHUB_WORKSPACE/SwiftAIApps-AItest.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftAIApps-AItest-IPA
          path: SwiftAIApps-AItest.ipa
          if-no-files-found: error
          retention-days: 30
