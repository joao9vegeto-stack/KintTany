name: 2. Build Game Thin IPA (from github_kit.zip)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
    paths:
      - '.github/workflows/build_game_ipa.yml'
  workflow_dispatch:
    inputs:
      github_kit_url:
        description: 'Link direto do github_kit.zip na Release'
        required: true
        default: 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip'

permissions:
  contents: write

jobs:
  build_thin_game_ipa:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      KIT_URL: ${{ inputs.github_kit_url || 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip' }}
    steps:
      - name: 1. Checkout da Branch SpkIOSzero
        uses: actions/checkout@v4

      - name: 2. Instalar Dependencias (xcodegen + Python packages)
        run: |
          brew install xcodegen
          pip3 install --break-system-packages lz4 capstone fonttools backports.zstd

      - name: 3. Baixar github_kit.zip e Compilar Thin IPA Nativo do Jogo
        run: |
          # Garante arvore completa e limpa do nxnative
          git clone --depth 1 https://github.com/seedds/nxnative.git "$RUNNER_TEMP/nx_up"
          cp -Rn "$RUNNER_TEMP/nx_up/." .

          # Garante que o Thin IPA leia Documents/romfs no iPhone sem exigir embutir 17 GB no IPA
          python3 - << 'PYEOF'
          from pathlib import Path
          main_m = Path("dm/ios/Sources/main.m")
          s = main_m.read_text(encoding="utf-8")
          old_marker = 'if ([fm fileExistsAtPath:[documentFolder stringByAppendingPathComponent:@DM_GAME_ROMFS_MARKER]]) return documentFolder;'
          new_marker = old_marker + '\n    if ([fm contentsOfDirectoryAtPath:documentFolder error:nil].count > 0) return documentFolder;'
          if 'contentsOfDirectoryAtPath:documentFolder' not in s:
              s = s.replace(old_marker, new_marker)
              main_m.write_text(s, encoding="utf-8")

          bsh = Path("dm/ios/tools/build_ipa.sh")
          b = bsh.read_text(encoding="utf-8")
          b = b.replace(
              'python3 "$DM/tools/romfs.py" "$ROMFS" "$MARKER" || die "no RomFS at $ROMFS (missing $MARKER)"',
              'echo "[Universal Thin IPA] RomFS sera lido de Documents/romfs no iPhone"'
          )
          b = b.replace('"Payload/DmIOS.app/romfs=$ROMFS"', '')
          bsh.write_text(b, encoding="utf-8")
          PYEOF

          echo "Baixando github_kit de: $KIT_URL"
          curl -L --fail -o "$RUNNER_TEMP/github_kit.zip" "$KIT_URL"
          mkdir -p "$RUNNER_TEMP/kit"
          unzip -q "$RUNNER_TEMP/github_kit.zip" -d "$RUNNER_TEMP/kit"
          echo "=== Conteudo extraido do github_kit.zip ==="
          find "$RUNNER_TEMP/kit" -maxdepth 3

          # Descobre automaticamente o TitleID real (010035F022078000)
          TITLE_ID=$(python3 - << 'PYEOF'
          import os, struct, re
          from pathlib import Path
          kit = Path(os.environ["RUNNER_TEMP"]) / "kit"
          npdm_file = kit / "ExeFS" / "main.npdm"
          tid_file = kit / "title_id.txt"
          manifest_file = kit / "manifest.tsv"
          tid_str = ""
          if npdm_file.exists():
              npdm = npdm_file.read_bytes()
              aci0 = struct.unpack_from("<I", npdm, 0x70)[0]
              tid = struct.unpack_from("<Q", npdm, aci0 + 0x10)[0]
              tid_str = f"{tid:016X}"
          elif tid_file.exists():
              tid_str = tid_file.read_text().strip().upper()
          elif manifest_file.exists():
              m = re.search(r"0100[0-9A-Fa-f]{12}", manifest_file.read_text(errors="ignore"))
              if m:
                  tid_val = int(m.group(0), 16) & ~0xFFF
                  tid_str = f"{tid_val:016X}"
          print(tid_str or "010035F022078000")
          PYEOF
          )
          echo "Jogo detectado: TITLE_ID=$TITLE_ID"

          # Gera ou localiza automaticamente o perfil do jogo em dm/games/
          GAME_KEY=$(python3 - << PYEOF
          import os, sys, subprocess
          from pathlib import Path

          tid = "$TITLE_ID"
          kit = Path(os.environ["RUNNER_TEMP"]) / "kit"
          games_dir = Path("dm/games")

          # 1. Verifica se algum perfil em dm/games/ ja possui esse TITLE_ID no game.mk
          for d in sorted(games_dir.iterdir()):
              if d.is_dir():
                  gm = d / "game.mk"
                  if gm.exists() and tid.lower() in gm.read_text(errors="ignore").lower():
                      print(d.name)
                      sys.exit(0)

          # 2. Se nao existir, roda game_survey.py + profile_guess.py para criar dm/games/<tid>
          survey_md = Path(os.environ["RUNNER_TEMP"]) / "survey.md"
          cmd_survey = [sys.executable, "dm/tools/survey/game_survey.py", str(kit), "-o", str(survey_md)]
          if (kit / "manifest.tsv").exists():
              cmd_survey += ["--manifest", str(kit / "manifest.tsv")]
          subprocess.run(cmd_survey, check=False)

          prof_dir = games_dir / tid
          prof_dir.mkdir(parents=True, exist_ok=True)
          subprocess.run([sys.executable, "dm/games/profile_guess.py", str(survey_md), "--extracted", str(kit), "-o", str(prof_dir)], check=False)

          # Fallback caso profile_guess tenha outra interface
          if not (prof_dir / "game.mk").exists():
              sys.path.insert(0, "dm/games")
              import profile_guess
              for fn_name in dir(profile_guess):
                  if "write" in fn_name or "guess" in fn_name or "generate" in fn_name:
                      sys.stderr.write(f"profile_guess exporta: {fn_name}\n")
              # Copia o template mais proximo de dm/games/ e ajusta TITLE_ID
              for d in sorted(games_dir.iterdir()):
                  if d.is_dir() and (d / "game.mk").exists():
                      for f in d.iterdir():
                          if f.is_file():
                              (prof_dir / f.name).write_bytes(f.read_bytes())
                      break
          print(tid)
          PYEOF
          )
          echo "Usando perfil: GAME_KEY=$GAME_KEY"
          ls -la "dm/games/$GAME_KEY"

          # 1. Patcheia os binarios ARM64 (ExeFS) para iOS nativo
          mkdir -p "$RUNNER_TEMP/patched"
          python3 dm/tools/patch_nso.py "$RUNNER_TEMP/kit/ExeFS" "$RUNNER_TEMP/patched" --game "$GAME_KEY"

          # 2. Extrai e converte os shaders para Metal (.dmsh)
          mkdir -p "$RUNNER_TEMP/shader_out"
          python3 dm/gfx/tools/shader_split.py "$RUNNER_TEMP/kit/RomFS" "$RUNNER_TEMP/shader_pkg" --game "$GAME_KEY" || true
          if [ -d "$RUNNER_TEMP/shader_pkg" ]; then
            IOSOUT=1 ALLOW_OTHER_METAL=1 python3 dm/gfx/tools/dmsh_build.py "$RUNNER_TEMP/shader_pkg" --game "$GAME_KEY" || true
          fi

          # 3. Empacota o Thin IPA do jogo com icone e nome oficial do control.nacp!
          NACP_ARG=()
          ICON_ARG=()
          [ -f "$RUNNER_TEMP/kit/control.nacp" ] && NACP_ARG=(--nacp "$RUNNER_TEMP/kit/control.nacp")
          [ -f "$RUNNER_TEMP/kit/icon.jpg" ] && ICON_ARG=(--icon "$RUNNER_TEMP/kit/icon.jpg")

          bash dm/ios/tools/build_ipa.sh \
            --game "$GAME_KEY" \
            --patched "$RUNNER_TEMP/patched" \
            --romfs "$RUNNER_TEMP/kit/RomFS" \
            "${NACP_ARG[@]}" \
            "${ICON_ARG[@]}" \
            -o "$RUNNER_TEMP/${TITLE_ID}_Thin.ipa"

          ls -lh "$RUNNER_TEMP/${TITLE_ID}_Thin.ipa"

      - name: 4. Upload do IPA do Jogo nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Game-Thin-IPA-Artifact
          path: ${{ runner.temp }}/*_Thin.ipa
