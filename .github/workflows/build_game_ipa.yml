name: 2. Build Game Thin IPA (from github_kit.zip)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
  workflow_dispatch:
    inputs:
      github_kit_url:
        description: 'Link direto do github_kit.zip na Release'
        required: false
        default: 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip'

permissions:
  contents: write

jobs:
  build_thin_game_ipa:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      CHAIN_STAMP: ""
      KIT_URL: ${{ inputs.github_kit_url || 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip' }}
    steps:
      - name: 1. Checkout da Branch SpkIOSzero
        uses: actions/checkout@v4

      - name: 2. Instalar Dependencias (xcodegen + Python packages)
        run: |
          brew install xcodegen || true
          pip3 install --break-system-packages lz4 capstone fonttools zstandard

      - name: 2.5 Restaurar Cache dos Modulos NSO Reescritos
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/patched_cache_010035F022078000
          key: patched-nso-010035F022078000-v3
          restore-keys: |
            patched-nso-010035F022078000-

      - name: 3. Baixar github_kit.zip e Compilar Thin IPA Nativo do Jogo
        run: |
          set -e

          # 1. Garante arvore completa do nxnative
          if [ ! -f "dm/ios/tools/build_ipa.sh" ]; then
            git clone --depth 1 https://github.com/seedds/nxnative.git "$RUNNER_TEMP/nx_up"
            rsync -a --ignore-existing "$RUNNER_TEMP/nx_up/" ./
          fi

          # Desativa 'set -u' no build_ipa.sh para nao quebrar em CHAIN_STAMP (linha 169)
          sed -i '' 's/^set -u/set +u/g' dm/ios/tools/build_ipa.sh || true

          # 2. Baixa o github_kit.zip da Release
          mkdir -p "$RUNNER_TEMP/dl"
          if ! curl -L --fail -o "$RUNNER_TEMP/dl/github_kit.zip" "$KIT_URL"; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "$RUNNER_TEMP/dl" --clobber
          fi

          FIRST_ZIP=$(find "$RUNNER_TEMP/dl" -name "*.zip" | head -n 1)
          mkdir -p "$RUNNER_TEMP/kit"
          unzip -q "$FIRST_ZIP" -d "$RUNNER_TEMP/kit"

          if [ ! -d "$RUNNER_TEMP/kit/ExeFS" ]; then
            SUB_EXEFS=$(find "$RUNNER_TEMP/kit" -type d -iname "ExeFS" | head -n 1)
            if [ -n "$SUB_EXEFS" ]; then
              PARENT_DIR=$(dirname "$SUB_EXEFS")
              [ "$PARENT_DIR" != "$RUNNER_TEMP/kit" ] && mv "$PARENT_DIR"/* "$RUNNER_TEMP/kit/" || true
            fi
          fi

          # 3. Executa o pipeline real do nxnative
          python3 -u - << 'PYEOF'
          import os, sys, re, struct, shutil, subprocess
          from pathlib import Path

          rt = Path(os.environ["RUNNER_TEMP"]).resolve()
          kit = rt / "kit"
          exefs = kit / "ExeFS"
          romfs = kit / "RomFS"
          romfs.mkdir(parents=True, exist_ok=True)
          manifest = kit / "romfs_manifest.tsv"

          # Descobre o TitleID real a partir do main.npdm
          tid_str = "010035F022078000"
          npdm_file = exefs / "main.npdm"
          if npdm_file.exists():
              npdm = npdm_file.read_bytes()
              aci0 = struct.unpack_from("<I", npdm, 0x70)[0]
              tid = struct.unpack_from("<Q", npdm, aci0 + 0x10)[0]
              tid_str = f"{tid:016X}"
          print(f"=== TitleID detectado: {tid_str} ===", flush=True)

          games_dir = Path("dm/games").resolve()
          game_py = games_dir / "game.py"
          sample_tsvs = sorted(games_dir.glob("*/game.tsv"))

          # Descobre quais modulos NSO existem dentro de ExeFS
          order = ["rtld", "main", "subsdk0", "subsdk1", "subsdk2", "subsdk3", "subsdk4", "subsdk5", "subsdk6", "subsdk7", "subsdk8", "subsdk9", "sdk"]
          mods = []
          for m in order:
              p = exefs / m
              if p.is_file() and p.read_bytes()[:4] == b"NSO0":
                  mods.append(m)
          for p in sorted(exefs.iterdir()):
              if p.is_file() and p.name not in mods and p.name != "main.npdm" and p.read_bytes()[:4] == b"NSO0":
                  mods.append(p.name)
          print(f"=== Modulos NSO encontrados em ExeFS: {mods} ===", flush=True)

          # Descobre um arquivo real do RomFS para usar como marker
          marker = "SparkingZERO/Content/Paks/global.ucas"
          if manifest.exists():
              for line in manifest.read_text(errors="ignore").splitlines():
                  if line.strip() and not line.startswith("#"):
                      first_col = line.split("\t")[0].lstrip("/")
                      if first_col:
                          marker = first_col
                          break

          prof_dir = games_dir / tid_str
          prof_dir.mkdir(parents=True, exist_ok=True)
          game_tsv = prof_dir / "game.tsv"

          ref_kv = {}
          for stsv in sample_tsvs:
              if stsv.parent.name != tid_str:
                  for line in stsv.read_text(errors="ignore").splitlines():
                      if "\t" in line and not line.startswith("#"):
                          k, v = line.split("\t", 1)
                          ref_kv.setdefault(k.strip(), v.strip())
                  break

          kv = {
              "name": "DRAGON BALL: Sparking! ZERO",
              "program_id": tid_str.lower(),
              "title_id": tid_str.lower(),
              "bundle_id": f"com.nxnative.g{tid_str.lower()}",
              "version": "1.0",
              "package": "v0",
              "ipa": f"{tid_str}_Thin.ipa",
              "modules": " ".join(mods),
              "romfs_marker": marker,
              "gfx_api": "nvn",
              "app_category": ref_kv.get("app_category", "public.app-category.action-games"),
              "orientation": "landscape",
              "mem_reserve": "0x300000000",
              "mem_alias": "0x200000000",
              "mem_stack": "0x10000000",
              "app_pool": "0xCD500000",
              "sys_resource": "0x1e00000",
              "fps_target": "60",
              "present_interval": "display",
              "op_mode": "handheld",
              "depth_mode": "zero",
              "alloc_big_align": "on",
              "game_args": "-SwitchVirtualAddressSpaceSize=2048",
          }
          skip_keys = {"patches", "hooks", "vulkan_shaders", "gl_shaders", "trinity_packs", "feedback_snap", "shader_versions", "shader_groups", "shader_note", "pso_mtl4", "game_env"}
          for rk, rv in ref_kv.items():
              if rk not in kv and rk not in skip_keys and not rk.startswith("subsdk") and rk not in ("rtld", "main", "sdk"):
                  kv[rk] = rv

          tsv_content = "\n".join(f"{k}\t{v}" for k, v in kv.items()) + "\n"
          game_tsv.write_text(tsv_content, encoding="utf-8")

          # Garante que dm/games/game.py nunca de KeyError
          gpy_txt = game_py.read_text(encoding="utf-8")
          if "return ''" not in gpy_txt:
              gpy_txt = re.sub(
                  r"if default is None:\s+raise KeyError\([^\)]+\)",
                  "if default is None: return ''",
                  gpy_txt
              )
              game_py.write_text(gpy_txt, encoding="utf-8")

          # Cria arquivo dummy para o marker dentro de RomFS
          marker_path = romfs / marker
          marker_path.parent.mkdir(parents=True, exist_ok=True)
          if not marker_path.exists():
              marker_path.write_bytes(b"DUMMY_ROMFS_MARKER")

          # Prepara o diretorio de trabalho ($W)
          work = rt / f"{tid_str}-work"
          patched = work / "build" / "patched_v0"
          msl_ios = work / "build" / "ios" / "dmsh_b" / "nvn"
          data_v0 = work / "data" / "v0"
          for d in (patched, msl_ios, data_v0):
              d.mkdir(parents=True, exist_ok=True)

          # Usa o cache dos NSOs reescritos (pasta inteira gerada pelo patch_nso.py)
          cache_dir = Path(f"/Users/runner/patched_cache_{tid_str}")
          cache_dir.mkdir(parents=True, exist_ok=True)

          cached_files = [f for f in cache_dir.iterdir() if f.name != ".DS_Store"]
          if len(cached_files) >= len(mods):
              print(f"=== [CACHE HIT] Restaurando {len(cached_files)} arquivos de {cache_dir} ===", flush=True)
              shutil.copytree(cache_dir, patched, dirs_exist_ok=True)
          else:
              for m in mods:
                  src_nso = exefs / m
                  print(f"=== Reescrevendo NSO: {m} ===", flush=True)
                  subprocess.run(
                      ["python3", "dm/tools/patch_nso.py", str(src_nso), str(patched), m],
                      check=True
                  )
              shutil.copytree(patched, cache_dir, dirs_exist_ok=True)

          if (exefs / "main.npdm").exists():
              dst_npdm = patched / "main.npdm"
              if (exefs / "main.npdm").resolve() != dst_npdm.resolve():
                  shutil.copy2(exefs / "main.npdm", dst_npdm)

          for nacp in kit.rglob("*.nacp"):
              for dst_nacp in (data_v0 / "control.nacp", romfs.parent / "control.nacp"):
                  if nacp.resolve() != dst_nacp.resolve():
                      shutil.copy2(nacp, dst_nacp)
              break

          # Gera os cabecalhos do perfil no host
          subprocess.run(["make", "-s", "-C", "dm/host", "game_profile", f"GAME={tid_str}"], check=True)

          # Executa o build_ipa.sh
          out_ipa = rt / f"{tid_str}_Thin.ipa"
          env = os.environ.copy()
          env.update({
              "GAME": tid_str,
              "W": str(work),
              "PATCHED": str(patched),
              "ROMFS": str(romfs),
              "MSL_IOS": str(msl_ios.parent),
              "DM_DISPLAY_NAME": "DRAGON BALL: Sparking! ZERO",
              "DM_APP_VERSION": "1.0",
              "CHAIN_STAMP": "",
          })
          aoc_dir = kit / "aoc"
          if aoc_dir.is_dir():
              env["AOC"] = str(aoc_dir)
          else:
              env["AOC"] = ""

          subprocess.run(["bash", "-x", "dm/ios/tools/build_ipa.sh", str(out_ipa)], env=env, check=True)
          print(f"=== SUCESSO! IPA GERADO EM: {out_ipa} ===", flush=True)
          PYEOF

      - name: 3.5 Salvar Cache dos Modulos NSO Reescritos
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /Users/runner/patched_cache_010035F022078000
          key: patched-nso-010035F022078000-v3

      - name: 4. Upload do IPA do Jogo nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SparkingZERO-Thin-IPA
          path: ${{ runner.temp }}/*_Thin.ipa
          if-no-files-found: error
