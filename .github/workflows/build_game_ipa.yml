name: 2. Build Thin IPA - Teste sem corte incorreto

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero

  workflow_dispatch:
    inputs:
      github_kit_url:
        description: "Link direto do github_kit.zip"
        required: false
        type: string
        default: "https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip"

permissions:
  contents: read

jobs:
  build_thin_game_ipa:
    runs-on: macos-26
    timeout-minutes: 240

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      CHAIN_STAMP: ""

      KIT_URL: ${{ inputs.github_kit_url || 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip' }}

      BASELINE_COMMIT: "306dcdfcb53d348085292e9e527339161c0536c7"

      EXPECTED_MAIN_SHA256: "a0f8f0644c92384ddb1baac1c21aecbeeace5bc99ad40895e216add61da78efe"

      EXPECTED_MAIN_BUILD_ID: "68edafd68c7bc1a1af50b82aac838018"

    steps:
      - name: 1. Baixar codigo da versao que compilou
        uses: actions/checkout@v4
        with:
          ref: 306dcdfcb53d348085292e9e527339161c0536c7

      - name: 2. Instalar dependencias
        shell: bash
        run: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          pip3 install --break-system-packages \
            lz4 \
            capstone \
            fonttools \
            zstandard \
            PyYAML

      - name: 3. Preparar workflow original sem o patch suspeito
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/spk-teste"

          # Não usar módulos reescritos por uma execução anterior.
          rm -rf /Users/runner/patched_cache

          python3 -u - <<'PYEOF'
          import os
          from pathlib import Path

          import yaml

          workflow_path = Path(".github/workflows/build_game_ipa.yml")

          if not workflow_path.is_file():
              raise SystemExit(
                  "ERRO: workflow original nao encontrado no commit base."
              )

          with workflow_path.open("r", encoding="utf-8") as f:
              workflow = yaml.safe_load(f)

          try:
              steps = workflow["jobs"]["build_thin_game_ipa"]["steps"]
          except (KeyError, TypeError) as exc:
              raise SystemExit(
                  f"ERRO: estrutura inesperada no workflow original: {exc}"
              )

          candidates = []

          for step in steps:
              name = str(step.get("name", ""))
              command = step.get("run")

              if (
                  "Baixar github_kit.zip" in name
                  and isinstance(command, str)
              ):
                  candidates.append((name, command))

          if len(candidates) != 1:
              raise SystemExit(
                  "ERRO: esperado exatamente um passo de build original; "
                  f"encontrados {len(candidates)}."
              )

          step_name, command = candidates[0]

          if "python3 -u - << 'PYEOF'" not in command:
              raise SystemExit(
                  "ERRO: o workflow base nao contem o Python embutido "
                  "esperado."
              )

          def replace_once(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERRO em '{label}': esperado 1 ponto de alteracao, "
                      f"encontrados {count}. Build interrompido."
                  )

              return text.replace(old, new, 1)

          # Confere que o kit contém exatamente o executável analisado.
          old_main = 'main_bytes = (exefs / "main").read_bytes()'

          new_main = (
              'main_bytes = (exefs / "main").read_bytes(); '
              'import hashlib; '
              'print("=== SHA-256 main: " + '
              'hashlib.sha256(main_bytes).hexdigest(), flush=True); '
              'assert hashlib.sha256(main_bytes).hexdigest() == '
              'os.environ["EXPECTED_MAIN_SHA256"], '
              '"ExeFS/main diferente do analisado"; '
              'assert main_bytes[0x40:0x50].hex() == '
              'os.environ["EXPECTED_MAIN_BUILD_ID"], '
              '"Build ID diferente do analisado"'
          )

          command = replace_once(
              command,
              old_main,
              new_main,
              "verificacao do executavel",
          )

          # Impede que um patches.py ja existente no perfil seja aplicado
          # sem que este teste tenha considerado seu conteudo.
          old_profile = 'prof_dir.mkdir(parents=True, exist_ok=True)'

          new_profile = (
              'prof_dir.mkdir(parents=True, exist_ok=True); '
              'assert not (prof_dir / "patches.py").exists(), '
              '"Existe patches.py no perfil: teste interrompido"'
          )

          command = replace_once(
              command,
              old_profile,
              new_profile,
              "verificacao de patch preexistente",
          )

          # O bloco abaixo, no workflow original, cria o CUT, a OBS e
          # registra o build em hle_uemalloc.c. Desativamos o bloco inteiro.
          old_condition = (
              "if cut_addr is not None and obs_addr is not None:"
          )

          new_condition = (
              "if False and cut_addr is not None and obs_addr is not None:"
          )

          command = replace_once(
              command,
              old_condition,
              new_condition,
              "desativacao do patch automatico",
          )

          # Nome distinto para identificar o IPA experimental.
          old_ipa = 'ipa_filename = f"{safe_name}.ipa"'

          new_ipa = (
              'safe_name = f"{safe_name}_SEM_CORTE"; '
              'ipa_filename = f"{safe_name}.ipa"'
          )

          command = replace_once(
              command,
              old_ipa,
              new_ipa,
              "nome do IPA",
          )

          output = Path(os.environ["RUNNER_TEMP"]) / "spk-build-teste.sh"
          output.write_text(command + "\n", encoding="utf-8")

          print(f"Commit base: {os.environ['BASELINE_COMMIT']}")
          print(f"Etapa original: {step_name}")
          print("CUT e OBS automaticos: DESATIVADOS")
          print("Cache de modulos antigos: DESATIVADO")
          print(f"Script preparado: {output}")
          PYEOF

      - name: 4. Baixar kit e compilar IPA de teste
        shell: bash
        run: |
          set -o pipefail

          bash "$RUNNER_TEMP/spk-build-teste.sh" 2>&1 \
            | tee "$RUNNER_TEMP/spk-teste/build.log"

      - name: 5. Registrar resultado e cortes aplicados
        if: always()
        shell: bash
        run: |
          python3 -u - <<'PYEOF'
          import hashlib
          import os
          from pathlib import Path

          rt = Path(os.environ["RUNNER_TEMP"])
          report_dir = rt / "spk-teste"
          report_dir.mkdir(parents=True, exist_ok=True)

          lines = [
              "TESTE SEM CORTE AUTOMATICO DO FMALLOC",
              "",
              f"Commit disparador: {os.environ.get('GITHUB_SHA', '')}",
              f"Commit base: {os.environ.get('BASELINE_COMMIT', '')}",
              f"Execucao: {os.environ.get('GITHUB_RUN_ID', '')}",
              "",
              "Este IPA e experimental.",
              "A cadeia de shaders ainda nao foi corrigida.",
              "",
          ]

          main = rt / "kit" / "ExeFS" / "main"

          if main.is_file():
              digest = hashlib.sha256()

              with main.open("rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      digest.update(chunk)

              with main.open("rb") as f:
                  header = f.read(0x60)

              lines.append(f"main SHA-256: {digest.hexdigest()}")

              if len(header) >= 0x50 and header[:4] == b"NSO0":
                  lines.append(
                      f"main Build ID: {header[0x40:0x50].hex()}"
                  )
          else:
              lines.append("ExeFS/main nao encontrado.")

          lines.append("")

          for pattern in (
              "*-work/build/patched_v0/main.cuts.tsv",
              "*-work/build/patched_v0/main.obs.tsv",
          ):
              paths = sorted(rt.glob(pattern))

              if not paths:
                  lines.append(f"Nao encontrado: {pattern}")
                  continue

              for path in paths:
                  lines.append(f"=== {path.name} ===")

                  try:
                      content = path.read_text(
                          encoding="utf-8",
                          errors="replace",
                      )
                      lines.append(content if content else "(vazio)")
                  except OSError as exc:
                      lines.append(f"Erro ao ler arquivo: {exc}")

                  lines.append("")

          ipas = sorted(rt.glob("*.ipa"))

          if ipas:
              lines.append("IPAs gerados:")

              for ipa in ipas:
                  lines.append(
                      f"  {ipa.name} ({ipa.stat().st_size} bytes)"
                  )
          else:
              lines.append("Nenhum IPA encontrado.")

          report = report_dir / "resumo.txt"
          report.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print(report.read_text(encoding="utf-8"))
          PYEOF

      - name: 6. Salvar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spk-teste-sem-corte-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/spk-teste/
          if-no-files-found: warn
          retention-days: 7

      - name: 7. Salvar IPA experimental
        uses: actions/upload-artifact@v4
        with:
          name: spk-ipa-sem-corte-${{ github.run_id }}
          path: ${{ runner.temp }}/*_SEM_CORTE.ipa
          if-no-files-found: error
          retention-days: 7
