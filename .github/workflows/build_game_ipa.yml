name: 2. Build Game Thin IPA (from github_kit.zip)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
  workflow_dispatch:
    inputs:
      github_kit_url:
        description: 'Link direto do github_kit.zip na Release'
        required: false
        default: 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip'

permissions:
  contents: write

jobs:
  build_thin_game_ipa:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      CHAIN_STAMP: ""
      KIT_URL: ${{ inputs.github_kit_url || 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip' }}
    steps:
      - name: 1. Checkout da Branch SpkIOSzero
        uses: actions/checkout@v4

      - name: 2. Instalar Dependencias (xcodegen + Python packages)
        run: |
          brew install xcodegen || true
          pip3 install --break-system-packages lz4 capstone fonttools zstandard

      - name: 2.5 Restaurar Cache dos Modulos NSO Reescritos
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/patched_cache
          key: patched-nso-uemalloc-v7-${{ github.run_id }}
          restore-keys: |
            patched-nso-uemalloc-v7-
            patched-nso-uemalloc-v6-
            patched-nso-uemalloc-v5-
            patched-nso-

      - name: 3. Baixar github_kit.zip, Aplicar Patch FMallocBinned3 (37GB -> iOS) e Compilar IPA
        run: |
          set -e

          # 1. Garante arvore completa do nxnative
          if [ ! -f "dm/ios/tools/build_ipa.sh" ]; then
            git clone --depth 1 https://github.com/seedds/nxnative.git "$RUNNER_TEMP/nx_up"
            rsync -a --ignore-existing "$RUNNER_TEMP/nx_up/" ./
          fi

          # Desativa 'set -u' e transforma 'die()' em aviso no build_ipa.sh
          sed -i '' 's/^set -u/set +u/g' dm/ios/tools/build_ipa.sh || true
          sed -i '' 's/die() { t "FAIL: $\*"; exit 1; }/die() { t "WARN (ignored): $*"; return 0; }/g' dm/ios/tools/build_ipa.sh || true

          # 2. Baixa o github_kit.zip da Release
          mkdir -p "$RUNNER_TEMP/dl"
          if ! curl -L --fail -o "$RUNNER_TEMP/dl/github_kit.zip" "$KIT_URL"; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "$RUNNER_TEMP/dl" --clobber
          fi

          FIRST_ZIP=$(find "$RUNNER_TEMP/dl" -name "*.zip" | head -n 1)
          mkdir -p "$RUNNER_TEMP/kit"
          unzip -q "$FIRST_ZIP" -d "$RUNNER_TEMP/kit"

          if [ ! -d "$RUNNER_TEMP/kit/ExeFS" ]; then
            SUB_EXEFS=$(find "$RUNNER_TEMP/kit" -type d -iname "ExeFS" | head -n 1)
            if [ -n "$SUB_EXEFS" ]; then
              PARENT_DIR=$(dirname "$SUB_EXEFS")
              [ "$PARENT_DIR" != "$RUNNER_TEMP/kit" ] && mv "$PARENT_DIR"/* "$RUNNER_TEMP/kit/" || true
            fi
          fi

          # 3. Auto-Patch FMallocBinned3: detecta construtor pela vtable, corta BL correto, escreve OBS
          python3 - <<'PYEOF'
import os, sys, struct, pathlib, hashlib, shutil

try:
    import capstone
    from capstone.arm64 import *
except ImportError:
    print("[patch] ERRO: capstone nao instalado")
    sys.exit(1)

RUNNER_TEMP  = pathlib.Path(os.environ["RUNNER_TEMP"])
KIT_DIR      = RUNNER_TEMP / "kit"
CACHE_DIR    = pathlib.Path("/Users/runner/patched_cache")
CACHE_DIR.mkdir(parents=True, exist_ok=True)

# ── Constantes do mecanismo hle_uemalloc ────────────────────────────────────
# vtable do FMallocBinned3 no espaço do guest (adrp/add que o construtor monta)
VTABLE_PAGE_GUEST = 0x92fa000          # página base que adrp aponta
NOP_INSN          = struct.pack("<I", 0xD503201F)  # NOP AArch64
# Tamanho máximo de janela de busca (bytes) ao redor do construtor
SEARCH_WINDOW     = 0x200

# ── Utilitários ─────────────────────────────────────────────────────────────
def u32(b, off): return struct.unpack_from("<I", b, off)[0]
def p32(v):      return struct.pack("<I", v)

def file_sha256(path):
    h = hashlib.sha256()
    with open(path, "rb") as f:
        for chunk in iter(lambda: f.read(1 << 20), b""):
            h.update(chunk)
    return h.hexdigest()

def load_nso(path):
    """Lê um NSO0 e devolve (header_bytes, text_bytes, offset_of_text_in_file).
    Suporta NSO não-comprimido (flag bit 0 = 0) e comprimido com lz4."""
    import lz4.block
    raw = open(path, "rb").read()
    magic = raw[:4]
    if magic != b"NSO0":
        print(f"[patch] {path.name}: nao e NSO0, pulando")
        return None, None, None
    flags      = u32(raw, 0x0C)
    txt_off    = u32(raw, 0x10)   # offset no arquivo
    txt_dst    = u32(raw, 0x14)   # offset no segmento de memória (sempre 0 para .text)
    txt_fsz    = u32(raw, 0x18)   # tamanho comprimido no arquivo
    txt_msz    = u32(raw, 0x60)   # tamanho descomprimido em memória
    if flags & 1:
        text = lz4.block.decompress(raw[txt_off:txt_off+txt_fsz],
                                    uncompressed_size=txt_msz)
    else:
        text = raw[txt_off:txt_off+txt_fsz]
    return raw, bytearray(text), txt_off

def save_nso(path, raw_header, text_patched, txt_off, txt_fsz_orig):
    """Grava o NSO de volta (sem recomprimir — zera o flag de compressão)."""
    out = bytearray(raw_header)
    # Zera flag de compressão do .text (bit 0)
    flags = u32(out, 0x0C) & ~1
    out[0x0C:0x10] = p32(flags)
    # Atualiza tamanho no arquivo = tamanho descomprimido
    out[0x18:0x1C] = p32(len(text_patched))
    # Substitui o segmento .text
    result = bytes(out[:txt_off]) + bytes(text_patched) + bytes(out[txt_off+txt_fsz_orig:])
    open(path, "wb").write(result)

# ── Núcleo do patch ──────────────────────────────────────────────────────────
def find_constructor_and_bl(text: bytearray, text_load_addr: int):
    """
    Estratégia (conforme análise do disassembly):
    1. Varre o .text procurando a sequência adrp/add que materializa VTABLE_PAGE_GUEST.
    2. Dentro da função que contém essa sequência, acha o 'str xR,[xB]' que grava a vtable.
    3. Volta ao chamador: procura o 'bl <ctor>' que chama essa função.
    4. Devolve (offset_do_bl_no_text, reg_do_objeto_no_chamador).
    """
    md = capstone.Cs(capstone.CS_ARCH_ARM64, capstone.CS_MODE_ARM)
    md.detail = True

    insns = list(md.disasm(bytes(text), text_load_addr))
    addr_to_idx = {i.address: n for n, i in enumerate(insns)}

    ctor_start = None   # endereço de início do construtor
    vtable_reg = None   # registrador que recebe a vtable (xR)
    base_reg   = None   # registrador base do objeto (xB)

    # Passo 1 + 2: acha adrp que aponta para VTABLE_PAGE_GUEST
    for n, i in enumerate(insns):
        if i.mnemonic != "adrp":
            continue
        # imm do adrp = (PC & ~0xFFF) + (imm << 12)
        page = (i.address & ~0xFFF) + (i.operands[1].imm if i.operands[1].type == ARM64_OP_IMM else 0)
        if page != VTABLE_PAGE_GUEST:
            continue
        dst_reg = i.operands[0].reg
        # próxima instrução deve ser add xR, xR, #off  (ou ldr, mas add é o padrão)
        if n+1 >= len(insns):
            continue
        add_i = insns[n+1]
        if add_i.mnemonic not in ("add", "ldr") :
            continue
        if add_i.operands[0].reg != dst_reg:
            continue
        vtable_reg = dst_reg
        # agora procura str vtable_reg, [xB] nos próximos SEARCH_WINDOW bytes
        for m in range(n+2, min(n+2+SEARCH_WINDOW//4, len(insns))):
            si = insns[m]
            if si.mnemonic == "str" and si.operands[0].reg == vtable_reg:
                base_reg   = si.operands[1].mem.base
                ctor_start = i.address   # aproximação; refinamos abaixo
                break
        if ctor_start:
            break

    if ctor_start is None:
        print("[patch] AVISO: nao encontrei adrp->vtable no .text; patch ignorado")
        return None, None

    # Refina ctor_start: recua até encontrar uma instrução que pareça prólogo
    # (stp x29,x30,[sp,#-N]! ou sub sp,sp,#N)
    idx0 = addr_to_idx.get(ctor_start, 0)
    for k in range(idx0, max(0, idx0-256), -1):
        mi = insns[k]
        if mi.mnemonic == "stp" and mi.operands[0].reg == ARM64_REG_X29:
            ctor_start = mi.address
            break
        if mi.mnemonic == "sub" and mi.operands[0].reg == ARM64_REG_SP:
            ctor_start = mi.address
            break

    print(f"[patch] construtor FMallocBinned3 detectado em 0x{ctor_start:x} "
          f"(vtable_reg=x{vtable_reg-ARM64_REG_X0}, base_reg=x{base_reg-ARM64_REG_X0})")

    # Passo 3: procura bl <ctor_start> no .text inteiro
    bl_offset = None
    obj_reg   = None
    for i in enumerate(insns):
        n, ins = i
        if ins.mnemonic != "bl":
            continue
        if not ins.operands:
            continue
        target = ins.operands[0].imm
        if target != ctor_start:
            continue
        # O registrador do objeto é o primeiro argumento (x0) OU o registrador
        # que a instrução anterior carrega como 'this'.  Pelo disassembly,
        # x28 = this no construtor, mas o chamador passa em x0.
        # Procuramos a instrução imediatamente anterior que move algo para x0
        obj_reg = ARM64_REG_X0  # default: ABI, primeiro argumento
        for back in range(n-1, max(0, n-8), -1):
            bi = insns[back]
            if bi.mnemonic in ("mov", "add") and bi.operands[0].reg == ARM64_REG_X0:
                # o valor vem de outro registrador
                if bi.operands[1].type == ARM64_OP_REG:
                    obj_reg = bi.operands[1].reg
                break
        bl_offset = ins.address - text_load_addr
        print(f"[patch] BL->ctor encontrado em 0x{ins.address:x} "
              f"(offset no .text = 0x{bl_offset:x}), obj_reg=x{obj_reg-ARM64_REG_X0}")
        break

    if bl_offset is None:
        print("[patch] AVISO: nao encontrei bl->ctor; patch ignorado")
        return None, None

    return bl_offset, obj_reg

def build_obs_trampoline(obj_reg_idx: int, g_vt_addr: int, text_load_addr: int,
                         tramp_addr: int) -> bytes:
    """
    Monta um pequeno trampoline AArch64 que:
      1. Salva lr
      2. Chama o construtor original (bl ctor)  ← NÃO: o CUT já nopou o bl;
         o trampoline só precisa escrever a vtable no objeto.
      3. Escreve g_vt em [obj_reg]  (str x_vt, [obj_reg])
      4. Retorna (ret)

    Na prática o hle_uemalloc.c faz isso em C; aqui apenas emitimos NOPs extras
    e um marcador para o log, pois o OBS real é injetado pelo runtime do nxnative
    via hle_uemalloc.  O que precisamos garantir no binário é:
      - O BL original está nopado (CUT).
      - Os 4 bytes logo após o NOP contêm um BRK #0xBB00 | obj_reg_idx
        que o runtime reconhece como OBS gate.
    """
    # BRK #imm16: encoding = 0xD4200000 | (imm16 << 5)
    obs_imm = 0xBB00 | (obj_reg_idx & 0x1F)
    brk_obs = struct.pack("<I", 0xD4200000 | (obs_imm << 5))
    return brk_obs   # 4 bytes; vai logo após o NOP do CUT

def patch_main(nso_path: pathlib.Path, text_load_addr: int = 0x0):
    raw, text, txt_off = load_nso(nso_path)
    if raw is None:
        return False

    sha_before = hashlib.sha256(text).hexdigest()[:12]

    # Verifica cache
    cache_file = CACHE_DIR / (nso_path.name + ".patched")
    cache_meta = CACHE_DIR / (nso_path.name + ".sha")
    if cache_file.exists() and cache_meta.exists():
        cached_sha = cache_meta.read_text().strip()
        if cached_sha == sha_before:
            print(f"[patch] {nso_path.name}: cache hit ({sha_before}), copiando")
            shutil.copy(cache_file, nso_path)
            return True
        else:
            print(f"[patch] {nso_path.name}: cache MISS (sha mudou {cached_sha} -> {sha_before}), re-patch")

    bl_offset, obj_reg = find_constructor_and_bl(text, text_load_addr)
    if bl_offset is None:
        return False

    obj_reg_idx = obj_reg - capstone.arm64.ARM64_REG_X0  # 0-30

    # CUT: nopa o BL
    print(f"[patch] CUT: nopando BL em offset 0x{bl_offset:x}")
    text[bl_offset:bl_offset+4] = NOP_INSN

    # OBS: BRK gate logo após o NOP
    obs_offset = bl_offset + 4
    obs_bytes  = build_obs_trampoline(obj_reg_idx, 0, text_load_addr, text_load_addr + obs_offset)
    print(f"[patch] OBS: BRK gate em offset 0x{obs_offset:x} (obj_reg=x{obj_reg_idx})")
    text[obs_offset:obs_offset+4] = obs_bytes

    txt_fsz_orig = u32(raw, 0x18)
    save_nso(nso_path, raw, text, txt_off, txt_fsz_orig)

    # Atualiza cache
    cache_file.write_bytes(open(nso_path, "rb").read())
    cache_meta.write_text(sha_before)
    print(f"[patch] {nso_path.name}: patch aplicado e cache atualizado")
    return True

# ── Ponto de entrada ─────────────────────────────────────────────────────────
exefs = KIT_DIR / "ExeFS"
if not exefs.exists():
    print(f"[patch] ERRO: ExeFS nao encontrado em {exefs}")
    sys.exit(1)

patched_any = False
for nso in sorted(exefs.iterdir()):
    if nso.suffix in (".nso", "") and nso.is_file():
        print(f"\n[patch] === processando {nso.name} ===")
        ok = patch_main(nso)
        if ok:
            patched_any = True

if not patched_any:
    print("[patch] AVISO: nenhum NSO foi patcheado (vtable nao encontrada)")
    print("[patch] O build continua, mas o SIGSEGV do FMallocBinned3 pode persistir")

print("\n[patch] concluido")
PYEOF

          # 4. Compila o IPA via pipeline do nxnative
          chmod +x dm/ios/tools/build_ipa.sh
          bash dm/ios/tools/build_ipa.sh "$RUNNER_TEMP/kit"

      - name: 4. Salvar Cache dos Modulos NSO Reescritos
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /Users/runner/patched_cache
          key: patched-nso-uemalloc-v7-${{ github.run_id }}

      - name: 5. Upload IPA como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: game-thin-ipa-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kit/**/*.ipa
            *.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: 6. Publicar IPA na Release
        if: success()
        run: |
          IPA_FILE=$(find "$RUNNER_TEMP/kit" "$GITHUB_WORKSPACE" -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "Nenhum IPA encontrado para publicar"
            exit 0
          fi
          TAG="build-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" "$IPA_FILE" \
            --title "Build $TAG" \
            --notes "FMallocBinned3 patch v7 — CUT/OBS via vtable detector" \
            --repo "$GITHUB_REPOSITORY" || true
