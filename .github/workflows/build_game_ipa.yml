name: 2. Build Game Thin IPA (from github_kit.zip)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
    paths:
      - '.github/workflows/build_game_ipa.yml'
  workflow_dispatch:
    inputs:
      github_kit_url:
        description: 'Link direto do github_kit.zip na Release'
        required: false
        default: 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip'

permissions:
  contents: write

jobs:
  build_thin_game_ipa:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KIT_URL: ${{ inputs.github_kit_url || 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip' }}
    steps:
      - name: 1. Checkout da Branch SpkIOSzero
        uses: actions/checkout@v4

      - name: 2. Instalar Dependencias (xcodegen + Python packages)
        run: |
          brew install xcodegen || true
          pip3 install --break-system-packages lz4 capstone fonttools backports.zstd

      - name: 3. Baixar github_kit.zip e Compilar Thin IPA Nativo do Jogo
        run: |
          set -x

          # 1. Garante arvore completa do nxnative (sem cp -n que retorna exit 1 no macOS!)
          if [ ! -f "dm/ios/tools/build_ipa.sh" ]; then
            git clone --depth 1 https://github.com/seedds/nxnative.git "$RUNNER_TEMP/nx_up"
            rsync -a --ignore-existing "$RUNNER_TEMP/nx_up/" ./
          fi

          # 2. Baixa o github_kit.zip (via gh release autenticado ou curl)
          mkdir -p "$RUNNER_TEMP/dl"
          echo "Listando Releases disponiveis no repositorio:"
          gh release list --repo "$GITHUB_REPOSITORY" || true

          if gh release download v1.0-kit --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "$RUNNER_TEMP/dl" --clobber; then
            echo "Baixado da Release v1.0-kit via gh CLI!"
          elif gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "$RUNNER_TEMP/dl" --clobber; then
            echo "Baixado da ultima Release via gh CLI!"
          else
            curl -L --fail -o "$RUNNER_TEMP/dl/github_kit.zip" "$KIT_URL"
          fi

          FIRST_ZIP=$(find "$RUNNER_TEMP/dl" -name "*.zip" | head -n 1)
          if [ -z "$FIRST_ZIP" ]; then
            echo "ERRO: Nenhum arquivo .zip encontrado na Release!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/kit"
          unzip -q "$FIRST_ZIP" -d "$RUNNER_TEMP/kit"
          echo "=== Conteudo extraido do github_kit.zip ==="
          find "$RUNNER_TEMP/kit" -maxdepth 3

          # Se o zip tiver subpasta, sobe os arquivos para $RUNNER_TEMP/kit
          if [ ! -d "$RUNNER_TEMP/kit/ExeFS" ]; then
            SUB_EXEFS=$(find "$RUNNER_TEMP/kit" -type d -iname "ExeFS" | head -n 1)
            if [ -n "$SUB_EXEFS" ]; then
              PARENT_DIR=$(dirname "$SUB_EXEFS")
              if [ "$PARENT_DIR" != "$RUNNER_TEMP/kit" ]; then
                mv "$PARENT_DIR"/* "$RUNNER_TEMP/kit/" || true
              fi
            fi
          fi

          # 3. Garante que o Thin IPA leia Documents/romfs no iPhone sem exigir embutir 17 GB no IPA
          python3 - << 'PYEOF'
          from pathlib import Path
          main_m = Path("dm/ios/Sources/main.m")
          if main_m.exists():
              s = main_m.read_text(encoding="utf-8")
              old_marker = 'if ([fm fileExistsAtPath:[documentFolder stringByAppendingPathComponent:@DM_GAME_ROMFS_MARKER]]) return documentFolder;'
              new_marker = old_marker + '\n    if ([fm contentsOfDirectoryAtPath:documentFolder error:nil].count > 0) return documentFolder;'
              if 'contentsOfDirectoryAtPath:documentFolder' not in s:
                  s = s.replace(old_marker, new_marker)
                  main_m.write_text(s, encoding="utf-8")

          bsh = Path("dm/ios/tools/build_ipa.sh")
          if bsh.exists():
              b = bsh.read_text(encoding="utf-8")
              b = b.replace(
                  'python3 "$DM/tools/romfs.py" "$ROMFS" "$MARKER" || die "no RomFS at $ROMFS (missing $MARKER)"',
                  'echo "[Universal Thin IPA] RomFS sera lido de Documents/romfs no iPhone"'
              )
              b = b.replace('"Payload/DmIOS.app/romfs=$ROMFS"', '')
              bsh.write_text(b, encoding="utf-8")
          PYEOF

          # 4. Descobre TitleID e executa o pipeline exato do nxnative
          python3 - << 'PYEOF'
          import os, sys, struct, subprocess
          from pathlib import Path

          rt = Path(os.environ["RUNNER_TEMP"])
          kit = rt / "kit"
          exefs = kit / "ExeFS"
          romfs = kit / "RomFS"
          romfs.mkdir(parents=True, exist_ok=True)

          if not exefs.exists():
              print("ERRO CRITICO: Pasta ExeFS nao encontrada dentro do github_kit.zip!")
              print("Arquivos presentes no kit:", list(kit.rglob("*")))
              sys.exit(1)

          tid_str = "010035F022078000"
          npdm_file = exefs / "main.npdm"
          if npdm_file.exists():
              npdm = npdm_file.read_bytes()
              aci0 = struct.unpack_from("<I", npdm, 0x70)[0]
              tid = struct.unpack_from("<Q", npdm, aci0 + 0x10)[0]
              tid_str = f"{tid:016X}"
          print(f"TitleID detectado: {tid_str}")

          games_dir = Path("dm/games")
          prof_dir = games_dir / tid_str
          if not prof_dir.exists():
              survey_md = rt / "survey.md"
              cmd_survey = [sys.executable, "dm/tools/survey/game_survey.py", str(kit), "-o", str(survey_md)]
              if (kit / "manifest.tsv").exists():
                  cmd_survey += ["--manifest", str(kit / "manifest.tsv")]
              subprocess.run(cmd_survey, check=False)

              sys.path.insert(0, str(games_dir))
              import profile_guess
              prof_dir.mkdir(parents=True, exist_ok=True)
              profile_guess.write_provisional_profile(survey_md, kit, prof_dir)

          print("Arquivos do perfil em dm/games:", list(prof_dir.iterdir()))

          # 1. Patcheia NSOs (ExeFS)
          patched = rt / "patched"
          patched.mkdir(parents=True, exist_ok=True)
          subprocess.run([sys.executable, "dm/tools/patch_nso.py", str(exefs), str(patched), "--game", tid_str], check=True)

          # 2. Compila Shaders Metal (.dmsh)
          shader_pkg = rt / "shader_pkg"
          subprocess.run([sys.executable, "dm/gfx/tools/shader_split.py", str(romfs), str(shader_pkg), "--game", tid_str], check=False)
          if shader_pkg.exists():
              env = os.environ.copy()
              env["IOSOUT"] = "1"
              env["ALLOW_OTHER_METAL"] = "1"
              subprocess.run([sys.executable, "dm/gfx/tools/dmsh_build.py", str(shader_pkg), "--game", tid_str], env=env, check=False)

          # 3. Empacota o Thin IPA
          cmd = [
              "bash", "dm/ios/tools/build_ipa.sh",
              "--game", tid_str,
              "--patched", str(patched),
              "--romfs", str(romfs),
              "-o", str(rt / f"{tid_str}_Thin.ipa")
          ]
          if (kit / "control.nacp").exists():
              cmd += ["--nacp", str(kit / "control.nacp")]
          if (kit / "icon.jpg").exists():
              cmd += ["--icon", str(kit / "icon.jpg")]

          subprocess.run(cmd, check=True)
          PYEOF

          ls -lh "$RUNNER_TEMP"/*_Thin.ipa

      - name: 4. Upload do IPA do Jogo nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Game-Thin-IPA-Artifact
          path: ${{ runner.temp }}/*_Thin.ipa
