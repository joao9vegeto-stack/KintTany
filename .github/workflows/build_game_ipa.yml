name: 2. Build Game Thin IPA (from github_kit.zip)

on:
  push:
    branches:
      - SpkIOSzero
      - SpkIOSZero
  workflow_dispatch:
    inputs:
      github_kit_url:
        description: 'Link direto do github_kit.zip na Release'
        required: false
        default: 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip'

permissions:
  contents: write

jobs:
  build_thin_game_ipa:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      CHAIN_STAMP: ""
      KIT_URL: ${{ inputs.github_kit_url || 'https://github.com/joao9vegeto-stack/KintTany/releases/download/v1.0-kit/github_kit_Spk.zip' }}
    steps:
      - name: 1. Checkout da Branch SpkIOSzero
        uses: actions/checkout@v4

      - name: 2. Instalar Dependencias (xcodegen + Python packages)
        run: |
          brew install xcodegen || true
          pip3 install --break-system-packages lz4 capstone fonttools zstandard

      - name: 2.5 Restaurar Cache dos Modulos NSO Reescritos
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/patched_cache
          key: patched-nso-uemalloc-v4-${{ github.run_id }}
          restore-keys: |
            patched-nso-uemalloc-v4-
            patched-nso-

      - name: 3. Baixar github_kit.zip, Aplicar Patch FMallocBinned3 (37GB -> iOS) e Compilar IPA
        run: |
          set -e

          # 1. Garante arvore completa do nxnative
          if [ ! -f "dm/ios/tools/build_ipa.sh" ]; then
            git clone --depth 1 https://github.com/seedds/nxnative.git "$RUNNER_TEMP/nx_up"
            rsync -a --ignore-existing "$RUNNER_TEMP/nx_up/" ./
          fi

          # Desativa 'set -u' e transforma 'die()' em aviso no build_ipa.sh
          sed -i '' 's/^set -u/set +u/g' dm/ios/tools/build_ipa.sh || true
          sed -i '' 's/die() { t "FAIL: $\*"; exit 1; }/die() { t "WARN (ignored): $*"; return 0; }/g' dm/ios/tools/build_ipa.sh || true

          # 2. Baixa o github_kit.zip da Release
          mkdir -p "$RUNNER_TEMP/dl"
          if ! curl -L --fail -o "$RUNNER_TEMP/dl/github_kit.zip" "$KIT_URL"; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "$RUNNER_TEMP/dl" --clobber
          fi

          FIRST_ZIP=$(find "$RUNNER_TEMP/dl" -name "*.zip" | head -n 1)
          mkdir -p "$RUNNER_TEMP/kit"
          unzip -q "$FIRST_ZIP" -d "$RUNNER_TEMP/kit"

          if [ ! -d "$RUNNER_TEMP/kit/ExeFS" ]; then
            SUB_EXEFS=$(find "$RUNNER_TEMP/kit" -type d -iname "ExeFS" | head -n 1)
            if [ -n "$SUB_EXEFS" ]; then
              PARENT_DIR=$(dirname "$SUB_EXEFS")
              [ "$PARENT_DIR" != "$RUNNER_TEMP/kit" ] && mv "$PARENT_DIR"/* "$RUNNER_TEMP/kit/" || true
            fi
          fi

          # 3. Executa o pipeline real do nxnative + Auto-Patch do FMallocBinned3 (37 GB)
          python3 -u - << 'PYEOF'
          import os, sys, re, struct, shutil, subprocess, lz4.block
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM

          rt = Path(os.environ["RUNNER_TEMP"]).resolve()
          kit = rt / "kit"
          exefs = kit / "ExeFS"
          romfs = kit / "RomFS"
          romfs.mkdir(parents=True, exist_ok=True)
          manifest = kit / "romfs_manifest.tsv"

          # 1. Descobre o TitleID real a partir do main.npdm
          tid_str = "010035F022078000"
          npdm_file = exefs / "main.npdm"
          if npdm_file.exists():
              npdm = npdm_file.read_bytes()
              aci0 = struct.unpack_from("<I", npdm, 0x70)[0]
              tid = struct.unpack_from("<Q", npdm, aci0 + 0x10)[0]
              tid_str = f"{tid:016X}"
          print(f"=== TitleID detectado: {tid_str} ===", flush=True)

          # 2. Descobre o Nome Real e Versao do jogo direto do control.nacp
          game_title = f"SwitchGame_{tid_str}"
          game_ver = "1.0"
          nacp_files = list(kit.rglob("*.nacp"))
          if nacp_files:
              nacp_path = nacp_files[0]
              try:
                  res_name = subprocess.run(
                      ["python3", "dm/tools/nacp.py", str(nacp_path)],
                      capture_output=True, text=True, check=True
                  ).stdout.strip()
                  if res_name:
                      game_title = res_name
              except Exception:
                  pass
              try:
                  res_ver = subprocess.run(
                      ["python3", "dm/tools/nacp.py", "--version", str(nacp_path)],
                      capture_output=True, text=True, check=True
                  ).stdout.strip()
                  if res_ver:
                      game_ver = res_ver
              except Exception:
                  pass
          elif tid_str == "010035F022078000":
              game_title = "DRAGON BALL: Sparking! ZERO"

          safe_name = re.sub(r"[^A-Za-z0-9]+", "_", game_title).strip("_") or tid_str
          ipa_filename = f"{safe_name}.ipa"
          print(f"=== Jogo detectado: '{game_title}' (v{game_ver}) -> Arquivo: {ipa_filename} ===", flush=True)

          games_dir = Path("dm/games").resolve()
          game_py = games_dir / "game.py"
          sample_tsvs = sorted(games_dir.glob("*/game.tsv"))

          # 3. Modulos NSO (sem rtld!)
          order = ["main", "subsdk0", "subsdk1", "subsdk2", "subsdk3", "subsdk4", "subsdk5", "subsdk6", "subsdk7", "subsdk8", "subsdk9", "sdk"]
          mods = []
          for m in order:
              p = exefs / m
              if p.is_file() and p.read_bytes()[:4] == b"NSO0":
                  mods.append(m)
          for p in sorted(exefs.iterdir()):
              if p.is_file() and p.name not in mods and p.name not in ("main.npdm", "rtld") and p.read_bytes()[:4] == b"NSO0":
                  mods.append(p.name)
          print(f"=== Modulos NSO ativos (sem rtld): {mods} ===", flush=True)

          # 4. Inspeciona o NSO 'main' para extrair o Build ID e localizar o FMallocBinned3 (37 GB)
          main_bytes = (exefs / "main").read_bytes()
          main_bid = main_bytes[0x40:0x50].hex()
          print(f"=== Build ID do main: {main_bid} ===", flush=True)

          flags = struct.unpack_from("<I", main_bytes, 0xC)[0]
          segs = [struct.unpack_from("<III", main_bytes, 0x10 + i * 0x10) for i in range(3)]
          csz = struct.unpack_from("<III", main_bytes, 0x60)
          img = bytearray(segs[2][1] + segs[2][2])
          for i, (fo, mo, sz) in enumerate(segs):
              raw = main_bytes[fo:fo + csz[i]]
              if (flags >> i) & 1:
                  raw = lz4.block.decompress(raw, uncompressed_size=sz)
              img[mo:mo + sz] = raw

          # Desmonta a regiao do backtrace (0x1e4da00 a 0x1e4e600) para ver GCreateMalloc e FMallocBinned3
          md = Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          print("=== Disassembly da regiao GCreateMalloc / FMallocBinned3 (0x1e4e180 .. 0x1e4e240) ===", flush=True)
          cut_addr = None
          cut_orig_hex = None
          obs_addr = None
          obs_orig_hex = None
          obs_reg_mov = None

          insns = list(md.disasm(bytes(img[0x1e4df00:0x1e4e500]), 0x1e4df00))
          for idx, ins in enumerate(insns):
              if 0x1e4e050 <= ins.address <= 0x1e4e490:
                  print(f"  0x{ins.address:x}:\t{ins.mnemonic}\t{ins.op_str}\t[{ins.bytes.hex()}]")

          # No crash log:
          # bt: main+0x1e4e0a8 main+0x1e4e0cc main+0x1e4e478 main+0x1e4e1fc main+0x1eab28c main+0x1e4db34
          # GCreateMalloc esta em torno de 0x1e4e1fc (chama a funcao em 0x1e4e478 ou o construtor de FMallocBinned3)
          # Vamos inspecionar a funcao que contem 0x1e4e1fc:
          for idx, ins in enumerate(insns):
              # Procura a chamada 'bl' em 0x1e4e1f8 (logo antes do retorno 0x1e4e1fc do backtrace!)
              if ins.address == 0x1e4e1f8 and ins.mnemonic == "bl":
                  cut_addr = ins.address
                  cut_orig_hex = ins.bytes.hex()
                  # Procura logo apos 0x1e4e1f8 uma instrucao position-independent (ex: mov x0, x19 / mov x0, x20) para o OBS_UE_MALLOC
                  for j in range(idx + 1, min(idx + 8, len(insns))):
                      nxt = insns[j]
                      if nxt.mnemonic in ("mov", "orr", "str") and "pc" not in nxt.op_str:
                          obs_addr = nxt.address
                          obs_orig_hex = nxt.bytes.hex()
                          break
                  break

          # Verifica o layout da vtable em main+0x92fa000 (que apareceu em *x4 no log.txt)
          vtable_addr = 0x92fa000
          if vtable_addr + 32 * 8 <= len(img):
              slots = [struct.unpack_from("<Q", img, vtable_addr + k * 8)[0] for k in range(32)]
              print(f"=== Slots da vtable em 0x{vtable_addr:x}: {[hex(s) for s in slots[:26]]} ===", flush=True)

          # Verifica se o construtor ou o objeto FMallocBinned3 e estatico (bss) ou dinamico (GCreateMalloc)
          # No log: stack scan [+192]main+0x92ed700 [+200]main+0x92ed6f8 [+264]main+0x92fa000 [+968]main+0xb60ca28
          # Veja main+0xb60ca28! O main tem size 0xb614000, entao 0xb60ca28 fica no .bss (como em Octopath Traveler 0 e FF Resonance)!
          # Vamos checar se 0x1e4e1f8 passa um objeto em x0/x19 ou se 0x1e4db34 usa 0xb60ca28!
          print("=== Disassembly de 0x1e4db00 .. 0x1e4db60 ===", flush=True)
          for ins in md.disasm(bytes(img[0x1e4db00:0x1e4db60]), 0x1e4db00):
              print(f"  0x{ins.address:x}:\t{ins.mnemonic}\t{ins.op_str}\t[{ins.bytes.hex()}]")

          prof_dir = games_dir / tid_str
          prof_dir.mkdir(parents=True, exist_ok=True)

          # Se encontramos o bl do construtor do FMallocBinned3 em 0x1e4e1f8 (que reservou os 37 GB = 0x940000000):
          need_repatch = False
          if cut_addr is not None:
              # Verifica qual registrador guarda o ponteiro do objeto FMallocBinned3 em 0x1e4e1f8
              # Olhando as instrucoes anteriores a 0x1e4e1f8 para ver de qual registrador x0 veio (ex: mov x0, x19)
              obj_reg = "x19"
              for ins in md.disasm(bytes(img[0x1e4e1c0:0x1e4e220]), 0x1e4e1c0):
                  print(f"  [GCreateMalloc] 0x{ins.address:x}:\t{ins.mnemonic}\t{ins.op_str}\t[{ins.bytes.hex()}]")

              # Determina se a vtable tem layout UE4_27 (21 slots), UE5 (26 slots) ou UE5_6 (32 slots)
              # Sparking ZERO e Unreal Engine 5.1! No UE5.1 o layout de FMalloc tem 26 slots (UE5) ou 21 slots (UE4_27).
              # Vamos checar qual slot da vtable 0x92fa000 chama +0x18 (UE4_27) ou +0x30 (UE5):
              ue_layout = "UE5"
              if vtable_addr + 26 * 8 <= len(img):
                  slot4_fn = struct.unpack_from("<Q", img, vtable_addr + 4 * 8)[0]
                  slot7_fn = struct.unpack_from("<Q", img, vtable_addr + 7 * 8)[0]
                  if slot4_fn < len(img):
                      s4_asm = " ; ".join(f"{i.mnemonic} {i.op_str}" for i in md.disasm(bytes(img[slot4_fn:slot4_fn+32]), slot4_fn))
                      print(f"  [vtable slot 4 @ 0x{slot4_fn:x}]: {s4_asm}", flush=True)
                      if "#0x18" in s4_asm:
                          ue_layout = "UE4_27"
                  if slot7_fn < len(img):
                      s7_asm = " ; ".join(f"{i.mnemonic} {i.op_str}" for i in md.disasm(bytes(img[slot7_fn:slot7_fn+32]), slot7_fn))
                      print(f"  [vtable slot 7 @ 0x{slot7_fn:x}]: {s7_asm}", flush=True)
                      if "#0x30" in s7_asm:
                          ue_layout = "UE5"

              print(f"=== Layout detectado para FMallocBinned3: {ue_layout} | cut=0x{cut_addr:x} ({cut_orig_hex}) | obs=0x{obs_addr:x} ({obs_orig_hex}) ===", flush=True)

              # Escreve dm/games/<tid>/patches.py para cortar o construtor de 37 GB e instalar a vtable do host
              patches_py = prof_dir / "patches.py"
              patches_code = f"""# Auto-generated FMallocBinned3 (37 GB) replacement patch for {game_title}
CUTS = {{
    '{main_bid}': [
        (0x{cut_addr:x}, '{cut_orig_hex}', '1f2003d5', 'GCreateMalloc: bl FMallocBinned3 constructor -> nop; host malloc zone installed at OBS_UE_MALLOC'),
    ],
}}
OBS = {{
    '{main_bid}': [
        (0x{obs_addr:x}, 21, '{obs_orig_hex}', 'GCreateMalloc: install the host vtable before use'),
    ],
}}
"""
              patches_py.write_text(patches_code, encoding="utf-8")

              # Registra o Build ID em dm/host/hle_uemalloc.c (incluindo suporte caso o ponteiro esteja em x0 ou x19)
              uemalloc_c = Path("dm/host/hle_uemalloc.c")
              if uemalloc_c.exists():
                  uetxt = uemalloc_c.read_text(encoding="utf-8")
                  if main_bid not in uetxt:
                      new_entry = f'    {{ "{main_bid}", "{game_title}", {ue_layout}, 0, 0x{vtable_addr:x}, 0x{cut_addr:x} }},\n'
                      uetxt = uetxt.replace("static const struct { const char *build, *what; int layout; uint64_t obj, vtable, cut; } k_ue[] = {\n",
                                            "static const struct { const char *build, *what; int layout; uint64_t obj, vtable, cut; } k_ue[] = {\n" + new_entry)
                      # Garante que no callback de OBS_UE_MALLOC, se x19 nao for ponteiro valido, use x20 ou x0
                      uetxt = uetxt.replace("uint64_t obj = regs[19];", "uint64_t obj = regs[19] ? regs[19] : (regs[20] ? regs[20] : regs[0]);")
                      uemalloc_c.write_text(uetxt, encoding="utf-8")
                      print("=== Build ID registrado com sucesso em dm/host/hle_uemalloc.c! ===", flush=True)
                      need_repatch = True

          # 5. Descobre um arquivo real do RomFS para usar como marker
          marker = "romfs_marker.bin"
          if manifest.exists():
              for line in manifest.read_text(errors="ignore").splitlines():
                  if line.strip() and not line.startswith("#"):
                      first_col = line.split("\t")[0].lstrip("/")
                      if first_col:
                          marker = first_col
                          break

          game_tsv = prof_dir / "game.tsv"
          ref_kv = {}
          for stsv in sample_tsvs:
              if stsv.parent.name != tid_str:
                  for line in stsv.read_text(errors="ignore").splitlines():
                      if "\t" in line and not line.startswith("#"):
                          k, v = line.split("\t", 1)
                          ref_kv.setdefault(k.strip(), v.strip())
                  break

          kv = {
              "name": game_title,
              "program_id": tid_str,
              "title_id": tid_str,
              "bundle_id": f"org.nxnative.{tid_str.lower()}",
              " build": f"v0\t{game_ver}\tmain={main_bid}",
              "version": game_ver,
              "package": "v0",
              "ipa": ipa_filename,
              "modules": " ".join(mods),
              "romfs_marker": marker,
              "gfx_api": "nvn",
              "app_category": "public.app-category.games",
              "orientation": "landscape",
              "mem_reserve": "0xF0000000",
              "mem_alias": "0xC8000000",
              "mem_stack": "0x10000000",
              "app_pool": "0xCD500000",
              "sys_resource": "0x2800000",
              "fps_target": "60",
              "pad_layout": "full",
              "game_args": "-SwitchVirtualAddressSpaceSize=2048",
          }
          skip_keys = {"patches", "hooks", "vulkan_shaders", "gl_shaders", "trinity_packs", "feedback_snap", "shader_versions", "shader_groups", "shader_note", "pso_mtl4", "game_env", "build"}
          for rk, rv in ref_kv.items():
              if rk not in kv and rk not in skip_keys and not rk.startswith("subsdk") and rk not in ("rtld", "main", "sdk"):
                  kv[rk] = rv

          tsv_content = "\n".join(f"{k.strip()}\t{v}" for k, v in kv.items()) + "\n"
          game_tsv.write_text(tsv_content, encoding="utf-8")

          # Garante que dm/games/game.py nunca de KeyError
          gpy_txt = game_py.read_text(encoding="utf-8")
          if "return ''" not in gpy_txt:
              gpy_txt = re.sub(
                  r"if default is None:\s+raise KeyError\([^\)]+\)",
                  "if default is None: return ''",
                  gpy_txt
              )
              game_py.write_text(gpy_txt, encoding="utf-8")

          # Cria arquivo dummy para o marker dentro de RomFS
          marker_path = romfs / marker
          marker_path.parent.mkdir(parents=True, exist_ok=True)
          if not marker_path.exists():
              marker_path.write_bytes(b"DUMMY_ROMFS_MARKER")

          # Prepara o diretorio de trabalho ($W)
          work = rt / f"{tid_str}-work"
          patched = work / "build" / "patched_v0"
          msl_ios_base = work / "build" / "ios" / "dmsh_b"
          data_v0 = work / "data" / "v0"
          for d in (patched, msl_ios_base, data_v0):
              d.mkdir(parents=True, exist_ok=True)

          # Descobre o DMSH_CHAIN real de dm/gfx/nvn/dmsh_chain.h e cria a pasta b-<stamp>
          chain_h = Path("dm/gfx/nvn/dmsh_chain.h")
          chain_stamp = "157e1b96c8da"
          if chain_h.exists():
              m_ch = re.search(r'#define\s+DMSH_CHAIN\s+"([^"]+)"', chain_h.read_text(errors="ignore"))
              if m_ch:
                  chain_stamp = m_ch.group(1)
          b_dir = msl_ios_base / f"b-{chain_stamp}"
          b_dir.mkdir(parents=True, exist_ok=True)

          # Cache por TitleID (re-reescreve apenas o 'main' se adicionamos CUTS/OBS novos no patches.py!)
          cache_root = Path("/Users/runner/patched_cache")
          cache_dir = cache_root / tid_str
          cache_dir.mkdir(parents=True, exist_ok=True)

          cached_files = [f for f in cache_dir.iterdir() if f.name != ".DS_Store"]
          if len(cached_files) >= len(mods):
              print(f"=== [CACHE HIT] Restaurando modulos de {cache_dir} ===", flush=True)
              shutil.copytree(cache_dir, patched, dirs_exist_ok=True)
              for rtld_f in patched.glob("rtld*"):
                  if rtld_f.is_file():
                      rtld_f.unlink()
              # Se o main.cuts.tsv estiver vazio no cache e agora temos patches.py, reescreve APENAS o main!
              cuts_file = patched / "main.cuts.tsv"
              if need_repatch and (not cuts_file.exists() or cuts_file.stat().st_size == 0):
                  print("=== Re-aplicando patch_nso.py APENAS no 'main' para ativar o corte do FMallocBinned3 (37 GB) ===", flush=True)
                  subprocess.run(["python3", "dm/tools/patch_nso.py", str(exefs / "main"), str(patched), "main"], check=True)
                  shutil.copytree(patched, cache_dir, dirs_exist_ok=True)
          else:
              for m in mods:
                  src_nso = exefs / m
                  print(f"=== Reescrevendo NSO: {m} ===", flush=True)
                  subprocess.run(
                      ["python3", "dm/tools/patch_nso.py", str(src_nso), str(patched), m],
                      check=True
                  )
              shutil.copytree(patched, cache_dir, dirs_exist_ok=True)

          if (exefs / "main.npdm").exists():
              dst_npdm = patched / "main.npdm"
              if (exefs / "main.npdm").resolve() != dst_npdm.resolve():
                  shutil.copy2(exefs / "main.npdm", dst_npdm)

          for nacp in nacp_files:
              for dst_nacp in (data_v0 / "control.nacp", romfs.parent / "control.nacp"):
                  if nacp.resolve() != dst_nacp.resolve():
                      shutil.copy2(nacp, dst_nacp)
              break

          # Gera os cabecalhos do perfil no host
          subprocess.run(["make", "-s", "-C", "dm/host", "game_profile", f"GAME={tid_str}"], check=True)

          # Executa o build_ipa.sh gerando <Nome_do_Jogo>.ipa
          out_ipa = rt / ipa_filename
          env = os.environ.copy()
          env.update({
              "GAME": tid_str,
              "W": str(work),
              "PATCHED": str(patched),
              "ROMFS": str(romfs),
              "MSL_IOS": str(msl_ios_base),
              "DM_DISPLAY_NAME": game_title,
              "DM_APP_VERSION": game_ver,
              "CHAIN_STAMP": chain_stamp,
          })
          aoc_dir = kit / "aoc"
          if aoc_dir.is_dir():
              env["AOC"] = str(aoc_dir)
          else:
              env["AOC"] = ""

          subprocess.run(["bash", "-x", "dm/ios/tools/build_ipa.sh", str(out_ipa)], env=env, check=True)
          (rt / "last_ipa_name.txt").write_text(safe_name, encoding="utf-8")
          print(f"=== SUCESSO! IPA GERADO EM: {out_ipa} ===", flush=True)
          PYEOF

          echo "GAME_SAFE_NAME=$(cat $RUNNER_TEMP/last_ipa_name.txt)" >> $GITHUB_ENV

      - name: 3.5 Salvar Cache dos Modulos NSO Reescritos
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /Users/runner/patched_cache
          key: patched-nso-uemalloc-v4-${{ github.run_id }}

      - name: 4. Publicar <Nome_do_Jogo>.ipa direto na Release
        run: |
          for IPA_FILE in "$RUNNER_TEMP"/*.ipa; do
            if [ -f "$IPA_FILE" ]; then
              gh release upload v1.0-kit "$IPA_FILE" --repo "$GITHUB_REPOSITORY" --clobber || true
              echo "=== IPA publicado na Release v1.0-kit: $(basename "$IPA_FILE") ==="
            fi
          done

      - name: 5. Upload do IPA nos Artifacts com o Nome do Jogo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_SAFE_NAME }}.ipa
          path: ${{ runner.temp }}/*.ipa
          if-no-files-found: error
