name: KaKaRoTiOS · validate repaired Unreal memory hooks

on:
  push:
    branches:
      - KaKaRoTiOS
    paths:
      - scripts/audit_kakarot_memory.py
      - scripts/patch_kakarot_ue_allocator.py
      - scripts/validate_kakarot_memory_fix.py

permissions:
  contents: read

concurrency:
  group: kakarotios-memory-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-existing-kakarot-workspace:
    if: github.ref == 'refs/heads/KaKaRoTiOS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout KaKaRoTiOS only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install memory-rewrite validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install 'capstone>=5,<6' lz4 google-api-python-client google-auth

      - name: Sync exact NX2Apple / NXNative engine pin
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1-rc2 https://github.com/LNPANDY/NX2Apple.git "$RUNNER_TEMP/NX2Apple"
          cd "$RUNNER_TEMP/NX2Apple"
          python tools/engine.py sync
          test "$(cat .upstream-ref)" = "81906931262fb25d774cce8bca2db8926439e5a2"

      - name: Patch and rewrite Kakarot main; validate both Unreal hooks
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_kakarot_memory_fix.py \
            --engine-root "$RUNNER_TEMP/NX2Apple/engine" \
            --handoff "$GITHUB_WORKSPACE/handoff.json" \
            --destination "$RUNNER_TEMP/kakarot-memory-audit"

      - name: Validate production Kakarot build integration
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_kakarot_shared.py scripts/patch_kakarot_ue_allocator.py scripts/validate_kakarot_memory_fix.py
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import build_kakarot_shared as build

          source = Path("scripts/build_kakarot_shared.py").read_text(encoding="utf-8")
          for required in (
              "apply_kakarot_unreal_memory_fix(",
              "KAKAROT_ALLOCATOR_SLOT = 17",
              "OBS_UE_MALLOC_verified",
              "OBS_UE_REGION_verified",
              "sdk_region_cuts",
              '"unreal_memory_fix":',
          ):
              assert required in source, f"production builder is missing {required}"

          with tempfile.TemporaryDirectory(prefix="kakarot-profile-contract-") as temp:
              profile = Path(temp) / "game.tsv"
              profile.write_text(
                  "mem_reserve\t0x1028000000\n"
                  "mem_alias\t0x1000000000\n"
                  "mem_stack\t0x10000000\n"
                  "app_pool\t0xCD500000\n"
                  "sys_resource\t0x1000000\n",
                  encoding="utf-8",
              )
              build.update_profile_values(profile, build.KAKAROT_IPHONE_MEMORY)
              rows = profile.read_text(encoding="utf-8").splitlines()
              for key, value in build.KAKAROT_IPHONE_MEMORY.items():
                  assert rows.count(f"{key}\t{value}") == 1
              assert "sys_resource\t0x1000000" in rows
          print("KaKaRoTiOS production memory-fix integration contract: OK")
          PY

