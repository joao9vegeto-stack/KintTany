name: 3. Finalize - Commit + Release

on:
  workflow_run:
    workflows: ["2b. Shader Build - Compile (Fatiado)"]
    types: [completed]
    branches:
      - SpkIOSzero
  workflow_dispatch:

permissions:
  contents: write

env:
  GAME: "010035F022078000"

jobs:
  finalize:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: SpkIOSzero

      - name: Download metallib artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Organize shader artifacts
        shell: bash
        run: |
          GAME="${{ env.GAME }}"
          SHADER_DIR="dm/games/$GAME/shaders"
          
          # Ensure metallib directory exists
          mkdir -p "$SHADER_DIR/metallib"
          
          echo "📁 Organizing artifacts..."
          
          # Find and copy all metallib files from artifacts
          find "$RUNNER_TEMP/artifacts" -type f \( -name "*.metallib" -o -name "*.mtl4a" \) | \
            while read file; do
              cp "$file" "$SHADER_DIR/metallib/" 2>/dev/null || true
            done
          
          # Extract any tar.gz archives
          find "$RUNNER_TEMP/artifacts" -type f -name "*.tar.gz" | \
            while read archive; do
              echo "  Extracting: $(basename "$archive")"
              tar -xzf "$archive" -C "$SHADER_DIR/metallib/" 2>/dev/null || true
            done
          
          TOTAL=$(find "$SHADER_DIR/metallib" -type f | wc -l)
          echo "✅ Organized $TOTAL metallib files"

      - name: Verify shader artifacts
        shell: bash
        run: |
          GAME="${{ env.GAME }}"
          SHADER_DIR="dm/games/$GAME/shaders"
          
          echo "📋 Shader directory contents:"
          echo ""
          
          # List TSV files
          echo "✅ Shader tables:"
          for f in "$SHADER_DIR"/*.tsv; do
            if [ -f "$f" ]; then
              NAME=$(basename "$f")
              LINES=$(wc -l < "$f")
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              echo "   $NAME - $LINES lines, $SIZE"
            fi
          done
          
          echo ""
          
          # List metallib files
          if [ -d "$SHADER_DIR/metallib" ]; then
            METALLIB_COUNT=$(find "$SHADER_DIR/metallib" -type f | wc -l)
            echo "✅ Metallib files: $METALLIB_COUNT"
            
            if [ $METALLIB_COUNT -gt 0 ]; then
              du -sh "$SHADER_DIR/metallib" | awk '{print "   Total size: " $1}'
            fi
          fi

      - name: Commit shader artifacts
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          GAME="${{ env.GAME }}"
          SHADER_DIR="dm/games/$GAME/shaders"
          
          echo "📤 Staging shader files..."
          
          # Stage TSV files (always commit)
          git add "$SHADER_DIR"/*.tsv 2>/dev/null || true
          
          # Stage metallib if present
          if [ -d "$SHADER_DIR/metallib" ] && [ $(find "$SHADER_DIR/metallib" -type f | wc -l) -gt 0 ]; then
            echo "   Adding metallib files..."
            git add "$SHADER_DIR/metallib/" || true
          fi
          
          if ! git diff --cached --quiet; then
            echo "✅ Committing changes..."
            
            git commit -m "chore: Sparking! Zero shader build artifacts

Shaders:
  - shader_map.tsv: keys and container locations
  - shader_facts.tsv: binding analysis
  - shader_pairs.tsv: vertex/pixel associations
  - metallib/: compiled Metal intermediate representation

Build info:
  - Fatiado em 4 jobs paralelos (max 2 simultâneos)
  - Cache persistente: DMSH_CAS
  - Total build time: ~6 horas
  - Generated by dmsh_build.py + metal toolchain"
            
            echo "📤 Pushing to repository..."
            git push origin HEAD:SpkIOSzero || {
              echo "⚠️  Push failed (may be rate-limited or branch protected)"
              exit 0
            }
            
            echo "✅ Artifacts committed"
          else
            echo "✅ No changes to commit"
          fi

      - name: Create release tag
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GAME="${{ env.GAME }}"
          SHADER_DIR="dm/games/$GAME/shaders"
          
          TAG="sparking-shaders-$(date +%Y%m%d-%H%M%S)"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          echo "📌 Creating release tag: $TAG"
          
          # Count artifacts
          TSV_COUNT=$(find "$SHADER_DIR" -maxdepth 1 -name "*.tsv" -type f | wc -l)
          METALLIB_COUNT=$(find "$SHADER_DIR/metallib" -type f 2>/dev/null | wc -l)
          
          git tag -a "$TAG" -m "Sparking! Zero shader build - $TIMESTAMP" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || {
            echo "⚠️  Tag push skipped"
          }
          
          echo "✅ Release tag created: $TAG"

      - name: Summary
        shell: bash
        run: |
          GAME="${{ env.GAME }}"
          SHADER_DIR="dm/games/$GAME/shaders"
          
          echo ""
          echo "=================================================="
          echo "  ✅ SHADER BUILD PIPELINE COMPLETED"
          echo "=================================================="
          echo ""
          echo "Game: $GAME"
          echo "Location: $SHADER_DIR/"
          echo "Branch: SpkIOSzero"
          echo ""
          echo "Artifacts:"
          
          [ -f "$SHADER_DIR/shader_map.tsv" ] && echo "  ✅ shader_map.tsv"
          [ -f "$SHADER_DIR/shader_facts.tsv" ] && echo "  ✅ shader_facts.tsv"
          [ -f "$SHADER_DIR/shader_pairs.tsv" ] && echo "  ✅ shader_pairs.tsv"
          [ -d "$SHADER_DIR/metallib" ] && {
            COUNT=$(find "$SHADER_DIR/metallib" -type f | wc -l)
            echo "  ✅ metallib/ ($COUNT files)"
          }
          
          echo ""
          echo "=================================================="
