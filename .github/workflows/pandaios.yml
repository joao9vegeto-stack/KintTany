name: Panda iOS Build

on:
  push:
    branches:
      - PandaiOS
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pandaios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout PandaiOS and pinned engine sources
        uses: actions/checkout@v4
        with:
          ref: PandaiOS
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Moonlight GameStream core
        run: |
          set -euo pipefail
          CORE_PROJECT="ThirdParty/moonlight-ios/moonlight-common/moonlight-common.xcodeproj"
          xcodebuild \
            -project "$CORE_PROJECT" \
            -scheme moonlight-common \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/MoonlightCoreDerived \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -f "build/MoonlightCoreDerived/Build/Products/Release-iphoneos/libmoonlight-common.a"

      - name: Generate Panda Xcode project
        run: xcodegen generate

      - name: Build Panda iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project PandaiOS.xcodeproj \
            -scheme PandaiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Panda Cloud.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/PandaCloud-iOS-unsigned.ipa
          test -s build/PandaCloud-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PandaCloud-iOS-unsigned
          path: build/PandaCloud-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
