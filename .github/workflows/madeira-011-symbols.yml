name: Madeira 0.1.1 Symbol Probe

on:
  push:
    branches: [madeira011-atomicfix]
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Download official Madeira 0.1.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/willfaust/Madeira/releases/download/v0.1.1/Madeira-0.1.1.ipa \
            -o Madeira.ipa
          mkdir unpack
          ditto -x -k Madeira.ipa unpack
          DYLIB="unpack/Payload/Madeira.app/Madeira.debug.dylib"
          xcrun nm -an "$DYLIB" | grep -E 'ios_emulate_store(_rel)?$|ios_jit_anon_alias_lookup$|bus_handler$' | tee symbols.txt
          xcrun llvm-objdump -d --start-address=0x83ae40 --stop-address=0x83b380 "$DYLIB" | tee bus.txt
          xcrun llvm-objdump -d --start-address=0x841d00 --stop-address=0x842c00 "$DYLIB" | tee store.txt
          xcrun nm -an "$DYLIB" | awk '$1 >= "0000000000841c00" && $1 <= "0000000000843000" {print}' | tee near-store-symbols.txt
          python3 - "$DYLIB" <<'PY' | tee caves.txt
          from pathlib import Path
          import struct, sys
          b=Path(sys.argv[1]).read_bytes()
          nop=struct.pack("<I",0xd503201f)
          i=0
          while i+4<=len(b):
              if b[i:i+4]==nop:
                  j=i
                  while j+4<=len(b) and b[j:j+4]==nop: j+=4
                  n=(j-i)//4
                  if n>=20 and i<0x2200000:
                      print(f"0x{i:x} words={n} bytes={n*4}")
                  i=j
              else:
                  i+=4
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: |
            symbols.txt
            bus.txt
            caves.txt
            store.txt
            near-store-symbols.txt
