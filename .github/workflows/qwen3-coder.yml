name: Qwen3-Coder Quick Start

on:
  push:
    branches:
      - qwen3-coder
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quickstart.txt

      - name: Install Quick Start dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quickstart.txt

      - name: Validate Quick Start
        run: |
          python -m py_compile qwen3_coder_quickstart.py
          python qwen3_coder_quickstart.py --check
