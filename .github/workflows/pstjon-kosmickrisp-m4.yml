          assert 'M6.8.8 GLOBAL_RECLAIM' in (root/'Emu/RSX/VK/VKGSRender.cpp').read_text()
          assert 'M6.8.2 NPUA_ASCENSION_FIDELITY' in (root/'Emu/System.cpp').read_text()
          assert 'force_store |= render->color_att_count > 0;' in Path('mesa-src/src/kosmickrisp/vulkan/kk_cmd_buffer.c').read_text()
          print('M6.9.2: run114 SPU strategy preserved, both original ARM64 waits lightly sampled, no title-specific code')
          PY_M692
          git -C rpcs3-src diff --check
