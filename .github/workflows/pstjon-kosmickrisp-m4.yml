          new='''if (g_cfg.video.shadermode == shader_mode::async_with_interpreter)
          '''
          if s.count(old)!=1: raise SystemExit("M5.14 interpreter preload rollback anchor mismatch")
          s=s.replace(old,new,1)
          p.write_text(s)
          
          sys=Path("rpcs3-src/rpcs3/Emu/System.cpp").read_text()
          vk=Path("rpcs3-src/rpcs3/Emu/RSX/VK/VKGSRender.cpp").read_text()
          assert 'shadermode.set(shader_mode::interpreter_only)' not in sys
          assert 'shadermode.set(shader_mode::async_with_interpreter)' in sys
          assert 'PsTJon M5.14 regression rollback:' in sys
          assert '(g_cfg.video.shadermode == shader_mode::interpreter_only && Emu.GetTitleID()' not in vk
          assert 'PsTJon M5.12 program selection' in vk
          assert 'm_shader_interpreter.get(' in vk
          assert 'compile_async = true;' in vk
          assert 'g_cfg.video.read_color_buffers.set(true)' in sys
          assert 'g_cfg.video.write_color_buffers.set(true)' in sys
          assert 'g_cfg.video.strict_rendering_mode.set(true)' in sys
          assert 'm_precise_get_publishing = Emu.GetTitleID()' in Path("rpcs3-src/rpcs3/Emu/RSX/RSXFIFO.cpp").read_text()
          assert 'PsTJon v13: consumed Ascension OOB local blit' in Path("rpcs3-src/rpcs3/Emu/RSX/NV47/HW/nv3089.cpp").read_text()
          print("M5.14 progression-regression rollback, async pipeline routing, v13 preservation PASS")
          PY
          grep -q 'M5.14 regression rollback:' rpcs3-src/rpcs3/Emu/System.cpp
          ! grep -q 'g_cfg.video.shadermode.set(shader_mode::interpreter_only)' rpcs3-src/rpcs3/Emu/System.cpp
          # M5.15: enforce missing Ascension MLAA patch and isolate stale Metal shader caches.
          python3 - <<'PY'
          from pathlib import Path
          import os
          # M5.14 physical logs: user patch_config had only three active patches:
          # Disable Motion Blur, Disable Depth of Field, Disable Mesh Trimming.
          # The critical "Disable MLAA" was NOT applied. Upstream RPCS3 #17179
          # documents a launch/race black-screen without this exact patch.
          # M5.9 only removed an accidental suppression of the patch, but it did
          # NOT enable it. Make the BCUS98232/01.12 PPU patch effective whenever
          # the game's official patch catalog contains it.
          p=Path("rpcs3-src/Utilities/bin_patch.cpp")
          s=p.read_text()
          old='''\t\t\t\t\t\t\tconst patch_config_values& config_values = patch_config[main_key].patch_info_map[description].titles[title][serial][app_version];
          
          \t\t\t\t\t\t\tapp_versions[app_version] = config_values;'''
          new='''\t\t\t\t\t\t\tpatch_config_values config_values = patch_config[main_key].patch_info_map[description].titles[title][serial][app_version];
          #ifdef RPCS3_IOS
          \t\t\t\t\t\t\t// Force the known-safe per-title startup workaround; never affect
          \t\t\t\t\t\t\t// other game versions or unrelated patches. The patch is only
          \t\t\t\t\t\t\t// enabled if its authoritative PPU-hash definition is loaded.
          \t\t\t\t\t\t\tif (main_key == "PPU-3a0b43e4a5f4bfea64f53612ee7c5d990f88129c" &&
          \t\t\t\t\t\t\t    description == "Disable MLAA" && serial == "BCUS98232" &&
          \t\t\t\t\t\t\t    app_version == "01.12")
          \t\t\t\t\t\t\t{
          \t\t\t\t\t\t\t\tconfig_values.enabled = true;
          \t\t\t\t\t\t\t\tpatch_log.notice("PsTJon M5.15: BCUS98232 v1.12 Disable MLAA selected from actual catalog (race-condition fix)");
          \t\t\t\t\t\t\t}
          #endif
          \t\t\t\t\t\t\tapp_versions[app_version] = config_values;'''
          if s.count(old)!=1:
              raise SystemExit(f"M5.15 patch catalog anchor count mismatch: {s.count(old)}")
          s=s.replace(old,new,1)
          p.write_text(s)
          
          # Unique cache epoch for this GAME/PROVIDER experiment.
          # Old shader binaries and Metal pipelines have been reused across M5.5-
          # M5.14 despite incompatible runtime graphics policies. Do not wipe the
          # user's original cache: isolate the new shader cache namespace and the
          # VkPipelineCache persistence file for reproducible cold shader recompiles.
          mesa=os.environ["MESA_KOSMICKRISP_SHA"]
          p=Path("rpcs3-src/rpcs3/Emu/RSX/VK/VKGSRender.cpp")
          s=p.read_text()
          old=f'"v1.95-{mesa}"'
          new=f'"v1.95-{mesa}-mlaafix-m515"'
          if s.count(old)!=1:
              raise SystemExit(f"M5.15 RSX shader namespace mismatch: {s.count(old)}")
          s=s.replace(old,new,1)
          p.write_text(s)
          
          p=Path("rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp")
          s=p.read_text()
          old=f'"shaders_cache/vulkan/kosmickrisp/{mesa}/vk_pipeline_cache.bin"'
          new=f'"shaders_cache/vulkan/kosmickrisp/{mesa}/m515/vk_pipeline_cache.bin"'
          if s.count(old)!=1:
              raise SystemExit(f"M5.15 Vulkan pipeline cache namespace mismatch: {s.count(old)}")
          s=s.replace(old,new,1)
          p.write_text(s)
          
          # Early gate: verify that this release actually selects the intended
          # PPU patch (when the patch definition is present), not just a commented
          # toggled setting; other patches and original source stay untouched.
          patch_src=Path("rpcs3-src/Utilities/bin_patch.cpp").read_text()
          assert "M5.15: BCUS98232 v1.12 Disable MLAA selected" in patch_src
          assert "app_version == \"01.12\"" in patch_src
          assert "config_values.enabled = true;" in patch_src
          assert 'v1.95-'+mesa+'-mlaafix-m515' in Path("rpcs3-src/rpcs3/Emu/RSX/VK/VKGSRender.cpp").read_text()
          assert 'kosmickrisp/'+mesa+'/m515/vk_pipeline_cache.bin' in Path("rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp").read_text()
          assert 'g_cfg.video.shadermode.set(shader_mode::async_with_interpreter)' in Path("rpcs3-src/rpcs3/Emu/System.cpp").read_text()
          assert 'm_precise_get_publishing = Emu.GetTitleID()' in Path("rpcs3-src/rpcs3/Emu/RSX/RSXFIFO.cpp").read_text()
          assert "PsTJon v13: consumed Ascension OOB local blit" in Path("rpcs3-src/rpcs3/Emu/RSX/NV47/HW/nv3089.cpp").read_text()
          print("M5.15 hash-scoped MLAA patch selection + shader caches isolated + v13 preserved PASS")
          PY
          grep -q 'M5.15: BCUS98232 v1.12 Disable MLAA selected' rpcs3-src/Utilities/bin_patch.cpp
          grep -q 'mlaafix-m515' rpcs3-src/rpcs3/Emu/RSX/VK/VKGSRender.cpp
          # M5.16: keep shader cache on a new epoch following Metal math semantics change.
          python3 - <<'PY'
          from pathlib import Path
          import os
          mesa=os.environ["MESA_KOSMICKRISP_SHA"]
          # Metal math/compiler semantics differ from every previous build.
          # Do not reload prior driver binaries or translated shader cache.
          p=Path("rpcs3-src/rpcs3/Emu/RSX/VK/VKGSRender.cpp")
          s=p.read_text()
          old=f'"v1.95-{mesa}-mlaafix-m515"'
          new=f'"v1.95-{mesa}-mlaafix-m516-metalprecise"'
          if s.count(old)!=1: raise SystemExit("M5.16 RSX shader cache epoch anchor mismatch")
          p.write_text(s.replace(old,new,1))
          p=Path("rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp")
          s=p.read_text()
          old=f'"shaders_cache/vulkan/kosmickrisp/{mesa}/m515/vk_pipeline_cache.bin"'
          new=f'"shaders_cache/vulkan/kosmickrisp/{mesa}/m516-metalprecise/vk_pipeline_cache.bin"'
          if s.count(old)!=1: raise SystemExit("M5.16 pipeline cache epoch anchor mismatch")
          p.write_text(s.replace(old,new,1))
          # Verify exact upstream controls, which the M5.15 log confirmed:
          # Disable MLAA actually applied; renderer=KOSMICKRISP; WCB=RCB=1;
          # 100% native render scale, Ultra, v13 precise FIFO preserved.
          system=Path("rpcs3-src/rpcs3/Emu/System.cpp").read_text()
          assert "g_cfg.video.read_color_buffers.set(true)" in system
          assert "g_cfg.video.write_color_buffers.set(true)" in system
          assert "g_cfg.video.strict_rendering_mode.set(true)" in system
          assert "g_cfg.video.resolution_scale_percent.set(100)" in system
          assert "g_cfg.video.shadermode.set(shader_mode::async_with_interpreter)" in system
          assert "PsTJon M5.15: BCUS98232 v1.12 Disable MLAA selected" in Path("rpcs3-src/Utilities/bin_patch.cpp").read_text()
          assert "m_precise_get_publishing = Emu.GetTitleID()" in Path("rpcs3-src/rpcs3/Emu/RSX/RSXFIFO.cpp").read_text()
          assert "PsTJon v13: consumed Ascension OOB local blit" in Path("rpcs3-src/rpcs3/Emu/RSX/NV47/HW/nv3089.cpp").read_text()
          print("M5.16 distinct shader/pipeline cache and v13/MLAA policies preserved")
          
          PY
          grep -q 'm516-metalprecise' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp
          grep -q 'allocatorInfo.pVulkanFunctions = &vma_vulkan_functions' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/memory.cpp
          grep -q 'PsTJon M5 VMA dispatch: vmaCreateAllocator complete' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/memory.cpp
          grep -q 'RPCS3_VULKAN_PROVIDER_KOSMICKRISP)' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp
          grep -q 'PsTJon M5 checkpoint 11: render device initialization complete' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp
          grep -q 'RPCS3_VULKAN_PROVIDER "MOLTENVK"' rpcs3-src/3rdparty/CMakeLists.txt
          grep -q 'RPCS3_VULKAN_PROVIDER_KOSMICKRISP' rpcs3-src/rpcs3/Emu/RSX/VK/VulkanAPI.h
          grep -q 'volkInitializeCustom' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/instance.cpp
          grep -q 'volkLoadDevice' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp
          grep -q 'shaders_cache/vulkan' rpcs3-src/rpcs3/Emu/RSX/VK/vkutils/device.cpp
          git -C rpcs3-src diff --check
          git -C rpcs3-src diff --stat | tee M5-rpcs3-patch-stat.txt

      - name: Build pinned KosmicKrisp iOS Metal provider
        run: |
          set -euxo pipefail
          for pkg in cmake pkg-config libclc "$LLVM_FORMULA" spirv-tools ninja; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

          python3 -m venv "$GITHUB_WORKSPACE/kk-venv"
          source "$GITHUB_WORKSPACE/kk-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "meson==${MESON_VERSION}" mako packaging pyyaml

          LLVM_PREFIX="$(brew --prefix "$LLVM_FORMULA")"
          export PATH="$LLVM_PREFIX/bin:$PATH"
          TRANSLATOR_PREFIX="$GITHUB_WORKSPACE/deps/spirv-llvm-translator-20"
          rm -rf "$GITHUB_WORKSPACE/spirv-llvm-translator-src" "$GITHUB_WORKSPACE/spirv-llvm-translator-build" "$TRANSLATOR_PREFIX"
          git clone --filter=blob:none --no-checkout "$SPIRV_LLVM_TRANSLATOR_URL" "$GITHUB_WORKSPACE/spirv-llvm-translator-src"
          git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" fetch --depth=1 origin "$SPIRV_LLVM_TRANSLATOR_SHA"
          git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" checkout --detach "$SPIRV_LLVM_TRANSLATOR_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/spirv-llvm-translator-src" rev-parse HEAD)" = "$SPIRV_LLVM_TRANSLATOR_SHA"

          cmake -S "$GITHUB_WORKSPACE/spirv-llvm-translator-src" -B "$GITHUB_WORKSPACE/spirv-llvm-translator-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TRANSLATOR_PREFIX" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF
          cmake --build "$GITHUB_WORKSPACE/spirv-llvm-translator-build" --target LLVMSPIRVLib llvm-spirv -j3
          cmake --install "$GITHUB_WORKSPACE/spirv-llvm-translator-build"
          test -f "$TRANSLATOR_PREFIX/lib/libLLVMSPIRVLib.a"

          export LDFLAGS="-L$TRANSLATOR_PREFIX/lib -L$LLVM_PREFIX/lib"
          export CPPFLAGS="-I$TRANSLATOR_PREFIX/include -I$LLVM_PREFIX/include"
          export PKG_CONFIG_PATH="$TRANSLATOR_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig:$(brew --prefix libclc)/lib/pkgconfig:$(brew --prefix spirv-tools)/lib/pkgconfig"

          rm -rf mesa-src
          if git clone --filter=blob:none --no-checkout "$MESA_PRIMARY_URL" mesa-src; then
            echo "official GitLab" | tee mesa-source.txt
          else
            rm -rf mesa-src
            git clone --filter=blob:none --no-checkout "$MESA_MIRROR_URL" mesa-src
            echo "synchronized GitHub mirror fallback" | tee mesa-source.txt
          fi
          git -C mesa-src fetch --depth=1 origin "$MESA_KOSMICKRISP_SHA"
          git -C mesa-src checkout --detach "$MESA_KOSMICKRISP_SHA"
          test "$(git -C mesa-src rev-parse HEAD)" = "$MESA_KOSMICKRISP_SHA"
          for patch in \
            "$GITHUB_WORKSPACE/pstjon-kosmickrisp/patches/0001-kosmickrisp-ios-m2.patch" \
            "$GITHUB_WORKSPACE/pstjon-kosmickrisp/patches/0002-kosmickrisp-ios-m3-metal-wsi.patch"; do
            git -C mesa-src apply --check "$patch"
            git -C mesa-src apply "$patch"
          done
          python3 /tmp/apply_m4.py --mesa mesa-src
          # M5.16: KosmicKrisp Metal 4 backend math correctness, not another RPCS3 config guess.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mesa-src/src/kosmickrisp/vulkan/kk_shader.c")
          s=p.read_text()
          # The pinned Metal 4 provider *unconditionally* compiled ALL RSX
          # fragment/vertex/compute-derived MSL libraries with FAST math. That
          # remained the case even though RPCS3 reports Shader Precision=Ultra.
          # On iOS/A19 this may violate the ordered fog/lighting/nan semantics.
          # Enforce SAFE math and precise FP functions in the Metal library compiler,
          # not just in the RSX SPIR-V producer; leave macOS provider unchanged.
          needle='#include "kosmickrisp/compiler/nir_to_msl.h"'
          assert s.count(needle)==1, "M5.16 KosmicKrisp include anchor mismatch"
          defs='''#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)
          // PsTJon M5.16: preserve Vulkan fragment/vertex/compute FP semantics on iOS.
          #define PSTJON_KK_METAL_MATH_MODE MTL_MATH_MODE_SAFE
          #define PSTJON_KK_METAL_FP_FUNCTIONS MTL_MATH_FLOATING_POINT_FUNCTIONS_PRECISE
          #else
          #define PSTJON_KK_METAL_MATH_MODE MTL_MATH_MODE_FAST
          #define PSTJON_KK_METAL_FP_FUNCTIONS MTL_MATH_FLOATING_POINT_FUNCTIONS_FAST
          #endif
          '''
          s=s.replace(needle,needle+"\\n\\n"+defs,1)
          pair="MTL_MATH_MODE_FAST, MTL_MATH_FLOATING_POINT_FUNCTIONS_FAST);"
          if s.count(pair)!=3:
              raise SystemExit(f"M5.16 expected three Metal-library compiler sites, found {s.count(pair)}")
          s=s.replace(pair,"PSTJON_KK_METAL_MATH_MODE, PSTJON_KK_METAL_FP_FUNCTIONS);")
          assert s.count("PSTJON_KK_METAL_MATH_MODE, PSTJON_KK_METAL_FP_FUNCTIONS);")==3
          assert s.count("MTL_MATH_MODE_SAFE")==1
          assert s.count("MTL_MATH_FLOATING_POINT_FUNCTIONS_PRECISE")==1
          assert "MTL_MATH_MODE_FAST, MTL_MATH_FLOATING_POINT_FUNCTIONS_FAST);" not in s
          p.write_text(s)
          print("M5.16 pinned Mesa/Metal math semantics for iOS: SAFE+PRECISE applied to 3 Metal-library compile sites")
          
          PY
          grep -q 'PSTJON_KK_METAL_MATH_MODE' mesa-src/src/kosmickrisp/vulkan/kk_shader.c
          git -C mesa-src diff --check
          git -C mesa-src diff --stat | tee M4-mesa-patch-stat.txt

          rm -rf build-kk-host kk-host-tools
          meson setup build-kk-host mesa-src \
            --buildtype=release \
            -Dplatforms=macos \
            -Dvulkan-drivers=kosmickrisp \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dzstd=disabled \
            -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled \
            --prefer-static
          meson compile -C build-kk-host mesa_clc vtn_bindgen2 kk_clc
          mkdir -p kk-host-tools/bin
          cp build-kk-host/src/compiler/clc/mesa_clc kk-host-tools/bin/
          cp build-kk-host/src/compiler/spirv/vtn_bindgen2 kk-host-tools/bin/
          cp build-kk-host/src/kosmickrisp/clc/kk_clc kk-host-tools/bin/
          chmod +x kk-host-tools/bin/*

          mkdir -p kk-toolchain
          cat > kk-toolchain/ios-clang <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          exec xcrun --sdk iphoneos clang -target arm64-apple-ios17.4 -isysroot "$SDKROOT" "$@"
          EOF
          cat > kk-toolchain/ios-clangxx <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          exec xcrun --sdk iphoneos clang++ -target arm64-apple-ios17.4 -isysroot "$SDKROOT" "$@"
          EOF
          cat > kk-toolchain/ios-ar <<'EOF'
          #!/bin/bash
          set -euo pipefail
          exec xcrun --sdk iphoneos ar "$@"
          EOF
          cat > kk-toolchain/ios-strip <<'EOF'
          #!/bin/bash
          set -euo pipefail
          exec xcrun --sdk iphoneos strip "$@"
          EOF
          chmod +x kk-toolchain/*
          cat > kk-ios-arm64.cross <<EOF
          [binaries]
          c = '$GITHUB_WORKSPACE/kk-toolchain/ios-clang'
          cpp = '$GITHUB_WORKSPACE/kk-toolchain/ios-clangxx'
          objc = '$GITHUB_WORKSPACE/kk-toolchain/ios-clang'
          ar = '$GITHUB_WORKSPACE/kk-toolchain/ios-ar'
          strip = '$GITHUB_WORKSPACE/kk-toolchain/ios-strip'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          unset LDFLAGS CPPFLAGS PKG_CONFIG_PATH
          export PATH="$GITHUB_WORKSPACE/kk-host-tools/bin:$PATH"
          rm -rf build-kk-ios
          meson setup build-kk-ios mesa-src \
            --cross-file "$GITHUB_WORKSPACE/kk-ios-arm64.cross" \
            --buildtype=release \
            --wrap-mode=nodownload \
            -Dplatforms=ios \
            -Dvulkan-drivers=kosmickrisp \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Dspirv-tools=disabled \
            --prefer-static

          ninja -C build-kk-ios src/kosmickrisp/libKosmicKrisp.dylib
          KK_DYLIB="$GITHUB_WORKSPACE/build-kk-ios/src/kosmickrisp/libKosmicKrisp.dylib"
          test -f "$KK_DYLIB"
          mkdir -p "$GITHUB_WORKSPACE/deps/kosmickrisp-ios/lib" "$GITHUB_WORKSPACE/deps/kosmickrisp-ios/include"
          cp "$KK_DYLIB" "$GITHUB_WORKSPACE/deps/kosmickrisp-ios/lib/libKosmicKrisp.dylib"
          # Package the complete Mesa public include tree so transitive Vulkan,
          # vk_video and future public header dependencies are present as one SDK.
          cp -R "$GITHUB_WORKSPACE/mesa-src/include/." "$GITHUB_WORKSPACE/deps/kosmickrisp-ios/include/"

          file "$KK_DYLIB" | tee M4-kosmickrisp-file.txt
          lipo -info "$KK_DYLIB" | tee M4-kosmickrisp-lipo.txt
          xcrun vtool -show-build "$KK_DYLIB" | tee M4-kosmickrisp-build-version.txt
          otool -D "$KK_DYLIB" | tee M4-kosmickrisp-id.txt
          otool -L "$KK_DYLIB" | tee M4-kosmickrisp-otool.txt
          nm -gU "$KK_DYLIB" | tee M4-kosmickrisp-symbols.txt
          grep -q 'vk_icdGetInstanceProcAddr' M4-kosmickrisp-symbols.txt
          grep -q '@loader_path/libKosmicKrisp.dylib' M4-kosmickrisp-id.txt
          grep -E -qi 'platform[[:space:]]+IOS|platform[[:space:]]+2' M4-kosmickrisp-build-version.txt

          rm -rf deps/volk
          git clone --filter=blob:none --no-checkout https://github.com/zeux/volk.git deps/volk
          git -C deps/volk fetch --depth=1 origin "$VOLK_SHA"
          git -C deps/volk checkout --detach "$VOLK_SHA"
          test "$(git -C deps/volk rev-parse HEAD)" = "$VOLK_SHA"
          test -f deps/volk/volk.c
          test -f deps/volk/volk.h

          echo "RPCS3_KOSMICKRISP_ROOT=$GITHUB_WORKSPACE/deps/kosmickrisp-ios" >> "$GITHUB_ENV"
          echo "RPCS3_VOLK_ROOT=$GITHUB_WORKSPACE/deps/volk" >> "$GITHUB_ENV"

      - name: Build FFmpeg 8.1.1 for iOS
        run: |
          set -euxo pipefail
          mkdir -p deps/ffmpeg-src deps/ffmpeg-ios
          curl -L --fail --retry 4 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" -o deps/ffmpeg.tar.xz
          tar -xf deps/ffmpeg.tar.xz -C deps/ffmpeg-src --strip-components=1
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"
          cd deps/ffmpeg-src
          ./configure \
            --prefix="$GITHUB_WORKSPACE/deps/ffmpeg-ios" \
            --target-os=darwin --arch=arm64 --cc="$CC" --cxx="$CXX" --sysroot="$SDKROOT" \
            --enable-cross-compile --enable-pic --disable-shared --enable-static \
            --disable-programs --disable-doc --disable-debug --disable-autodetect \
            --extra-cflags="-arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            --extra-cxxflags="-arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            --extra-ldflags="-arch arm64 -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET} -isysroot $SDKROOT"
          make -j3
          make install
          test -f "$GITHUB_WORKSPACE/deps/ffmpeg-ios/lib/libavcodec.a"
          echo "RPCS3_FFMPEG_ROOT=$GITHUB_WORKSPACE/deps/ffmpeg-ios" >> "$GITHUB_ENV"

      - name: Build native llvm-tblgen
        run: |
          set -euxo pipefail
          LLVM_SRC="$GITHUB_WORKSPACE/rpcs3-src/3rdparty/llvm/llvm/llvm"
          cmake -S "$LLVM_SRC" -B llvm-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF
          cmake --build llvm-host --target llvm-tblgen -j3
          echo "LLVM_NATIVE_TOOL_DIR=$GITHUB_WORKSPACE/llvm-host/bin" >> "$GITHUB_ENV"

      - name: Configure RPCS3Core for iPhone
        run: |
          set -euxo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          CXX="$(xcrun --sdk iphoneos --find clang++)"
          TARGET="arm64-apple-ios$IOS_DEPLOYMENT_TARGET"
          CLANG_RESOURCE="$("$CC" --print-resource-dir)"
          IOS_COMPILER_RT="$CLANG_RESOURCE/lib/darwin/libclang_rt.ios.a"
          test -s "$IOS_COMPILER_RT"
          cmake -S rpcs3-src -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_TARGET="$TARGET" -DCMAKE_CXX_COMPILER_TARGET="$TARGET" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="$IOS_COMPILER_RT" \
            -DRPCS3_FRONTEND=IOS -DUSE_VULKAN=ON \
            -DWITH_LLVM=ON -DBUILD_LLVM=ON -DSTATIC_LINK_LLVM=ON \
            -DLLVM_NATIVE_TOOL_DIR="$LLVM_NATIVE_TOOL_DIR" \
            -DLLVM_TABLEGEN="$LLVM_NATIVE_TOOL_DIR/llvm-tblgen" \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_TARGETS_TO_BUILD=AArch64 -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DBUILD_RPCS3_TESTS=OFF -DRUN_RPCS3_TESTS=OFF \
            -DHAVE_ACCEPT4=0 \
            -DUSE_PRECOMPILED_HEADERS=OFF -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DWITH_DISCORD_RPC=OFF -DWITH_FAUDIO=OFF \
            -DRPCS3_VULKAN_PROVIDER=KOSMICKRISP \
            -DRPCS3_KOSMICKRISP_ROOT="$RPCS3_KOSMICKRISP_ROOT" \
            -DRPCS3_KOSMICKRISP_VERSION="$MESA_KOSMICKRISP_SHA" \
            -DRPCS3_VOLK_ROOT="$RPCS3_VOLK_ROOT" \
            -DRPCS3_FFMPEG_ROOT="$RPCS3_FFMPEG_ROOT"

      - name: Build RPCS3Core
        run: |
          set -euxo pipefail
          cmake --build build-ios --target RPCS3Core -j3
          CORE="$(find build-ios -type f -name 'libRPCS3Core.dylib' -print -quit)"
          test -n "$CORE"
          file "$CORE"
          lipo -info "$CORE"
          cp "$CORE" "$GITHUB_WORKSPACE/libRPCS3Core.dylib"
          ccache --show-stats || true

      - name: Repack official RPCS3 shell
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 "https://github.com/XITRIX/RPCS3-iOS-Releases/releases/download/v0.10.1/RPCS3.ipa" -o RPCS3-official.ipa
          echo "$OFFICIAL_IPA_SHA256  RPCS3-official.ipa" | shasum -a 256 -c -
          rm -rf package && mkdir package
          ditto -x -k RPCS3-official.ipa package
          APP="package/Payload/RPCS3.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.xitrix.RPCS3"
          cp libRPCS3Core.dylib "$APP/Frameworks/libRPCS3Core.dylib"
          cp "$RPCS3_KOSMICKRISP_ROOT/lib/libKosmicKrisp.dylib" "$APP/Frameworks/libKosmicKrisp.dylib"
          otool -L "$APP/Frameworks/libRPCS3Core.dylib" | tee M4-core-otool.txt
          otool -L "$APP/Frameworks/libKosmicKrisp.dylib" | tee M4-driver-otool.txt
          grep -q '@loader_path/libKosmicKrisp.dylib' M4-core-otool.txt
          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"
          codesign --force --sign - "$APP/Frameworks/libKosmicKrisp.dylib"
          codesign --force --sign - "$APP/Frameworks/libRPCS3Core.dylib"
          codesign --force --sign - --entitlements PsTJon.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>&1 | tee pstjon-entitlements.txt
          (
            cd package
            ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/PsTJon-KK-M5.16.ipa"
          )
          shasum -a 256 PsTJon-KK-M5.16.ipa

      - name: Build report
        run: |
          {
            echo "PsTJon M5.16 - fix hardcoded KosmicKrisp Metal FAST math for iOS (SAFE+PRECISE shaders) and fresh cache"
            echo "RPCS3 ios-port: $RPCS3_IOS_SHA"
            echo "Shell bundle id: com.xitrix.RPCS3"
            echo "Vulkan provider: KOSMICKRISP"
            echo "Mesa/KosmicKrisp: $MESA_KOSMICKRISP_SHA"
            echo "Volk: $VOLK_SHA"
            echo "FFmpeg: $FFMPEG_VERSION"
            echo "Core: $(shasum -a 256 libRPCS3Core.dylib | awk '{print $1}')"
            echo "IPA: $(shasum -a 256 PsTJon-KK-M5.16.ipa | awk '{print $1}')"
          } > PsTJon-KK-M5.16-build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PsTJon-KK-m05-16-metal-precise-math-IPA
          path: |
            PsTJon-KK-M5.16.ipa
            PsTJon-KK-M5.16-build.txt
            pstjon-entitlements.txt
            M5-rpcs3-patch-stat.txt
            M4-mesa-patch-stat.txt
            M4-kosmickrisp-file.txt
            M4-kosmickrisp-lipo.txt
            M4-kosmickrisp-build-version.txt
            M4-kosmickrisp-id.txt
            M4-kosmickrisp-otool.txt
            M4-kosmickrisp-symbols.txt
            M4-core-otool.txt
            M4-driver-otool.txt
          if-no-files-found: error
          compression-level: 0
