          // no more than once in five seconds per callsite.
          template <bool Getllar, typename Callback>
          static inline void m692_sample_original_spu_wait(Callback&& original_wait)
          {
              static thread_local u32 calls = 0;
              if ((++calls & 1023u) != 0)
              {
                  original_wait();
                  return;
              }
              using clock = std::chrono::steady_clock;
              const auto start = clock::now();
              original_wait();
              const u64 duration_ns = static_cast<u64>(
                  std::chrono::duration_cast<std::chrono::nanoseconds>(clock::now() - start).count());
              static std::atomic<u64> probe_count{0}, sum_ns{0}, max_ns{0}, report_ns{0};
              probe_count.fetch_add(1, std::memory_order_relaxed);
              sum_ns.fetch_add(duration_ns, std::memory_order_relaxed);
              u64 prev_max = max_ns.load(std::memory_order_relaxed);
              while (duration_ns > prev_max &&
                  !max_ns.compare_exchange_weak(prev_max, duration_ns, std::memory_order_relaxed)) {}
              const u64 now_ns = static_cast<u64>(
                  std::chrono::duration_cast<std::chrono::nanoseconds>(clock::now().time_since_epoch()).count());
              u64 previous = report_ns.load(std::memory_order_relaxed);
              if (!previous)
              {
                  report_ns.compare_exchange_strong(previous, now_ns, std::memory_order_relaxed);
                  return;
              }
              if (now_ns > previous + 5000000000ull &&
                  report_ns.compare_exchange_strong(previous, now_ns, std::memory_order_relaxed))
              {
                  const u64 n = probe_count.exchange(0, std::memory_order_relaxed);
                  const u64 sum = sum_ns.exchange(0, std::memory_order_relaxed);
                  const u64 maximum = max_ns.exchange(0, std::memory_order_relaxed);
                  spu_log.notice("M6.9.2 GLOBAL_SPU_WAIT path=%s sampled_calls=%llu avg_ns=%llu max_ns=%llu sampling=1/1024 no_guest_semantics_change",
                      Getllar ? "GETLLAR" : "RdEventStat", n, n ? sum/n : 0, maximum);
              }
          }
          #endif

          '''
          src=src.replace(anchor,profiler+anchor,1)
          # Existing original operation inside x64 fallback; always leave
          # x86 monitor branch intact, no WFE or queue/yield change.
          src=src.replace(getllar,getllar.replace(
              '\t\t\t\t\t\t\t\t\tbusy_wait(300);',
              '''#ifdef RPCS3_IOS
          \t\t\t\t\t\t\t\t\tm692_sample_original_spu_wait<true>([&] { busy_wait(300); });
          #else
          \t\t\t\t\t\t\t\t\tbusy_wait(300);
          #endif'''),1)
          src=src.replace(event,event.replace(
              '\t\t\t\t\tbusy_wait(300);',
              '''#ifdef RPCS3_IOS
          \t\t\t\t\tm692_sample_original_spu_wait<false>([&] { busy_wait(300); });
          #else
          \t\t\t\t\tbusy_wait(300);
          #endif'''),1)
          assert src.count('m692_sample_original_spu_wait<true>')==1
          assert src.count('m692_sample_original_spu_wait<false>')==1
          assert src.count('busy_wait(300);')==6
          assert src.count('M6.9.2 GLOBAL_SPU_WAIT')==1
          p.write_text(src)
          # Preserve the existing M6.9 percentile telemetry in RSX.
          perf=(root/'ios/RPCS3IOSPerformance.cpp').read_text()
          for token in ('exp_frame_hist[11]','frametime_p50_ms','frametime_p95_ms','frametime_p99_ms'):
