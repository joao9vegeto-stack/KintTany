      - name: PsTJohn1 - import verified ARMSX3 SPU LLVM and Vulkan depth transfer fixes
        run: |
          set -euxo pipefail
          python3 - <<'PY_PSTJOHN_ARM'
          from pathlib import Path
          root = Path("rpcs3-src/rpcs3")
          def replace_once(content, before, after, name):
              n = content.count(before)
              if n != 1:
                  raise RuntimeError(f"PsTJohn {name}: expected one source anchor, got {n}")
              return content.replace(before, after, 1)

          # ARMSX3 ab53473f (upstream RPCS3 eda7621): SPU LLVM
          # Use the callee's calling convention for generated state checks,
          # and restore InstCombine in the SPU function optimization pipeline.
          p = root / "Emu/Cell/SPULLVMRecompiler.cpp"
          s = p.read_text()
          s = replace_once(s,
              "#include <llvm/Transforms/Scalar/SimplifyCFG.h>\n",
              "#include <llvm/Transforms/Scalar/SimplifyCFG.h>\n#include <llvm/Transforms/InstCombine/InstCombine.h>\n",
              "SPU InstCombine include")
          original = "m_ir->CreateCall(m_test_state, {m_thread});"
          assert s.count(original) == 2, "SPU state-check calling convention anchors changed"
          s = s.replace(original, "m_ir->CreateCall(m_test_state, {m_thread})->setCallingConv(m_test_state->getCallingConv());")
          s = replace_once(s,
              "fpm.addPass(SimplifyCFGPass());\n\t\tfpm.addPass(DSEPass());",
              "fpm.addPass(SimplifyCFGPass());\n\t\tfpm.addPass(InstCombinePass());\n\t\tfpm.addPass(DSEPass());",
              "SPU LLVM optimizer")
          p.write_text(s)
          print("PsTJohn1 ARMSX3 SPU: state check calling conventions and InstCombine enabled")

          # ARMSX3 07e477d2 (upstream RPCS3 cfd03fc):
          # Correct depth/stencil compute-buffer capacity verification.
          # The original check omitted 256-byte alignment gaps, causing
          # the GPU to access offsets beyond the checked allocation.
          p = root / "Emu/RSX/VK/VKTexture.cpp"
          s = p.read_text()
          for buf in ("dst", "src"):
              old = (
                  "\t\t\tconst auto allocation_end = region.bufferOffset + packed32_length + packed16_length;\n"
                  f"\t\t\tensure({buf}->size() >= allocation_end);\n\n"
                  "\t\t\tconst auto data_offset = u32(region.bufferOffset);\n"
                  "\t\t\tconst auto z32_offset = utils::align<u32>(data_offset + packed16_length, 256);"
              )
              new = (
                  "\t\t\tconst auto data_offset = u32(region.bufferOffset);\n"
                  "\t\t\tconst auto z32_offset = utils::align<u32>(data_offset + packed16_length, 256);\n"
                  "\t\t\tconst auto allocation_end = z32_offset + packed32_length;\n"
                  f"\t\t\tensure({buf}->size() >= allocation_end);"
              )
              s = replace_once(s, old, new, "Z16F aligned transfer " + buf)
          for buf in ("dst", "src"):
              warn = ' // "Out of memory (compute heap). Lower your resolution scale setting."' if buf == "src" else ""
              old = (
                  "\t\t\tconst auto allocation_end = region.bufferOffset + packed_length + in_depth_size + in_stencil_size;\n"
                  f"\t\t\tensure({buf}->size() >= allocation_end);{warn}\n\n"
                  "\t\t\tconst auto data_offset = u32(region.bufferOffset);\n"
                  "\t\t\tconst auto z_offset = utils::align<u32>(data_offset + packed_length, 256);\n"
                  "\t\t\tconst auto s_offset = utils::align<u32>(z_offset + in_depth_size, 256);"
              )
              new = (
                  "\t\t\tconst auto data_offset = u32(region.bufferOffset);\n"
                  "\t\t\tconst auto z_offset = utils::align<u32>(data_offset + packed_length, 256);\n"
                  "\t\t\tconst auto s_offset = utils::align<u32>(z_offset + in_depth_size, 256);\n"
                  "\t\t\tconst auto allocation_end = s_offset + in_stencil_size;\n"
                  f"\t\t\tensure({buf}->size() >= allocation_end);{warn}"
              )
              s = replace_once(s, old, new, "D24S8 aligned transfer " + buf)
          for buf in ("dst", "src"):
              s = replace_once(s,
                  f"vk::insert_buffer_memory_barrier(cmd, {buf}->value, z_offset, in_depth_size + in_stencil_size,",
                  f"vk::insert_buffer_memory_barrier(cmd, {buf}->value, z_offset, (s_offset + in_stencil_size) - z_offset,",
                  "depth/stencil barrier " + buf)
          p.write_text(s)
          print("PsTJohn1 ARMSX3 Vulkan: 4 aligned transfer checks and 2 corrected barrier spans")

          # Fail closed if a source version cannot apply the verified change.
          # Keep the M6.9.2 known-better SPU wait path, texture/RSX safety,
          # KosmicKrisp backend and title-independent behavior.
          assert "InstCombinePass()" in (root / "Emu/Cell/SPULLVMRecompiler.cpp").read_text()
          assert "(s_offset + in_stencil_size) - z_offset" in p.read_text()
          PY_PSTJOHN_ARM
          git -C rpcs3-src diff --check
          git -C rpcs3-src diff --stat | tee PsTJohn1-1.0-core-diff-stat.txt
          git -C rpcs3-src diff -- rpcs3/Emu/Cell/SPULLVMRecompiler.cpp rpcs3/Emu/RSX/VK/VKTexture.cpp > PsTJohn1-1.0-arm64-backport.patch

