name: SpartanPort native ARM64 AOT
run-name: SpartanPort native AOT recompilation • ${{ github.sha }}
on:
  push:
    branches: [SpartanPort-iOS]
  pull_request:
    branches: [SpartanPort-iOS]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: spartanport-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Validate optional KosmicKrisp SDK scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated port branch
        uses: actions/checkout@v4
      - name: Validate optional SDK scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n KosmicKrispiOS/build.sh
          bash -n KosmicKrispiOS/make-dylibs.sh
          git diff --check
          echo "PASS: optional KosmicKrisp SDK scripts parse cleanly."

  native-aot:
    name: Static x86-64 to ARM64 iOS recompilation (gow3-macos-arm64)
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Checkout only SpartanPort-iOS
        uses: actions/checkout@v4
      - name: Validate iOS guest ELF staging layer
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -ISpartanPort-iOS/Sources/Runtime \
            SpartanPort-iOS/Sources/Runtime/SpartanIOSGuestMemory.c \
            SpartanPort-iOS/Sources/Runtime/SpartanIOSGuestELFLoader.c \
            SpartanPort-iOS/Tests/SpartanGuestELFLoaderTests.c \
            -o "$RUNNER_TEMP/spartan-elf-loader-tests"
          "$RUNNER_TEMP/spartan-elf-loader-tests"
      - name: Validate readiness audit helper
        run: |
          python3 -m py_compile tools/spartan-aot/audit_runtime_readiness.py
          python3 tools/spartan-aot/test_audit_runtime_readiness.py
      - name: Install native build tools
        run: |
          set -euo pipefail
          brew list ninja >/dev/null 2>&1 || brew install ninja
          cmake --version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Fetch pinned gow3 AOT integration and CPU recompiler
        run: |
          set -euo pipefail
          git clone https://github.com/xPXavierx/gow3-macos-arm64.git "$RUNNER_TEMP/gow3"
          git -C "$RUNNER_TEMP/gow3" checkout --detach eb9af23a198c577f8548a63471770e7b3316a369
          git clone https://github.com/bloodborne-native/bloodborne-recomp.git "$RUNNER_TEMP/recomp"
          git -C "$RUNNER_TEMP/recomp" checkout --detach 4b23a301944642f1e4e9e921418d4519dc36c315
          git -C "$RUNNER_TEMP/recomp" apply "$RUNNER_TEMP/gow3/packaging/macos/aot/bloodborne-recomp-arm64.patch"
          git clone --recursive --branch v4.1.1 https://github.com/zyantific/zydis.git "$RUNNER_TEMP/zydis"
          git -C "$RUNNER_TEMP/zydis" checkout a2278f1d254e492f6a6b39f6cb5d1f5d515659dc
          git -C "$RUNNER_TEMP/zydis" submodule update --init --recursive
          test -f "$RUNNER_TEMP/recomp/tools/recomp/scan.c"
          test -f "$RUNNER_TEMP/recomp/tools/recomp/bbrecomp.c"
      - name: Build host ARM64 AOT scanner and generator
        run: |
          set -euo pipefail
          DEPS="$RUNNER_TEMP/aot-deps"
          mkdir -p "$DEPS/install"
          cmake -S "$RUNNER_TEMP/zydis/dependencies/zycore" -B "$DEPS/zycore-host" -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS/install"
          cmake --build "$DEPS/zycore-host" --parallel 6
          cmake --install "$DEPS/zycore-host"
          cmake -S "$RUNNER_TEMP/zydis" -B "$DEPS/zydis-host" -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS/install" -DCMAKE_PREFIX_PATH="$DEPS/install" \
            -DCMAKE_C_FLAGS="-I$DEPS/install/include" \
            -DZYDIS_BUILD_TOOLS=OFF -DZYDIS_BUILD_EXAMPLES=OFF -DZYDIS_BUILD_DOXYGEN=OFF
          cmake --build "$DEPS/zydis-host" --parallel 6
          cmake --install "$DEPS/zydis-host"
          cmake -S "$RUNNER_TEMP/gow3/packaging/macos/aot" -B "$DEPS/aot-host" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGOW3_RECOMP_SOURCE_DIRECTORY="$RUNNER_TEMP/recomp" \
            -DCMAKE_PREFIX_PATH="$DEPS/install"
          cmake --build "$DEPS/aot-host" --parallel 6
          ctest --test-dir "$DEPS/aot-host" --output-on-failure
      - name: Build the strict static ARM64 CPU dispatcher for iOS
        run: |
          set -euo pipefail
          IOS_DEPS="$RUNNER_TEMP/ios-aot-deps"
          mkdir -p "$IOS_DEPS/install"
          cmake -S "$RUNNER_TEMP/zydis/dependencies/zycore" -B "$IOS_DEPS/zycore" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$IOS_DEPS/install"
          cmake --build "$IOS_DEPS/zycore" --parallel 6
          cmake --install "$IOS_DEPS/zycore"
          cmake -S "$RUNNER_TEMP/zydis" -B "$IOS_DEPS/zydis" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$IOS_DEPS/install" \
            -DCMAKE_PREFIX_PATH="$IOS_DEPS/install" \
            -DCMAKE_C_FLAGS="-I$IOS_DEPS/install/include" \
            -DZYDIS_BUILD_TOOLS=OFF -DZYDIS_BUILD_EXAMPLES=OFF -DZYDIS_BUILD_DOXYGEN=OFF
          cmake --build "$IOS_DEPS/zydis" --parallel 6
          cmake --install "$IOS_DEPS/zydis"
          python3 tools/spartan-aot/compile_ios_cpu_runtime.py \
            --recomp "$RUNNER_TEMP/recomp" \
            --zydis-include "$IOS_DEPS/install/include" \
            --zycore-include "$IOS_DEPS/install/include" \
            --out "$RUNNER_TEMP/spartan-ios-cpu"
          cat "$RUNNER_TEMP/spartan-ios-cpu/ios-cpu-runtime-manifest.json"
      - name: Reconstruct the supplied SELF and prepare the real PS4 module graph
        run: |
          set -euo pipefail
          python3 tools/spartan-aot/prepare_dump.py --eboot eboot.bin --assets-zip G3.zip --out "$RUNNER_TEMP/spartan-input"
          cat "$RUNNER_TEMP/spartan-input/input-manifest.json"
          python3 "$RUNNER_TEMP/gow3/packaging/macos/native/prepare_game.py" \
            "$RUNNER_TEMP/spartan-input/game" --out "$RUNNER_TEMP/spartan-prepared" \
            --tools "$RUNNER_TEMP/aot-deps/aot-host"
          test -s "$RUNNER_TEMP/spartan-prepared/aot/recomp.c"
      - name: Compile generated game functions as strict iOS ARM64 AOT
        run: |
          set -euo pipefail
          python3 tools/spartan-aot/compile_ios_aot.py \
            --generated "$RUNNER_TEMP/spartan-prepared/aot" \
            --recomp "$RUNNER_TEMP/recomp" \
            --zydis-include "$RUNNER_TEMP/zydis/include" \
            --zycore-include "$RUNNER_TEMP/zydis/dependencies/zycore/include" \
            --coverage "$RUNNER_TEMP/spartan-prepared/aot/coverage-summary.json" \
            --out "$RUNNER_TEMP/spartan-ios-aot"
          cat "$RUNNER_TEMP/spartan-ios-aot/aot-build-manifest.json"
          cat "$RUNNER_TEMP/spartan-prepared/aot/coverage-summary.json"
      - name: Audit full-game AOT and runtime readiness
        run: |
          set -euo pipefail
          python3 tools/spartan-aot/audit_runtime_readiness.py \
            --prepared "$RUNNER_TEMP/spartan-prepared" \
            --compiled "$RUNNER_TEMP/spartan-ios-aot" \
            --project "$GITHUB_WORKSPACE"
          cat "$RUNNER_TEMP/spartan-ios-aot/runtime-readiness.json"
      - name: Retain non-game diagnostic manifests only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpartanPort-AOT-Diagnostics
          path: |
            ${{ runner.temp }}/spartan-input/input-manifest.json
            ${{ runner.temp }}/spartan-ios-aot/aot-build-manifest.json
            ${{ runner.temp }}/spartan-prepared/aot/coverage-summary.json
            ${{ runner.temp }}/spartan-prepared/aot/coverage-audit.log
            ${{ runner.temp }}/spartan-prepared/aot/coverage-sites.local.json
            ${{ runner.temp }}/spartan-prepared/link.json
            ${{ runner.temp }}/spartan-prepared/native-inputs.json
            ${{ runner.temp }}/spartan-prepared/aot/functions.tsv
            ${{ runner.temp }}/spartan-prepared/aot/imports.tsv
            ${{ runner.temp }}/spartan-ios-aot/runtime-readiness.json
            ${{ runner.temp }}/spartan-ios-cpu/ios-cpu-runtime-manifest.json
            ${{ runner.temp }}/spartan-ios-cpu/libgow3-aot-cpu-ios.a
          if-no-files-found: warn
          retention-days: 14
