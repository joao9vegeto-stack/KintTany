name: SpartanPort iOS + KosmicKrisp
run-name: SpartanPort iOS ARM64 validation • macos-15-runner • ${{ github.sha }}
on:
  push:
    branches: [SpartanPort-iOS]
  pull_request:
    branches: [SpartanPort-iOS]
  workflow_dispatch:
permissions:
  contents: read
# Keep an accepted build alive; a later push must not cancel it.
concurrency:
  group: spartanport-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Validate source and pinned Mesa patches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated port branch
        uses: actions/checkout@v4
      - name: Validate scripts and patch applicability before macOS build
        shell: bash
        run: |
          set -euo pipefail
          bash -n KosmicKrispiOS/build.sh
          bash -n KosmicKrispiOS/make-dylibs.sh
          git diff --check
          MESA_SHA="bfe063f723d436e5cdef8a98f058d4e44a64810c"
          MESA_DIR="$RUNNER_TEMP/mesa-preflight"
          if git clone --filter=blob:none --no-checkout https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_DIR"; then
            echo "Mesa preflight source: official GitLab"
          else
            rm -rf "$MESA_DIR"
            git clone --filter=blob:none --no-checkout https://github.com/Kenji-NX/mesa.git "$MESA_DIR"
            echo "Mesa preflight source: pinned GitHub mirror"
          fi
          git -C "$MESA_DIR" fetch --depth=1 origin "$MESA_SHA"
          git -C "$MESA_DIR" checkout --detach "$MESA_SHA"
          test "$(git -C "$MESA_DIR" rev-parse HEAD)" = "$MESA_SHA"
          for patch in \
            KosmicKrispiOS/patches/0001-kosmickrisp-ios-m2.patch \
            KosmicKrispiOS/patches/0002-kosmickrisp-ios-m3-metal-wsi.patch \
            KosmicKrispiOS/patches/0003-kosmickrisp-ios-m3b-smoke-target.patch \
            KosmicKrispiOS/patches/0004-kosmickrisp-ios-macho-weak-import.patch; do
            echo "Checking $patch"
            git -C "$MESA_DIR" apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$MESA_DIR" apply "$GITHUB_WORKSPACE/$patch"
          done
          git -C "$MESA_DIR" diff --check
          echo "PASS: all pinned Mesa patches apply cleanly."
  build:
    name: Build KosmicKrisp ICD and SpartanPort iOS arm64
    # macos-15 image currently includes Xcode 26.3 and iOS 26.2 SDK.
    # Keep the Xcode/SDK/Metal 4 preflight below as a hard gate.
    runs-on: macos-15
    timeout-minutes: 240
    env:
      KK_SKIP_PREREQUISITES: "1"
    steps:
      - name: Checkout isolated port branch
        uses: actions/checkout@v4
      - name: Select Xcode 26 and validate Metal 4 SDK
        run: |
          set -euo pipefail
          xcode_apps=(/Applications/Xcode_26*.app)
          test -d "${xcode_apps[0]}" || {
            echo "ERROR: macos-15 runner has no Xcode 26 installation." >&2
            ls -la /Applications/Xcode*.app || true
            exit 1
          }
          sudo xcode-select --switch "${xcode_apps[${#xcode_apps[@]}-1]}/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Selected Xcode: $XCODE_VERSION"
          echo "Selected iPhoneOS SDK: $SDK_VERSION"
          [[ "$XCODE_VERSION" == 26.* ]]
          [[ "${SDK_VERSION%%.*}" -ge 26 ]]
          cat > "$RUNNER_TEMP/metal4-sdk-probe.m" <<'EOF'
          #import <Metal/Metal.h>
          #import <Metal/MTL4ArgumentTable.h>
          int main(void) { return 0; }
          EOF
          xcrun --sdk iphoneos clang -fsyntax-only -x objective-c \
            -target arm64-apple-ios17.4 "$RUNNER_TEMP/metal4-sdk-probe.m" -framework Metal
          echo "PASS: selected Xcode SDK contains Metal 4 argument-table headers."
          for pkg in cmake pkg-config libclc llvm@20 spirv-tools ninja xcodegen; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done
      - name: Build pinned KosmicKrisp iOS arm64 ICD and Metal WSI
        run: |
          set -euo pipefail
          chmod +x KosmicKrispiOS/build.sh
          ./KosmicKrispiOS/build.sh
      - name: Generate standalone SpartanPort Xcode project
        working-directory: SpartanPort-iOS
        run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          ds=[x for runtime,items in d.get("devices",{}).items() if "iOS" in runtime for x in items if x.get("isAvailable") and x.get("name","").startswith("iPhone")]
          pref=[x for x in ds if x.get("name")=="iPhone 17 Pro"]
          choices=pref or ds
          print(choices[0]["udid"] if choices else "")
          ')"
          test -n "$SIM_UDID"
          echo "SIMULATOR_UDID=$SIM_UDID" >> "$GITHUB_ENV"
      - name: Run PS4 folder, ELF and param.sfo unit tests
        working-directory: SpartanPort-iOS
        run: |
          set -euo pipefail
          xcodebuild -project SpartanPort.xcodeproj -scheme SpartanPort -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/SpartanPortTestDerived" CODE_SIGNING_ALLOWED=NO test
      - name: Build SpartanPort for iOS device ARM64
        working-directory: SpartanPort-iOS
        run: |
          set -euo pipefail
          KK_LINK_CONFIG="$GITHUB_WORKSPACE/KosmicKrispiOS/build/KosmicKrispLink.xcconfig"
          test -s "$KK_LINK_CONFIG"
          xcodebuild -project SpartanPort.xcodeproj -scheme SpartanPort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -xcconfig "$KK_LINK_CONFIG" \
            -derivedDataPath "$RUNNER_TEMP/SpartanPortDerived" CODE_SIGNING_ALLOWED=NO build
      - name: Package and validate unsigned ARM64 IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SpartanPortDerived/Build/Products/Release-iphoneos/SpartanPort.app"
          test -d "$APP"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          APP_BINARY="$APP/$EXECUTABLE"
          test -s "$APP_BINARY"
          xcrun lipo "$APP_BINARY" -verify_arch arm64
          nm -gU "$APP_BINARY" | grep -F '_vk_icdGetInstanceProcAddr'
          if otool -L "$APP_BINARY" | grep -E 'libKosmicKrisp|libvulkan\.dylib'; then
            echo "ERROR: KosmicKrisp must be linked into the app executable, not loaded dynamically." >&2
            exit 1
          fi
          if find "$APP" -type f \( -name '*.a' -o -name '*KosmicKrisp*.dylib' -o -name 'libvulkan.dylib' \) -print -quit | grep -q .; then
            echo "ERROR: a separate KosmicKrisp archive/dylib leaked into the app bundle." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/SpartanIPA/Payload"
          cp -R "$APP" "$RUNNER_TEMP/SpartanIPA/Payload/SpartanPort.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SpartanIPA/Payload" SpartanPort-iOS-KosmicKrisp-unsigned.ipa
          unzip -t SpartanPort-iOS-KosmicKrisp-unsigned.ipa
          unzip -l SpartanPort-iOS-KosmicKrisp-unsigned.ipa | grep -E 'Payload/SpartanPort.app/(Info.plist|SpartanPort)$'
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpartanPort-iOS-IPA
          path: SpartanPort-iOS-KosmicKrisp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
