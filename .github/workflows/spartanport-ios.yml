name: SpartanPort iOS + KosmicKrisp
run-name: SpartanPort iOS ARM64 - ${{ github.sha }}

# Build automatically for every committed change on the isolated SpartanPort branch.
on:
  push:
    branches:
      - SpartanPort-iOS
  pull_request:
    branches:
      - SpartanPort-iOS
  workflow_dispatch:

permissions:
  contents: read

# Never discard an accepted build because a follow-up fix was pushed.
concurrency:
  group: spartanport-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KosmicKrisp ICD and SpartanPort iOS arm64
    runs-on: macos-26
    timeout-minutes: 240
    env:
      KK_SKIP_PREREQUISITES: "1"
    steps:
      - name: Checkout isolated port branch
        uses: actions/checkout@v4
      - name: Select Xcode and install dependencies
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew update
          for pkg in cmake pkg-config libclc llvm@20 spirv-tools ninja xcodegen; do brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"; done
      - name: Build pinned KosmicKrisp iOS arm64 ICD and Metal WSI
        run: |
          set -euo pipefail
          chmod +x KosmicKrispiOS/build.sh
          ./KosmicKrispiOS/build.sh
      - name: Generate standalone SpartanPort Xcode project
        working-directory: SpartanPort-iOS
        run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          ds=[x for runtime,items in d.get("devices",{}).items() if "iOS" in runtime for x in items if x.get("isAvailable") and x.get("name","").startswith("iPhone")]
          pref=[x for x in ds if x.get("name")=="iPhone 17 Pro"]
          choices=pref or ds
          print(choices[0]["udid"] if choices else "")
          ')"
          test -n "$SIM_UDID"
          echo "SIMULATOR_UDID=$SIM_UDID" >> "$GITHUB_ENV"
      - name: Run PS4 ELF and param.sfo inspector unit tests
        working-directory: SpartanPort-iOS
        run: |
          set -euo pipefail
          xcodebuild -project SpartanPort.xcodeproj -scheme SpartanPort -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/SpartanPortTestDerived" CODE_SIGNING_ALLOWED=NO test
      - name: Build SpartanPort for iOS device ARM64
        working-directory: SpartanPort-iOS
        run: |
          set -euo pipefail
          KK_LINK_CONFIG="$GITHUB_WORKSPACE/KosmicKrispiOS/build/KosmicKrispLink.xcconfig"
          test -s "$KK_LINK_CONFIG"
          xcodebuild -project SpartanPort.xcodeproj -scheme SpartanPort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -xcconfig "$KK_LINK_CONFIG" \
            -derivedDataPath "$RUNNER_TEMP/SpartanPortDerived" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned SpartanPort IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SpartanPortDerived/Build/Products/Release-iphoneos/SpartanPort.app"
          test -d "$APP"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          APP_BINARY="$APP/$EXECUTABLE"
          test -s "$APP_BINARY"
          xcrun lipo "$APP_BINARY" -verify_arch arm64
          nm -gU "$APP_BINARY" | grep -F '_vk_icdGetInstanceProcAddr'
          if otool -L "$APP_BINARY" | grep -E 'libKosmicKrisp|libvulkan\.dylib'; then
            echo "ERROR: KosmicKrisp was left as a dynamic dependency instead of being linked into the app executable." >&2
            exit 1
          fi
          if find "$APP" -type f \( -name '*.a' -o -name '*KosmicKrisp*.dylib' -o -name 'libvulkan.dylib' \) -print -quit | grep -q .; then
            echo "ERROR: separate KosmicKrisp archive/dylib leaked into the app bundle." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/SpartanIPA/Payload"
          cp -R "$APP" "$RUNNER_TEMP/SpartanIPA/Payload/SpartanPort.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SpartanIPA/Payload" SpartanPort-iOS-KosmicKrisp-unsigned.ipa
          unzip -t SpartanPort-iOS-KosmicKrisp-unsigned.ipa
      - name: Upload SpartanPort IPA only
        uses: actions/upload-artifact@v4
        with:
          name: SpartanPort-iOS-IPA
          path: SpartanPort-iOS-KosmicKrisp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0