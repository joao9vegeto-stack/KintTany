workflows:
  kinttany-ios-unsigned:
    name: KintTany iOS - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 26.5
      vars:
        XCODE_PROJECT: "KintTany.xcodeproj"
        XCODE_SCHEME: "KintTany"

    scripts:
      - name: Show build environment
        script: |
          set -euo pipefail
          echo "Build dir: $CM_BUILD_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list devices available | grep -E "iPhone 17 Pro|iPhone 17" || true

      - name: Validate Xcode project and scheme
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -d "$XCODE_PROJECT"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Run XCTest
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p artifacts/logs artifacts/tests
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath "$CM_BUILD_DIR/artifacts/tests/KintTanyTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$CM_BUILD_DIR/artifacts/logs/xcodebuild-test.log"

      - name: Build unsigned iPhone app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          rm -rf build-iphoneos Payload artifacts/unsigned
          mkdir -p artifacts/unsigned artifacts/logs

          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$CM_BUILD_DIR/artifacts/logs/xcodebuild-iphoneos.log"

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          APP_PATH="$CM_BUILD_DIR/build-iphoneos/Build/Products/Release-iphoneos/KintTany.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: KintTany.app was not generated."
            find "$CM_BUILD_DIR/build-iphoneos" -name "*.app" -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload artifacts/unsigned
          cp -R "$APP_PATH" Payload/KintTany.app
          ditto -c -k --sequesterRsrc --keepParent Payload artifacts/unsigned/KintTany-unsigned.ipa
          cp -R "$APP_PATH" artifacts/unsigned/KintTany.app
          shasum -a 256 artifacts/unsigned/KintTany-unsigned.ipa > artifacts/unsigned/KintTany-unsigned.ipa.sha256

          echo "Generated artifacts:"
          ls -lh artifacts/unsigned

    artifacts:
      - artifacts/unsigned/KintTany-unsigned.ipa
      - artifacts/unsigned/KintTany-unsigned.ipa.sha256
      - artifacts/unsigned/KintTany.app
      - artifacts/logs/*.log
      - artifacts/tests/*.xcresult
