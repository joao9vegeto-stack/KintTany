name: XOWUE
targets:
  XOWUE:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: App
    info:
      path: XOWUE-Info.plist
      properties:
        CFBundleDisplayName: XOWUE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.games
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsDocumentBrowser: true
        # Library uses portrait, launched gameplay uses landscape. Both
        # orientations must be declared or UIWindowScene rejects rotation.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Xbox 360 Executable
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.xowue.xex
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.xowue.xex
            UTTypeDescription: Xbox 360 executable
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - xex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopedro.xowue
        PRODUCT_NAME: XOWUE
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "72"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/XOWUE-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../Runtime"
          - "$(SRCROOT)/../mesa-src/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../build-ios"
          - "$(SRCROOT)/../build-ios/kosmickrisp"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "-lXOWUEEngineComplete"
          - "-lvulkan_kosmickrisp"
          - "-lc++"
          - "-lz"
          - "-framework"
          - "Metal"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "IOSurface"
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1,2"
