name: XOWUE
targets:
  XOWUE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    info:
      path: XOWUE-Info.plist
      properties:
        CFBundleDisplayName: XOWUE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.games
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsDocumentBrowser: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Xbox 360 Executable
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.xowue.xex
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.xowue.xex
            UTTypeDescription: Xbox 360 executable
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - xex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopedro.xowue
        PRODUCT_NAME: XOWUE
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/XOWUE-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../Runtime"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../../build-ios"
        OTHER_LDFLAGS:
          - "-lXOWUEEngineComplete"
          - "-lc++"
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1,2"