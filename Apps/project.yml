name: SwiftPilot
options:
  bundleIdPrefix: com.joaopedro
  deploymentTarget:
    iOS: "17.0"
targets:
  SwiftPilot:
    type: application
    platform: iOS
    sources:
      - SwiftPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopedro.swiftpilot
        PRODUCT_NAME: SwiftPilot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwiftPilot
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
