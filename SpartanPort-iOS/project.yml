name: SpartanPort
options:
  bundleIdPrefix: com.joaopedro
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

targets:
  SpartanPort:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: Frameworks/GOW3Recompiled.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopedro.spartanport
        PRODUCT_NAME: SpartanPort
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/SpartanPort-Bridging-Header.h"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -force_load $(PROJECT_DIR)/Frameworks/libgow3-aot-cpu-ios.a -force_load $(PROJECT_DIR)/Frameworks/libZydis.a -force_load $(PROJECT_DIR)/Frameworks/libZycore.a -ldl"

  SpartanPortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SpartanPort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopedro.spartanport.tests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SpartanPort:
    build:
      targets:
        SpartanPort: all
        SpartanPortTests: [test]
    test:
      targets:
        - SpartanPortTests
