name: SpartanPort
options:
  bundleIdPrefix: com.joaopedro
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

targets:
  SpartanPort:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopedro.spartanport
        PRODUCT_NAME: SpartanPort
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../KosmicKrispiOS/build/include"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/SpartanPort-Bridging-Header.h"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  SpartanPortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SpartanPort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaopedro.spartanport.tests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SpartanPort:
    build:
      targets:
        SpartanPort: all
        SpartanPortTests: [test]
    test:
      targets:
        - SpartanPortTests
